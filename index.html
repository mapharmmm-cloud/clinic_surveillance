  computeItemStats(rows) {
    const map = {};
    rows.forEach(r => { const fm = FORMS[r.form_type]; if (!fm) return;
      fm.resultItems.forEach(it => { const v = r[it.key]; if (v !== 'Y' && v !== 'N') return;
        const m = map[it.key] || (map[it.key] = { key: it.key, fid: r.form_type, form: fm.short, no: it.no, text: it.text.replace(/\n/g, ' › '), y: 0, n: 0 });
        v === 'Y' ? m.y++ : m.n++; }); });
    return Object.values(map).map(m => Object.assign(m, { checked: m.y + m.n, rate: pct(m.n, m.y + m.n) }));
  },

  renderItemTable() {
    const q = this.f.q.trim().toLowerCase();
    let list = this.itemStats.filter(m => m.n > 0 && (!q || (m.form + ' ' + m.no + ' ' + m.text).toLowerCase().includes(q)));
    const { key, dir } = this.sort;
    list.sort((a, b) => { const x = a[key], y = b[key]; const c = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'th', { numeric: true }); return c * dir || b.n - a.n; });
    $$('#d-tbl th.sort').forEach(th => { th.classList.toggle('asc', th.dataset.sort === key && dir === 1); th.classList.toggle('desc', th.dataset.sort === key && dir === -1); });
    const ps = 15, pages = Math.max(1, Math.ceil(list.length / ps)); this.page = Math.min(this.page, pages - 1);
    const slice = list.slice(this.page * ps, this.page * ps + ps);
    $('#d-tbl tbody').innerHTML = slice.length ? slice.map(m => `<tr class="click" data-item="${esc(m.key)}" tabindex="0"><td>${esc(m.form)}</td><td class="num">${esc(m.no)}</td><td class="clip">${esc(m.text.slice(0, 220))}</td>
      <td class="r num">${fmtNum(m.checked)}</td><td class="r num"><b>${fmtNum(m.n)}</b></td><td class="r num">${fmtNum(m.rate, 1)}%</td></tr>`).join('')
      : `<tr><td colspan="6" class="empty">ไม่พบรายการที่ไม่ถูกต้อง${q ? 'ตามคำค้น' : ''}</td></tr>`;
    $$('#d-tbl tbody tr[data-item]').forEach(tr => { const go = () => this.itemDrill(tr.dataset.item); tr.addEventListener('click', go); tr.addEventListener('keydown', e => e.key === 'Enter' && go()); });
    $('#d-pager').innerHTML = `<span class="small muted">${fmtNum(list.length)} รายการ</span>` + (pages > 1 ? `<button class="btn sm" ${this.page === 0 ? 'disabled' : ''} data-pg="-1">${ic('left')}</button><span class="small">หน้า ${this.page + 1}/${pages}</span><button class="btn sm" ${this.page >= pages - 1 ? 'disabled' : ''} data-pg="1">${ic('right')}</button>` : '');
    $$('#d-pager [data-pg]').forEach(b => b.addEventListener('click', () => { this.page += +b.dataset.pg; this.renderItemTable(); }));
  },

  sectionStats(fid, rows) {
    const fm = FORMS[fid];
    return fm.sections.map(s => { let y = 0, n = 0; rows.forEach(r => s.items.forEach(k => { if (r[k] === 'Y') y++; else if (r[k] === 'N') n++; }));
      return { id: s.id, title: s.title, y, n, pct: pct(y, y + n) }; }).filter(s => s.y + s.n);
  },

  formStats(rows) {
    return FORM_IDS.map(fid => { const rs = rows.filter(r => r.form_type === fid); let y = 0, n = 0; rs.forEach(r => { y += +r.score_pass || 0; n += +r.score_fail || 0; });
      return { fid, label: FORMS[fid].short, count: rs.length, pass: rs.filter(r => r.overall_result === 'pass').length, fail: rs.filter(r => r.overall_result === 'fail').length,
        inc: rs.filter(r => r.overall_result === 'incomplete').length, pct: pct(y, y + n) }; });
  },

  renderSections() {
    const el = $('#d-sections');
    const bar = (label, v, sub) => `<div class="prog" title="${esc(label)}"><span>${esc(label)}${sub ? ` <span class="tiny muted">${sub}</span>` : ''}</span><span class="pv num">${v == null ? '–' : fmtNum(v, 1) + '%'}</span><div class="pb"><i style="width:${v || 0}%"></i></div></div>`;
    if (this.f.form) {
      $('#sec-title').textContent = 'ร้อยละความถูกต้องรายหมวด · ' + FORMS[this.f.form].short;
      el.innerHTML = this.sectionStats(this.f.form, this.rows).map(s => bar(s.title, s.pct, `(× ${s.n})`)).join('') || '<div class="empty">ไม่มีข้อมูล</div>';
    } else {
      $('#sec-title').textContent = 'ร้อยละความถูกต้องตามประเภทคลินิก';
      el.innerHTML = this.formStats(this.rows).filter(s => s.count).sort((a, b) => (a.pct ?? 101) - (b.pct ?? 101)).map(s => bar(s.label, s.pct, `(${s.count} ครั้ง)`)).join('');
    }
  },

  renderInsights(rows, avg, pass) {
    const out = [];
    const fs = this.formStats(rows).filter(s => s.count);
    if (fs.length > 1) { const lo = fs.reduce((a, b) => (b.pct ?? 101) < (a.pct ?? 101) ? b : a); out.push(`ประเภทที่มีร้อยละความถูกต้องต่ำสุด คือ <b>${esc(lo.label)}</b> (${fmtNum(lo.pct, 1)}%)`); }
    const top = this.itemStats.slice().sort((a, b) => b.n - a.n)[0];
    if (top && top.n) out.push(`ข้อที่พบไม่ถูกต้องมากที่สุด: <b>${esc(top.form)} ข้อ ${esc(top.no)}</b> — ${esc(top.text.split(' › ').pop().slice(0, 90))} (${top.n} ครั้ง)`);
    out.push(`ตรวจแล้ว ${fmtNum(rows.length)} ครั้ง ถูกต้องทุกข้อ ${fmtNum(pct(pass, rows.length), 1)}% · ร้อยละความถูกต้องเฉลี่ย ${avg == null ? '–' : fmtNum(avg, 1) + '%'}`);
    const months = this.monthSeries(rows);
    if (months.labels.length >= 2) { const a = months.avg[months.avg.length - 1], b = months.avg[months.avg.length - 2];
      if (a != null && b != null) out.push(`เดือนล่าสุดร้อยละความถูกต้องเฉลี่ย ${fmtNum(a, 1)}% (${a >= b ? 'เพิ่มขึ้น' : 'ลดลง'} ${fmtNum(Math.abs(a - b), 1)} จุดจากเดือนก่อน)`); }
    $('#d-insights').innerHTML = out.map(t => `<li>${ic('info')}<span>${t}</span></li>`).join('');
  },

  monthSeries(rows) {
    const keys = rows.map(r => String(r.inspection_date).slice(0, 7)).filter(k => /^\d{4}-\d{2}$/.test(k)).sort();
    if (!keys.length) return { labels: [], keys: [], count: [], avg: [] };
    const months = []; let [y, m] = keys[0].split('-').map(Number); const [ey, em] = keys[keys.length - 1].split('-').map(Number);
    while ((y < ey || (y === ey && m <= em)) && months.length < 36) { months.push(`${y}-${pad(m)}`); m++; if (m > 12) { m = 1; y++; } }
    const count = months.map(k => rows.filter(r => String(r.inspection_date).startsWith(k)).length);
    const avg = months.map(k => { const rs = rows.filter(r => String(r.inspection_date).startsWith(k) && r.score_compliance_pct !== '' && r.score_compliance_pct != null); return rs.length ? Math.round(rs.reduce((s, r) => s + +r.score_compliance_pct, 0) / rs.length * 10) / 10 : null; });
    return { labels: months.map(monthLabel), keys: months, count, avg };
  },

  /* ---------- กราฟ (Chart.js) ---------- */
  renderCharts() {
    if (!window.Chart) { $$('.chart-box').forEach(b => b.innerHTML = '<div class="empty small">ไม่สามารถโหลดไลบรารีกราฟ (ต้องเชื่อมต่ออินเทอร์เน็ต) — กด "ตาราง" เพื่อดูข้อมูล</div>'); this.prepareChartData(); return; }
    Object.values(this.charts).forEach(c => c.destroy()); this.charts = {};
    const rows = this.rows; if (!rows.length || !$('#c-month')) return;
    this.prepareChartData();
    const C = { text: cssVar('--text-2'), grid: cssVar('--grid'), axis: cssVar('--axis'), s1: cssVar('--series-1'), good: cssVar('--good'), bad: cssVar('--bad'), na: cssVar('--na'), surface: cssVar('--surface'), seq: cssVar('--seq-4') };
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; Chart.defaults.color = C.text; Chart.defaults.font.size = 12;
    const tip = { backgroundColor: cssVar('--surface'), titleColor: cssVar('--text'), bodyColor: cssVar('--text-2'), borderColor: cssVar('--line'), borderWidth: 1, padding: 10, cornerRadius: 10, displayColors: true, boxPadding: 4 };
    const scale = (extra = {}) => Object.assign({ grid: { color: C.grid, drawTicks: false }, border: { color: C.axis }, ticks: { padding: 6 } }, extra);
    const base = (o = {}) => Object.assign({ responsive: true, maintainAspectRatio: false, animation: { duration: 350 }, interaction: { mode: 'nearest', intersect: false },
      plugins: { legend: { display: false }, tooltip: tip } }, o);
    const bar = (data, color, label) => ({ label, data, backgroundColor: color, borderRadius: 4, borderSkipped: 'start', maxBarThickness: 30, borderColor: C.surface, borderWidth: 0 });
    const d = this.chartData;

    this.charts.month = new Chart($('#c-month'), { type: 'bar', data: { labels: d.month.labels, datasets: [bar(d.month.count, C.s1, 'จำนวนการตรวจ (ครั้ง)')] },
      options: base({ scales: { x: scale({ grid: { display: false } }), y: scale({ beginAtZero: true, ticks: { precision: 0 } }) } }) });
    this.charts.trend = new Chart($('#c-trend'), { type: 'line', data: { labels: d.month.labels, datasets: [{ label: 'ร้อยละความถูกต้องเฉลี่ย', data: d.month.avg, borderColor: C.s1, backgroundColor: C.s1, borderWidth: 2, pointRadius: 4, pointHoverRadius: 6, pointBorderColor: C.surface, pointBorderWidth: 2, spanGaps: true, tension: .25 }] },
      options: base({ interaction: { mode: 'index', intersect: false }, scales: { x: scale({ grid: { display: false } }), y: scale({ suggestedMin: 80, max: 100, ticks: { callback: v => v + '%' } }) },
        plugins: { legend: { display: false }, tooltip: Object.assign({}, tip, { callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y == null ? '–' : c.parsed.y.toFixed(1) + '%'}` } }) } }) });
    const stack = (labels, s) => ({ labels, datasets: [Object.assign(bar(s.pass, C.good, '✓ ถูกต้องทุกข้อ'), { borderWidth: 2, borderSkipped: false }), Object.assign(bar(s.fail, C.bad, '× พบข้อไม่ถูกต้อง'), { borderWidth: 2, borderSkipped: false }), Object.assign(bar(s.inc, C.na, 'ตรวจไม่ครบ'), { borderWidth: 2, borderSkipped: false })] });
    const hopts = (onClick) => base({ indexAxis: 'y', interaction: { mode: 'index', axis: 'y', intersect: false }, onClick, onHover: (e, el) => { e.native.target.style.cursor = el.length && onClick ? 'pointer' : 'default'; },
      scales: { x: scale({ stacked: true, beginAtZero: true, ticks: { precision: 0 } }), y: scale({ stacked: true, grid: { display: false }, ticks: { autoSkip: false, callback: function (v) { const l = this.getLabelForValue(v); return l.length > 26 ? l.slice(0, 25) + '…' : l; } } }) } });
    this.charts.form = new Chart($('#c-form'), { type: 'bar', data: stack(d.form.labels, d.form), options: hopts((e, el) => { if (el.length) this.formDrill(d.form.ids[el[0].index]); }) });
    this.charts.amphoe = new Chart($('#c-amphoe'), { type: 'bar', data: stack(d.amphoe.labels, d.amphoe), options: hopts((e, el) => { if (el.length) this.amphoeDrill(d.amphoe.labels[el[0].index]); }) });
    this.charts.dist = new Chart($('#c-dist'), { type: 'bar', data: { labels: d.dist.labels, datasets: [bar(d.dist.count, C.seq, 'จำนวนการตรวจ (ครั้ง)')] },
      options: base({ scales: { x: scale({ grid: { display: false }, title: { display: true, text: 'ร้อยละความถูกต้อง' } }), y: scale({ beginAtZero: true, ticks: { precision: 0 } }) } }) });
    this.charts.building = new Chart($('#c-building'), { type: 'bar', data: { labels: d.building.labels, datasets: [bar(d.building.count, C.s1, 'จำนวนการตรวจ (ครั้ง)')] },
      options: base({ indexAxis: 'y', scales: { x: scale({ beginAtZero: true, ticks: { precision: 0 } }), y: scale({ grid: { display: false } }) } }) });
  },

  prepareChartData() {
    const rows = this.rows; const d = this.chartData = {};
    d.month = this.monthSeries(rows);
    const fs = this.formStats(rows).filter(s => s.count || !this.f.form);
    d.form = { ids: fs.map(s => s.fid), labels: fs.map(s => s.label), pass: fs.map(s => s.pass), fail: fs.map(s => s.fail), inc: fs.map(s => s.inc), count: fs.map(s => s.count), pct: fs.map(s => s.pct) };
    const am = {}; rows.forEach(r => { const k = r.addr_amphoe || 'ไม่ระบุ'; const o = am[k] || (am[k] = { pass: 0, fail: 0, inc: 0 }); o[r.overall_result === 'pass' ? 'pass' : r.overall_result === 'fail' ? 'fail' : 'inc']++; });
    const ak = Object.keys(am).sort((a, b) => (am[b].pass + am[b].fail + am[b].inc) - (am[a].pass + am[a].fail + am[a].inc));
    d.amphoe = { labels: ak, pass: ak.map(k => am[k].pass), fail: ak.map(k => am[k].fail), inc: ak.map(k => am[k].inc) };
    const bins = [['< 80%', v => v < 80], ['80–89.9%', v => v >= 80 && v < 90], ['90–94.9%', v => v >= 90 && v < 95], ['95–99.9%', v => v >= 95 && v < 100], ['100%', v => v >= 100]];
    d.dist = { labels: bins.map(b => b[0]), count: bins.map(b => rows.filter(r => r.score_compliance_pct !== '' && r.score_compliance_pct != null && b[1](+r.score_compliance_pct)).length) };
    const bt = {}; rows.forEach(r => { const k = r.building_type || 'ไม่ระบุ'; bt[k] = (bt[k] || 0) + 1; });
    const bk = Object.keys(bt).sort((a, b) => bt[b] - bt[a]); d.building = { labels: bk, count: bk.map(k => bt[k]) };
  },

  /* ---------- drill-down / table view ---------- */
  tableHTML(head, rows) {

  chartTable(kind) {

      const b = e.currentTarget; btnBusy(b, true, 'บันทึก…');
      try { await Api.update({ record_id: id, record_status: v }, r.updated_at); toast('เปลี่ยนสถานะแล้ว', 'ok'); m.close(); this.cache = null; this.renderTab(); }

  async edit(id) {
    const r = this.rec(id); if (!r) return;

    try { await Api.remove(id); toast('ลบรายการแล้ว', 'ok'); this.cache = this.cache.filter(x => x.record_id !== id); this.renderRows(); }

  exportXlsx(recs, name) {
    if (!window.XLSX) return toast('ไม่สามารถโหลดไลบรารี Excel (ต้องเชื่อมต่ออินเทอร์เน็ต) — ใช้การส่งออก CSV แทน', 'err', 6000);
    const wb = XLSX.utils.book_new();
    const sheet = (keys, rows) => XLSX.utils.aoa_to_sheet([keys, ...rows.map(r => keys.map(k => safeCell(r[k])))]);
    XLSX.utils.book_append_sheet(wb, sheet(SCHEMA.masterKeys, recs), 'inspections');
    FORM_IDS.forEach(fid => XLSX.utils.book_append_sheet(wb, sheet(sheetKeys(fid), recs.filter(r => r.form_type === fid)), 'chk_' + fid));
    XLSX.writeFile(wb, name); toast(`ส่งออก Excel ${recs.length} รายการ`, 'ok');
  },

  printList(recs) {
    $('#print-root').innerHTML = `<h2>${esc(CONFIG.APP_NAME)} · รายการการตรวจ</h2><p class="small">${esc(CONFIG.ORG_NAME)} · พิมพ์เมื่อ ${fmtDT(nowISO())} · ${recs.length} รายการ</p>
      <table class="tbl"><thead><tr><th>#</th><th>วันที่ตรวจ</th><th>ประเภท</th><th>ชื่อคลินิก</th><th>อำเภอ</th><th>✓</th><th>×</th><th>–</th><th>ร้อยละ</th><th>ผล</th><th>สถานะ</th></tr></thead><tbody>
      ${recs.map((r, i) => `<tr><td>${i + 1}</td><td>${fmtDate(r.inspection_date)}</td><td>${esc((FORMS[r.form_type] || {}).short)}</td><td>${esc(r.clinic_name)}</td><td>${esc(r.addr_amphoe)}</td><td>${r.score_pass}</td><td>${r.score_fail}</td><td>${r.score_na}</td><td>${r.score_compliance_pct}</td><td>${esc(OVERALL[r.overall_result] || '')}</td><td>${esc(STATUS[r.record_status] || '')}</td></tr>`).join('')}</tbody></table>`;
    document.body.classList.add('printing');
    const done = () => { document.body.classList.remove('printing'); $('#print-root').innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done); setTimeout(() => window.print(), 60);
  },

  async importJson(btn) {
    const file = $('#im-file').files[0]; const out = $('#im-res');
    if (!file) return toast('กรุณาเลือกไฟล์ JSON', 'err');
    let recs;
    try { const j = JSON.parse(await file.text()); recs = Array.isArray(j) ? j : j.records; if (!Array.isArray(recs)) throw new Error(); }
    catch (e) { return toast('ไฟล์ไม่ใช่ JSON ที่ถูกต้อง', 'err'); }
    recs = recs.filter(r => r && FORMS[r.form_type] && /^INS-\d{8}-[A-Z0-9]{6}$/.test(r.record_id));
    if (!await confirmBox({ title: 'ยืนยันการนำเข้า', message: `พบรายการที่ถูกต้อง ${recs.length} รายการ ต้องการนำเข้าหรือไม่?`, ok: 'นำเข้า' })) return;
    btnBusy(btn, true, 'กำลังนำเข้า…'); let ok = 0, skip = 0, bad = 0;
    for (const r of recs) {
      try {
        if (MODE === 'demo') { const db = Demo.db(); if (db.records.some(x => x.record_id === r.record_id)) { skip++; continue; }
          const c = computeScores(cleanRecord(Object.assign({}, r))); db.records.push(c); Demo.audit(db, Auth.user(), 'create', c.record_id, c.form_type, '', 'นำเข้าจากไฟล์ JSON'); Demo.save(db); ok++; }
        else { const res = await Api.create(Object.assign({}, r, { created_by: Auth.user() })); res.duplicate ? skip++ : ok++; }
      } catch (e) { e.code === 'DUPLICATE' ? skip++ : bad++; }
      out.textContent = `นำเข้าแล้ว ${ok} · ข้าม (ซ้ำ) ${skip} · ไม่สำเร็จ ${bad}`;
    }
    btnBusy(btn, false); this.cache = null; toast(`นำเข้าเสร็จ: สำเร็จ ${ok} · ข้าม ${skip} · ไม่สำเร็จ ${bad}`, bad ? 'warn' : 'ok');
  },

    $('#cp-f').addEventListener('submit', async e => {

    const od = $('#ob-dl'); od && od.addEventListener('click', () => download('outbox_' + todayISO() + '.json', JSON.stringify({ records: Outbox.list() }, null, 1), 'application/json'));
  }
};
function safeCell(v) { if (v == null) return ''; const s = typeof v === 'string' ? v : v; return typeof s === 'string' && /^[=+@]/.test(s) ? "'" + s : s; }
function toCSV(keys, rows) {
  const q = v => { let s = v == null ? '' : String(v); if (/^[=+@]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [keys.join(','), ...rows.map(r => keys.map(k => q(r[k])).join(','))].join('\r\n');
}
ICON.shield = '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9.5 12.5l2 2 3.5-4"/>';

/* =====================================================================
   ROUTER — แยกหน้าบันทึกข้อมูล / Dashboard สาธารณะ / ผู้ดูแล
   ===================================================================== */
const Router = {
  current: '',
  setTitle(t) { document.title = `${t} · ${CONFIG.APP_NAME}`; },
  go() {
    const h = location.hash || '#/form';
    const [, page, arg] = h.match(/^#\/([a-z]+)\/?([a-z_]*)/) || [, 'form', ''];
    this.current = page;
    $$('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.route === (page === 'edit' ? 'admin' : page) ? 'page' : 'false'));
    if (page !== 'dashboard') { Object.values(Dash.charts).forEach(c => c.destroy()); Dash.charts = {}; }
    if (page === 'dashboard') return Dash.show();
    if (page === 'admin') return Admin.show();
    if (page === 'edit') { if (Wizard.st && Wizard.st.mode === 'edit' && Auth.get()) return Wizard.render(); location.replace('#/admin'); return; }
    if (page === 'form' && arg && FORMS[arg]) {
      if (Wizard.st && Wizard.st.fid === arg && Wizard.st.mode === 'new') return Wizard.render();
      const d = LS.get(Wizard.draftKey(arg), null);
      Wizard.st = null; Wizard.start(arg, d && d.rec, 'new', d ? d.step : 0); return;
    }
    if (Wizard.st && Wizard.st.mode === 'new' && Wizard.st.dirty) Wizard.saveDraft();
    Wizard.st = null; Wizard.landing();
  }
};

/* =====================================================================
   BOOT
   ===================================================================== */
document.addEventListener('DOMContentLoaded', function boot() {   // รอให้ Chart.js / SheetJS (defer) โหลดก่อน
  applyBranding();
  updateModeChip();
  if (!location.hash || !/^#\/(form|dashboard|admin|edit)/.test(location.hash)) history.replaceState(null, '', '#/form');   // หน้าแรก = หน้าบันทึกข้อมูลเสมอ
  window.addEventListener('hashchange', () => Router.go());
  window.addEventListener('online', () => { if (MODE === 'gas') { setModeChip('live'); Outbox.flush(); } });
  window.addEventListener('offline', () => { if (MODE === 'gas') setModeChip('off'); toast('ขาดการเชื่อมต่ออินเทอร์เน็ต — ข้อมูลที่บันทึกจะถูกเก็บไว้ในเครื่องก่อน', 'warn'); });
  window.addEventListener('beforeunload', () => { if (Wizard.st && Wizard.st.mode === 'new' && Wizard.st.dirty) Wizard.saveDraft(); });
  if (MODE === 'gas') { Api.ping().then(() => Outbox.flush()).catch(() => setModeChip('off')); setInterval(() => Outbox.flush(), 60e3); }
  else Demo.db();
  Router.go();
});
</script>
