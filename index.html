ู้ป่วยและญาติที่เหมาะสม ไม่น้อยกว่า 5- 10 ที่นั่งและที่นั่งต้องมีพนักพิง","section":"s2"},{"key":"tms_q010","no":"1.4","text":"1.4 การสัญจรและการเคลื่อนย้ายผู้ป่วยต้องกระทำได้โดยสะดวก โดยเฉพาะเมื่อเกิดภาวะฉุกเฉิน ขนาดความกว้างของประตู เข้า-ออก ไม่ต่ำกว่า 80 เซนติเมตร","section":"s2"},{"key":"tms_q011","no":"1.5.1","text":"1.5 ห้องตรวจหรือห้องให้การรักษา\n1.5.1 ห้องตรวจหรือห้องให้การรักษากั้นเป็นสัดส่วนและมิดชิด มีประตู เปิด-ปิด อย่างชัดเจน","section":"s2"},{"key":"tms_q012","no":"1.5.2 › 1)","text":"1.5.2 ภายในห้องตรวจต้องประกอบด้วย โต๊ะตรวจโรค\n1 ตัว เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์ 1 เตียง","section":"s2"},{"key":"tms_q013","no":"1.5.3","text":"1.5.3 อ่างฟอกมือชนิดไม่ใช้มือเปิด-ปิดน้ำ พร้อมมีสบู่เหลว\nผ้าเช็ดมือหรือกระดาษเช็ดมือที่ใช้ครั้งเดียว","section":"s2"},{"key":"tms_q014","no":"1.5.4","text":"1.5.4 ไม่มีวงจรปิดในห้องตรวจหรือห้องที่เกี่ยวกับการประกอบวิชาชีพหรือการประกอบโรคศิลปะ","section":"s2"},{"key":"tms_q015","no":"1.6","text":"1.6 มีห้องน้ำห้องส้วมที่ถูกสุขลักษณะอย่างน้อยหนึ่งห้องหรือมีห้องน้ำส่วนรวมในกรณีอาคารศูนย์การค้าหรืออาคารสำนักงาน","section":"s2"},{"key":"tms_q016","no":"1.7","text":"1.7 มีแสงสว่างและการระบายอากาศเพียงพอ ไม่มีกลิ่นอับทึบ (หากความสูงของสถานพยาบาลต่ำกว่า 2.6 เมตร ต้องเพิ่มพัดลมดูดอากาศที่เหมาะสม)","section":"s2"},{"key":"tms_q017","no":"1.8.1","text":"1.8 มีระบบการเก็บและกำจัดมูลฝอยและสิ่งปฏิกูลที่เหมาะสม และมีการกำจัดอย่างเหมาะสม\n1.8.1 ทุกห้องตรวจและทุกห้องที่ให้การรักษาผู้ป่วย ต้องมีถังขยะทั่วไป–ถังขยะติดเชื้อ ที่มีลักษณะถังขยะแบบใช้เท้าเหยียบให้เปิด มีฝาปิดมิดชิด ถังขยะติดเชื้อใช้ถุงสีแดง เขียนข้อความ “ขยะติดเชื้อ”ไว้ที่ถังขยะ แยกต่างหากจากถังขยะทั่วไป ใช้ถุงสีดำ เขียนข้อความ “ขยะทั่วไป” ไว้ที่ถังขยะ วางคู่กันทุกห้อง","section":"s2"},{"key":"tms_q018","no":"1.8.2","text":"1.8.2 มีสัญญา/หนังสือตอบรับการขนถ่ายขยะติดเชื้อ ของการจ้างบริษัทกำจัดขยะติดเชื้อ หรืออาจแสดงใบเสร็จรับเงินที่เป็นเดือนปัจจุบัน","section":"s2"},{"key":"tms_q019","no":"1.9","text":"1.9 มีระบบควบคุมการติดเชื้อที่เหมาะสม ตามวิธีการป้องกันการติดเชื้อในคลินิก (ส.พ.23)","section":"s2"},{"key":"tms_q020","no":"1.10.1","text":"1.10 มีเครื่องดับเพลิงขนาดเหมาะสม ตามที่กฎหมายท้องถิ่นบัญญัติ และอยู่ในสภาพพร้อมใช้งาน ติดตั้งในที่มองเห็นได้ชัดเจน\n1.10.1 ขนาดเครื่องดับเพลิงไม่ต่ำกว่า 10 ปอนด์","section":"s2"},{"key":"tms_q021","no":"1.10.2","text":"1.10.2 มีเครื่องดับเพลิงติดตั้งทุกชั้น","section":"s2"},{"key":"tms_q022","no":"1.10.3","text":"1.10.3 ติดตั้งเครื่องดับเพลิงส่วนบนสูงจากพื้นไม่เกิน 1.5 เมตร หรือวางกับพื้นมีฐานรองรับที่มั่นคง อยู่ในที่มองเห็นอย่างชัดเจน และควรมีป้ายแสดงจุดที่ตั้งถังดับเพลิง","section":"s2"},{"key":"tms_q023","no":"1.11","text":"1.11 มีป้ายเครื่องหมายห้ามสูบบุหรี่","section":"s2"},{"key":"tms_q024","no":"2.1","text":"2. คลินิกต้องมีลักษณะการให้บริการดังต่อไปนี้\n2.1 มีความปลอดภัย มีความสะดวก และเหมาะสมต่อ\nผู้ให้บริการและผู้รับบริการ","section":"s3"},{"key":"tms_q025","no":"2.2","text":"2.2 มีการให้บริการที่ได้มาตรฐานตามลักษณะวิชาชีพ ตามที่สภาวิชาชีพหรือคณะกรรมการวิชาชีพประกาศกำหนด แล้วแต่กรณี","section":"s3"},{"key":"tms_q026","no":"2.3","text":"2.3 พื้นที่ให้บริการจะต้องมีพื้นที่เชื่อมและเปิดติดต่อถึงกันได้และไม่ตั้งอยู่ในพื้นที่เดียวกับสถานที่ขายยาตามกฎหมายว่าด้วยยาหรือพื้นที่เดียวกับการประกอบอาชีพอื่น","section":"s3"},{"key":"tms_q027","no":"2.4","text":"2.4 พื้นที่ให้บริการจะต้องไม่ตั้งอยู่ในสถานที่เดียวกับสถานพยาบาลของกระทรวง ทบวง กรม กรุงเทพมหานคร เมือง\nพัทยา องค์การบริการส่วนจังหวัด เทศบาล องค์การบริการส่วน\nตำบล องค์กรปกครองส่วนท้องถิ่นอื่น และสภากาชาดไทย ซึ่งให้บริการในลักษณะเดียวกัน","section":"s3"},{"key":"tms_q028","no":"2.5","text":"2.5 ในกรณีที่มีการให้บริการในอาคารเดียวกับการประกอบกิจการอื่น จะต้องมีการแบ่งพื้นที่ให้ชัดเจน และกิจการอื่นต้องไม่กระทบกระเทือนต่อการประกอบวิชาชีพ รวมทั้งสามารถเคลื่อนย้ายผู้ป่วยฉุกเฉินได้สะดวก","section":"s3","condHead":true,"cond":"tms_g1"},{"key":"tms_q029","no":"2.5.1","text":"2.5.1 สถานพยาบาลต้องมีประตู เข้า-ออก คนละทางกับการประกอบกิจการอื่น","section":"s3","cond":"tms_g1"},{"key":"tms_q030","no":"2.5.2","text":"2.5.2 การกั้นพื้นที่ต้องเป็นสัดส่วน แสดงให้เห็นประจักษ์ ชัดเจนและถาวร","section":"s3","cond":"tms_g1"},{"key":"tms_q031","no":"2.6","text":"2.6 ในกรณีที่มีการให้บริการของลักษณะสหคลินิกหรือ มีคลินิกหลายลักษณะ อยู่ในอาคารเดียวกัน จะต้องมีการแบ่งสัดส่วนพื้นที่ให้ชัดเจน และแต่ละสัดส่วนต้องมีพื้นที่และลักษณะตามมาตรฐานของการให้บริการนั้น แต่ละสาขาต้องมีอย่างน้อย 1 ห้องตรวจโรค ซึ่งต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรค 1 เตียง ที่ได้มาตรฐานทางการแพทย์ และอ่างฟอกมือชนิดที่ไม่ใช้มือ เปิด-ปิดน้ำ สบู่","section":"s3"},{"key":"tms_q032","no":"3.1.1","text":"3. การแสดงรายละเอียดเกี่ยวกับชื่อสถานพยาบาล ผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะในสถานพยาบาล อัตราค่ารักษาพยาบาล ค่าบริการและสิทธิผู้ป่วย\n3.1 มีป้ายชื่อสถานพยาบาล เป็นไปตามกฎกระทรวง\n3.1.1 ป้ายชื่อสถานพยาบาลต้องเป็นสี่เหลี่ยมผืนผ้า ขนาดความกว้างของป้ายไม่น้อยกว่า 40 เซนติเมตร ความยาวไม่น้อยกว่า 120 เซนติเมตร","section":"s4"},{"key":"tms_q033","no":"3.1.2","text":"3.1.2 จัดทำแผ่นป้ายแสดงชื่อสถานพยาบาลที่เป็นภาษาไทยขนาดความสูงไม่ต่ำกว่า 10 เซนติเมตร ตัวหนังสือสีน้ำเงิน\nสีพื้นป้ายสีขาว","section":"s4"},{"key":"tms_q034","no":"3.1.3","text":"3.1.3 เลขที่ใบอนุญาตขนาดความสูงไม่ต่ำกว่า 5 เซนติเมตร ตัวเลขอารบิคสีน้ำเงิน","section":"s4"},{"key":"tms_q035","no":"3.1.4","text":"3.1.4 กรณีใช้ภาษาต่างประเทศร่วมด้วย ต้องมีชื่อตรงกันกับภาษาไทย ขนาดตัวอักษรต้องเล็กกว่าภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"tms_q036","no":"3.2","text":"3.2 ติดตั้งป้ายชื่อสถานพยาบาลในตำแหน่งที่มองเห็นได้ชัดเจนจากภายนอกและเหมาะสม","section":"s4"},{"key":"tms_q037","no":"3.3.1","text":"3.3 ชื่อสถานพยาบาลไม่มีข้อความลักษณะชักชวนโอ้อวดเกินจริงหรืออาจสื่อให้เข้าใจผิด\n3.3.1 คำนำหน้าชื่อหรือต่อท้ายของชื่อคลินิกต้องประกอบด้วยลักษณะคลินิก และลักษณะการให้บริการของคลินิก","section":"s4"},{"key":"tms_q038","no":"3.3.2","text":"3.3.2 กรณีใช้ชื่อภาษาต่างประเทศด้วย ขนาดตัวอักษรต้องเล็กกว่าอักษรภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"tms_q039","no":"3.3.3","text":"3.3.3 ชื่อคลินิกจะต้องไม่ใช้คำหรือข้อความที่มีลักษณะชักชวน โอ้อวดเกินความจริง หรืออาจทำให้เกิดความเข้าใจผิดในสาระสำคัญเกี่ยวกับการประกอบกิจการ","section":"s4"},{"key":"tms_q040","no":"3.3.4","text":"3.3.4 ชื่อคลินิกต้องไม่สื่อความหมายหรืออ้างอิงสถาบันพระมหากษัตริย์ เว้นแต่ได้รับพระบรมราชานุญาต","section":"s4"},{"key":"tms_q041","no":"3.4","text":"3.๔ มีข้อความแสดงวัน เวลาที่ให้บริการไว้โดยเปิดเผย มองเห็นได้ชัดเจนจากด้านนอกคลินิกและตรงกับที่ได้รับอนุญาตให้ประกอบกิจการสถานพยาบาล","section":"s4"},{"key":"tms_q042","no":"3.5.2","text":"3.๕ แสดงใบอนุญาตติดในที่เปิดเผยและเหมาะสม\n3.5.๑ ใบอนุญาตให้ประกอบกิจการสถานพยาบาล (แบบ ส.พ.7)\n3.5.๒ ใบอนุญาตให้ดำเนินการสถานพยาบาล (แบบ ส.พ.19)","section":"s4"},{"key":"tms_q043","no":"3.6","text":"3.6 มีบริเวณที่ใช้แสดงหลักฐานการชำระค่าธรรมเนียมการประกอบกิจการสถานพยาบาล(แบบ ส.พ.12) ในที่เปิดเผยและเห็นได้ชัดเจนบริเวณทางเข้าสถานพยาบาล","section":"s4"},{"key":"tms_q044","no":"3.7","text":"3.7 หน้าห้องตรวจมีบริเวณให้ติดป้ายแสดงชื่อ ภาพถ่าย และเลขที่ใบอนุญาตของผู้ประกอบวิชาชีพเวชกรรมที่ให้บริการ หากมีผู้ประกอบวิชาชีพ/ผู้ประกอบโรคศิลปะอื่นปฏิบัติงานให้ยื่น สพ.6 ทุกคนและแสดงป้ายนี้ไว้ในบริเวณที่เปิดเผยและเห็นได้ชัดเจน","section":"s4"},{"key":"tms_q045","no":"3.8","text":"3.8 แสดงอัตราค่าบริการและค่ารักษาพยาบาลให้ครอบคลุมการบริการที่เรียกเก็บ โดยแสดงอัตราราคาต่อหน่วย และระบุข้อความด้วยอักษรภาษาไทย โดยแสดงไว้ในที่เปิดเผยให้ผู้รับบริการสามารถเห็นได้ง่าย โดยจัดทำเป็นแผ่นประกาศ แผ่นพับ เล่ม หรือแฟ้มเอกสาร หรือโปรแกรมคอมพิวเตอร์ แสดงให้ผู้ป่วยทราบ","section":"s4"},{"key":"tms_q046","no":"3.9","text":"3.9 มีป้ายแสดงให้ผู้รับบริการทราบว่าสามารถสอบถามอัตราค่าบริการและค่ารักษาพยาบาลได้จากที่ใด ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 10 เซนติเมตร แสดงไว้ในที่เห็นได้ชัดเจน","section":"s4"},{"key":"tms_q047","no":"3.10","text":"3.10 แสดงคำประกาศสิทธิผู้ป่วยไว้ในที่เปิดเผยและเห็นได้ง่ายอ่านได้ชัดเจน ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 1 เซนติเมตร บริเวณที่พักคอยของผู้รับบริการ","section":"s4"},{"key":"tms_q048","no":"3.11","text":"3.11 ข้อความโฆษณาสถานพยาบาล (ถ้ามี) ไม่เป็นเท็จ ไม่โอ้อวด หรือสื่อให้เข้าใจผิดในสาระสำคัญ","section":"s4"},{"key":"tms_q049","no":"4.1.1","text":"4.ชนิดและจำนวนเครื่องมือ เครื่องใช้ที่จำเป็นประจำสถานพยาบาล\n4.1 เวชระเบียน\n4.1.1 มีตู้หรือชั้นหรืออุปกรณ์เก็บเวชระเบียนที่มั่นคง ปลอดภัยและต้องจัดให้เป็นระเบียบสามารถค้นหาได้ง่าย","section":"s5"},{"key":"tms_q050","no":"4.1.2","text":"4.1.2 มีการจัดเตรียมทะเบียนผู้ป่วย มีรายการดังต่อไปนี้","section":"s5"},{"key":"tms_q051","no":"4.1.2 › 1)","text":"1) ชื่อ นามสกุล อายุ ของผู้ป่วย","section":"s5"},{"key":"tms_q052","no":"4.1.2 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s5"},{"key":"tms_q053","no":"4.1.2 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"tms_q054","no":"4.1.3 › 1)","text":"4.1.3 มีเวชระเบียน หรือ บัตรผู้ป่วย ที่สามารถ บันทึกรายละเอียด ตามที่กฎกระทรวงกำหนด\n1) ชื่อและที่อยู่สถานพยาบาล","section":"s5"},{"key":"tms_q055","no":"4.1.3 › 2)","text":"2) เลขบัตรประจำตัวประชาชนผู้ป่วย","section":"s5"},{"key":"tms_q056","no":"4.1.3 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"tms_q057","no":"4.1.3 › 4)","text":"4) ชื่อ นามสกุล อายุ เพศ ที่อยู่ หมายเลขโทรศัพท์ (ถ้ามี) และข้อมูลส่วนบุคคลอื่น ๆ ของผู้ป่วย เช่น เชื้อชาติ สัญชาติ สถานภาพสมรส เป็นต้น","section":"s5"},{"key":"tms_q058","no":"4.1.3 › 5)","text":"5) อาการเจ็บป่วย การแพ้ยา ผลการตรวจทางร่างกายและผลการตรวจทางห้องปฏิบัติชันสูตรของผู้ป่วย","section":"s5"},{"key":"tms_q059","no":"4.1.3 › 6)","text":"6) การวินิจฉัยโรค","section":"s5"},{"key":"tms_q060","no":"4.1.3 › 7)","text":"7) การรักษา","section":"s5"},{"key":"tms_q061","no":"4.1.3 › 8)","text":"8) ลายมือผู้ประกอบวิชาชีพเวชกรรมที่ให้การรักษา","section":"s5"},{"key":"tms_q062","no":"4.2.1","text":"4.2 เครื่องใช้ทั่วไป ในห้องตรวจโรคทุกห้องต้องประกอบด้วย\n4.2.1 โต๊ะตรวจโรค พร้อมเก้าอี้","section":"s5"},{"key":"tms_q063","no":"4.2.2","text":"4.2.2 เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์","section":"s5"},{"key":"tms_q064","no":"4.2.3","text":"4.2.3 ต้องมีบันไดขึ้นเตียง (Step)","section":"s5"},{"key":"tms_q065","no":"4.2.4","text":"4.2.4 มีปลอกหมอน ผ้าปูเตียง และผ้าคลุมตัวผู้ป่วย","section":"s5"},{"key":"tms_q066","no":"4.2.5","text":"4.2.5เครื่องชั่งน้ำหนัก และอุปกรณ์วัดส่วนสูง อยู่ในห้องตรวจหรือบริเวณที่พักคอย","section":"s5"},{"key":"tms_q067","no":"4.2.6","text":"4.2.6มีตู้หรือชั้นเก็บยาและเวชภัณฑ์เป็นสัดส่วน","section":"s5"},{"key":"tms_q068","no":"4.2.7","text":"4.2.7อ่างฟอกมือชนิดไม่ใช้มือเปิดปิดน้ำ สบู่ ผ้าเช็ดมือ","section":"s5"},{"key":"tms_q069","no":"4.3","text":"4.3 ห้องนวด/ห้องประคบ (หากมีบริการ) ให้มีขนาดและอุปกรณ์ตามเกณฑ์มาตรฐาน","section":"s5","condHead":true,"cond":"tms_g4"},{"key":"tms_q070","no":"4.3.1","text":"4.3.1 มีขนาดและพื้นที่เหมาะสมกับการให้บริการนวด และจำนวนเตียง หากเป็นห้องนวดรวมต้องมีม่านกั้นระหว่างเตียงให้เป็นสัดส่วน มีที่ว่างระหว่างเตียงหรือที่ว่างระหว่างเบาะนวด (ในกรณียกพื้นสูง) ห่างกันไม่น้อยกว่า 0.8 เมตร","section":"s5","cond":"tms_g4"},{"key":"tms_q071","no":"4.3.2","text":"4.3.2 เตียงนวดมีขนาดไม่น้อยกว่า 1.20 x 2.00 เมตร เบาะมีขนาดไม่น้อยกว่า ๐.๙ x 1.80 เมตร ความสูงของเตียงมีความเหมาะสมกับการให้บริการนวดโดยไม่ก่อให้เกิดอันตรายทั้งผู้ให้และผู้รับบริการ","section":"s5","cond":"tms_g4"},{"key":"tms_q072","no":"4.3.3","text":"4.3.3 เบาะที่นอนเป็นที่นอนที่เหมาะสมต่อการนวด หุ้มด้วยวัสดุคงทน และมีผ้าปูที่นอน หมอนพร้อมปลอกหมอน ผ้าคลุมตัว","section":"s5","cond":"tms_g4"},{"key":"tms_q073","no":"4.3.4 › 3)","text":"4.3.4 หากมีการประคบสมุนไพรในห้องนวดให้เพิ่มอุปกรณ์ ดังนี้\n1) ภาชนะล้างมือพร้อมสบู่ และผ้าเช็ดมือที่สะอาด\n2) พัดลมระบายอากาศหรือระบบระบายอากาศ เพื่อให้อากาศถ่ายเทได้สะดวก\n3) มีที่วางหม้อน้ำร้อนนึ่งลูกประคบอย่างเหมาะสมคำนึงถึงความปลอดภัยของผู้ให้และผู้รับบริการ","section":"s5","cond":"tms_g4"},{"key":"tms_q074","no":"4.3.5","text":"4.3.5 สัดส่วนการให้บริการของผู้ประกอบวิชาชีพ : เตียงให้บริการ ไม่เกิน 1 : ๔","section":"s5","cond":"tms_g4"},{"key":"tms_q075","no":"4.4.1","text":"4.4 ห้องเปลี่ยนเสื้อผ้าให้มีขนาดและอุปกรณ์ตามเกณฑ์มาตรฐาน\n4.4.1 แยกห้องเปลี่ยนเสื้อผ้าชาย – หญิง แต่หากไม่สามารถแยกห้องชาย – หญิง ได้ ต้องบริหารจัดการเรื่องเวลาการใช้ห้องเปลี่ยนเสื้อผ้าของผู้รับบริการชาย หญิง ได้อย่างเหมา .1 › 42)","text":"8) มีระบบบันทึกการควบคุมอุณหภูมิในห้องอบไอน้ำสมุนไพร\nในวันที่มีการใช้งานอย่างน้อย 1 ครั้ง โดยให้มีอุณหภูมิอยู่ระหว่าง\n42 – 45 องศาเซลเซียส","section":"s5","cond":"tms_g5"},{"key":"tms_q090","no":"4.5.1 › 10)","text":"10) มีกริ่ง/กระดิ่งสัญญาณที่ไม่ใช้ระบบไฟฟ้าเรียกในกรณีฉุกเฉิน","section":"s5","cond":"tms_g5"},{"key":"tms_q091","no":"4.5.1 › 11)","text":"11) มีสัญญาณเตือนบอกเวลา","section":"s5","cond":"tms_g5"},{"key":"tms_q092","no":"4.5.1 › 12)","text":"12) มีระบบป้องกันไฟฟ้ารั่วและไฟฟ้าลัดวงจร","section":"s5","cond":"tms_g5"},{"key":"tms_q093","no":"4.5.1 › 13)","text":"13) มีที่นั่งพักรอหน้าห้องอบไอน้ำสมุนไพร พร้อมน้ำดื่ม","section":"s5","cond":"tms_g5"},{"key":"tms_q094","no":"4.5.1 › 14)","text":"14) ท่อส่งกระจายไอน้ำในห้องอบสมุนไพร ทำด้วยวัสดุแข็งแรงทนความร้อนได้ดี มีฉนวนหุ้มไม่รั่วซึม มีการออกแบบให้กระจายความร้อนได้ทั่วถึง ติดตั้งอยู่ในที่ปลอดภัย หรือไม่อยู่ในตำแหน่งที่ผู้รับบริการสัมผัสง่าย","section":"s5","cond":"tms_g5"},{"key":"tms_q095","no":"4.5.1 › 15)","text":"15) กรณีมีหม้อต้มไอน้ำที่มีระบบไอน้ำผ่านท่อไปยังห้องอบ\nสมุนไพร หม้อต้มต้องทำด้วย สแตนเลส มีความแข็งแรง ไม่มี\nส่วนประกอบของสารตะกั่ว มีระบบแยกสมุนไพรออกจากน้ำ\nมีระบบควบคุมความปลอดภัย และมีเครื่องควบคุมอุณหภูมิ สามารถควบคุมอุณหภูมิให้อยู่ในระดับไม่เกิน 45 องศาเซลเซียส","section":"s5","cond":"tms_g5"},{"key":"tms_q096","no":"4.5.2 › 1)","text":"4.5.2 ห้องอบไอน้ำสมุนไพรรวม\n1) แยกห้องชาย-หญิง หรือถ้าไม่สามารถแยกได้ต้องบริหารจัดการเรื่องของเวลาการให้บริการแก่ผู้รับบริการชาย-หญิงได้อย่างเหมาะสม","section":"s5","cond":"tms_g5"},{"key":"tms_q097","no":"4.5.2 › 2)","text":"2) ขนาดห้องไม่น้อยกว่า 1.5 x 2 เมตร ความสูงของเพดาน\nไม่น้อยกว่า 2.00 เมตร","section":"s5","cond":"tms_g5"},{"key":"tms_q098","no":"4.5.2 › 3)","text":"3) พื้น ผนัง ฝ้าทำด้วยวัสดุที่แข็งแรง ทนทาน ทนน้ำ ไม่ทาสี และทำความสะอาดง่าย","section":"s5","cond":"tms_g5"},{"key":"tms_q099","no":"4.5.2 › 4)","text":"4) ประตูทำด้วยวัสดุทนน้ำ มีความกว้างไม่น้อยกว่า 0.๘ เมตรหรือมีความกว้างที่สามารถให้รถเข็นผู้ป่วย เข้า-ออก ประตูได้สะดวก ประตูเปิดออกจากภายใน ด้านบนของประตูหรือบานเลื่อนมีช่องมองเป็นกระจกใสที่อยู่ในระดับสายตา และไม่มีอุปกรณ์ล็อค/ขัดปิด/ตรึงประตู","section":"s5","cond":"tms_g5"},{"key":"tms_q100","no":"4.5.2 › 5)","text":"5) ที่นั่ง/เก้าอี้ ในห้องอบไอน้ำทำด้วยวัสดุทนความร้อน และไม่มีเชื้อรา","section":"s5","cond":"tms_g5"},{"key":"tms_q101","no":"4.5.2 › 6)","text":"6) มีพัดลมดูดอากาศ หรือระบบระบายอากาศ เพื่อให้อากาศถ่ายเทสะดวก","section":"s5","cond":"tms_g5"},{"key":"tms_q102","no":"4.5.2 › 7)","text":"7) มีแสงสว่างเพียงพอ สามารถมองเห็นสิ่งต่างๆ ในห้องได้ชัดเจนหลอดไฟใช้ชนิดกันความชื้นหรือหลอดไฟชนิดที่มีฝาครอบ","section":"s5","cond":"tms_g5"},{"key":"tms_q103","no":"4.5.2 › 8)","text":"8) มีที่วัดอุณหภูมิในห้องอบไอน้ำสมุนไพรได้อย่างถูกต้องเหมาะสม","section":"s5","cond":"tms_g5"},{"key":"tms_q104","no":"4.5.2 › 42)","text":"9) มีระบบบันทึกการควบคุมอุณหภูมิในห้องอบไอน้ำสมุนไพร\nในวันที่มีการใช้งานอย่างน้อย 1 ครั้ง โดยให้มีอุณหภูมิอยู่ระหว่าง\n42 – 45 องศาเซลเซียส","section":"s5","cond":"tms_g5"},{"key":"tms_q105","no":"4.5.2 › 10)","text":"10) มีกริ่ง/กระดิ่งสัญญาณที่ไม่ใช้ระบบไฟฟ้าเรียกในกรณีฉุกเฉิน","section":"s5","cond":"tms_g5"},{"key":"tms_q106","no":"4.5.2 › 11)","text":"11) มีสัญญาณเตือนบอกเวลา","section":"s5","cond":"tms_g5"},{"key":"tms_q107","no":"4.5.2 › 12)","text":"12) มีระบบป้องกันไฟฟ้ารั่วและไฟฟ้าลัดวงจร","section":"s5","cond":"tms_g5"},{"key":"tms_q108","no":"4.5.2 › 13)","text":"13) มีที่นั่งพักรอหน้าห้องอบไอน้ำสมุนไพร พร้อมน้ำดื่ม","section":"s5","cond":"tms_g5"},{"key":"tms_q109","no":"4.5.2 › 14)","text":"14) ท่อส่งกระจายไอน้ำในห้องอบสมุนไพร ทำด้วยวัสดุแข็งแรงทนความร้อนได้ดี มีฉนวนหุ้มไม่รั่วซึม มีการออกแบบให้กระจายความร้อนได้ทั่วถึง ติดตั้งอยู่ในที่ปลอดภัย หรือไม่อยู่ในตำแหน่งที่ผู้รับบริการสัมผัสง่าย","section":"s5","cond":"tms_g5"},{"key":"tms_q110","no":"4.5.2 › 15)","text":"15) กรณีมีหม้อต้มไอน้ำที่มีระบบไอน้ำผ่านท่อไปยังห้องอบ\nสมุนไพร หม้อต้มต้องทำด้วย สแตนเลส มีความแข็งแรง ไม่มี\nส่วนประกอบของสารตะกั่ว มีระบบแยกสมุนไพรออกจากน้ำ\nมีระบบควบคุมความปลอดภัย และมีเครื่องควบคุมอุณหภูมิ สามารถควบคุมอุณหภูมิให้อยู่ในระดับไม่เกิน 45 องศาเซลเซียส","section":"s5","cond":"tms_g5"},{"key":"tms_q111","no":"4.5.2 › 16)","text":"16) กรณีมีหม้อต้มไอน้ำที่ไม่มีระบบไอน้ำผ่านท่อไปยังห้องอบสมุนไพร หม้อต้มทำด้วยวัสดุที่มีความปลอดภัย ไม่มีส่วนประกอบของสารตะกั่วและมีระบบควบคุมความปลอดภัย ทนความร้อนได้ดีและมีเครื่องควบคุมอุณหภูมิ สามารถควบคุมอุณหภูมิให้อยู่ในระดับไม่เกิน 45 องศาเซลเซียส","section":"s5","cond":"tms_g5"},{"key":"tms_q112","no":"4.5.3 › 1)","text":"4.5.3 ตู้อบไอน้ำสมุนไพร\n1) ขนาดของตู้อบไอน้ำสมุนไพรเหมาะสมกับจำนวน และขนาดของผู้รับบริการ","section":"s5","cond":"tms_g5"},{"key":"tms_q113","no":"4.5.3 › 2)","text":"2) ประตูทำด้วยวัสดุทนน้ำ เปิดออกจากภายใน และสามารถเข้า –ออก ได้สะดวก ด้านบนของบานเลื่อนมีช่องมองเป็นกระจกใสที่อยู่ในระดับสายตา และไม่มีอุปกรณ์ล็อค/ขัดปิด/ตรึง","section":"s5","cond":"tms_g5"},{"key":"tms_q114","no":"4.5.3 › 3)","text":"3) หม้อต้มสมุนไพรทำจากวัสดุปลอดภัย ไม่มีส่วนประกอบของสารตะกั่ว และมีระบบควบคุมความปลอดภัย","section":"s5","cond":"tms_g5"},{"key":"tms_q115","no":"4.5.3 › 4)","text":"4) หม้อต้มสมุนไพรวางอยู่ในตำแหน่งที่ปลอดภัย","section":"s5","cond":"tms_g5"},{"key":"tms_q116","no":"4.5.3 › 6)","text":"6) ที่นั่ง/เก้าอี้ ในห้องอบไอน้ำทำด้วยวัสดุทนความร้อน และไม่มีเชื้อรา","section":"s5","cond":"tms_g5"},{"key":"tms_q117","no":"4.5.3 › 7)","text":"7) มีพัดลมดูดอากาศ หรือระบบระบายอากาศ เพื่อให้อากาศถ่ายเทสะดวก","section":"s5","cond":"tms_g5"},{"key":"tms_q118","no":"4.5.3 › 8)","text":"8) มีแสงสว่างเพียงพอ สามารถมองเห็นสิ่งต่างๆ ในห้องได้ชัดเจน หลอดไฟใช้ชนิดกันความชื้นหรือหลอดไฟชนิดที่มีฝาครอบ","section":"s5","cond":"tms_g5"},{"key":"tms_q119","no":"4.5.3 › 9)","text":"9) มีที่วัดอุณหภูมิในห้องอบไอน้ำสมุนไพรได้อย่างถูกต้อง เหมาะสม","section":"s5","cond":"tms_g5"},{"key":"tms_q120","no":"4.5.3 › 10)","text":"10) มีระบบบันทึกการควบคุมอุณหภูมิในห้องอบไอน้ำสมุนไพร ในวันที่มีการใช้งานอย่างน้อย 1 ครั้ง โดยให้มีอุณหภูมิอยู่ระหว่าง 42 – 45 องศาเซลเซียส","section":"s5","cond":"tms_g5"},{"key":"tms_q121","no":"4.5.3 › 11)","text":"11) มีกริ่ง/กระดิ่งสัญญาณที่ไม่ใช้ระบบไฟฟ้าเรียกในกรณีฉุกเฉิน","section":"s5","cond":"tms_g5"},{"key":"tms_q122","no":"4.5.3 › 12)","text":"12) มีสัญญาณเตือนบอกเวลา","section":"s5","cond":"tms_g5"},{"key":"tms_q123","no":"4.5.3 › 13)","text":"13) มีระบบป้องกันไฟฟ้ารั่วและไฟฟ้าลัดวงจร","section":"s5","cond":"tms_g5"},{"key":"tms_q124","no":"4.5.3 › 14)","text":"14) มีที่นั่งพักรอหน้าห้องอบไอน้ำสมุนไพร พร้อมน้ำดื่ม","section":"s5","cond":"tms_g5"},{"key":"tms_q125","no":"4.5.4 › 1)","text":"4.5.4 กระโจมอบไอน้ำสมุนไพร\n1) เป็นกระโจมที่ผู้รับบริการเข้าได้ทั้งร่างกาย โดยไม่มีส่วนหนึ่งส่วนใดของร่างกายยื่นออกจากกระโจม และสามารถเข้าออกได้สะดวก","section":"s5","cond":"tms_g5"},{"key":"tms_q126","no":"4.5.4 › 2)","text":"2) ขนาดของกระโจมมีความเหมาะสมกับจำนวนและขนาดผู้รับบริการ","section":"s5","cond":"tms_g5"},{"key":"tms_q127","no":"4.5.4 › 3)","text":"3) ทำจากผ้าที่ระบายอากาศได้ดีและสะอาด","section":"s5","cond":"tms_g5"},{"key":"tms_q128","no":"4.5.4 › 4)","text":"4) หม้อต้มสมุนไพรทำจากวัสดุที่มีความปลอดภัย ไม่มีส่วนประกอบของสารตะกั่ว","section":"s5","cond":"tms_g5"},{"key":"tms_q129","no":"4.5.4 › 5)","text":"5) มีวัสดุอุปกรณ์สำหรับป้องกันไม่ให้ผู้รับบริการสัมผัสหม้อต้มสมุนไพรได้ง่าย","section":"s5","cond":"tms_g5"},{"key":"tms_q130","no":"4.5.4 › 6)","text":"6) เก้าอี้ในกระโจมทำด้วยวัสดุทนความร้อน และไม่มีเชื้อรา","section":"s5","cond":"tms_g5"},{"key":"tms_q131","no":"4.5.4 › 7)","text":"7) บริเวณพื้นที่ตั้งกระโจมต้องไม่ลื่น","section":"s5","cond":"tms_g5"},{"key":"tms_q132","no":"4.8 › 1)","text":"4.๘ มีระบบประสานการส่งต่อผู้ป่วยไปยังสถานพยาบาลที่อยู่ใกล้เคียง เมื่อเกิดภาวะฉุกเฉิน\n1) มีเบอร์โทรศัพท์ติดต่อฉุกเฉินติดไว้ในที่เห็นชัดเจน","section":"s5"},{"key":"tms_q133","no":"4.8 › 2)","text":"2) มีแผนและขั้นตอนการช่วยเหลือเบื้องต้น และขั้นตอนการส่งต่อผู้ป่วย","section":"s5"}],"ack":"ข้าพเจ้าได้อ่านและรับทราบผลการตรวจสถานพยาบาลนี้แล้วและจะปฏิบัติตามคำสั่งหรือคำแนะนำของพนักงานเจ้าหน้าที่อย่างเคร่งครัด ทั้งนี้พนักงานเจ้าหน้าที่ไม่ได้ทำการละเมิด ข่มขู่ key":"dia_q003","no":"2.1","text":"2.1 มีสำเนาเอกสารแสดงกรรมสิทธิ์ เพื่อประกอบกิจการสถานพยาบาลประเภทคลินิก จากผู้มีกรรมสิทธิ์/ผู้ครอบครองพื้นที่ดังกล่าว เช่น สำเนาโฉนดที่ดิน หรือสำเนาสัญญาเช่า เป็นต้น","section":"s2"},{"key":"dia_q004","no":"1","text":"การตรวจสอบสถานที่\n1. ลักษณะโดยทั่วไปของสถานพยาบาล","section":"s3"},{"key":"dia_q005","no":"1.1","text":"1.1 ตั้งอยู่ในทำเลที่สะดวก ปลอดภัยและไม่เป็นอันตรายต่อสุขภาพ","section":"s3"},{"key":"dia_q006","no":"1.2","text":"1.2 อาคารต้องมั่นคงแข็งแรง ไม่อยู่ในสภาพชำรุดหรือเสี่ยงต่ออันตรายจากการใช้สอย","section":"s3"},{"key":"dia_q007","no":"1.3","text":"1.3 บริเวณทั้งภายนอกและภายในต้องสะอาด เป็นระเบียบเรียบร้อย จัดแบ่งพื้นที่ใช้สอยอย่างเหมาะสม และมีสิ่งอำนวยความสะดวกแก่ผู้ป่วย โดยมีลักษณะดังนี้","section":"s3"},{"key":"dia_q008","no":"1.3.1","text":"1.3.1 มีพื้นที่โดยรวมไม่ต่ำกว่า 20 ตารางเมตร โดยส่วนแคบที่สุดต้องมีความกว้างไม่น้อยกว่า 3.00 เมตร","section":"s3"},{"key":"dia_q009","no":"1.3.2","text":"1.3.2 มีส่วนที่นั่งพักคอยของผู้ป่วยและญาติที่เหมาะสม ไม่น้อยกว่า 5- 10 ที่นั่งและที่นั่งต้องมีพนักพิง","section":"s3"},{"key":"dia_q010","no":"1.4","text":"1.4 การสัญจรและการเคลื่อนย้ายผู้ป่วยต้องกระทำได้โดยสะดวก โดยเฉพาะเมื่อเกิดภาวะฉุกเฉิน ขนาดความกว้างของประตู เข้า-ออก ไม่ต่ำกว่า 80 เซนติเมตร","section":"s3"},{"key":"dia_q011","no":"1.5.1","text":"1.5 ห้องตรวจหรือห้องให้การรักษา\n1.5.1 ห้องตรวจหรือห้องให้การรักษากั้นเป็นสัดส่วนและมิดชิด มีประตู เปิด-ปิด อย่างชัดเจน","section":"s3"},{"key":"dia_q012","no":"1.5.2","text":"1.5.2 ภายในห้องตรวจต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์ 1 เตียง","section":"s3"},{"key":"dia_q013","no":"1.5.3","text":"1.5.3 อ่างฟอกมือชนิดไม่ใช้มือเปิด-ปิดน้ำ พร้อมมีสบู่เหลว ผ้าเช็ดมือหรือกระดาษเช็ดมือที่ใช้ครั้งเดียว","section":"s3"},{"key":"dia_q014","no":"1.5.4","text":"1.5.4 ไม่มีวงจรปิดในห้องตรวจหรือห้องที่เกี่ยวกับการประกอบวิชาชีพหรือการประกอบโรคศิลปะ","section":"s3"},{"key":"dia_q015","no":"1.6","text":"1.6 มีห้องน้ำห้องส้วมที่ถูกสุขลักษณะอย่างน้อยหนึ่งห้องหรือมีห้องน้ำส่วนรวมในกรณีอาคารศูนย์การค้าหรืออาคารสำนักงาน","section":"s3"},{"key":"dia_q016","no":"1.7","text":"1.7 มีแสงสว่างและการระบายอากาศเพียงพอ ไม่มีกลิ่นอับทึบ (หากความสูงของสถานพยาบาลต่ำกว่า 2.6 เมตร ต้องเพิ่มพัดลมดูดอากาศที่เหมาะสม)","section":"s3"},{"key":"dia_q017","no":"1.8.1","text":"1.8 มีระบบการเก็บและกำจัดมูลฝอยและสิ่งปฏิกูลที่เหมาะสม และมีการกำจัดอย่างเหมาะสม\n1.8.1 ทุกห้องตรวจและทุกห้องที่ให้การรักษาผู้ป่วย ต้องมีถังขยะทั่วไป–ถังขยะติดเชื้อ ที่มีลักษณะถังขยะแบบใช้เท้าเหยียบให้เปิด มีฝาปิดมิดชิด ถังขยะติดเชื้อใช้ถุงสีแดง เขียนข้อความ “ขยะติดเชื้อ”ไว้ที่ถังขยะ แยกต่างหากจากถังขยะทั่วไป ใช้ถุงสีดำ เขียนข้อความ “ขยะทั่วไป” ไว้ที่ถังขยะ วางคู่กันทุกห้อง","section":"s3"},{"key":"dia_q018","no":"1.8.2","text":"1.8.2 มีสัญญา/หนังสือตอบรับการขนถ่ายขยะติดเชื้อ ของการจ้างบริษัทกำจัดขยะติดเชื้อ หรืออาจแสดงใบเสร็จรับเงินที่เป็นเดือนปัจจุบัน","section":"s3"},{"key":"dia_q019","no":"1.9.1","text":"1.9 มีระบบควบคุมการติดเชื้อที่เหมาะสม (นอกเหนือจากพิจารณาในภาพรวมแล้ว ให้ตรวจสอบการทำความสะอาดและทำ ให้เครื่องมือปราศจากเชื้อ ในห้องบำบัดรักษาหรือในบริเวณ\nที่มีงานหัตถการด้วย)\n1.9.1 เครื่องมืออุปกรณ์และเวชภัณฑ์สำหรับควบคุมการติดเชื้อในกรณีที่จำเป็นต้องใช้ทำ เช่น Autoclave หม้อต้มเครื่องมือแพทย์ เครื่องนึ่ง","section":"s3"},{"key":"dia_q020","no":"1.9.2","text":"1.9.2 แช่น้ำยาฆ่าเชื้อ","section":"s3"},{"key":"dia_q021","no":"1.9.3","text":"1.9.3 ขั้นตอน/วิธีการทำให้เครื่องมือสะอาดปราศจากเชื้อและวิธีกำจัดของมีคม ติดในที่เปิดเผยภายในคลินิก","section":"s3"},{"key":"dia_q022","no":"1.10.1","text":"1.10 มีเครื่องดับเพลิงขนาดเหมาะสม ตามที่กฎหมายท้องถิ่นบัญญัติ และอยู่ในสภาพพร้อมใช้งาน ติดตั้งในที่มองเห็นได้ชัดเจน\n1.10.1 ขนาดเครื่องดับเพลิงไม่ต่ำกว่า 10 ปอนด์","section":"s3"},{"key":"dia_q023","no":"1.10.2","text":"1.10.2 มีเครื่องดับเพลิงติดตั้งทุกชั้น","section":"s3"},{"key":"dia_q024","no":"1.10.3","text":"1.10.3 ติดตั้งเครื่องดับเพลิงส่วนบนสูงจากพื้นไม่เกิน 1.5 เมตร หรือวางกับพื้นมีฐานรองรับที่มั่นคง อยู่ในที่มองเห็นอย่างชัดเจน และควรมีป้ายแสดงจุดที่ตั้งถังดับเพลิง","section":"s3"},{"key":"dia_q025","no":"1.11","text":"1.11 มีป้ายเครื่องหมายห้ามสูบบุหรี่","section":"s3"},{"key":"dia_q026","no":"2.1","text":"2. คลินิกต้องมีลักษณะการให้บริการดังต่อไปนี้\n2.1 มีความปลอดภัย มีความสะดวก และเหมาะสมต่อ\nผู้ให้บริการและผู้รับบริการ","section":"s4"},{"key":"dia_q027","no":"2.2","text":"2.2 มีการให้บริการที่ได้มาตรฐานตามลักษณะวิชาชีพ ตามที่สภาวิชาชีพหรือคณะกรรมการวิชาชีพประกาศกำหนด แล้วแต่กรณี","section":"s4"},{"key":"dia_q028","no":"2.3","text":"2.3 พื้นที่ให้บริการจะต้องมีพื้นที่เชื่อมและเปิดติดต่อถึงกันได้และไม่ตั้งอยู่ในพื้นที่เดียวกับสถานที่ขายยาตามกฎหมายว่าด้วยยาหรือพื้นที่เดียวกับการประกอบอาชีพอื่น","section":"s4"},{"key":"dia_q029","no":"2.4","text":"2.4 พื้นที่ให้บริการจะต้องไม่ตั้งอยู่ในสถานที่เดียวกับสถานพยาบาลของกระทรวง ทบวง กรม กรุงเทพมหานคร เมืองพัทยา องค์การบริการส่วนจังหวัด เทศบาล องค์การบริการส่วนตำบล องค์กรปกครองส่วนท้องถิ่นอื่น และสภากาชาดไทย ซึ่งให้บริการในลักษณะเดียวกัน","section":"s4"},{"key":"dia_q030","no":"2.5","text":"2.5 ในกรณีที่มีการให้บริการในอาคารเดียวกับการประกอบกิจการอื่น จะต้องมีการแบ่งพื้นที่ให้ชัดเจน และกิจการอื่นต้องไม่กระทบกระเทือนต่อการประกอบวิชาชีพ รวมทั้งสามารถเคลื่อนย้ายผู้ป่วยฉุกเฉินได้สะดวก","section":"s4","condHead":true,"cond":"dia_g1"},{"key":"dia_q031","no":"2.5.1","text":"2.5.1 สถานพยาบาลต้องมีประตู เข้า-ออก คนละทางกับการประกอบกิจการอื่น","section":"s4","cond":"dia_g1"},{"key":"dia_q032","no":"2.5.2","text":"2.5.2 การกั้นพื้นที่ต้องเป็นสัดส่วน แสดงให้เห็นประจักษ์ ชัดเจนและถาวร","section":"s4","cond":"dia_g1"},{"key":"dia_q033","no":"2.6","text":"2.6 ในกรณีที่มีการให้บริการของลักษณะสหคลินิกหรือ มีคลินิกหลายลักษณะ อยู่ในอาคารเดียวกัน จะต้องมีการแบ่งสัดส่วนพื้นที่ให้ชัดเจน และแต่ละสัดส่วนต้องมีพื้นที่และลักษณะตามมาตรฐานของการให้บริการนั้น แต่ละสาขาต้องมีอย่างน้อย 1 ห้องตรวจโรค ซึ่งต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรค 1 เตียง ที่ได้มาตรฐานทางการแพทย์ และอ่างฟอกมือชนิดที่ไม่ใช้มือ เปิด-ปิดน้ำ สบู่","section":"s4"},{"key":"dia_q034","no":"3.1.1","text":"3. การแสดงรายละเอียดเกี่ยวกับชื่อสถานพยาบาล ผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะในสถานพยาบาล อัตราค่ารักษาพยาบาล ค่าบริการและสิทธิผู้ป่วย\n3.1 มีป้ายชื่อสถานพยาบาล เป็นไปตามกฎกระทรวง\n3.1.1 ป้ายชื่อสถานพยาบาลต้องเป็นสี่เหลี่ยมผืนผ้า ขนาดความกว้างของป้ายไม่น้อยกว่า 40 เซนติเมตร ความยาวไม่น้อยกว่า 120 เซนติเมตร","section":"s5"},{"key":"dia_q035","no":"3.1.2","text":"3.1.2 จัดทำแผ่นป้ายแสดงชื่อสถานพยาบาลที่เป็นภาษาไทยขนาดความสูงไม่ต่ำกว่า 10 เซนติเมตร ตัวหนังสือ สีเขียว สีพื้นป้ายสีขาว","section":"s5"},{"key":"dia_q036","no":"3.1.3","text":"3.1.3 เลขที่ใบอนุญาตขนาดความสูงไม่ต่ำกว่า 5 เซนติเมตร ตัวเลขสีเขียว","section":"s5"},{"key":"dia_q037","no":"3.1.4","text":"3.1.4 กรณีใช้ภาษาต่างประเทศร่วมด้วย ต้องมีชื่อตรงกันกับภาษาไทย ขนาดตัวอักษรต้องเล็กกว่าภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s5"},{"key":"dia_q038","no":"3.2","text":"3.2 ติดตั้งป้ายชื่อสถานพยาบาลในตำแหน่งที่มองเห็นได้ชัดเจนจากภายนอกและเหมาะสม","section":"s5"},{"key":"dia_q039","no":"3.3.1","text":"3.3 ชื่อสถานพยาบาลไม่มีข้อความลักษณะชักชวนโอ้อวดเกินจริงหรืออาจสื่อให้เข้าใจผิด\n3.3.1 คำนำหน้าชื่อหรือต่อท้ายของชื่อคลินิกต้องประกอบด้วยลักษณะคลินิก และลักษณะการให้บริการของคลินิก","section":"s5"},{"key":"dia_q040","no":"3.3.2","text":"3.3.2 กรณีใช้ชื่อภาษาต่างประเทศด้วย ขนาดตัวอักษรต้องเล็กกว่าอักษรภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s5"},{"key":"dia_q041","no":"3.3.3","text":"3.3.3 ชื่อคลินิกจะต้องไม่ใช้คำหรือข้อความที่มีลักษณะชักชวน โอ้อวดเกินความจริง หรืออาจทำให้เกิดความเข้าใจผิดในสาระสำคัญเกี่ยวกับการประกอบกิจการ","section":"s5"},{"key":"dia_q042","no":"3.3.4","text":"3.3.4 ชื่อคลินิกต้องไม่สื่อความหมายหรืออ้างอิงสถาบันพระมหากษัตริย์ เว้นแต่ได้รับพระบรมราชานุญาต","section":"s5"},{"key":"dia_q043","no":"3.3.5","text":"3.3.5 คลินิกที่ตั้งอยู่ในอำเภอหรือในเขตเดียวกัน จะต้องมีชื่อไม่ซ้ำกัน เว้นแต่ผู้ขอรับอนุญาตเป็นบุคคลเดียวกันหรือมีหนังสือยินยอมจากผู้ได้รับใบอนุญาตให้ประกอบกิจการคลินิกเดิม ให้ใช้ชื่อซ้ำกันได้ แต่ต้องมีตัวอักษรหรือหมายเลขเรียงลำดับหรือที่ตั้งสถานที่ต่อท้ายชื่อคลินิก","section":"s5"},{"key":"dia_q044","no":"3.4","text":"3.4 มีข้อความแสดงวัน เวลา ให้บริการไว้โดยเปิดเผย มองเห็นได้ชัดเจนจากด้านนอกคลินิกและตรงกับเวลาที่ขอรับอนุญาตให้ประกอบกิจการสถานพยาบาล","section":"s5"},{"key":"dia_q045","no":"3.5","text":"3.5 มีบริเวณที่ต้องแสดงใบอนุญาตให้ประกอบกิจการและดำเนินการในบริเวณที่เปิดเผย และเหมาะสม เช่น บริเวณที่นั่งพักคอยของผู้รับบริการ","section":"s5"},{"key":"dia_q046","no":"3.6","text":"3.6 มีบริเวณที่ใช้แสดงหลักฐานการชำระค่าธรรมเนียมการประกอบกิจการสถานพยาบาล(แบบ ส.พ.12) ในที่เปิดเผยและเห็นได้ชัดเจนบริเวณทางเข้าสถานพยาบาล","section":"s5"},{"key":"dia_q047","no":"3.7","text":"3.7 หน้าห้องตรวจมีบริเวณให้ติดป้ายแสดงชื่อ ภาพถ่าย และเลขที่ใบอนุญาตของผู้ประกอบวิชาชีพเวชกรรมที่ให้บริการ หากมีผู้ประกอบวิชาชีพ/ผู้ประกอบโรคศิลปะอื่นปฏิบัติงานให้ยื่น สพ.6 ทุกคนและแสดงป้ายนี้ไว้ในบริเวณที่เปิดเผยและเห็นได้ชัดเจน","section":"s5"},{"key":"dia_q048","no":"3.8","text":"3.8 แสดงอัตราค่าบริการและค่ารักษาพยาบาลให้ครอบคลุมการบริการที่เรียกเก็บ โดยแสดงอัตราราคาต่อหน่วย และระบุข้อความด้วยอักษรภาษาไทย โดยแสดงไว้ในที่เปิดเผยให้ผู้รับบริการสามารถเห็นได้ง่าย โดยจัดทำเป็นแผ่นประกาศ แผ่นพับ เล่ม หรือแฟ้มเอกสาร หรือโปรแกรมคอมพิวเตอร์ แสดงให้ผู้ป่วยทราบ","section":"s5"},{"key":"dia_q049","no":"3.9","text":"3.9 มีป้ายแสดงให้ผู้รับบริการทราบว่าสามารถสอบถามอัตราค่าบริการและค่ารักษาพยาบาลได้จากที่ใด ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 10 เซนติเมตร แสดงไว้ในที่เห็นได้ชัดเจน","section":"s5"},{"key":"dia_q050","no":"3.10","text":"3.10 แสดงคำประกาศสิทธิผู้ป่วยไว้ในที่เปิดเผยและเห็นได้ง่ายอ่านได้ชัดเจน ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 1 เซนติเมตร บริเวณที่พักคอยของผู้รับบริการ","section":"s5"},{"key":"dia_q051","no":"3.11","text":"3.11 ข้อความโฆษณาสถานพยาบาล (ถ้ามี) ไม่เป็นเท็จ ไม่โอ้อวด หรือสื่อให้เข้าใจผิดในสาระสำคัญ","section":"s5"},{"key":"dia_q052","no":"4.1.1","text":"4.ชนิดและจำนวนเครื่องมือ เครื่องใช้ที่จำเป็นประจำสถานพยาบาล\n4.1 เวชระเบียน\n4.1.1 มีตู้หรือชั้นหรืออุปกรณ์เก็บเวชระเบียนที่มั่นคง ปลอดภัยและต้องจัดให้เป็นระเบียบสามารถค้นหาได้ง่าย","section":"s6"},{"key":"dia_q053","no":"4.1.2","text":"4.1.2 มีการจัดเตรียมทะเบียนผู้ป่วย มีรายการดังต่อไปนี้","section":"s6"},{"key":"dia_q054","no":"4.1.2 › 1)","text":"1) ชื่อ นามสกุล อายุ ของผู้ป่วย","section":"s6"},{"key":"dia_q055","no":"4.1.2 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s6"},{"key":"dia_q056","no":"4.1.2 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s6"},{"key":"dia_q057","no":"4.1.3 › 1)","text":"4.1.3 มีเวชระเบียน หรือ บัตรผู้ป่วย ที่สามารถ บันทึกรายละเอียด ตามที่กฎกระทรวงกำหนด\n1) ชื่อและที่อยู่สถานพยาบาล","section":"s6"},{"key":"dia_q058","no":"4.1.3 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s6"},{"key":"dia_q059","no":"4.1.3 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s6"},{"key":"dia_q060","no":"4.1.3 › 4)","text":"4) ชื่อ นามสกุล อายุ เพศ ที่อยู่ หมายเลขโทรศัพท์ (ถ้ามี) และข้อมูลส่วนบุคคลอื่น ๆ ของผู้ป่วย เช่น เชื้อชาติ สัญชาติ สถานภาพสมรส เลขที่บัตรประจำตัวประชาชน เป็นต้น","section":"s6"},{"key":"dia_q061","no":"4.1.3 › 5)","text":"5) อาการเจ็บป่วย การแพ้ยา ผลการตรวจทางร่างกายและผลการตรวจทางห้องปฏิบัติชันสูตรของผู้ป่วย","section":"s6"},{"key":"dia_q062","no":"4.1.3 › 6)","text":"6) การวินิจฉัยโรค","section":"s6"},{"key":"dia_q063","no":"4.1.3 › 7)","text":"7) การรักษา","section":"s6"},{"key":"dia_q064","no":"4.1.3 › 8)","text":"8) ลายมือผู้ประกอบวิชาชีพเวชกรรมที่ให้การรักษาพยาบาล","section":"s6"},{"key":"dia_q065","no":"4.1.4","text":"4.1.4 ต้องจัดให้มีการลงทะเบียนและบันทึกข้อมูลของผู้ป่วยระหว่างที่ได้รับการรักษาด้วยวิธีการฟอกเลือดด้วยเครื่องไตเทียมทุกราย","section":"s6"},{"key":"dia_q066","no":"4.1.5","text":"4.1.5 สถานพยาบาลจะต้องได้รับความยินยอมจากผู้ป่วยก่อนให้บริการการฟอกเลือดด้วยเครื่องไตเทียมครั้งแรกทุกรายโดยสถานพยาบาลจะต้องชี้แจงขั้นตอนปฏิบัติ ผลที่อาจเกิดขึ้นจากการให้บริการทุกด้าน ให้ผู้ป่วยทราบก่อนให้ความยินยอม และต้องได้รับความยินยอมจากผู้ป่วยในครั้งต่อไปทุก ๖ เดือน ยกเว้น กรณีฉุกเฉินซึ่งผู้ป่วยไม่อยู่ในภาวะที่จะให้ความยินยอมได้","section":"s6"},{"key":"dia_q067","no":"4.2.1","text":"4.2 เครื่องใช้ทั่วไป ในห้องตรวจโรคทุกห้องต้องประกอบด้วย\n4.2.1 โต๊ะตรวจโรค พร้อมเก้าอี้","section":"s6"},{"key":"dia_q068","no":"4.2.2","text":"4.2.2 เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์ พร้อมอุปกรณ์","section":"s6"},{"key":"dia_q069","no":"4.2.2 › 1)","text":"1) มีขนาดที่ได้มาตรฐานทางการแพทย์ พื้นแข็งสามารถช่วยฟื้นคืนชีพ (CPR) ได้ตามหลักวิชาชีพ","section":"s6"},{"key":"dia_q070","no":"4.2.2 › 2)","text":"2) ต้องมีบันไดขึ้นเตียง (Step) หากเตียงนั้นมีความสูง","section":"s6"},{"key":"dia_q071","no":"4.2.2 › 3)","text":"3) มีปลอกหมอน ผ้าปูเตียง และผ้าคลุมตัวผู้ป่วย","section":"s6"},{"key":"dia_q072","no":"4.3.1","text":"4.3 เครื่องมือ หรืออุปกรณ์ในการตรวจและวินิจฉัยโรค จะต้องมี\n4.3.1 หูฟัง (Stethoscope)","section":"s6"},{"key":"dia_q073","no":"4.3.2","text":"4.3.2 เครื่องวัดความดันโลหิต (Sphygmomanometer)","section":"s6"},{"key":"dia_q074","no":"4.3.3","text":"4.3.3 ปรอทวัดอุณหภูมิร่างกาย หรือ อุปกรณ์วัดอุณหภูมิ","section":"s6"},{"key":"dia_q075","no":"4.3.4","text":"4.3.4 ไฟฉาย ไม้กดลิ้น","section":"s6"},{"key":"dia_q076","no":"4.3.5","text":"4.3.5 เครื่องชั่งน้ำหนัก และอุปกรณ์วัดส่วนสูง","section":"s6"},{"key":"dia_q077","no":"5.1","text":"5. ยา และเวชภัณฑ์ในสถานพยาบาล\n5.1 มียาและเวชภัณฑ์อื่นที่จำเป็น โดยมีจำนวน รายการและประมาณเพียงพอ ตามลักษณะสถานพยาบาล ไตเทียม","section":"s7"},{"key":"dia_q078","no":"5.2","text":"5.2 ไม่มียาที่หมดอายุหรือเสื่อมสภาพ","section":"s7"},{"key":"dia_q079","no":"5.3","text":"5.3 มีอุปกรณ์นับเม็ดยา อย่างน้อยสองชุด","section":"s7"},{"key":"dia_q080","no":"5.4","text":"5.4 ภาชนะบรรจุยาหรือฉลากติดซองยาให้ระบุชื่อและที่อยู่สถานพยาบาล ชื่อ-สกุลผู้ป่วย ชื่อยา วิธีใช้ และต้องระบุวันที่ยาหมดอายุอย่างชัดเจน","section":"s7"},{"key":"dia_q081","no":"5.5","text":"5.5 มีตู้หรือชั้นเก็บยาและเวชภัณฑ์เป็นสัดส่วน","section":"s7"},{"key":"dia_q082","no":"5.6","text":"5.6 มีตู้เย็นสำหรับเก็บยาหรือเวชภัณฑ์อื่น กรณีที่มีวัคซีน หรือยาที่ต้องเก็บไว้ในอุณหภูมิต่ำ ตู้เย็นนั้น ต้องมีการควบคุมอุณหภูมิ มีปรอทวัดอุณหภูมิ และมีการบันทึกอุณหภูมิในตู้เย็น","section":"s7"},{"key":"dia_q083","no":"5.7","text":"5.7 กรณีมียาเสพติดให้โทษ ให้มีสถานที่หรือตู้เก็บยาเสพติดให้โทษที่มั่นคงและปลอดภัย มีกุญแจปิดและเปิดอย่างมีประสิทธิภาพ","section":"s7"},{"key":"dia_q084","no":"5.8","text":"5.8 ยาต้องมีทะเบียน เว้นแต่เป็นการผลิตตามใบสั่งยาของ\nผู้ประกอบวิชาชีพเวชกรรมที่สั่งให้สำหรับคนไข้เฉพาะรายของสถานพยาบาล การแสดงฉลากและวันหมดอายุให้ชัดเจน","section":"s7"},{"key":"dia_q085","no":"6","text":"6. ชุดช่วยชีวิตฉุกเฉิน ประกอบด้วย","section":"s8"},{"key":"dia_q086","no":"6.1","text":"6.1 ยา เวชภัณฑ์และเครื่องมือแพทย์อื่นที่สามารถให้การรักษาพยาบาลและช่วยชีวิตผู้ป่วยฉุกเฉิน ในคลินิก ยาจะต้องมีเพียงพอกับการให้บริการ มีฉลากที่ถูกต้อง และไม่มียาที่หมดอายุหรือเสื่อมสภาพ ต้องมีครบทุกรายการ ได้แก่","section":"s8"},{"key":"dia_q087","no":"6.1 › 1)","text":"(๑) ยาฉีด Adrenaline ๑ : ๑๐๐๐","section":"s8"},{"key":"dia_q088","no":"6.1 › 2)","text":"(๒)ยาฉีด Steroid injection เช่น Dexamethazone Injection หรือ Hydrocortizone","section":"s8"},{"key":"dia_q089","no":"6.1 › 3)","text":"(๓) ยาฉีด Chlorphenilamine injection","section":"s8"},{"key":"dia_q090","no":"6.1 › 4)","text":"(๔) ๕๐% Glucose injection","section":"s8"},{"key":"dia_q091","no":"6.1 › 5)","text":"(๕) ยาอมใต้ลิ้นเพื่อขยายหลอดเลือดหัวใจ","section":"s8"},{"key":"dia_q092","no":"6.1 › 6)","text":"(6) Sodium Bicarbonate injection","section":"s8"},{"key":"dia_q093","no":"6.1 › 7)","text":"(7) Calcium Chloride / Gluconate injection","section":"s8"},{"key":"dia_q094","no":"6.1 › 8)","text":"(8) NSS ๑,๐๐๐ cc. พร้อมชุดให้สารน้ำทางหลอดเลือดดำ (set IV fluid) ๒ ชุด","section":"s8"},{"key":"dia_q095","no":"6.1 › 2)","text":"(9) Medicut หรือเข็มแทงหลอดเลือดดำเพื่อให้น้ำเกลือ\n๒ ชุด","section":"s8"},{"key":"dia_q096","no":"6.1 › 10)","text":"(10) Disposable Syringe ๕ หลอด","section":"s8"},{"key":"dia_q097","no":"6.1 › 11)","text":"(11) เข็ม Disposable ๕ อัน","section":"s8"},{"key":"dia_q098","no":"6.1 › 12)","text":"(12) เสาแขวนน้ำเกลือ (Stand) ที่เคลื่อนย้ายได้ ๑ อัน","section":"s8"},{"key":"dia_q099","no":"6.1 › 13)","text":"(13) Oral Airway ๑ อัน","section":"s8"},{"key":"dia_q100","no":"6.1 › 14)","text":"(14) Laryngoscope","section":"s8"},{"key":"dia_q101","no":"6.1 › 15)","text":"(15) Endotracheal tube ขนาดต่างๆ","section":"s8"},{"key":"dia_q102","no":"6.1 › 16)","text":"(16) ถุงบีบลมเพื่อช่วยหายใจพร้อมหน้ากากครอบช่วย\nการหายใจตามลักษณะการให้บริการของสถานพยาบาล ๑ ชุด","section":"s8"},{"key":"dia_q103","no":"6.2","text":"6.2 เครื่องมือในการปฏิบัติการกู้ชีพ","section":"s8"},{"key":"dia_q104","no":"6.2 › 1)","text":"(1) Oxygen Tank พร้อมอุปกรณ์วัดปริมาณออกซิเจนในถัง","section":"s8"},{"key":"dia_q105","no":"6.2 › 2)","text":"(2) อุปกรณ์ในการให้ออกซิเจนแก่ผู้ป่วย","section":"s8"},{"key":"dia_q106","no":"6.2 › 3)","text":"(3) เครื่องดูดเสมหะ","section":"s8"},{"key":"dia_q107","no":"6.2 › 4)","text":"(4) รถเข็นสำหรับกู้ชีพฉุกเฉิน","section":"s8"},{"key":"dia_q108","no":"6.2 › 5)","text":"(5) เครื่องกระตุกหัวใจด้วยไฟฟ้า (Defibrilator)","section":"s8","hint":"ควรมี"},{"key":"dia_q109","no":"6.3 › 1)","text":"6.3 มีแผนการส่งต่อผู้ป่วย และการเตรียมความพร้อมในสถานการณ์ฉุกเฉิน\n(๑) มีระบบในการเคลื่อนย้ายและส่งต่อผู้ป่วยในภาวะฉุกเฉิน พร้อมที่จะนำส่งผู้ป่วยไปยังสถานพยาบาลประเภทที่รับผู้ป่วยไว้ค้างคืนที่มีบริการการฟอกเลือดด้วยเครื่องไตเทียมตามที่ได้มีข้อตกลงกันไว้เป็นลายลักษณ์อักษร","section":"s8"},{"key":"dia_q110","no":"7.1","text":"7.ห้องฟอกไตเทียม\n7.1 มีขนาดของห้องบริการฟอกเลือดที่สัมพันธ์กับจำนวนเตียงและอุปกรณ์และพื้นที่ใช้สอยเหมาะสมในการปฏิบัติงาน ที่ได้มาตรฐาน โดยมีพื้นที่ไม่ต่ำกว่าสี่ตารางเมตรต่อหนึ่งจุดบริการ โดยส่วนที่แคบที่สุดไม่น้อยกว่า ๑.๘ เมตร เพื่อให้มีพื้นที่สามารถช่วยเหลือและเคลื่อนย้ายผู้ป่วยฉุกเฉินได้โดยสะดวก","section":"s9"},{"key":"dia_q111","no":"7.2","text":"7.2 พื้นที่เตรียมน้ำบริสุทธิ์ พื้นที่ล้างตัวกรอง","section":"s9"},{"key":"dia_q112","no":"7.3","text":"7.3 มีระบบไฟฟ้าและแสงสว่างสำรอง","section":"s9"},{"key":"dia_q113","no":"7.4","text":"7.4 เครื่องไตเทียมที่ได้มาตรฐาน พร้อมทั้งหนังสือคู่มือประจำเครื่อง เกณฑ์การทำความสะอาดและการทะนุบำรุงเครื่อง โดยถ้าเป็นฉบับภาษาอังกฤษ ต้องมีฉบับภาษาไทยด้วย","section":"s9"},{"key":"dia_q114","no":"7.5","text":"7.5 ระบบทำน้ำบริสุทธิ์ที่ได้มาตรฐาน เช่น Reverse Osmosis, Deionizer พร้อมเกณฑ์การทำความสะอาดระบบน้ำและควบคุมคุณภาพของน้ำบริสุทธิ์อยู่ตลอดเวลา","section":"s9"},{"key":"dia_q115","no":"7.6","text":"7.6 ตัวกรองเลือด ในกรณีที่จะนำตัวกรองเลือดมาใช้ซ้ำ (Dialyzer Reprocessing) จะต้องมีประสิทธิภาพและความปลอดภัยสูงสุด","section":"s9"},{"key":"dia_q116","no":"7.7","text":"7.7 หากมีบริการ จัดให้มีบริการตรวจทางห้องปฏิบัติการชันสูตรที่ได้มาตรฐานและสามารถทำการตรวจวิเคราะห์\nผลการชันสูตรได้เท่าที่จำเป็นเป็นอย่างน้อย","section":"s9"},{"key":"dia_q117","no":"8.1","text":"8.มีระบบการควบคุมการติดเชื้อ\n8.๑ ห้องให้บริการฟอกเลือด ต้องเป็นเขตกึ่งปลอดเชื้อ","section":"s10"},{"key":"dia_q118","no":"8.2","text":"8.2 การใช้และปฏิบัติงานในเขตห้องบริการฟอกเลือดถูกต้องตามหลักการมาตรฐานการควบคุมการติดเชื้อ","section":"s10"},{"key":"dia_q119","no":"8.3","text":"8.3 มาตรฐานการดูแลทำความสะอาดห้อง อุปกรณ์ เครื่องใช้และสิ่งอำนวยความสะดวก","section":"s10"}],"ack":"ข้าพเจ้าได้อ่านและรับทราบผลการตรวจสถานพยาบาลนี้แล้วและจะปฏิบัติตามคำสั่งหรือคำแนะนำของพนักงานเจ้าหน้าที่อย่างเคร่งครัด ทั้งนี้พนักงานเจ้าหน้าที่ไม่ได้ทำการละเมิด ข่มขู่ หรือทำให้ทรัพย์สินของสถานพยาบาลหรือบุคคลในสถานพยาบาลเสียหาย สูญหาย หรือเสื่อมค่าแต่ประการใด","note":"หมายเหตุ วุฒิบัตร/อนุมัติบัตร ที่ได้รับจากแพทยสภา คือผู้ประกอบวิชาชีพเวชกรรมที่ได้รับวุฒิบัตรหรือหนังสืออนุมัติจากแพทยสภา ในสาขาอายุรศาสตร์โรคไต หรือสาขากุมารเวชศาสตร์โรคไต หรือผู้ประกอบวิชาชีพเวชกรรมที่ได้ผ่านการอบรมการฟอกเลือดด้วยเครื่องไตเทียมจากสถาบันที่คณะกรรมการสถานพยาบาลรับรอง","instruction":"โปรดใส่เครื่องหมาย ✓ เมื่อถูกต้อง และเครื่องหมาย × เมื่อไม่จัดให้มีหรือไม่ถูกต้อง กรณีไม่มีบริการที่เกี่ยวข้องในหัวข้อนั้น ๆ ใส่เครื่องหมาย –"},"medtech":{"id":"medtech","prefix":"mlt","sheet":"chk_medtech","title":"บันทึกการตรวจมาตรฐานคลินิกเทคนิคการแพทย์ ประจำปี","short":"คลินิกเทคนิคการแพทย์","icon":"flask","color":"#9b2d3c","source":"คลินิกเทคนิคการแพทย์.pdf","fields":[{"key":"survey_date","label":"ว/ด/ปี ที่สำรวจ","type":"date"},{"key" สอบสถานที่\n1. ลักษณะโดยทั่วไปของสถานพยาบาล","section":"s2"},{"key":"mlt_q005","no":"1.1","text":"1.1 ตั้งอยู่ในทำเลที่สะดวก ปลอดภัยและไม่เป็นอันตรายต่อสุขภาพ","section":"s2"},{"key":"mlt_q006","no":"1.2","text":"1.2 อาคารต้องมั่นคงแข็งแรง ไม่อยู่ในสภาพชำรุดหรือเสี่ยงต่ออันตรายจากการใช้สอย","section":"s2"},{"key":"mlt_q007","no":"1.3","text":"1.3 บริเวณทั้งภายนอกและภายในต้องสะอาด เป็นระเบียบเรียบร้อย จัดแบ่งพื้นที่ใช้สอยอย่างเหมาะสม และมีสิ่งอำนวยความสะดวกแก่ผู้ป่วย โดยมีลักษณะดังนี้","section":"s2"},{"key":"mlt_q008","no":"1.3.1","text":"1.3.1 มีพื้นที่โดยรวมไม่ต่ำกว่า 20 ตารางเมตร โดยส่วนแคบที่สุดต้องมีความกว้างไม่น้อยกว่า 3.00 เมตร","section":"s2"},{"key":"mlt_q009","no":"1.3.2","text":"1.3.2 มีส่วนที่นั่งพักคอยของผู้ป่วยและญาติที่เหมาะสม ไม่น้อยกว่า 5- 10 ที่นั่งและที่นั่งต้องมีพนักพิง","section":"s2"},{"key":"mlt_q010","no":"1.4","text":"1.4 การสัญจรและการเคลื่อนย้ายผู้ป่วยต้องกระทำได้โดยสะดวก โดยเฉพาะเมื่อเกิดภาวะฉุกเฉิน ขนาดความกว้างของประตู เข้า-ออก ไม่ต่ำกว่า 80 เซนติเมตร","section":"s2"},{"key":"mlt_q011","no":"1.5.1","text":"1.5 ห้องตรวจหรือห้องให้การรักษา\n1.5.1 ห้องตรวจหรือห้องให้การรักษากั้นเป็นสัดส่วนและมิดชิด มีประตู เปิด-ปิด อย่างชัดเจน","section":"s2"},{"key":"mlt_q012","no":"1.5.2","text":"1.5.2 ภายในห้องตรวจต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์ 1 เตียง","section":"s2"},{"key":"mlt_q013","no":"1.5.3","text":"1.5.3 อ่างฟอกมือชนิดไม่ใช้มือเปิด-ปิดน้ำ พร้อมมีสบู่เหลว ผ้าเช็ดมือหรือกระดาษเช็ดมือที่ใช้ครั้งเดียว","section":"s2"},{"key":"mlt_q014","no":"1.5.4","text":"1.5.4 ไม่มีวงจรปิดในห้องตรวจหรือห้องที่เกี่ยวกับการประกอบวิชาชีพหรือการประกอบโรคศิลปะ","section":"s2"},{"key":"mlt_q015","no":"1.6","text":"1.6 มีห้องน้ำห้องส้วมที่ถูกสุขลักษณะอย่างน้อยหนึ่งห้องหรือมีห้องน้ำส่วนรวมในกรณีอาคารศูนย์การค้าหรืออาคารสำนักงาน","section":"s2"},{"key":"mlt_q016","no":"1.7","text":"1.7 มีแสงสว่างและการระบายอากาศเพียงพอ ไม่มีกลิ่นอับทึบ (หากความสูงของสถานพยาบาลต่ำกว่า 2.6 เมตร ต้องเพิ่มพัดลมดูดอากาศที่เหมาะสม)","section":"s2"},{"key":"mlt_q017","no":"1.8.1","text":"1.8 มีระบบการเก็บและกำจัดมูลฝอยและสิ่งปฏิกูลที่เหมาะสม และมีการกำจัดอย่างเหมาะสม\n1.8.1 ทุกห้องตรวจและทุกห้องที่ให้การรักษาผู้ป่วย ต้องมีถังขยะทั่วไป–ถังขยะติดเชื้อ ที่มีลักษณะถังขยะแบบใช้เท้าเหยียบให้เปิด มีฝาปิดมิดชิด ถังขยะติดเชื้อใช้ถุงสีแดง เขียนข้อความ “ขยะติดเชื้อ”ไว้ที่ถังขยะ แยกต่างหากจากถังขยะทั่วไป ใช้ถุงสีดำ เขียนข้อความ “ขยะทั่วไป” ไว้ที่ถังขยะ วางคู่กันทุกห้อง","section":"s2"},{"key":"mlt_q018","no":"1.8.2","text":"1.8.2 มีสัญญา/หนังสือตอบรับการขนถ่ายขยะติดเชื้อ ของการจ้างบริษัทกำจัดขยะติดเชื้อ หรืออาจแสดงใบเสร็จรับเงินที่เป็นเดือนปัจจุบัน","section":"s2"},{"key":"mlt_q019","no":"1.9.1","text":"1.9 มีระบบควบคุมการติดเชื้อที่เหมาะสม (นอกเหนือจากพิจารณาในภาพรวมแล้ว ให้ตรวจสอบการทำความสะอาดและทำ ให้เครื่องมือปราศจากเชื้อ ในห้องบำบัดรักษาหรือในบริเวณ ที่มีงานหัตถการด้วย)\n1.9.1 แช่น้ำยาฆ่าเชื้อ","section":"s2"},{"key":"mlt_q020","no":"1.9.2","text":"1.9.2 ขั้นตอน/วิธีการทำให้เครื่องมือสะอาดปราศจากเชื้อและวิธีกำจัดของมีคม ติดในที่เปิดเผยภายในคลินิก","section":"s2"},{"key":"mlt_q021","no":"1.10.1","text":"1.10 มีเครื่องดับเพลิงขนาดเหมาะสม ตามที่กฎหมายท้องถิ่นบัญญัติ และอยู่ในสภาพพร้อมใช้งาน ติดตั้งในที่มองเห็นได้ชัดเจน\n1.10.1 ขนาดเครื่องดับเพลิงไม่ต่ำกว่า 10 ปอนด์","section":"s2"},{"key":"mlt_q022","no":"1.10.2","text":"1.10.2 มีเครื่องดับเพลิงติดตั้งทุกชั้น","section":"s2"},{"key":"mlt_q023","no":"1.10.3","text":"1.10.3 ติดตั้งเครื่องดับเพลิงส่วนบนสูงจากพื้นไม่เกิน 1.5 เมตร หรือวางกับพื้นมีฐานรองรับที่มั่นคง อยู่ในที่มองเห็นอย่างชัดเจน และควรมีป้ายแสดงจุดที่ตั้งถังดับเพลิง","section":"s2"},{"key":"mlt_q024","no":"1.11","text":"1.11 มีป้ายเครื่องหมายห้ามสูบบุหรี่","section":"s2"},{"key":"mlt_q025","no":"2.1","text":"2. คลินิกต้องมีลักษณะการให้บริการดังต่อไปนี้\n2.1 มีความปลอดภัย มีความสะดวก และเหมาะสมต่อผู้ให้บริการและผู้รับบริการ","section":"s3"},{"key":"mlt_q026","no":"2.2","text":"2.2 มีการให้บริการที่ได้มาตรฐานตามลักษณะวิชาชีพ ตามที่สภาวิชาชีพหรือคณะกรรมการวิชาชีพประกาศกำหนด แล้วแต่กรณี","section":"s3"},{"key":"mlt_q027","no":"2.3","text":"2.3 พื้นที่ให้บริการจะต้องมีพื้นที่เชื่อมและเปิดติดต่อถึงกันได้และไม่ตั้งอยู่ในพื้นที่เดียวกับสถานที่ขายยาตามกฎหมายว่าด้วยยาหรือพื้นที่เดียวกับการประกอบอาชีพอื่น","section":"s3"},{"key":"mlt_q028","no":"2.4","text":"2.4 พื้นที่ให้บริการจะต้องไม่ตั้งอยู่ในสถานที่เดียวกับสถานพยาบาลของกระทรวง ทบวง กรม กรุงเทพมหานคร เมืองพัทยา องค์การบริการส่วนจังหวัด เทศบาล องค์การบริการส่วนตำบล องค์กรปกครองส่วนท้องถิ่นอื่น และสภากาชาดไทย ซึ่งให้บริการในลักษณะเดียวกัน","section":"s3"},{"key":"mlt_q029","no":"2.5","text":"2.5 ในกรณีที่มีการให้บริการในอาคารเดียวกับการประกอบกิจการอื่น จะต้องมีการแบ่งพื้นที่ให้ชัดเจน และกิจการอื่นต้องไม่กระทบกระเทือนต่อการประกอบวิชาชีพ รวมทั้งสามารถเคลื่อนย้ายผู้ป่วยฉุกเฉินได้สะดวก","section":"s3","condHead":true,"cond":"mlt_g1"},{"key":"mlt_q030","no":"2.5.1","text":"2.5.1 สถานพยาบาลต้องมีประตู เข้า-ออก คนละทางกับการประกอบกิจการอื่น","section":"s3","cond":"mlt_g1"},{"key":"mlt_q031","no":"2.5.2","text":"2.5.2 การกั้นพื้นที่ต้องเป็นสัดส่วน แสดงให้เห็นประจักษ์ ชัดเจนและถาวร","section":"s3","cond":"mlt_g1"},{"key":"mlt_q032","no":"2.6","text":"2.6 ในกรณีที่มีการให้บริการของลักษณะสหคลินิกหรือ มีคลินิกหลายลักษณะ อยู่ในอาคารเดียวกัน จะต้องมีการแบ่งสัดส่วนพื้นที่ให้ชัดเจน และแต่ละสัดส่วนต้องมีพื้นที่และลักษณะตามมาตรฐานของการให้บริการนั้น แต่ละสาขาต้องมีอย่างน้อย 1 ห้องตรวจโรค ซึ่งต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรค 1 เตียง ที่ได้มาตรฐานทางการแพทย์ และอ่างฟอกมือชนิดที่ไม่ใช้มือ เปิด-ปิดน้ำ สบู่","section":"s3"},{"key":"mlt_q033","no":"3.1.1","text":"3. การแสดงรายละเอียดเกี่ยวกับชื่อสถานพยาบาล ผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะในสถานพยาบาล อัตราค่ารักษาพยาบาล ค่าบริการและสิทธิผู้ป่วย\n3.1 มีป้ายชื่อสถานพยาบาล เป็นไปตามกฎกระทรวง\n3.1.1 ป้ายชื่อสถานพยาบาลต้องเป็นสี่เหลี่ยมผืนผ้าขนาดความกว้างของป้ายไม่น้อยกว่า 40 เซนติเมตร ความยาวไม่น้อยกว่า 120 เซนติเมตร","section":"s4"},{"key":"mlt_q034","no":"3.1.2","text":"3.1.2 จัดทำแผ่นป้ายแสดงชื่อสถานพยาบาลที่เป็นภาษาไทยขนาดความสูงไม่ต่ำกว่า 10 เซนติเมตร ตัวหนังสือ สีเลือดหมู สีพื้นป้ายสีขาว","section":"s4"},{"key":"mlt_q035","no":"3.1.3","text":"3.1.3 เลขที่ใบอนุญาตขนาดความสูงไม่ต่ำกว่า 5 เซนติเมตร ตัวเลขสีเลือดหมู","section":"s4"},{"key":"mlt_q036","no":"3.1.4","text":"3.1.4 กรณีใช้ภาษาต่างประเทศร่วมด้วย ต้องมีชื่อตรงกันกับภาษาไทย ขนาดตัวอักษรต้องเล็กกว่าภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"mlt_q037","no":"3.2","text":"3.2 ติดตั้งป้ายชื่อสถานพยาบาลในตำแหน่งที่มองเห็นได้ชัดเจนจากภายนอกและเหมาะสม","section":"s4"},{"key":"mlt_q038","no":"3.3.1","text":"3.3 ชื่อสถานพยาบาลไม่มีข้อความลักษณะชักชวนโอ้อวดเกินจริงหรืออาจสื่อให้เข้าใจผิด\n3.3.1 คำนำหน้าชื่อหรือต่อท้ายของชื่อคลินิกต้องประกอบด้วยลักษณะคลินิก และลักษณะการให้บริการของคลินิก","section":"s4"},{"key":"mlt_q039","no":"3.3.2","text":"3.3.2 กรณีใช้ชื่อภาษาต่างประเทศด้วย ขนาดตัวอักษรต้องเล็กกว่าอักษรภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"mlt_q040","no":"3.3.3","text":"3.3.3 ชื่อคลินิกจะต้องไม่ใช้คำหรือข้อความที่มีลักษณะชักชวน โอ้อวดเกินความจริง หรืออาจทำให้เกิดความเข้าใจผิดในสาระสำคัญเกี่ยวกับการประกอบกิจการ","section":"s4"},{"key":"mlt_q041","no":"3.3.4","text":"3.3.4 ชื่อคลินิกต้องไม่สื่อความหมายหรืออ้างอิงสถาบันพระมหากษัตริย์ เว้นแต่ได้รับพระบรมราชานุญาต","section":"s4"},{"key":"mlt_q042","no":"3.3.5","text":"3.3.5 คลินิกที่ตั้งอยู่ในอำเภอหรือในเขตเดียวกัน จะต้องมีชื่อไม่ซ้ำกัน เว้นแต่ผู้ขอรับอนุญาตเป็นบุคคลเดียวกันหรือมีหนังสือยินยอมจากผู้ได้รับใบอนุญาตให้ประกอบกิจการคลินิกเดิม ให้ใช้ชื่อซ้ำกันได้ แต่ต้องมีตัวอักษรหรือหมายเลขเรียงลำดับหรือที่ตั้งสถานที่ต่อท้ายชื่อคลินิก","section":"s4"},{"key":"mlt_q043","no":"3.4","text":"3.4 มีข้อความแสดงวัน เวลา ให้บริการไว้โดยเปิดเผย มองเห็นได้ชัดเจนจากด้านนอกคลินิกและตรงกับเวลาที่ขอรับอนุญาตให้ประกอบกิจการสถานพยาบาล","section":"s4"},{"key":"mlt_q044","no":"3.5","text":"3.5 มีบริเวณที่ต้องแสดงใบอนุญาตให้ประกอบกิจการและดำเนินการในบริเวณที่เปิดเผย และเหมาะสม เช่น บริเวณที่นั่งพักคอยของผู้รับบริการ","section":"s4"},{"key":"mlt_q045","no":"3.6","text":"3.6 มีบริเวณที่ใช้แสดงหลักฐานการชำระค่าธรรมเนียมการประกอบกิจการสถานพยาบาล(แบบ ส.พ.12) ในที่เปิดเผยและเห็นได้ชัดเจนบริเวณทางเข้าสถานพยาบาล","section":"s4"},{"key":"mlt_q046","no":"3.7","text":"3.7 หน้าห้องตรวจมีบริเวณให้ติดป้ายแสดงชื่อ ภาพถ่าย และเลขที่ใบอนุญาตของผู้ประกอบวิชาชีพเวชกรรมที่ให้บริการ หากมีผู้ประกอบวิชาชีพ/ผู้ประกอบโรคศิลปะอื่นปฏิบัติงานให้ยื่น สพ.6 ทุกคนและแสดงป้ายนี้ไว้ในบริเวณที่เปิดเผยและเห็นได้ชัดเจน","section":"s4"},{"key":"mlt_q047","no":"3.8","text":"3.8 แสดงอัตราค่าบริการและค่ารักษาพยาบาลให้ครอบคลุมการบริการที่เรียกเก็บ โดยแสดงอัตราราคาต่อหน่วย และระบุข้อความด้วยอักษรภาษาไทย โดยแสดงไว้ในที่เปิดเผยให้ผู้รับบริการสามารถเห็นได้ง่าย โดยจัดทำเป็นแผ่นประกาศ แผ่นพับ เล่ม หรือแฟ้มเอกสาร หรือโปรแกรมคอมพิวเตอร์ แสดงให้ผู้ป่วยทราบ","section":"s4"},{"key":"mlt_q048","no":"3.9","text":"3.9 มีป้ายแสดงให้ผู้รับบริการทราบว่าสามารถสอบถามอัตราค่าบริการและค่ารักษาพยาบาลได้จากที่ใด ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 10 เซนติเมตร แสดงไว้ในที่เห็นได้ชัดเจน","section":"s4"},{"key":"mlt_q049","no":"3.10","text":"3.10 แสดงคำประกาศสิทธิผู้ป่วยไว้ในที่เปิดเผยและเห็นได้ง่ายอ่านได้ชัดเจน ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 1 เซนติเมตร บริเวณที่พักคอยของผู้รับบริการ","section":"s4"},{"key":"mlt_q050","no":"3.11","text":"3.11 ข้อความโฆษณาสถานพยาบาล (ถ้ามี) ไม่เป็นเท็จ ไม่โอ้อวด หรือสื่อให้เข้าใจผิดในสาระสำคัญ","section":"s4"},{"key":"mlt_q051","no":"4.1","text":"4.ชนิดและจำนวนเครื่องมือ เครื่องใช้ที่จำเป็นประจำสถานพยาบาล\n4.1 เวชระเบียน","section":"s5"},{"key":"mlt_q052","no":"4.1.1","text":"4.1.1 มีตู้หรือชั้นหรืออุปกรณ์เก็บเวชระเบียนที่มั่นคง ปลอดภัยและต้องจัดให้เป็นระเบียบสามารถค้นหาได้ง่าย","section":"s5"},{"key":"mlt_q053","no":"4.1.2","text":"4.1.2 มีการจัดเตรียมทะเบียนผู้ป่วย มีรายการดังต่อไปนี้","section":"s5"},{"key":"mlt_q054","no":"4.1.2 › 1)","text":"1) ชื่อ นามสกุล อายุ ของผู้ป่วย","section":"s5"},{"key":"mlt_q055","no":"4.1.2 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s5"},{"key":"mlt_q056","no":"4.1.2 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"mlt_q057","no":"4.1.3 › 1)","text":"4.1.3 มีการจัดเตรียมใบส่งตรวจ หรือใบรายงานผลการตรวจวิเคราะห์ ที่ระบุ\n1) ชื่อสถานพยาบาล","section":"s5"},{"key":"mlt_q058","no":"4.1.3 › 2)","text":"2) ชื่อ นามสกุล อายุ เพศ ที่อยู่ หมายเลขโทรศัพท์ (ถ้ามี) และข้อมูลส่วนบุคคลอื่น ๆ ของผู้ป่วย เช่น เชื้อชาติ สัญชาติ สถานภาพสมรส เป็นต้น","section":"s5"},{"key":"mlt_q059","no":"4.1.3 › 3)","text":"3) เลขที่บัตรประจำตัวประชาชนผู้ป่วย","section":"s5"},{"key":"mlt_q060","no":"4.1.3 › 4)","text":"4) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"mlt_q061","no":"4.1.3 › 5)","text":"5) ชื่อผู้ประกอบวิชาชีพที่เป็นผู้วิเคราะห์","section":"s5"},{"key":"mlt_q062","no":"4.2.1","text":"4.2 เครื่องใช้ทั่วไป ประกอบด้วย\n4.2.1 โต๊ะสำหรับให้บริการ","section":"s5"},{"key":"mlt_q063","no":"4.2.2","text":"4.2.2 ตู้ หรือชั้นเก็บอุกรณ์สำหรับเก็บสิ่งส่งตรวจ หรืออุปกรณ์สำหรับการตรวจวิเคราะห์","section":"s5"},{"key":"mlt_q064","no":"4.2.3","text":"4.2.3 มีอ่างล้างมือ พร้อมอุปกรณ์การทำความสะอาด","section":"s5"},{"key":"mlt_q065","no":"4.3.1","text":"4.3 เครื่องมือ หรืออุปกรณ์ในการเก็บสิ่งส่งตรวจ และการตรวจวิเคราะห์ ดังนี้\n4.3.1 กล้องจุลทรรศน์ที่มีกำลังขยายถึงพันเท่า","section":"s5"},{"key":"mlt_q066","no":"4.3.2","text":"4.3.2 เครื่องมือหรืออุปกรณ์ที่ใช้ในการตรวจนับจำนวนเซลล์","section":"s5"},{"key":"mlt_q067","no":"4.3.3","text":"4.3.3 เครื่องมือวิเคราะห์ความเข้มข้นของสารที่มิใช่เครื่องใช้ในบ้านหรือข้างเตียงผู้ป่วย","section":"s5"},{"key":"mlt_q068","no":"4.3.4","text":"4.3.4 เครื่องมือหรืออุปกรณ์ควบคุมอุณหภูมิในการตรวจวิเคราะห์","section":"s5"},{"key":"mlt_q069","no":"4.3.5","text":"4.3.5 ตู้เย็นสำหรับเก็บรักษาสิ่งตัวอย่าง หรือใช้เก็บน้ำยาสำหรับการตรวจวิเคราะห์ โดยตู้เย็นนั้นต้องไม่มีอาหารหรือเครื่องดื่มปะปน","section":"s5"},{"key":"mlt_q070","no":"4.3.6","text":"4.3.6 เครื่องมืออื่นๆตามประเภทของการตรวจวิเคราะห์ที่จัดให้มี","section":"s5"},{"key":"mlt_q071","no":"6.3 › 1)","text":"6.3 มีแผนการส่งต่อผู้ป่วย และการเตรียมความพร้อมในสถานการณ์ฉุกเฉิน\n(๑) มีเบอร์โทรศัพท์ฉุกเฉินติดต่อโรงพยาบาล","section":"s5"},{"key":"mlt_q072","no":"6.3 }],"items":[{"key":"tcm_q001","no":"1.1","text":"1.1 หนังสือรับรองตนเองของผู้ดำเนินการสถานพยาบาล ที่สามารถดูแลสถานพยาบาล ได้อย่างใกล้ชิด และไม่เป็นผู้ดำเนินการหรือผู้ประกอบวิชาชีพในสถานพยาบาลเอกชนหรือหน่วยงานของรัฐที่มีเวลาปฏิบัติงานซ้ำซ้อนกัน","section":"s1"},{"key":"tcm_q002","no":"1.2","text":"1.2 กรณีที่ผู้ดำเนินการสถานพยาบาลกำลังศึกษา/อบรม เพิ่มเติม ต้องมีเอกสารรับรองเรื่องระยะเวลาการศึกษา/อบรมจากสถาบันนั้น ๆ ซึ่งเวลาต้องไม่ซ้ำซ้อนกับการได้รับอนุญาตให้เป็นผู้ดำเนินการสถานพยาบาล","section":"s1"},{"key":"tcm_q003","no":"2.1","text":"2.1 มีเอกสารแสดงกรรมสิทธิ์ เพื่อประกอบกิจการสถานพยาบาลประเภทคลินิก จากผู้มีกรรมสิทธิ์/ผู้ครอบครองพื้นที่ดังกล่าว เช่น สำเนาโฉนดที่ดินหรือสัญญาเช่า","section":"s2"},{"key":"tcm_q004","no":"5.1","text":"5.1 แนบสำเนาใบอนุญาตจากสำนักงานคณะกรรมการอาหารและยา","section":"s3"},{"key":"tcm_q005","no":"1.1","text":"1.1 ตั้งอยู่ในทำเลที่สะดวก ปลอดภัย และไม่เป็นอันตรายต่อสุขภาพ","section":"s4"},{"key":"tcm_q006","no":"1.2","text":"1.2 อาคารต้องมั่นคงแข็งแรง ไม่อยู่ในสภาพชำรุดหรือเสี่ยงต่ออันตรายจากการใช้สอย","section":"s4"},{"key":"tcm_q007","no":"1.3","text":"1.3 บริเวณทั้งภายนอกและภายในต้องสะอาด เป็นระเบียบเรียบร้อย จัดแบ่งพื้นที่ใช้สอยอย่างเหมาะสม และมีสิ่งอำนวยความสะดวกแก่ผู้ป่วย","section":"s4"},{"key":"tcm_q008","no":"1.3.1","text":"1.3.1 มีพื้นที่ที่ให้บริการโดยรวมไม่ต่ำกว่า 20 ตารางเมตร โดยส่วนแคบที่สุดต้องมีความกว้างไม่น้อยกว่า 3.00 เมตร พื้นที่ให้บริการจะต้องมีพื้นที่เชื่อมและเปิดติดต่อถึงกันได้","section":"s4"},{"key":"tcm_q009","no":"1.3.2","text":"1.3.2 มีส่วนพักคอยตรวจที่เหมาะสมอย่างน้อย 5 ที่นั่ง และที่นั่งต้องมีพนักพิง","section":"s4"},{"key":"tcm_q010","no":"1.4","text":"1.4 การสัญจรและการเคลื่อนย้ายผู้ป่วยต้องกระทำได้โดยสะดวก โดยเฉพาะเมื่อเกิดภาวะฉุกเฉิน","section":"s4"},{"key":"tcm_q011","no":"1.4.1","text":"1.4.1 ขนาดความกว้างของประตูเข้า-ออก ไม่ต่ำกว่า 80 เซนติเมตร และผู้พิการสามารถเข้าออกได้อย่างสะดวก","section":"s4"},{"key":"tcm_q012","no":"1.4.2","text":"1.4.2 มีทางลาดเอียงสำหรับรถเข็นผู้ป่วย กรณีทางเข้าคลินิกมีความสูงไม่สะดวกแก่คนพิการหรือผู้ป่วยสูงอายุที่ใช้รถเข็น","section":"s4"},{"key":"tcm_q013","no":"1.5","text":"1.5 มีห้องตรวจหรือห้องให้การรักษาเป็นสัดส่วนและมิดชิด","section":"s4"},{"key":"tcm_q014","no":"1.5.1","text":"1.5.๑ มีประตูเข้า – ออกคนละทาง","section":"s4"},{"key":"tcm_q015","no":"1.5.1 › 1)","text":"1) ต้องมีประตูเปิด-ปิดอย่างชัดเจน กั้นเป็นสัดส่วน","section":"s4"},{"key":"tcm_q016","no":"1.5.1 › 2)","text":"2) ภายในห้องต้องประกอบด้วยโต๊ะตรวจโรค 1 ตัว เตียงตรวจโรค 1 เตียงที่ได้มาตรฐานทางการแพทย์ และอ่างฟอกมือชนิดที่ไม่ใช้มือเปิด-ปิดน้ำ สบู่เหลว และผ้าเช็ดมือหรือกระดาษเช็ดมือที่ใช้ครั้งเดียว","section":"s4"},{"key":"tcm_q017","no":"1.5.2","text":"๑.5.๒ ห้องให้การรักษาและการทำหัตถการตามประเภทให้บริการ ต้องเป็นสัดส่วนและมีความปลอดภัยต่อผู้รับบริการ","section":"s4"},{"key":"tcm_q018","no":"1.5.3","text":"๑.5.3 ไม่มีวงจรปิดในห้องตรวจหรือห้องที่เกี่ยวกับการประกอบวิชาชีพหรือการประกอบโรคศิลปะ","section":"s4"},{"key":"tcm_q019","no":"1.6","text":"1.6 มีห้องน้ำห้องส้วมที่ถูกสุขลักษณะอย่างน้อยหนึ่งห้องกรณีที่สถานพยาบาลตั้งอยู่ในศูนย์การค้าอนุญาตให้ใช้ห้องส้วมรวมได้","section":"s4"},{"key":"tcm_q020","no":"1.7","text":"1.7 มีแสงสว่างและการระบายอากาศเพียงพอ ไม่มีกลิ่นอับทึบ","section":"s4"},{"key":"tcm_q021","no":"1.7.1","text":"1.7.1 หากความสูงของสถานพยาบาลต่ำกว่า 2.6 เมตร ต้องมีการแก้ไขเรื่องการระบายอากาศ เช่น เพิ่มพัดลมดูดอากาศเพื่อให้มีการระบายอากาศเพียงพอ","section":"s4"},{"key":"tcm_q022","no":"1.8","text":"1.8 มีระบบการเก็บและกำจัดมูลฝอยและสิ่งปฏิกูลที่เหมาะสม มีภาชนะใส่มูลฝอยติดเชื้อ (ใช้ถุงขยะพลาสติกสีแดงเขียนข้อความ \"ขยะติดเชื้อ\") แยกต่างหากจากภาชนะใส่มูลฝอยทั่วไปและมีการกำจัดอย่างเหมาะสม","section":"s4"},{"key":"tcm_q023","no":"1.8.1","text":"1.8.1 ห้องตรวจและห้องที่ให้บริการผู้ป่วย ต้องมีถังขยะทั่วไป–ถังขยะติดเชื้อ ที่มีลักษณะถังขยะแบบเหยียบให้เปิด มีฝาปิดมิดชิดวางคู่กันทุกห้อง","section":"s4"},{"key":"tcm_q024","no":"1.8.2","text":"1.8.2 มีสัญญา/หนังสือตอบรับการขนถ่ายขยะติดเชื้อ ของการจ้างบริษัทกำจัดขยะ ติดเชื้อ หรืออาจแสดงใบเสร็จรับเงินที่เป็นเดือนปัจจุบัน","section":"s4"},{"key":"tcm_q025","no":"1.8.3","text":"1.8.3 ภาชนะเป็นชนิดที่ใช้เท้าเหยียบสำหรับเปิด-ปิด","section":"s4"},{"key":"tcm_q026","no":"1.8.4","text":"1.8.4 ภาชนะบรรจุขยะติดเชื้อ ให้ใช้ถุงขยะพลาสติกสีแดง เขียนข้อความ “ขยะติดเชื้อ” ที่ชัดเจนบริเวณถุง","section":"s4"},{"key":"tcm_q027","no":"1.9","text":"1.9 มีระบบควบคุมการติดเชื้อที่เหมาะสม (นอกเหนือจากพิจารณาในภาพรวมแล้วให้ตรวจสอบการทำความสะอาดและทำให้เครื่องมือปราศจากเชื้อ ในห้องบำบัดรักษาหรือในบริเวณที่มีงานหัตถการด้วย)","section":"s4"},{"key":"tcm_q028","no":"1.10","text":"1.10 มีถังดับเพลิงขนาดไม่ต่ำกว่า ๑๐ ปอนด์ อยู่ในสภาพพร้อมใช้งาน ติดตั้งโดยยึดกับอาคารให้ส่วนบนสุดของตัวเครื่องสูงจากระดับพื้นอาคารไม่เกิน 1.50 เมตร อยู่ในที่มองเห็น สามารถอ่านคำแนะนำ การใช้ได้ชัดเจน ติดตั้งทุกชั้น","section":"s4"},{"key":"tcm_q029","no":"1.11","text":"1.11 มีป้ายเครื่องหมายห้ามสูบบุหรี่","section":"s4"},{"key":"tcm_q030","no":"2.1","text":"2.1 มีความปลอดภัย มีความสะดวก และเหมาะสมต่อผู้ให้บริการและผู้รับบริการในการประกอบวิชาชีพนั้น","section":"s5"},{"key":"tcm_q031","no":"2.2","text":"2.2 ได้มาตรฐานตามลักษณะวิชาชีพตามที่สภาวิชาชัพหรือคณะกรรมการวิชาชีพประกาศกำหนด แล้วแต่กรณี","section":"s5"},{"key":"tcm_q032","no":"2.3","text":"2.3 พื้นที่ให้บริการจะต้องมีพื้นที่เชื่อมและเปิดติดต่อถึงกันได้ และไม่ตั้งอยู่ในพื้นที่เดียวกับสถานที่ขายยาตามกฎหมายว่าด้วยยาหรือพื้นที่เดียวกับการประกอบอาชีพอื่น","section":"s5"},{"key":"tcm_q033","no":"2.3.1","text":"2.3.1 มีประตูเข้า - ออกคนละทาง","section":"s5"},{"key":"tcm_q034","no":"2.3.2","text":"2.3.2 การกั้นพื้นที่ต้องเป็นสัดส่วน แสดงให้เห็นประจักษ์ ชัดเจนและถาวร","section":"s5"},{"key":"tcm_q035","no":"2.4","text":"2.4 พื้นที่ให้บริการจะต้องไม่ตั้งอยู่ในสถานที่เดียวกับสถานพยาบาลของกระทรวง ทบวง กรม กรุงเทพมหานคร เมืองพัทยา องค์การบริหารส่วนจังหวัด เทศบาล องค์การบริหารส่วนตำบล องค์กรปกครองส่วนท้องถิ่น ท้องถิ่นอื่น และสภากาชาดไทย ซึ่งให้บริการในลักษณะเดียวกัน","section":"s5"},{"key":"tcm_q036","no":"2.5","text":"2.5 กรณีที่มีการให้บริการในอาคารเดียวกับการประกอบกิจการอื่น จะต้องมีการแบ่งพื้นที่ให้ชัดเจน และกิจการอื่นต้องไม่กระทบกระเทือนต่อการประกอบวิชาชีพ รวมทั้งสามารถเคลื่อนย้ายผู้ป่วยฉุกเฉินได้สะดวก","section":"s5"},{"key":"tcm_q037","no":"2.6","text":"2.6 กรณีที่มีการให้บริการของลักษณะสหคลินิกหรือมีคลินิกหลายลักษณะ อยู่ในอาคารเดียวกัน จะต้องมีการแบ่งสัดส่วนพื้นที่ให้ชัดเจน และแต่ละสัดส่วนต้องมีพื้นที่และลักษณะตามมาตรฐานของการให้บริการนั้น","section":"s5","condHead":true,"cond":"tcm_g2"},{"key":"tcm_q038","no":"2.6.1","text":"2.6.1 แต่ละสาขาต้องมีอย่างน้อย 1 ห้องตรวจโรค ซึ่งต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรค 1 เตียงที่ได้มาตรฐานทางการแพทย์ และอ่างฟอกมือชนิดที่ไม่ใช้มือเปิด-ปิด สบู่ และผ้าเช็ดมือ หรือกระดาษเช็ดมือที่ใช้ครั้งเดียวทิ้ง","section":"s5","cond":"tcm_g2"},{"key":"tcm_q039","no":"2.6.2","text":"2.6.2 มีห้องตรวจหรือห้องให้บริการเป็นสัดส่วนและมิดชิด","section":"s5","cond":"tcm_g2"},{"key":"tcm_q040","no":"3.1","text":"3.1 มีป้ายชื่อคลินิกการประกอบโรคศิลปะสาขาการแพทย์แผนจีน ที่ถูกต้องอย่างน้อย ๑ ป้ายโดยมีลักษณะดังนี้คือ","section":"s6"},{"key":"tcm_q041","no":"3.1.1","text":"3.๑.๑ ป้ายชื่อสถานพยาบาลต้องเป็นสี่เหลี่ยมผืนผ้า ขนาดความกว้างของป้ายไม่น้อยกว่า ๔๐ เซนติเมตร ความยาวไม่น้อยกว่า ๑๒๐ เซนติเมตร","section":"s6"},{"key":"tcm_q042","no":"3.1.2","text":"3.๑.๒ แสดงประเภทและลักษณะถูกต้อง โดยต้องมีคำว่า “คลินิกการประกอบโรคศิลปะ สาขาการแพทย์แผนจีน” นำหน้าหรือต่อท้ายชื่อ","section":"s6"},{"key":"tcm_q043","no":"3.1.3","text":"3.๑.๓ จัดทำแผ่นป้ายชื่อสถานพยาบาลที่เป็นภาษาไทย ขนาดความสูงไม่ต่ำกว่า 10 เซนติเมตร คลินิกการประกอบโรคศิลปะ สาขาการแพทย์แผนจีน ใช้พื้นสีขาว ตัวอักษรสีน้ำตาล","section":"s6"},{"key":"tcm_q044","no":"3.1.4","text":"3.๑.๔ เลขที่ใบอนุญาตขนาดความสูงไม่ต่ำกว่า 5 เซนติเมตร ใช้เป็น ตัวเลขอารบิค สีน้ำตาล","section":"s6"},{"key":"tcm_q045","no":"3.2","text":"3.๒ ติดตั้งป้ายชื่อสถานพยาบาลในตำแหน่งมองเห็นได้ชัดเจนจากภายนอก และเหมาะสม","section":"s6"},{"key":"tcm_q046","no":"3.3","text":"3.๓ ชื่อสถานพยาบาลไม่มีข้อความลักษณะชักชวน โอ้อวดเกินจริง หรืออาจสื่อให้เข้าใจผิด ในสาระสำคัญดังต่อไปนี้","section":"s6"},{"key":"tcm_q047","no":"3.3.1","text":"3.3.1 คำนำหน้าชื่อ หรือ ต่อท้ายของชื่อคลินิก ต้องประกอบด้วยลักษณะคลินิก และลักษณะการให้บริการของคลินิกที่ขออนุญาต คือ “คลินิกการประกอบโรคศิลปะ สาขาการแพทย์แผนจีน”","section":"s6"},{"key":"tcm_q048","no":"3.3.2","text":"3.3.2 กรณีใช้ชื่อภาษาต่างประเทศด้วย ขนาดตัวอักษรต้องเล็กกว่าอักษรภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s6"},{"key":"tcm_q049","no":"3.3.3","text":"3.3.3 ชื่อคลินิกจะต้องไม่ใช้คำหรือข้อความที่มีลักษณะชักชวน โอ้อวดเกินความจริงหรืออาจทำให้เกิดความเข้าใจผิดในสาระสำคัญเกี่ยวกับการประกอบกิจการคลินิกการประกอบโรคศิลปะ สาขาการแพทย์แผนจีน","section":"s6"},{"key":"tcm_q050","no":"3.3.4","text":"3.3.4 ชื่อคลินิกต้องไม่สื่อความหมายหรืออ้างอิงสถาบันพระมหากษัตริย์ เว้นแต่ได้รับพระบรมราชานุญาต","section":"s6"},{"key":"tcm_q051","no":"3.3.5","text":"3.3.5 คลินิกที่ตั้งอยู่ในอำเภอ หรือ ในเขตเดียวกัน จะต้องมีชื่อไม่ซ้ำกัน เว้นแต่กรณีที่ผู้ขอรับใบอนุญาตให้ประกอบกิจการคลินิก (ใหม่) และผู้ได้รับใบอนุญาตให้ประกอบกิจการคลินิกเดิมเป็นบุคคลหรือนิติบุคคลเดียวกัน หรือมีหนังสือยินยอมจากผู้ได้ใบอนุญาตให้ประกอบกิจการคลินิกเดิม ให้ใช้ชื่อซ้ำกันได้ แต่ต้องมีตัวอักษร หรือ หมายเลขเรียงลำดับ หรือ ที่ตั้งสถานที่ต่อท้ายชื่อคลินิก","section":"s6"},{"key":"tcm_q052","no":"3.4","text":"3.๔ มีข้อความแสดงวัน เวลาที่ให้บริการไว้โดยเปิดเผย มองเห็นได้ชัดเจนจากด้านนอกคลินิกและตรงกับที่ได้รับอนุญาตให้ประกอบกิจการสถานพยาบาล","section":"s6"},{"key":"tcm_q053","no":"3.5","text":"3.๕ แสดงใบอนุญาตติดในที่เปิดเผยและเหมาะสม (กรณีที่คลินิกยังไม่ได้รับใบอนุญาตให้พนักงานเจ้าหน้าที่ให้คำแนะนำ)","section":"s6"},{"key":"tcm_q054","no":"3.5.1","text":"3.5.๑ ใบอนุญาตให้ประกอบกิจการสถานพยาบาล (แบบ ส.พ.7)","section":"s6"},{"key":"tcm_q055","no":"3.5.2","text":"3.5.๒ ใบอนุญาตให้ดำเนินการสถานพยาบาล (แบบ ส.พ.19)","section":"s6"},{"key":"tcm_q056","no":"3.6","text":"3.6 แสดงเอกสารหรือหลักฐานการชำระค่าธรรมเนียมการประกอบกิจการสถานพยาบาล (แบบ ส.พ.12) ไว้บริเวณด้านหน้าสถานพยาบาล (คลินิกที่ยังไม่ได้รับอนุญาตให้เจ้าหน้าที่ให้คำแนะนำ)","section":"s6"},{"key":"tcm_q057","no":"3.7","text":"3.๗ แสดงรายละเอียดเกี่ยวกับผู้ประกอบโรคศิลปะ สาขาการแพทย์แผนจีน ที่มีหนังสือแสดงความจำนงเป็นผู้ปฏิบัติงานในสถานพยาบาลของผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะ (แบบ ส.พ. ๖) ไว้ในที่เปิดเผยและเห็นได้ง่าย ณ คลินิก (กรณีที่คลินิกยังไม่ได้รับใบอนุญาตให้พนักงานเจ้าหน้าที่ให้คำแนะนำ) ดังต่อไปนี้","section":"s6"},{"key":"tcm_q058","no":"3.7.1","text":"3.๗.๑ ให้จัดให้มีแผ่นป้ายแสดงชื่อ และ ชื่อสกุลของผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะพร้อมทั้งระบุเลขที่ใบอนุญาตให้ประกอบโรคศิลปะ (ออกใบโดยผู้อนุญาต)","section":"s6"},{"key":"tcm_q059","no":"3.7.2","text":"3.๗.๒ รูปถ่ายหน้าตรง ไม่สวมหมวก ไม่สวมแว่นดำ แต่งกายสุภาพ รูปถ่ายที่ถ่ายไม่เกิน 1 ปีขนาด 8 เซนติเมตร x 13 เซนติเมตร","section":"s6"},{"key":"tcm_q060","no":"3.7.3","text":"3.๗.๓ ติดแบบแสดงรูปถ่ายและรายละเอียดเกี่ยวกับผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะในสถานพยาบาลบริเวณหน้าห้องที่ผู้ประกอบวิชาชีพหรือประกอบโรคศิลปะปฏิบัติงานเท่านั้น และต้องตรงกับผู้ประกอบโรคศิลปะที่ให้บริการ","section":"s6"},{"key":"tcm_q061","no":"3.7.4","text":"3.๗.๔ แบบแสดงบนรูปถ่ายและรายละเอียดของผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะ ให้ใช้พื้นแผ่นป้ายสีน้ำเงิน","section":"s6"},{"key":"tcm_q062","no":"3.7.5","text":"3.๗.5 หากมีผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะที่เป็นผู้ปฏิบัติงานในสถานพยาบาลของคลินิก (ตามหนังสือแสดงความจำนงเป็นผู้ปฏิบัติงาน) ให้ยื่นแบบ ส.พ.6 ทุกคน","section":"s6"},{"key":"tcm_q063","no":"3.8","text":"3.๘ แสดงอัตราค่าบริการทางการแพทย์แผนจีน ในที่เปิดเผยเห็นได้ง่ายด้วยตัวอักษรไทย (หากมีภาษาต่างประเทศร่วมด้วยได้) และต้องครอบคลุมที่ให้บริการ โดยจัดทำเป็นแผ่นประกาศ แผ่นพับ เล่มหรือแฟ้มเอกสาร หรือโปรแกรมคอมพิวเตอร์ แสดงให้ผู้ป่วยทราบ ดังต่อไปนี้","section":"s6"},{"key":"tcm_q064","no":"3.8.1","text":"3.8.๑ แสดงรายละเอียดเกี่ยวกับอัตรารักษาพยาบาล และค่าบริการให้ครอบคลุมบริการที่จัดให้มีผู้รับอนุญาตจะเรียกเก็บหรือยินยอมให้มีการเรียกเก็บค่ารักษาพยาบาล หรือบริการอื่นเกินอัตราที่แสดงไว้มิได้และต้องให้บริการผู้ป่วยตามสิทธิแสดงไว้","section":"s6"},{"key":"tcm_q065","no":"3.8.2","text":"3.8.2 แสดงในที่เปิดเผยและเห็นได้ง่าย ณ คลินิกที่ได้รับอนุญาต","section":"s6"},{"key":"tcm_q066","no":"3.8.3","text":"3.8.3 จัดทำเป็นแผ่นประกาศ แผ่นพับ เล่มหรือแฟ้มเอกสาร หรือโปรแกรมคอมพิวเตอร์แสดงให้ผู้ป่วยทราบ","section":"s6"},{"key":"tcm_q067","no":"3.9","text":"3.๙ จัดทำป้ายตัวอักษรภาษาไทยขนาดความสูงไม่น้อยกว่า ๑๐ เซนติเมตร แสดงให้ผู้รับบริการทราบว่าสามารถสอบถามอัตราค่าบริการและค่ารักษาพยาบาลได้จากที่ใด","section":"s6"},{"key":"tcm_q068","no":"3.10","text":"3.๑๐ จัดทำป้ายตัวอักษรภาษาไทยขนาดความสูงไม่น้อยกว่า ๑ เซนติเมตร แสดงคำประกาศสิทธิผู้ป่วยไว้ในที่เปิดเผยและเห็นได้ง่าย บริเวณที่พักคอยของผู้รับบริการ","section":"s6"},{"key":"tcm_q069","no":"3.11","text":"3.๑๑ กรณีมีการโฆษณาสถานพยาบาลข้อความต้องให้เป็นไปตามมาตรา 38 แห่งพระราชบัญญัติสถานพยาบาล พ.ศ. 2541 และประกาศกระทรวงสาธารณสุข ฉบับที่ 11 (พ.ศ. 2546) เรื่อง หลักเกณฑ์ วิธีการ และเงื่อนไขในการโฆษณาสถานพยาบาล การโฆษณาคลินิกให้กระทำได้ ดังต่อไปนี้","section":"s6","condHead":true,"cond":"tcm_g3"},{"key":"tcm_q070","no":"3.11.1","text":"3.๑๑.๑ การโฆษณาชื่อ ที่ตั้ง ถ้ามีภาพประกอบให้แสดงได้เฉพาะสถานที่ตั้งอาคาร และอาคารคลินิก","section":"s6","cond":"tcm_g3"},{"key":"tcm_q071","no":"3.11.2","text":"3.1๑.๒ การโฆษณาคุณวุฒิ หรือความสามารถของผู้ประกอบโรคศิลปะสาขาการแพทย์แผนจีนให้เป็นไปตามกฎหมายว่าด้วยการประกอบโรคศิลปะสาขาการแพทย์แผนจีน","section":"s6","cond":"tcm_g3"},{"key":"tcm_q072","no":"3.11.3","text":"3.๑๑.๓ การโฆษณาบริการ การประกอบโรคศิลปะสาขาการแพทย์แผนจีนให้แจ้งเฉพาะบริการที่มีในคลินิก วัน เวลา ที่ให้บริการตามที่ได้รับอนุญาต","section":"s6","cond":"tcm_g3"},{"key":"tcm_q073","no":"3.11.4","text":"3.๑๑.๔ การโฆษณาอัตราค่ารักษาพยาบาล หรือค่าบริการที่มีเงื่อนไข จะต้องแจ้งเงื่อนไขให้ผู้รับบริการทราบล่วงหน้าก่อนให้บริการ และจะต้องกำหนดวันเริ่มต้นและสิ้นสุดของระยะเวลาที่ชัดเจน","section":"s6","cond":"tcm_g3"},{"key":"tcm_q074","no":"3.12","text":"3.๑๒ ห้ามมิให้โฆษณาคลินิกในลักษณะ ดังต่อไปนี้","section":"s6"},{"key":"tcm_q075","no":"3.12.1","text":"3.๑2.๑ ห้ามใช้ข้อความอันเป็นเท็จ หรือข้อความที่ไม่มีมูลความจริงทั้งหมด หรือเพียงบางส่วนหรือมีลักษณะเป็นการหลอกลวง หรือปกปิดความจริง หรือทำให้เข้าใจผิดว่าเป็นจริง","section":"s6"},{"key":"tcm_q076","no":"3.12.2","text":"3.๑2.๒ การใช้ข้อความที่ทำให้บุคคลทั่วไปเข้าใจว่าในคลินิก มีบุคลากร เครื่องมือเครื่องใช้ และอุปกรณ์ทางการแพทย์ แต่ข้อเท็จจริงกลับไม่มีให้บริการในคลินิก","section":"s6"},{"key":"tcm_q077","no":"3.12.3","text":"3.๑2.๓ การใช้สถาบัน หน่วยงาน องค์กร หรือบุคคล ที่มิได้ผ่านการรับรองจากหน่วยงานของรัฐ เพื่อรับรองมาตรฐานคลินิกของตน เว้นแต่ได้รับอนุญาตจากผู้อนุญาต","section":"s6"},{"key":"tcm_q078","no":"3.12.4","text":"3.๑2.4 ห้ามการโฆษณาแจ้งบริการโรคที่ไม่มีอยู่ในสาขาที่ผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะมีหนังสืออนุมัติบัตร หรือวุฒิบัตร","section":"s6"},{"key":"tcm_q079","no":"3.12.5","text":"3.๑2.5 ห้ามการใช้ข้อความหรือรูปภาพโอ้อวดเกินความจริง หรือข้อความที่กล่าวอ้างหรือบ่งบอกว่าของตนเองดีกว่า เหนือกว่า ดีที่สุด รายแรก แห่งแรก รับรองผล 100 % หรือ การเปรียบเทียบหรือการใช้ข้อความอื่นใดที่มีความหมายในทำนองเดียวกันมาใช้ประกอบข้อความโฆษณา ด้วยความประสงค์ที่จะทำให้ผู้รับบริการ หรือผู้บริโภคเข้าใจว่าการบริการของสถานพยาบาลแห่งนั้น มีคุณภาพมาตรฐานที่ดีกว่า เหนือกว่า หรือสูงกว่าสถานพยาบาลอื่น หรือเกิดความคาดหวังว่าจะได้รับบริการที่ดีกว่า หรือได้ผลสูงสุด","section":"s6"},{"key":"tcm_q080","no":"3.12.6","text":"3.๑2.6 ห้ามการโฆษณาการให้บริการ “ฟรี” เว้นแต่ดีรับความเห็นชอบจากผู้อนุญาต ทั้งนี้ต้องกำหนดวัน เวลา และสถานที่ให้บริการ และจะต้องแสดงรายละเอียดว่าให้บริการฟรีเรื่องใดให้ชัดเจน","section":"s6"},{"key":"tcm_q081","no":"3.12.7","text":"3.๑2.7 ห้ามการโฆษณาที่จัดให้มีการแถมพก แลกเปลี่ยน ให้สิทธิประโยชน์ รางวัลหรือเสี่ยงโชค เว้นแต่สิทธิประโยชน์โดยตรงและมาตรฐานการรับบริการทางการแพทย์ต้องไม่ต่ำกว่ามาตรฐานทั่วไป และต้องระบุเงื่อนไขรายละเอียดของสิทธิประโยชน์ต่างๆให้ชัดเจน และต้องกำหนดวันเริ่มต้นและสิ้นสุดของระยะเวลาที่ให้สิทธิประโยชน์นั้นๆ","section":"s6"},{"key":"tcm_q082","no":"3.12.8","text":"3.๑2.8 อื่นๆ","section":"s6","textField":true},{"key":"tcm_q083","no":"4.1","text":"4.๑ เวชระเบียน","section":"s7"},{"key":"tcm_q084","no":"4.1.1","text":"4.๑.๑ มีตู้หรือชั้น หรืออุปกรณ์เก็บเวชระเบียน ที่มั่นคงปลอดภัย และต้องจัดให้เป็นระเบียบสามารถค้นหาได้ง่าย หรือถ้าเป็นระบบคอมพิวเตอร์ ต้องจัดให้มีระบบข้อมูลสำรอง เพื่อป้องกันข้อมูล สูญหาย ซึ่งอาจจัดแยกเป็นแผนกเวชระเบียนโดยเฉพาะก็ได้","section":"s7"},{"key":"tcm_q085","no":"4.1.2","text":"4.๑.๒ มีการจัดเตรียมทะเบียนผู้ป่วย สำหรับบันทึกการมารับบริการของผู้ป่วย อย่างน้อย ต้องมีรายการต่อไปนี้","section":"s7"},{"key":"tcm_q086","no":"4.1.2 › 1)","text":"๑) ชื่อ นามสกุล อายุ ของผู้รับบริการ","section":"s7"},{"key":"tcm_q087","no":"4.1.2 › 2)","text":"๒) เลขที่ประจำตัวผู้ป่วย","section":"s7"},{"key":"tcm_q088","no":"4.1.2 › 3)","text":"๓) วัน เดือน ปี ที่มารับบริการ","section":"s7"},{"key":"tcm_q089","no":"4.1.2 › 4)","text":"๔) การบริการทางการแพทย์แผนจีน","section":"s7"},{"key":"tcm_q090","no":"4.1.3","text":"4.๑.๓ มีแบบบันทึกการรับบริการ ที่สามารถบันทึกรายละเอียดตามที่กฎกระทรวงกำหนด ดังต่อไปนี้","section":"s7"},{"key":"tcm_q091","no":"4.1.3 › 1)","text":"๑) ชื่อสถานพยาบาล","section":"s7"},{"key":"tcm_q092","no":"4.1.3 › 2)","text":"๒) เลขที่ประจำตัวผู้ป่วย","section":"s7"},{"key":"tcm_q093","no":"4.1.3 › 3)","text":"๓) วัน เดือน ปี ที่มารับบริการ","section":"s7"},{"key":"tcm_q094","no":"4.1.3 › 4)","text":"๔) ชื่อ นามสกุล อายุ เพศ ที่อยู่ หมายเลขโทรศัพท์ (ถ้ามี) และข้อมูลส่วนบุคคลอื่นๆ ของผู้ป่วยเช่น เชื้อชาติ สัญชาติ สถานภาพสมรส เลขที่บัตรประจำตัวประชาชน","section":"s7"},{"key":"tcm_q095","no":"4.1.3 › 5)","text":"๕) ประวัติการเจ็บป่วย การแพ้ยา และผลการตรวจร่างกาย ของผู้รับบริการ","section":"s7"},{"key":"tcm_q096","no":"4.1.3 › 6)","text":"๖) การให้บริการทางการแพทย์แผนจีน","section":"s7"},{"key":"tcm_q097","no":"4.1.3 › 7)","text":"๗) ลายมือชื่อผู้ประกอบโรคศิลปะที่ให้บริการ","section":"s7"},{"key":"tcm_q098","no":"4.1.3 › 8)","text":"8) ไม่อนุญาตให้บุคคลภายนอกหยิบเอกสารการให้บริการผู้ป่วย เว้นแต่จะได้รับอนุญาต","section":"s7"},{"key":"tcm_q099","no":"4.2","text":"4.๒ เครื่องใช้ทั่วไป จะต้องจัดให้มี","section":"s7"},{"key":"tcm_q100","no":"4.2.1","text":"4.๒.๑ เตียงตรวจโรค ที่นอน ผ้าปูที่นอน หมอน พร้อมปลอกหมอน ผ้าคลุมตัวผู้ป่วย ให้อยู /* ---------- toast & modal ---------- */
function toast(msg, type = 'info', ms = 4200) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'ok' ? 'ok' : type === 'err' ? 'err' : type === 'warn' ? 'warn' : '');
  el.innerHTML = ic(type === 'ok' ? 'check' : type === 'err' ? 'alert' : 'info') + `<div>${msg}</div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, ms);
}
function openModal({ title, body, foot = '', size = '', onClose }) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-h"><h2>${esc(title)}</h2><span class="spacer"></span><button class="icon-btn" data-close aria-label="ปิด">${ic('x')}</button></div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  const close = () => { scrim.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  scrim.addEventListener('click', e => { if (e.target === scrim || e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(scrim);
  const f = scrim.querySelector('.modal-b input, .modal-b select, .modal-f .btn.primary, .modal-f .btn.danger'); f && f.focus();
  return { el: scrim, close };
}
/** หน้าต่างยืนยัน — คืนค่า Promise<boolean> */
function confirmBox({ title, message, ok = 'ยืนยัน', danger = false, cancel = 'ยกเลิก' }) {
  return new Promise(res => {
    let done = false;
    const m = openModal({ title, size: 'sm', body: `<div class="alert ${danger ? 'err' : 'info'}">${ic(danger ? 'alert' : 'info')}<div>${message}</div></div>`,
      foot: `<button class="btn ghost" data-close>${esc(cancel)}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(ok)}</button>`,
      onClose: () => { if (!done) res(false); } });
    m.el.querySelector('[data-ok]').addEventListener('click', () => { done = true; m.close(); res(true); });
  });
}
function btnBusy(btn, busy, label) {
  if (!btn) return;
  if (busy) { btn.dataset.html = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${esc(label || 'กำลังดำเนินการ…')}`; }
  else { btn.disabled = false; if (btn.dataset.html) btn.innerHTML = btn.dataset.html; }
}

/* =====================================================================
   SCHEMA HELPERS — ฟิลด์/ข้อตรวจ/คะแนน/การตรวจสอบข้อมูล
   ===================================================================== */
const FORMS = SCHEMA.forms;
const FORM_IDS = Object.keys(FORMS);
const BASE_FIELD = {};
[...SCHEMA.system, ...SCHEMA.common, ...SCHEMA.score].forEach(f => BASE_FIELD[f.key] = f);
FORM_IDS.forEach(fid => {
  const fm = FORMS[fid];
  fm.itemMap = {}; fm.items.forEach(it => fm.itemMap[it.key] = it);
  fm.secMap = {}; fm.sections.forEach(s => fm.secMap[s.id] = s);
  fm.fieldMap = {}; fm.fields.forEach(f => fm.fieldMap[f.key] = f);
  fm.resultItems = fm.items.filter(it => it.kind !== 'text');
  fm.headerKeys = fm.groups.flatMap(g => g.fields);
  fm.finalKeys = fm.final.flatMap(g => g.fields);
});
const RESULT = { Y: 'ถูกต้อง', N: 'ไม่ถูกต้อง', NA: 'ไม่มีบริการ' };
const SYM = { Y: '✓', N: '×', NA: '–' };
const STATUS = Object.fromEntries(SCHEMA.recordStatus.map(s => [s.v, s.label]));
const OVERALL = Object.fromEntries(SCHEMA.overall.map(s => [s.v, s.label]));
const PUBLIC_FIELDS = ['form_type','inspection_year','inspection_date','addr_amphoe','addr_province','building_type','record_status',
  'score_total_items','score_pass','score_fail','score_na','score_blank','score_compliance_pct','overall_result'];

function fieldDef(fid, key) {
  const fm = FORMS[fid]; const base = BASE_FIELD[key] || fm.fieldMap[key];
  if (!base) return null;
  return Object.assign({}, base, { label: (fm.labels && fm.labels[key]) || base.label });
}
/** คอลัมน์ของ Sheet chk_<form> (ตรงกับ build.py / Code.gs) */
function sheetKeys(fid) {
  const fm = FORMS[fid]; const keys = ['record_id', ...fm.fields.map(f => f.key)];
  fm.items.forEach(it => {
    if (it.kind !== 'text') keys.push(it.key, it.key + '_note');
    if (it.opts) keys.push(it.key + '_opts');
    if (it.textField || it.kind === 'text') keys.push(it.key + '_text');
  });
  return keys;
}
function isVisible(fid, key, rec) {
  const f = fieldDef(fid, key); if (!f || !f.showIf) return true;
  return Object.entries(f.showIf).every(([k, vals]) => { const v = String(rec[k] || ''); return vals.some(x => v.split('|').includes(x)); });
}
function computeScores(rec) {
  const fm = FORMS[rec.form_type]; if (!fm) return rec;
  let p = 0, f = 0, na = 0, b = 0;
  fm.resultItems.forEach(it => { const v = rec[it.key]; if (v === 'Y') p++; else if (v === 'N') f++; else if (v === 'NA') na++; else b++; });
  Object.assign(rec, { score_total_items: p + f + na + b, score_pass: p, score_fail: f, score_na: na, score_blank: b,
    score_compliance_pct: (p + f) ? Math.round(p * 1000 / (p + f)) / 10 : '', overall_result: b ? 'incomplete' : (f ? 'fail' : 'pass') });
  return rec;
}
/**
 * ตรวจสอบข้อมูล (ฝั่งหน้าเว็บ) — ช่องบังคับ ชนิดข้อมูล ช่วงค่า รูปแบบ และความครบถ้วนของผลการตรวจ
 * @returns [{key, msg, where:'header'|'final'|'item'}]
 */
function validateRecord(rec, { full = true, keys } = {}) {
  const fm = FORMS[rec.form_type]; const errs = [];
  if (!fm) return [{ key: 'form_type', msg: 'ไม่พบประเภทแบบบันทึก', where: 'header' }];
  const check = (key, where) => {
    const f = fieldDef(rec.form_type, key); if (!f || !isVisible(rec.form_type, key, rec)) return;
    const v = rec[key]; const s = v == null ? '' : String(v).trim();
    if (!s) { if (f.required) errs.push({ key, msg: 'กรุณากรอก ' + f.label, where }); return; }
    if (f.maxlength && s.length > f.maxlength) errs.push({ key, msg: `ยาวเกิน ${f.maxlength} ตัวอักษร`, where });
    if (f.type === 'number' || f.type === 'year') {
      if (!/^\d+(\.\d+)?$/.test(s)) errs.push({ key, msg: 'ต้องเป็นตัวเลข 0 ขึ้นไป', where });
      else {
        if (f.min != null && +s < f.min) errs.push({ key, msg: `ต้องไม่น้อยกว่า ${f.min}`, where });
        if (f.max != null && +s > f.max) errs.push({ key, msg: `ต้องไม่เกิน ${f.max}`, where });
        if (f.lte && rec[f.lte] !== '' && rec[f.lte] != null && +s > +rec[f.lte]) errs.push({ key, msg: `ต้องไม่มากกว่า "${fieldDef(rec.form_type, f.lte).label}"`, where });
      }
    }
    if (f.type === 'date') {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s) || isNaN(new Date(s + 'T00:00:00'))) errs.push({ key, msg: 'วันที่ไม่ถูกต้อง', where });
      else if ((key === 'inspection_date' || key === 'survey_date' || key === 'application_date') && s > todayISO()) errs.push({ key, msg: 'ต้องไม่เป็นวันในอนาคต', where });
    }
    if (f.pattern && !(new RegExp(f.pattern)).test(s)) errs.push({ key, msg: key === 'phone' ? 'รูปแบบหมายเลขโทรศัพท์ไม่ถูกต้อง' : key === 'addr_postcode' ? 'รหัสไปรษณีย์ต้องเป็นตัวเลข 5 หลัก' : 'รูปแบบไม่ถูกต้อง', where });
    if ((f.type === 'radio' || f.type === 'select') && f.options && !f.options.includes(s)) errs.push({ key, msg: 'ค่าไม่อยู่ในตัวเลือก', where });
    if (f.type === 'signature' && !/^data:image\/(png|jpeg);base64,/.test(s)) errs.push({ key, msg: 'ลายเซ็นไม่ถูกต้อง กรุณาเซ็นใหม่', where });
  };
  (keys || fm.headerKeys).forEach(k => check(k, 'header'));
  if (!keys) fm.finalKeys.forEach(k => check(k, 'final'));
  if (!keys && rec.sign_date && rec.inspection_date && rec.sign_date < rec.inspection_date) errs.push({ key: 'sign_date', msg: 'วันที่ลงนามต้องไม่ก่อนวันที่ตรวจ', where: 'final' });
  if (full && !keys) fm.resultItems.forEach(it => {
    const v = rec[it.key];
    if (!v) errs.push({ key: it.key, msg: `ยังไม่บันทึกผล ข้อ ${it.no || ''}`, where: 'item' });
    else if (!['Y', 'N', 'NA'].includes(v)) errs.push({ key: it.key, msg: 'ผลการตรวจไม่ถูกต้อง', where: 'item' });
  });
  return errs;
}
/** ตัดข้อมูลส่วนบุคคล/ข้อความอิสระออก — ใช้สำหรับ Dashboard สาธารณะ (ตรงกับ Code.gs publicRows_) */
function publicize(rec) {
  const fm = FORMS[rec.form_type]; if (!fm) return null;
  const o = {}; PUBLIC_FIELDS.forEach(k => o[k] = rec[k]);
  fm.items.forEach(it => { if (it.kind !== 'text') o[it.key] = rec[it.key] || ''; if (it.opts) o[it.key + '_opts'] = rec[it.key + '_opts'] || ''; });
  fm.fields.forEach(f => { if (!f.pii && ['number', 'multi', 'radio'].includes(f.type)) o[f.key] = rec[f.key]; });
  return o;
}
/** ทำความสะอาดข้อมูลก่อนบันทึก: ตัดแท็ก HTML / อักขระควบคุม */
function cleanRecord(rec) {
  const o = {};
  Object.keys(rec).forEach(k => {
    let v = rec[k];
    if (typeof v === 'string') v = v.replace(/<[^>]*>/g, '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '').trim();
    o[k] = v;
  });
  return o;
}
