<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจมาตรฐานสถานพยาบาล</title>
<meta name="description" content="ระบบบันทึก ประมวลผล และแสดงผลการตรวจมาตรฐานสถานพยาบาลประเภทคลินิก (เฝ้าระวัง) 10 แบบบันทึก">
<meta name="theme-color" content="#1d3a7a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
/* =====================================================================
   1) DESIGN TOKENS — สี/ระยะ/เงา (ปรับโทนสีหลักได้ที่ CONFIG.THEME ใน <script>)
   ===================================================================== */
:root{
  color-scheme: light;
  --brand:#0A6E5C; --brand-2:#2a78d6; --brand-ink:#ffffff; --brand-soft:color-mix(in srgb, var(--brand) 11%, transparent);
  --page:#eef2f1; --page-2:#e6eeec;
  --surface:#fcfcfb; --surface-2:#f4f6f5; --surface-3:#eaeeec;
  --glass:rgba(252,252,251,.72); --glass-line:rgba(255,255,255,.6);
  --line:#e1e0d9; --line-2:#c3c2b7;
  --text:#0b0b0b; --text-2:#52514e; --muted:#76746e;
  --good:#0ca30c; --good-ink:#006300; --good-soft:rgba(12,163,12,.12);
  --bad:#d03b3b; --bad-ink:#b42727; --bad-soft:rgba(208,59,59,.11);
  --warn:#fab219; --warn-ink:#7a5200; --warn-soft:rgba(250,178,25,.16);
  --na:#898781; --na-soft:rgba(137,135,129,.14);
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
  --seq-1:#cde2fb; --seq-2:#86b6ef; --seq-3:#3987e5; --seq-4:#256abf; --seq-5:#184f95;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --neu: 8px 8px 22px rgba(20,40,34,.08), -8px -8px 22px rgba(255,255,255,.85);
  --neu-in: inset 3px 3px 8px rgba(20,40,34,.08), inset -3px -3px 8px rgba(255,255,255,.9);
  --lift: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.07);
  --r-lg:22px; --r:16px; --r-sm:12px; --r-xs:9px;
  --font:"IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --brand-soft:color-mix(in srgb, var(--brand) 16%, transparent);
    --page:#0d0d0d; --page-2:#121413;
    --surface:#1a1a19; --surface-2:#222221; --surface-3:#2a2a28;
    --glass:rgba(26,26,25,.72); --glass-line:rgba(255,255,255,.06);
    --line:#2c2c2a; --line-2:#383835;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#9a988f;
    --good-ink:#2fc22f; --good-soft:rgba(12,163,12,.20);
    --bad-ink:#f07a7a; --bad-soft:rgba(208,59,59,.20);
    --warn-ink:#fab219; --warn-soft:rgba(250,178,25,.16);
    --na-soft:rgba(137,135,129,.22);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --seq-1:#104281; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#86b6ef;
    --grid:#2c2c2a; --axis:#383835;
    --neu: 8px 8px 22px rgba(0,0,0,.45), -6px -6px 18px rgba(255,255,255,.025);
    --neu-in: inset 3px 3px 8px rgba(0,0,0,.5), inset -3px -3px 8px rgba(255,255,255,.03);
    --lift: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --brand-soft:color-mix(in srgb, var(--brand) 16%, transparent);
  --page:#0d0d0d; --page-2:#121413;
  --surface:#1a1a19; --surface-2:#222221; --surface-3:#2a2a28;
  --glass:rgba(26,26,25,.72); --glass-line:rgba(255,255,255,.06);
  --line:#2c2c2a; --line-2:#383835;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#9a988f;
  --good-ink:#2fc22f; --good-soft:rgba(12,163,12,.20);
  --bad-ink:#f07a7a; --bad-soft:rgba(208,59,59,.20);
  --warn-ink:#fab219; --warn-soft:rgba(250,178,25,.16);
  --na-soft:rgba(137,135,129,.22);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --seq-1:#104281; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#86b6ef;
  --grid:#2c2c2a; --axis:#383835;
  --neu: 8px 8px 22px rgba(0,0,0,.45), -6px -6px 18px rgba(255,255,255,.025);
  --neu-in: inset 3px 3px 8px rgba(0,0,0,.5), inset -3px -3px 8px rgba(255,255,255,.03);
  --lift: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

/* =====================================================================
   2) BASE
   ===================================================================== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15.5px;line-height:1.6;color:var(--text);
  background:var(--page);
  background-image:radial-gradient(1200px 600px at 100% -10%, var(--brand-soft), transparent 60%),
                   radial-gradient(900px 500px at -10% 10%, rgba(42,120,214,.07), transparent 60%);
  background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{line-height:1.3;margin:0 0 .4em;font-weight:600;letter-spacing:-.005em}
h1{font-size:1.55rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0 0 .6em}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb, var(--brand) 55%, transparent);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* =====================================================================
   3) APP BAR (glass)
   ===================================================================== */
.appbar{position:sticky;top:0;z-index:40;backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);
  background:var(--glass);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--brand-ink);
  background:linear-gradient(145deg, var(--brand), color-mix(in srgb, var(--brand) 60%, var(--brand-2)));box-shadow:0 6px 16px color-mix(in srgb, var(--brand) 35%, transparent)}
.logo.has-img{background:#fff;box-shadow:0 4px 14px rgba(24,39,80,.18);border:1px solid var(--line);padding:3px}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.doc-logo{width:54px;height:62px;flex:none}
.doc-logo img{width:100%;height:100%;object-fit:contain}
.logo svg{width:24px;height:24px}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t span{display:block;font-size:.78rem;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:4px;margin-left:auto;background:var(--surface-2);padding:4px;border-radius:14px;box-shadow:var(--neu-in)}
.nav a{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:11px;text-decoration:none;color:var(--text-2);font-weight:500;font-size:.93rem;white-space:nowrap}
.nav a[aria-current="page"]{background:var(--surface);color:var(--brand);box-shadow:var(--lift)}
.bar-tools{display:flex;align-items:center;gap:8px}
.chip-mode{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn-ink);white-space:nowrap}
.chip-mode.live{background:var(--good-soft);color:var(--good-ink)}
.chip-mode.off{background:var(--bad-soft);color:var(--bad-ink)}
.chip-mode .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--text-2)}
.icon-btn:hover{color:var(--brand)}
@media (max-width:900px){
  /* backdrop-filter ทำให้ position:fixed ของเมนูล่างอิงกับ appbar — ปิดบนจอเล็ก */
  .appbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface)}
  .brand-t span{display:none}
  .nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));margin:0;justify-content:space-around;z-index:45;
       background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--lift)}
  .nav a{flex:1;justify-content:center;flex-direction:column;gap:2px;font-size:.74rem;padding:6px 4px}
  body{padding-bottom:84px}
  .chip-mode .lbl{display:none}
}

/* =====================================================================
   4) LAYOUT & SURFACES
   ===================================================================== */
main{max-width:1240px;margin:0 auto;padding:22px 16px 48px}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin:6px 0 20px}
.hero h1{margin:0}
.hero p{margin:4px 0 0;color:var(--text-2)}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--brand);text-transform:uppercase}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--neu);border:1px solid var(--glass-line);padding:20px}
.card + .card{margin-top:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:860px){.g2,.g3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:13px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-weight:600;font-size:.93rem;white-space:nowrap;text-decoration:none;transition:transform .08s, box-shadow .15s, background .15s}
.btn:hover{box-shadow:var(--lift)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn.primary{background:var(--brand);border-color:transparent;color:var(--brand-ink);box-shadow:0 6px 18px color-mix(in srgb, var(--brand) 32%, transparent)}
.btn.tonal{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.85rem;border-radius:10px}
.btn .spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.field > .lbl{font-weight:500;font-size:.92rem;color:var(--text-2)}
.req{color:var(--bad-ink);margin-left:3px}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:10px 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);
  box-shadow:var(--neu-in);outline:none;transition:border-color .15s, background .15s}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{border-color:var(--brand);background:var(--surface)}
.field.err .inp{border-color:var(--bad)}
.ferr{font-size:.82rem;color:var(--bad-ink);display:none}
.field.err .ferr{display:block}
.help{font-size:.8rem;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 16px}
.fgrid > .field{grid-column:span 6}
.fgrid > .field.half{grid-column:span 3}
.fgrid > .field.third{grid-column:span 2}
@media (max-width:700px){.fgrid > .field.half,.fgrid > .field.third{grid-column:span 6}}
@media (min-width:701px) and (max-width:980px){.fgrid > .field.third{grid-column:span 3}}

/* option chips (radio / multi) */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:.92rem;line-height:1.35;text-align:left}
.opt::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);flex:none;background:var(--surface)}
.opt.multi::before{border-radius:5px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--text)}
.opt[aria-pressed="true"]::before{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px var(--surface)}

/* =====================================================================
   5) FORM LANDING & WIZARD
   ===================================================================== */
.forms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.fcard{position:relative;display:flex;flex-direction:column;gap:12px;text-align:left;padding:18px;border-radius:var(--r-lg);border:1px solid var(--glass-line);
  background:var(--surface);box-shadow:var(--neu);transition:transform .15s, box-shadow .2s}
.fcard:hover{transform:translateY(-3px);box-shadow:var(--lift), var(--neu)}
.fcard .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;background:var(--c)}
.fcard .ic svg{width:26px;height:26px}
.fcard b{font-size:1.02rem;line-height:1.4}
.fcard .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--text-2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--surface-3);font-size:.78rem;font-weight:500;color:var(--text-2);white-space:nowrap}
.pill.draft{background:var(--warn-soft);color:var(--warn-ink)}
.pill.good{background:var(--good-soft);color:var(--good-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}
.pill.info{background:var(--brand-soft);color:var(--brand)}

.wiz-top{position:sticky;top:63px;z-index:30;margin:0 -16px 16px;padding:10px 16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
@media (max-width:900px){.wiz-top{top:63px}}
.wiz-title{display:flex;align-items:center;gap:12px}
.wiz-title .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}
.wiz-title .ic svg{width:21px;height:21px}
.wiz-title h1{font-size:1.08rem;margin:0}
.progress{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;box-shadow:var(--neu-in)}
.progress > i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand),color-mix(in srgb, var(--brand) 55%, var(--brand-2)));transition:width .3s}
.steps{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:thin}
.step{flex:none;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;color:var(--text-2);max-width:260px}
.step span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-size:.72rem;font-weight:700;flex:none}
.step.done .n{background:var(--good);color:#fff}
.step[aria-current="step"]{border-color:var(--brand);color:var(--text);background:var(--brand-soft)}
.step[aria-current="step"] .n{background:var(--brand);color:#fff}
.wiz-foot{position:sticky;bottom:0;z-index:20;margin:18px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:900px){.wiz-foot{bottom:74px;border:1px solid var(--line);border-radius:16px;margin:18px 0 0}}
.instr{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--brand-soft);color:var(--text);font-size:.9rem;margin-bottom:14px}
.sec-h{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap;margin:4px 0 12px}
.sec-h h2{font-size:1.12rem;margin:0}
.sec-h .grp{font-size:.8rem;color:var(--brand);font-weight:600}
.cond-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-sm);border:1px dashed var(--line-2);background:var(--surface-2);margin:0 0 10px;font-size:.88rem}
.cond-bar b{font-weight:600}

/* checklist item */
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);margin-bottom:10px;scroll-margin-top:190px;transition:border-color .2s, background .2s}
.q.ans-Y{border-color:color-mix(in srgb, var(--good) 45%, var(--line))}
.q.ans-N{border-color:color-mix(in srgb, var(--bad) 55%, var(--line));background:color-mix(in srgb, var(--bad) 4%, var(--surface))}
.q.ans-NA{background:var(--surface-2)}
.q.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px color-mix(in srgb, var(--brand) 40%, transparent)}100%{box-shadow:none}}
.q-body{min-width:0}
.q-no{display:inline-block;font-size:.76rem;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:1px 8px;border-radius:7px;margin-bottom:4px}
.q-text{white-space:pre-line;font-size:.95rem}
.q-text .ctx{display:block;color:var(--text-2);font-size:.86rem}
.q-hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.seg{display:inline-flex;align-self:start;border-radius:13px;background:var(--surface-2);box-shadow:var(--neu-in);padding:3px;gap:3px}
.seg button{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border:0;border-radius:10px;background:transparent;color:var(--text-2);font-weight:600;font-size:.86rem;white-space:nowrap}
.seg button .sym{font-size:1.05rem;line-height:1}
.seg button[aria-pressed="true"][data-v="Y"]{background:var(--good);color:#fff}
.seg button[aria-pressed="true"][data-v="N"]{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="NA"]{background:var(--na);color:#fff}
.q-extra{grid-column:1 / -1;display:flex;flex-direction:column;gap:8px}
.q-extra .opts .opt{font-size:.85rem;padding:7px 11px}
.note-toggle{align-self:flex-start;border:0;background:none;color:var(--text-2);font-size:.84rem;padding:2px 0;display:inline-flex;gap:6px;align-items:center}
@media (max-width:640px){
  .wiz-foot{flex-wrap:nowrap;gap:6px;padding:8px 10px} .wiz-foot .lm{display:none} .wiz-foot .btn{padding:8px 11px}
  .q{grid-template-columns:1fr}
  .seg{width:100%}
  .seg button{flex:1;justify-content:center;padding:6px 4px}
  .seg button .w{display:none}
}

/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{padding:16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--neu);border:1px solid var(--glass-line);text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
button.tile{cursor:pointer;transition:transform .12s}
button.tile:hover{transform:translateY(-2px)}
.tile .k{font-size:.84rem;color:var(--text-2);display:flex;gap:6px;align-items:center}
.tile .v{font-size:1.9rem;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.tile .s{font-size:.8rem;color:var(--muted)}
.tile .bar{height:6px;border-radius:9px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.tile .bar i{display:block;height:100%;background:var(--brand)}
.mark{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font-weight:700;font-size:.85rem;color:#fff}
.mark.Y{background:var(--good)} .mark.N{background:var(--bad)} .mark.NA{background:var(--na)} .mark.B{background:var(--surface-3);color:var(--text-2)}

.list-jump{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.list-jump button{display:flex;gap:10px;text-align:left;align-items:flex-start;padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:.88rem}
.ack{padding:14px;border-radius:var(--r);background:var(--surface-2);font-size:.88rem;color:var(--text-2);border:1px solid var(--line)}

/* =====================================================================
   6) DASHBOARD
   ===================================================================== */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px;border-radius:var(--r-lg);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);margin-bottom:18px}
.filters .field{min-width:150px;flex:1}
.filters .field.date{min-width:140px;max-width:170px}
.filters .inp{min-height:40px;padding:8px 11px}
.updated{font-size:.8rem;color:var(--text-2);display:flex;gap:6px;align-items:center}
.charts{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:16px}
.charts > .card{grid-column:span 6;margin:0}
.charts > .card.w12{grid-column:span 12}
.charts > .card.w4{grid-column:span 4}
.charts > .card.w8{grid-column:span 8}
@media (max-width:980px){.charts > .card,.charts > .card.w4,.charts > .card.w8{grid-column:span 12}}
.chart-box{position:relative;height:280px}
.chart-box.tall{height:360px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--text-2);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.prog-list{display:flex;flex-direction:column;gap:10px}
.prog{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center;font-size:.88rem;cursor:default}
.prog .pb{grid-column:1 / -1;height:8px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.prog .pb i{display:block;height:100%;border-radius:9px;background:var(--seq-4)}
.prog .pv{text-align:right;font-weight:600}
.insights{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.insights li{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r-sm);background:var(--surface-2);font-size:.92rem}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}

/* tables */
.tbl-wrap{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{position:sticky;top:0;background:var(--surface-2);font-weight:600;color:var(--text-2);white-space:nowrap;z-index:1}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort::after{content:"↕";opacity:.35;margin-left:6px;font-size:.8em}
.tbl th.sort.asc::after{content:"↑";opacity:1} .tbl th.sort.desc::after{content:"↓";opacity:1}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.click{cursor:pointer}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .clip{max-width:520px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 0 0;flex-wrap:wrap}

/* =====================================================================
   7) MODAL / TOAST / ADMIN
   ===================================================================== */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(10,14,13,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 30px 80px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.sm{width:min(480px,100%)}
.modal-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:1.08rem}
.modal-b{padding:18px 20px}
.modal-f{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px;background:var(--surface);border-top:1px solid var(--line)}
.toasts{position:fixed;z-index:90;right:16px;top:76px;display:flex;flex-direction:column;gap:10px;max-width:min(420px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:14px;background:var(--surface);box-shadow:var(--lift);border:1px solid var(--line);border-left:5px solid var(--brand);font-size:.92rem;animation:slide .2s}
.toast.ok{border-left-color:var(--good)} .toast.err{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
@keyframes slide{from{transform:translateY(-8px);opacity:0}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:12px;font-weight:600;color:var(--text-2);display:inline-flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--brand);border-color:transparent;color:var(--brand-ink)}
.login-wrap{min-height:60vh;display:grid;place-items:center}
.login{width:min(420px,100%)}
.kv{display:grid;grid-template-columns:minmax(140px,240px) minmax(0,1fr);gap:6px 16px;font-size:.9rem}
.kv dt{color:var(--text-2)} .kv dd{margin:0;word-break:break-word}
@media (max-width:600px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-sm);font-size:.9rem;align-items:flex-start}
.alert.warn{background:var(--warn-soft);color:var(--text)}
.alert.err{background:var(--bad-soft)}
.alert.ok{background:var(--good-soft)}
.alert.info{background:var(--brand-soft)}
.doc h3{margin:18px 0 8px;font-size:1rem;color:var(--brand)}
.doc table.tbl td.c{text-align:center;width:42px}
.doc .rule{height:1px;background:var(--line);margin:14px 0}

/* ---------- ช่องลายเซ็น ---------- */
.sigbox{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:64px;padding:8px 10px;border-radius:var(--r-sm);border:1px dashed var(--line-2);background:var(--surface-2)}
.sigbox img{height:52px;max-width:220px;object-fit:contain;background:#fff;border-radius:8px;padding:2px 6px}
.sigpad{position:relative;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--neu-in);overflow:hidden}
.sigpad canvas{display:block;touch-action:none;cursor:crosshair}
.sigpad .sigline{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:1.5px dashed #b9b8b0;pointer-events:none}
.sigpad .sigx{position:absolute;left:5%;bottom:calc(28% + 4px);color:#9a988f;font-size:18px;pointer-events:none}

/* =====================================================================
   แบบฟอร์มสำหรับ PDF / พิมพ์ — จัดรูปแบบเหมือนแบบบันทึกต้นฉบับ (ฟอนต์ Sarabun)
   ===================================================================== */
.pf{font-family:"Sarabun","TH Sarabun New",var(--font);color:#000;background:#fff;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.pf *{color:#000}
.pf .val,.pf .pf-fill,.pf .pf-block{color:#12306b}
.pf .pf-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:12.5px;margin-bottom:4px}
.pf .pf-org{display:flex;align-items:center;gap:8px}
.pf .pf-org img{width:34px;height:40px;object-fit:contain}
.pf h1{font-size:18px;text-align:center;margin:2px 0;font-weight:700;line-height:1.4}
.pf .pf-sub{text-align:center;margin:0 0 6px}
.pf h2{font-size:15.5px;font-weight:700;margin:12px 0 4px}
.pf .pf-q{margin:5px 0 1px}
.pf .pf-line{display:flex;align-items:flex-end;gap:6px;margin:3px 0;break-inside:avoid}
.pf .pf-lab{flex:none;max-width:62%}
.pf .pf-fill{flex:1;min-width:50px;border-bottom:1px dotted #000;padding:0 4px;min-height:1.55em;font-weight:500;word-break:break-word}
.pf .pf-fill.sm{flex:none;display:inline-block;min-width:46px;text-align:center}
.pf .pf-fill.md{flex:none;display:inline-block;min-width:180px}
.pf .pf-fill.nm{flex:none;display:inline-block;min-width:190px;text-align:center}
.pf .pf-inline{display:flex;flex-wrap:wrap;column-gap:14px}
.pf .pf-inline > .pf-line{flex:1 1 200px}
.pf .pf-choices{display:flex;flex-wrap:wrap;gap:2px 22px;margin:2px 0 4px 18px}
.pf .pf-box{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border:1px solid #000;font-size:12px;line-height:1;margin-right:6px;vertical-align:-2px;font-weight:700;flex:none;color:#12306b}
.pf .pf-note{font-size:12.5px}
.pf table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13.5px}
.pf th,.pf td{border:1px solid #000;padding:3px 6px;vertical-align:top}
.pf thead{display:table-header-group}
.pf thead th{text-align:center;font-weight:700;background:#fff}
.pf td.c{text-align:center;vertical-align:middle;width:56px;font-size:17px;font-weight:700;color:#12306b}
.pf td.nt{width:23%;font-size:12.5px}
.pf tr{break-inside:avoid;page-break-inside:avoid}
.pf .ln{display:block}
.pf .pf-opts{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin:3px 0 2px;font-size:12.5px}
.pf .pf-opts span{display:flex;align-items:flex-start}
.pf .pf-opts .pf-box{margin-top:3px}
.pf .pf-chk{display:flex;gap:8px;margin:3px 0;break-inside:avoid}
.pf .pf-chk .pf-box{margin-top:4px}
.pf .pf-sec{font-weight:700;margin:8px 0 2px}
.pf .pf-block{border-bottom:1px dotted #000;min-height:4.8em;white-space:pre-line;padding:0 4px;background:repeating-linear-gradient(transparent,transparent 1.5em,rgba(0,0,0,.35) 1.5em,rgba(0,0,0,.35) calc(1.5em + 1px));line-height:1.55em}
.pf .pf-sigs{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-top:14px}
.pf .pf-sign{text-align:center;break-inside:avoid;page-break-inside:avoid}
.pf .pf-sign .s{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.pf .pf-sigimg{display:inline-flex;align-items:flex-end;justify-content:center;min-width:160px;height:48px;border-bottom:1px dotted #000}
.pf .pf-sigimg img{max-height:56px;max-width:180px;margin-bottom:-8px}
.pf .pf-ack{margin-top:16px;text-indent:2.5em;break-inside:avoid}
.pf .pf-fsign{width:min(520px,100%);margin:10px 0 0 auto;break-inside:avoid}
.pf .pf-fsign .pf-sign{text-align:left;margin-top:8px}
.pf .pf-fsign .pf-sign .s{justify-content:flex-start}
.pf .pf-foot{margin-top:16px;font-size:10.5px;color:#555;border-top:1px solid #bbb;padding-top:4px}
.pf .pf-foot *{color:#555}
.pf-break{page-break-before:always;break-before:page}

/* =====================================================================
   8) PRINT (บันทึกเป็น PDF ผ่านเมนูพิมพ์ของเบราว์เซอร์)
   ===================================================================== */
#print-root{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff!important;color:#000;font-size:11.5pt;padding:0}
  .appbar,.nav,.wiz-foot,.wiz-top .steps,.toasts,.filters,.no-print,.scrim{display:none!important}
  .card,.tile{box-shadow:none!important;border:1px solid #ccc!important;break-inside:avoid}
  main{max-width:none;padding:0}
  body.printing > *:not(#print-root){display:none!important}
  body.printing #print-root{display:block}
  .tbl th{position:static;background:#eee!important}
  .tbl th,.tbl td{border:1px solid #bbb;padding:4px 6px}
  .mark{color:#000!important;background:none!important;border:1px solid #000}
  .charts > .card{grid-column:span 12}
}
</style>

:"s2"},{"key":"med_q006","no":"1.2","text":"1.2 อาคารต้องมั่นคงแข็งแรง ไม่อยู่ในสภาพชำรุดหรือเสี่ยงต่ออันตรายจากการใช้สอย","section":"s2"},{"key":"med_q007","no":"1.3","text":"1.3 บริเวณทั้งภายนอกและภายในต้องสะอาด เป็นระเบียบเรียบร้อย จัดแบ่งพื้นที่ใช้สอยอย่างเหมาะสม และมีสิ่งอำนวยความสะดวกแก่ผู้ป่วย โดยมีลักษณะดังนี้","section":"s2"},{"key":"med_q008","no":"1.3.1","text":"1.3.1 มีพื้นที่โดยรวมไม่ต่ำกว่า 20 ตารางเมตร โดยส่วนแคบที่สุดต้องมีความกว้างไม่น้อยกว่า 3.00 เมตร","section":"s2"},{"key":"med_q009","no":"1.3.2","text":"1.3.2 มีส่วนที่นั่งพักคอยของผู้ป่วยและญาติที่เหมาะสม ไม่น้อยกว่า 5- 10 ที่นั่งและที่นั่งต้องมีพนักพิง","section":"s2"},{"key":"med_q010","no":"1.4","text":"1.4 การสัญจรและการเคลื่อนย้ายผู้ป่วยต้องกระทำได้โดยสะดวก โดยเฉพาะเมื่อเกิดภาวะฉุกเฉิน ขนาดความกว้างของประตู เข้า-ออก ไม่ต่ำกว่า 80 เซนติเมตร","section":"s2"},{"key":"med_q011","no":"1.5.1","text":"1.5 ห้องตรวจหรือห้องให้การรักษา\n1.5.1 ห้องตรวจหรือห้องให้การรักษากั้นเป็นสัดส่วนและมิดชิด มีประตู เปิด-ปิด อย่างชัดเจน","section":"s2"},{"key":"med_q012","no":"1.5.2","text":"1.5.2 ภายในห้องตรวจต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์ 1 เตียง","section":"s2"},{"key":"med_q013","no":"1.5.3","text":"1.5.3 อ่างฟอกมือชนิดไม่ใช้มือเปิด-ปิดน้ำ พร้อมมีสบู่เหลว ผ้าเช็ดมือหรือกระดาษเช็ดมือที่ใช้ครั้งเดียว","section":"s2"},{"key":"med_q014","no":"1.5.4","text":"1.5.4 ไม่มีวงจรปิดในห้องตรวจหรือห้องที่เกี่ยวกับการประกอบวิชาชีพหรือการประกอบโรคศิลปะ","section":"s2"},{"key":"med_q015","no":"1.6","text":"1.6 มีห้องน้ำห้องส้วมที่ถูกสุขลักษณะอย่างน้อยหนึ่งห้องหรือมีห้องน้ำส่วนรวมในกรณีอาคารศูนย์การค้าหรืออาคารสำนักงาน","section":"s2"},{"key":"med_q016","no":"1.7","text":"1.7 มีแสงสว่างและการระบายอากาศเพียงพอ ไม่มีกลิ่นอับทึบ (หากความสูงของสถานพยาบาลต่ำกว่า 2.6 เมตร ต้องเพิ่มพัดลมดูดอากาศที่เหมาะสม)","section":"s2"},{"key":"med_q017","no":"1.8.1","text":"1.8 มีระบบการเก็บและกำจัดมูลฝอยและสิ่งปฏิกูลที่เหมาะสม และมีการกำจัดอย่างเหมาะสม\n1.8.1 ทุกห้องตรวจและทุกห้องที่ให้การรักษาผู้ป่วย ต้องมีถังขยะทั่วไป–ถังขยะติดเชื้อ ที่มีลักษณะถังขยะแบบใช้เท้าเหยียบให้เปิด มีฝาปิดมิดชิด ถังขยะติดเชื้อใช้ถุงสีแดง เขียนข้อความ “ขยะติดเชื้อ”ไว้ที่ถังขยะ แยกต่างหากจากถังขยะทั่วไป ใช้ถุงสีดำ เขียนข้อความ “ขยะทั่วไป” ไว้ที่ถังขยะ วางคู่กันทุกห้อง","section":"s2"},{"key":"med_q018","no":"1.8.2","text":"1.8.2 มีสัญญา/หนังสือตอบรับการขนถ่ายขยะติดเชื้อ ของการจ้างบริษัทกำจัดขยะติดเชื้อ หรืออาจแสดงใบเสร็จรับเงินที่เป็นเดือนปัจจุบัน","section":"s2"},{"key":"med_q019","no":"1.9","text":"1.9 มีระบบควบคุมการติดเชื้อที่เหมาะสม (นอกเหนือจากพิจารณาในภาพรวมแล้ว ให้ตรวจสอบการทำความสะอาดและทำ ให้เครื่องมือปราศจากเชื้อ ในห้องบำบัดรักษาหรือในบริเวณ\nที่มีงานหัตถการด้วย)","section":"s2"},{"key":"med_q020","no":"1.9.1","text":"1.9.1 เครื่องมืออุปกรณ์และเวชภัณฑ์สำหรับควบคุมการติดเชื้อในกรณีที่จำเป็นต้องใช้ทำ เช่น Autoclave หม้อต้มเครื่องมือแพทย์ เครื่องนึ่ง","section":"s2"},{"key":"med_q021","no":"1.9.2","text":"1.9.2 แช่น้ำยาฆ่าเชื้อ","section":"s2"},{"key":"med_q022","no":"1.9.3","text":"1.9.3 ขั้นตอน/วิธีการทำให้เครื่องมือสะอาดปราศจากเชื้อและวิธีกำจัดของมีคม ติดในที่เปิดเผยภายในคลินิก","section":"s2"},{"key":"med_q023","no":"1.10.1","text":"1.10 กรณีมีบริการเอกซเรย์ ต้องมีความปลอดภัยทางรังสี ดังนี้\n1.10.1 ห้องเอกซเรย์ ประตูและผนังของห้องให้บริการต้องป้องกันอันตรายจากรังสีได้และมีอุปกรณ์ป้องกันอันตรายจากรังสีตามมาตรฐานของสํานักงานปรมาณูเพื่อสันติ","section":"s2","condHead":true,"cond":"med_g1"},{"key":"med_q024","no":"1.10.2","text":"1.10.2 ป้ายสัญลักษณ์แสดงเขตรังสี","section":"s2","cond":"med_g1"},{"key":"med_q025","no":"1.10.3","text":"1.10.3 ป้ายคำเตือนผู้ป่วยมีครรภ์ให้แจ้งเจ้าหน้าที่","section":"s2","cond":"med_g1"},{"key":"med_q026","no":"1.10.4 › 2)","text":"1.10.4 อุปกรณ์ป้องกันอันตรายจากรังสีสำหรับผู้ป่วย\n1) เสื้อตะกั่ว\n2) ฉากกั้นรังสี","section":"s2","cond":"med_g1"},{"key":"med_q027","no":"1.10.5","text":"1.10.5 ตู้ส่องฟิล์มหรือจอแสดงผลภาพถ่ายทางรังสีระบบดิจิทัล","section":"s2","cond":"med_g1"},{"key":"med_q028","no":"1.10.6","text":"1.10.6 มีหนังสือรับรองมาตรฐานจากกรมวิทยาศาสตร์\nการแพทย์และใบอนุญาตครอบครองรังสีจากสำนักงานปรมาณู\nเพื่อสันติ","section":"s2","cond":"med_g1"},{"key":"med_q029","no":"1.11.1","text":"1.11 มีเครื่องดับเพลิงขนาดเหมาะสม ตามที่กฎหมายท้องถิ่นบัญญัติ และอยู่ในสภาพพร้อมใช้งาน ติดตั้งในที่มองเห็นได้ชัดเจน\n1.11.1 ขนาดเครื่องดับเพลิงไม่ต่ำกว่า 10 ปอนด์","section":"s2"},{"key":"med_q030","no":"1.11.2","text":"1.11.2 มีเครื่องดับเพลิงติดตั้งทุกชั้น","section":"s2"},{"key":"med_q031","no":"1.11.3","text":"1.11.3 ติดตั้งเครื่องดับเพลิงส่วนบนสูงจากพื้นไม่เกิน 1.5 เมตร หรือวางกับพื้นมีฐานรองรับที่มั่นคง อยู่ในที่มองเห็นอย่างชัดเจน และควรมีป้ายแสดงจุดที่ตั้งถังดับเพลิง","section":"s2"},{"key":"med_q032","no":"1.12","text":"1.12 มีป้ายเครื่องหมายห้ามสูบบุหรี่","section":"s2"},{"key":"med_q033","no":"2.1","text":"2. คลินิกต้องมีลักษณะการให้บริการดังต่อไปนี้\n2.1 มีความปลอดภัย มีความสะดวก และเหมาะสมต่อ\nผู้ให้บริการและผู้รับบริการ","section":"s3"},{"key":"med_q034","no":"2.2","text":"2.2 มีการให้บริการที่ได้มาตรฐานตามลักษณะวิชาชีพ ตามที่สภาวิชาชีพหรือคณะกรรมการวิชาชีพประกาศกำหนด แล้วแต่กรณี","section":"s3"},{"key":"med_q035","no":"2.3","text":"2.3 พื้นที่ให้บริการจะต้องมีพื้นที่เชื่อมและเปิดติดต่อถึงกันได้และไม่ตั้งอยู่ในพื้นที่เดียวกับสถานที่ขายยาตามกฎหมายว่าด้วยยาหรือพื้นที่เดียวกับการประกอบอาชีพอื่น","section":"s3"},{"key":"med_q036","no":"2.4","text":"2.4 พื้นที่ให้บริการจะต้องไม่ตั้งอยู่ในสถานที่เดียวกับสถานพยาบาลของกระทรวง ทบวง กรม กรุงเทพมหานคร เมืองพัทยา องค์การบริการส่วนจังหวัด เทศบาล องค์การบริการส่วนตำบล องค์กรปกครองส่วนท้องถิ่นอื่น และสภากาชาดไทย ซึ่งให้บริการในลักษณะเดียวกัน","section":"s3"},{"key":"med_q037","no":"2.5","text":"2.5 ในกรณีที่มีการให้บริการในอาคารเดียวกับการประกอบกิจการอื่น จะต้องมีการแบ่งพื้นที่ให้ชัดเจน และกิจการอื่นต้องไม่กระทบกระเทือนต่อการประกอบวิชาชีพ รวมทั้งสามารถเคลื่อนย้ายผู้ป่วยฉุกเฉินได้สะดวก","section":"s3","condHead":true,"cond":"med_g2"},{"key":"med_q038","no":"2.5.1","text":"2.5.1 สถานพยาบาลต้องมีประตู เข้า-ออก คนละทางกับการประกอบกิจการอื่น","section":"s3","cond":"med_g2"},{"key":"med_q039","no":"2.5.2","text":"2.5.2 การกั้นพื้นที่ต้องเป็นสัดส่วน แสดงให้เห็นประจักษ์ ชัดเจนและถาวร","section":"s3","cond":"med_g2"},{"key":"med_q040","no":"2.6","text":"2.6 ในกรณีที่มีการให้บริการของลักษณะสหคลินิกหรือ มีคลินิกหลายลักษณะ อยู่ในอาคารเดียวกัน จะต้องมีการแบ่งสัดส่วนพื้นที่ให้ชัดเจน และแต่ละสัดส่วนต้องมีพื้นที่และลักษณะตามมาตรฐานของการให้บริการนั้น แต่ละสาขาต้องมีอย่างน้อย 1 ห้องตรวจโรค ซึ่งต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรค 1 เตียง ที่ได้มาตรฐานทางการแพทย์ และอ่างฟอกมือชนิดที่ไม่ใช้มือ เปิด-ปิดน้ำ สบู่","section":"s3"},{"key":"med_q041","no":"3.1.1","text":"3. การแสดงรายละเอียดเกี่ยวกับชื่อสถานพยาบาล ผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะในสถานพยาบาล อัตราค่ารักษาพยาบาล ค่าบริการและสิทธิผู้ป่วย\n3.1 มีป้ายชื่อสถานพยาบาล เป็นไปตามกฎกระทรวง\n3.1.1 ป้ายชื่อสถานพยาบาลต้องเป็นสี่เหลี่ยมผืนผ้า ขนาดความกว้างของป้ายไม่น้อยกว่า 40 เซนติเมตร ความยาวไม่น้อยกว่า 120 เซนติเมตร","section":"s4"},{"key":"med_q042","no":"3.1.2","text":"3.1.2 จัดทำแผ่นป้ายแสดงชื่อสถานพยาบาลที่เป็นภาษาไทยขนาดความสูงไม่ต่ำกว่า 10 เซนติเมตร ตัวหนังสือ สีเขียว สีพื้นป้ายสีขาว","section":"s4"},{"key":"med_q043","no":"3.1.3","text":"3.1.3 เลขที่ใบอนุญาตขนาดความสูงไม่ต่ำกว่า 5 เซนติเมตร ตัวเลขสีเขียว","section":"s4"},{"key":"med_q044","no":"3.2","text":"3.2 ติดตั้งป้ายชื่อสถานพยาบาลในตำแหน่งที่มองเห็นได้ชัดเจนจากภายนอกและเหมาะสม","section":"s4"},{"key":"med_q045","no":"3.3.1","text":"3.3 ชื่อสถานพยาบาลไม่มีข้อความลักษณะชักชวนโอ้อวดเกินจริงหรืออาจสื่อให้เข้าใจผิด\n3.3.1 คำนำหน้าชื่อหรือต่อท้ายของชื่อคลินิกต้องประกอบด้วยลักษณะคลินิก และลักษณะการให้บริการของคลินิก","section":"s4"},{"key":"med_q046","no":"3.3.2","text":"3.3.2 กรณีใช้ชื่อภาษาต่างประเทศด้วย ขนาดตัวอักษรต้องเล็กกว่าอักษรภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"med_q047","no":"3.3.3","text":"3.3.3 ชื่อคลินิกจะต้องไม่ใช้คำหรือข้อความที่มีลักษณะชักชวน โอ้อวดเกินความจริง หรืออาจทำให้เกิดความเข้าใจผิดในสาระสำคัญเกี่ยวกับการประกอบกิจการ","section":"s4"},{"key":"med_q048","no":"3.3.4","text":"3.3.4 ชื่อคลินิกต้องไม่สื่อความหมายหรืออ้างอิงสถาบันพระมหากษัตริย์ เว้นแต่ได้รับพระบรมราชานุญาต","section":"s4"},{"key":"med_q049","no":"3.3.5","text":"3.3.5 คลินิกที่ตั้งอยู่ในอำเภอหรือในเขตเดียวกัน จะต้องมีชื่อไม่ซ้ำกัน เว้นแต่ผู้ขอรับอนุญาตเป็นบุคคลเดียวกันหรือมีหนังสือยินยอมจากผู้ได้รับใบอนุญาตให้ประกอบกิจการคลินิกเดิม ให้ใช้ชื่อซ้ำกันได้ แต่ต้องมีตัวอักษรหรือหมายเลขเรียงลำดับหรือที่ตั้งสถานที่ต่อท้ายชื่อคลินิก","section":"s4"},{"key":"med_q050","no":"3.4","text":"3.4 มีข้อความแสดงวัน เวลา ให้บริการไว้โดยเปิดเผย มองเห็นได้ชัดเจนจากด้านนอกคลินิกและตรงกับเวลาที่ขอรับอนุญาตให้ประกอบกิจการสถานพยาบาล","section":"s4"},{"key":"med_q051","no":"3.5","text":"3.5 มีบริเวณที่ต้องแสดงใบอนุญาตให้ประกอบกิจการและดำเนินการในบริเวณที่เปิดเผย และเหมาะสม เช่น บริเวณที่นั่งพักคอยของผู้รับบริการ","section":"s4"},{"key":"med_q052","no":"3.6","text":"3.6 มีบริเวณที่ใช้แสดงหลักฐานการชำระค่าธรรมเนียมการประกอบกิจการสถานพยาบาล(แบบ ส.พ.12) ในที่เปิดเผยและเห็นได้ชัดเจนบริเวณทางเข้าสถานพยาบาล","section":"s4"},{"key":"med_q053","no":"3.7","text":"3.7 หน้าห้องตรวจมีบริเวณให้ติดป้ายแสดงชื่อ ภาพถ่าย และเลขที่ใบอนุญาตของผู้ประกอบวิชาชีพเวชกรรมที่ให้บริการ หากมีผู้ประกอบวิชาชีพ/ผู้ประกอบโรคศิลปะอื่นปฏิบัติงานให้ยื่น สพ.6 ทุกคนและแสดงป้ายนี้ไว้ในบริเวณที่เปิดเผยและเห็นได้ชัดเจน","section":"s4"},{"key":"med_q054","no":"3.8","text":"3.8 แสดงอัตราค่าบริการและค่ารักษาพยาบาลให้ครอบคลุมการบริการที่เรียกเก็บ โดยแสดงอัตราราคาต่อหน่วย และระบุข้อความด้วยอักษรภาษาไทย โดยแสดงไว้ในที่เปิดเผยให้ผู้รับบริการสามารถเห็นได้ง่าย โดยจัดทำเป็นแผ่นประกาศ แผ่นพับ เล่ม หรือแฟ้มเอกสาร หรือโปรแกรมคอมพิวเตอร์ แสดงให้ผู้ป่วยทราบ","section":"s4"},{"key":"med_q055","no":"3.9","text":"3.9 มีป้ายแสดงให้ผู้รับบริการทราบว่าสามารถสอบถามอัตราค่าบริการและค่ารักษาพยาบาลได้จากที่ใด ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 10 เซนติเมตร แสดงไว้ในที่เห็นได้ชัดเจน","section":"s4"},{"key":"med_q056","no":"3.10","text":"3.10 แสดงคำประกาศสิทธิผู้ป่วยไว้ในที่เปิดเผยและเห็นได้ง่ายอ่านได้ชัดเจน ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 1 เซนติเมตร บริเวณที่พักคอยของผู้รับบริการ","section":"s4"},{"key":"med_q057","no":"3.11","text":"3.11 ข้อความโฆษณาสถานพยาบาล (ถ้ามี) ไม่เป็นเท็จ ไม่โอ้อวด หรือสื่อให้เข้าใจผิดในสาระสำคัญ","section":"s4"},{"key":"med_q058","no":"4.1.1","text":"4.ชนิดและจำนวนเครื่องมือ เครื่องใช้ที่จำเป็นประจำสถานพยาบาล\n4.1 เวชระเบียน\n4.1.1 มีตู้หรือชั้นหรืออุปกรณ์เก็บเวชระเบียนที่มั่นคง ปลอดภัยและต้องจัดให้เป็นระเบียบสามารถค้นหาได้ง่าย","section":"s5"},{"key":"med_q059","no":"4.1.2","text":"4.1.2 มีการจัดเตรียมทะเบียนผู้ป่วย มีรายการดังต่อไปนี้","section":"s5"},{"key":"med_q060","no":"4.1.2 › 1)","text":"1) ชื่อ นามสกุล อายุ ของผู้ป่วย","section":"s5"},{"key":"med_q061","no":"4.1.2 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s5"},{"key":"med_q062","no":"4.1.2 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"med_q063","no":"4.1.3 › 1)","text":"4.1.3 มีเวชระเบียน หรือ บัตรผู้ป่วย ที่สามารถ บันทึกรายละเอียด ตามที่กฎกระทรวงกำหนด\n1) ชื่อและที่อยู่สถานพยาบาล","section":"s5"},{"key":"med_q064","no":"4.1.3 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s5"},{"key":"med_q065","no":"4.1.3 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"med_q066","no":"4.1.3 › 4)","text":"4) ชื่อ นามสกุล อายุ เพศ ที่อยู่ หมายเลขโทรศัพท์ (ถ้ามี) และข้อมูลส่วนบุคคลอื่น ๆ ของผู้ป่วย เช่น เชื้อชาติ สัญชาติ สถานภาพสมรส และเลขที่บัตรประจำตัวประชาชน เป็นต้น","section":"s5"},{"key":"med_q067","no":"4.1.3 › 5)","text":"5) อาการเจ็บป่วย การแพ้ยา ผลการตรวจทางร่างกายและผลการตรวจทางห้องปฏิบัติชันสูตรของผู้ป่วย","section":"s5"},{"key":"med_q068","no":"4.1.3 › 6)","text":"6) การวินิจฉัยโรค","section":"s5"},{"key":"med_q069","no":"4.1.3 › 7)","text":"7) การรักษา","section":"s5"},{"key":"med_q070","no":"4.1.3 › 8)","text":"8) ลายมือผู้ประกอบวิชาชีพเวชกรรมที่ให้การรักษาพยาบาล","section":"s5"},{"key":"med_q071","no":"4.2.1","text":"4.2 เครื่องใช้ทั่วไป ในห้องตรวจโรคทุกห้องต้องประกอบด้วย\n4.2.1 โต๊ะตรวจโรค พร้อมเก้าอี้","section":"s5"},{"key":"med_q072","no":"4.2.2","text":"4.2.2 เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์ พร้อมอุปกรณ์","section":"s5"},{"key":"med_q073","no":"4.2.2 › 1)","text":"1) มีขนาดที่ได้มาตรฐานทางการแพทย์ พื้นแข็งสามารถช่วยฟื้นคืนชีพ (CPR) ได้ตามหลักวิชาชีพ","section":"s5"},{"key":"med_q074","no":"4.2.2 › 2)","text":"2) ต้องมีบันไดขึ้นเตียง (Step) หากเตียงนั้นมีความสูง","section":"s5"},{"key":"med_q075","no":"4.2.2 › 3)","text":"3) มีปลอกหมอน ผ้าปูเตียง และผ้าคลุมตัวผู้ป่วย","section":"s5"},{"key":"med_q076","no":"4.3.1","text":"4.3 เครื่องมือ หรืออุปกรณ์ในการตรวจและวินิจฉัยโรค จะต้องมี\n4.3.1 หูฟัง (Stethoscope)","section":"s5"},{"key":"med_q077","no":"4.3.2","text":"4.3.2 เครื่องวัดความดันโลหิต (Sphygmomanometer)","section":"s5"},{"key":"med_q078","no":"4.3.3","text":"4.3.3 ปรอทวัดอุณหภูมิร่างกาย หรือ อุปกรณ์วัดอุณหภูมิ","section":"s5"},{"key":"med_q079","no":"4.3.4","text":"4.3.4 ไฟฉาย ไม้กดลิ้น","section":"s5"},{"key":"med_q080","no":"4.3.5","text":"4.3.5 เครื่องชั่งน้ำหนัก และอุปกรณ์วัดส่วนสูง","section":"s5"},{"key":"med_q081","no":"5.1","text":"5. ยา และเวชภัณฑ์ในสถานพยาบาล\n5.1 มียาและเวชภัณฑ์อื่นที่จำเป็น โดยมีจำนวน รายการและประมาณเพียงพอ ตามลักษณะสถานพยาบาล","section":"s6"},{"key":"med_q082","no":"5.2","text":"5.2 ไม่มียาที่หมดอายุหรือเสื่อมสภาพ (ให้ใช้ภาชนะบรรจุ ยาเดิมที่ได้มาจากแหล่งผลิตยานั้น)","section":"s6"},{"key":"med_q083","no":"5.3","text":"5.3 มีอุปกรณ์นับเม็ดยา อย่างน้อยสองชุด","section":"s6"},{"key":"med_q084","no":"5.4","text":"5.4 ภาชนะบรรจุยาหรือฉลากติดซองยาให้ระบุชื่อและที่อยู่สถานพยาบาล ชื่อ-สกุลผู้ป่วย ชื่อยา วิธีใช้ และต้องระบุวันที่ยาหมดอายุอย่างชัดเจน","section":"s6"},{"key":"med_q085","no":"5.5","text":"5.5 มีตู้หรือชั้นเก็บยาและเวชภัณฑ์เป็นสัดส่วน","section":"s6"},{"key":"med_q086","no":"5.6","text":"5.6 มีตู้เย็นสำหรับเก็บยาหรือเวชภัณฑ์อื่น กรณีที่มีวัคซีน หรือยาที่ต้องเก็บไว้ในอุณหภูมิต่ำ ตู้เย็นนั้น ต้องมีการควบคุมอุณหภูมิ มีปรอทวัดอุณหภูมิ และมีการบันทึกอุณหภูมิในตู้เย็น","section":"s6"},{"key":"med_q087","no":"5.7","text":"5.7 กรณีมียาเสพติดให้โทษ ให้มีสถานที่หรือตู้เก็บยาเสพติดให้โทษที่มั่นคงและปลอดภัย มีกุญแจปิดและเปิดอย่างมีประสิทธิภาพ","section":"s6"},{"key":"med_q088","no":"5.8","text":"5.8 ยาต้องมีทะเบียน เว้นแต่เป็นการผลิตตามใบสั่งยาของ\nผู้ประกอบวิชาชีพเวชกรรมที่สั่งให้สำหรับคนไข้เฉพาะรายของสถานพยาบาล กรณีการผลิตยาของสถานพยาบาลต้องมีมาตรฐานการผลิต การแสดงฉลากและวันหมดอายุให้ชัดเจน","section":"s6"},{"key":"med_q089","no":"6","text":"6. ชุดช่วยชีวิตฉุกเฉิน ประกอบด้วย","section":"s7"},{"key":"med_q090","no":"6.1","text":"6.1 ยา เวชภัณฑ์และเครื่องมือแพทย์อื่นที่สามารถให้การรักษาพยาบาลและช่วยชีวิตผู้ป่วยฉุกเฉินตามลักษณะสถานพยาบาล ในคลินิกเวชกรรม ยาจะต้องมีเพียงพอกับการให้บริการ มีฉลากที่ถูกต้องตามกฎหมายให้ตรวจสอบ และไม่มียาที่หมดอายุหรือเสื่อมสภาพ ต้องมีครบทุกรายการ ได้แก่","section":"s7"},{"key":"med_q091","no":"6.1 › 1)","text":"(๑) ยาฉีด Adrenaline ๑ : ๑๐๐๐","section":"s7"},{"key":"med_q092","no":"6.1 › 2)","text":"(๒)ยาฉีด Steroid injection เช่น Dexamethazone Injection หรือ Hydrocortizone","section":"s7"},{"key":"med_q093","no":"6.1 › 3)","text":"(๓) ยาฉีด Chlorphenilamine injection","section":"s7"},{"key":"med_q094","no":"6.1 › 4)","text":"(๔) ๕๐% Glucose injection","section":"s7"},{"key":"med_q095","no":"6.1 › 5)","text":"(๕) ยาอมใต้ลิ้นเพื่อขยายหลอดเลือดหัวใจ","section":"s7"},{"key":"med_q096","no":"6.1 › 6)","text":"(6) ถุงบีบลมเพื่อช่วยหายใจพร้อมหน้ากากครอบช่วย\nการหายใจตามลักษณะการให้บริการของสถานพยาบาล ๑ ชุด","section":"s7"},{"key":"med_q097","no":"6.1 › 7)","text":"(7) NSS ๑,๐๐๐ cc. พร้อมชุดให้สารน้ำทางหลอดเลือดดำ (set IV fluid) ๒ ชุด","section":"s7"},{"key":"med_q098","no":"6.1 › 2)","text":"(8) Medicut หรือเข็มแทงหลอดเลือดดำเพื่อให้น้ำเกลือ\n๒ ชุด","section":"s7"},{"key":"med_q099","no":"6.1 › 9)","text":"(9) Disposable Syringe ๕ หลอด","section":"s7"},{"key":"med_q100","no":"6.1 › 10)","text":"(10) เข็ม Disposable ๕ อัน","section":"s7"},{"key":"med_q101","no":"6.1 › 11)","text":"(11) เสาแขวนน้ำเกลือ (Stand) ที่เคลื่อนย้ายได้ ๑ อัน","section":"s7"},{"key":"med_q102","no":"6.1 › 12)","text":"(12) Oral Airway ๑ อัน","section":"s7"},{"key":"med_q103","no":"6.1 › 13)","text":"(13) Oxygen Tank พร้อมอุปกรณ์วัดปริมาณออกซิเจน","section":"s7"},{"key":"med_q104","no":"6.1 › 14)","text":"(14) ในกรณีคลินิกเวชกรรมที่มีห้องผ่าตัดใหญ่จะต้องมีเครื่องกระตุกหัวใจ (Defibrilator)","section":"s7"},{"key":"med_q105","no":"6.3 › 1)","text":"6.3 มีแผนการส่งต่อผู้ป่วย และการเตรียมความพร้อมในสถานการณ์ฉุกเฉิน\n(๑) มีเบอร์โทรศัพท์ฉุกเฉินติดต่อโรงพยาบาล","section":"s7"},{"key":"med_q106","no":"6.3 › 2)","text":"(๒) มีแผนและขั้นตอนการช่วยชีวิตเบื้องต้นที่ได้มาตรฐาน และขั้นตอนการส่งต่อผู้ป่วย","section":"s7"},{"key":"med_q107","no":"7.1","text":"7.ในกรณีมีห้องบำบัดรักษา (ห้อง Treatment) จะต้องมี\n7.1 เตียงสำหรับให้การรักษา","section":"s8"},{"key":"med_q108","no":"7.2","text":"7.2 ยา เวชภัณฑ์ และอุปกรณ์ สำหรับทำแผล ฉีดยา ปริมาณพอเพียง","section":"s8"},{"key":"med_q109","no":"7.3","text":"7.3 อุปกรณ์ เครื่องมือ เครื่องใช้ มีระบบควบคุมการทำ ความสะอาดและทำให้ปราศจากเชื้อที่เหมาะสม","section":"s8"},{"key":"med_q110","no":"7.4","text":"7.4 มีภาชนะใส่มูลฝอยติดเชื้อ (ใช้ถุงสีแดง เขียนข้อความ “ขยะติดเชื้อ”) แยกต่างหากจากภาชนะใส่มูลฝอยทั่วไป","section":"s8"},{"key":"med_q111","no":"8.1","text":"8. กรณีมีห้องตรวจภายใน (ห้อง PV) จะต้องมี\n8.1 ลักษณะเป็นสัดส่วนมิดชิด","section":"s9"},{"key":"med_q112","no":"8.2","text":"8.2 เตียงสำหรับตรวจภายใน","section":"s9"},{"key":"med_q113","no":"8.3","text":"8.3 ไฟส่องตรวจ","section":"s9"},{"key":"med_q114","no":"8.4","text":"8.4 อุปกรณ์การตรวจภายใน มีการทำความสะอาด และทำให้ปราศจากเชื้ออย่างเหมาะสม","section":"s9"},{"key":"med_q115","no":"8.5","text":"8.5 ผ้าปิดตา ผ้าคลุมตัวท่อนล่างป้องกันการเปิดเผยของผู้ป่วย","section":"s9"},{"key":"med_q116","no":"9.1","text":"9. กรณีมีห้องผ่าตัดเล็ก\n9.1 ขนาดพื้นที่ห้องผ่าตัดเล็กไม่น้อยกว่า 12 ตารางเมตร\nส่วนที่แคบที่สุด ไม่น้อยกว่า 3 เมตร ความสูงไม่น้อยกว่า 2.6 เมตร หากมีการตกแต่งฝ้าให้ต่ำลงมา ต้องมีความสูงที่วัดจากพื้นห้องถึงฝ้าไม่ต่ำกว่า 2.45 เมตร และมีพัดลมดูดอากาศ หรือระบบระบายอากาศที่เหมาะสม","section":"s10"},{"key":"med_q117","no":"9.2 › 1)","text":"9.2 อุปกรณ์ เครื่องมือแพทย์ ยาและเวชภัณฑ์\n(๑) หม้อนึ่งอบความดันที่มีประสิทธิภาพในการฆ่าเชื้อ (Autoclave)","section":"s10"},{"key":"med_q118","no":"9.2 › 2)","text":"(๒) ตู้เก็บอุปกรณ์/เครื่องมือที่ปราศจากเชื้อ (ให้แสดงรายละเอียดของอุปกรณ์/เครื่องมือที่ปราศจากเชื้อ เช่น ระบุวัน เดือน ปีที่นึ่ง/หรือเปลี่ยนน้ำยา/หรือวันผลิต/หรือวันหมดอายุ","section":"s10"},{"key":"med_q119","no":"9.2 › 3)","text":"(๓) ถังออกซิเจน","section":"s10"},{"key":"med_q120","no":"9.2 › 4)","text":"(๔) ถุงบีบลมพร้อมหน้ากากครอบช่วยการหายใจ (Ambubag)","section":"s10"},{"key":"med_q121","no":"9.2 › 5)","text":"(๕) ชุดเครื่องมือผ่าตัดทั่วไป","section":"s10"},{"key":"med_q122","no":"9.2 › 6)","text":"(๖) ยาและเวชภัณฑ์ฉุกเฉินต้องจัดให้มีในห้องผ่าตัด","section":"s10"},{"key":"med_q123","no":"9.2 › 7)","text":"(๗) เตียงและโคมไฟผ่าตัด (แบบตั้ง /ติดเตียง/ ติดผนัง)","section":"s10"},{"key":"med_q124","no":"9.2 › 8)","text":"(๘) จัดให้มีบริเวณ ดังต่อไปนี้\n(ก) อ่างฟอกมือที่ไม่ใช้มือเปิดปิดน้ำ สำหรับแพทย์ผู้ทำผ่าตัดและสำหรับผู้ป่วยเพื่อ ล้างทำความสะอาดส่วนที่ต้องการทำผ่าตัด\n(ข) บริเวณล้างเครื่องมือที่ใช้แล้ว\n(ค) บริเวณที่ทำความสะอาดเครื่องมือผ่าตัด ด้วยหม้อนึ่งอบความดันที่มีประสิทธิภาพในการฆ่าเชื้อ (Autoclave) พร้อมทั้งให้จัดทำคู่มือ หรือแผนภูมิแสดงขั้นตอนการทำความสะอาดและทำให้เครื่องมือปราศจากเชื้อ","section":"s10"},{"key":"med_q125","no":"10.1","text":"10. กรณีมีห้องผ่าตัดใหญ่\n10.1 ขนาดพื้นที่ห้องผ่าตัดใหญ่ไม่น้อยกว่า 20 ตารางเมตร ความสูงไม่น้อยกว่า 3 เมตร","section":"s11"},{"key":"med_q126","no":"10.2 › 1)","text":"10.2 พื้นที่ใช้สอยประกอบด้วย\nStaff Area\n๑) ห้องเก็บเสื้อผ้าและของใช้ส่วนตัว พื้นที่ (6 ตารางเมตร)\nส่วนที่แคบที่สุด ๒.๕ เมตร ความสูงพื้นถึงฝ้า ๒.๕ เมตร","section":"s11","hint":"1 และ 2 ร่วมกันได้"},{"key":"med_q127","no":"10.2 › 2)","text":"๒) ห้องเปลี่ยนเสื้อผ้า พื้นที่ (6 ตารางเมตร) ส่วนที่แคบที่สุด ๒ เมตร ความสูงพื้นถึงฝ้า ๒.๕ เมตร","section":"s11"},{"key":"med_q128","no":"10.2 › 3)","text":"บริเวณรับคนไข้\n3) Transfer Area พื้นที่ (9 ตารางเมตร) ส่วนที่แคบที่สุด ๒.๕ เมตร ความสูงพื้นถึงฝ้า 3 เมตร","section":"s11"},{"key":"med_q129","no":"10.2 › 4)","text":"Procedure Area\n4) บริเวณฟอกมือเจ้าหน้าที่ (อ่างฟอกมือชนิดที่ไม่ใช้มือเปิด-ปิดน้ำ)","section":"s11","hint":"ต้องไม่อยู่ในห้องผ่าตัด"},{"key":"med_q130","no":"10.2 › 5)","text":"๕) Operation Rooms พื้นที่ (20 ตารางเมตร) ส่วนที่แคบที่สุด 4 เมตร ความสูงพื้นถึงฝ้า 3 เมตร","section":"s11"},{"key":"med_q131","no":"10.2 › 6)","text":"๖) Recovery Rooms","section":"s11","hint":"๑.๕ เตียงต่อ ๑ ห้อง"},{"key":"med_q132","no":"10.2 › 1)","text":"10.2 อุปกรณ์ เครื่องมือแพทย์ ยาและเวชภัณฑ์ ห้องผ่าตัดใหญ่\n(๑) เตียงและโคมไฟผ่าตัดแบบมาตรฐาน ใช้ในการผ่าตัดประจำทุกห้องที่ใช้งานผ่าตัด","section":"s11"},{"key":"med_q133","no":"10.2 › 2)","text":"(๒) เครื่องดมยาสลบที่ได้มาตรฐานทางการแพทย์ และระบบแก๊สทางการแพทย์ซึ่งมีสัญญาณเตือนอันตรายทุกห้องที่ขออนุญาตใช้งาน","section":"s11"},{"key":"med_q134","no":"10.2 › 3)","text":"(๓) ถังออกซิเจน หรือ ออกซิเจนที่ส่งผ่านมาทางท่อส่งก๊าซ (Pipe line)","section":"s11"},{"key":"med_q135","no":"10.2 › 4)","text":"(๔) เครื่องดูดเสมหะ","section":"s11"},{"key":"med_q136","no":"10.2 › 5)","text":"(๕) ชุดอุปกรณ์ ยาและเวชภัณฑ์ในการช่วยฟื้นคืนชีพ ทุกห้อง","section":"s11"},{"key":"med_q137","no":"10.2 › 6)","text":"(๖) เครื่องมือผ่าตัดที่ได้มาตรฐานทางการแพทย์และเพียงพอสำหรับการผ่าตัดตามสาขาโรค","section":"s11"},{"key":"med_q138","no":"10.2 › 7)","text":"(๗) เครื่องกระตุกหัวใจด้วยไฟฟ้า (Defibrilator)","section":"s11"},{"key":"med_q139","no":"10.2 › 8)","text":"(๘) ถุงบีบลมพร้อมหน้ากากครอบช่วยการหายใจ (Ambubag)","section":"s11"},{"key":"med_q140","no":"10.2 › 9)","text":"(๙) Patient monitor ซึ่งสามารถ monitor ในเรื่อง คลื่นไฟฟ้าหัวใจ (EKG) ความดันโลหิต (Blood Pressure) ชีพจร (Pulse) และการวัดความอิ่มตัวออกซิเจนของฮีโมโกลบินจากชีพจร (Oxygen Saturation )","section":"s11"},{"key":"med_q141","no":"10.2 › 10)","text":"(๑๐) ชุดใส่ท่อหายใจ (ชุด Laryngoscope)","section":"s11"},{"key":"med_q142","no":"10.2 › 11)","text":"(๑๑) หม้อนึ่งอบความดันที่มีประสิทธิภาพในการฆ่าเชื้อ (Autoclave)","section":"s11"},{"key":"med_q143","no":"10.2 › 12)","text":"(๑๒) ตู้เก็บอุปกรณ์/เครื่องมือที่ปราศจากเชื้อ (ให้แสดงรายละเอียดของอุปกรณ์/เครื่องมือที่ปราศจากเชื้อ เช่น ระบุวัน เดือน ปีที่นึ่ง/หรือเปลี่ยนน้ำยา/หรือวันผลิต/หรือวันหมดอายุ)","section":"s11"},{"key":"med_q144","no":"10.2 › 13)","text":"(๑๓) ตู้เสื้อผ้าและบริเวณสำหรับเจ้าหน้าที่เปลี่ยนเสื้อผ้าและรองเท้า","section":"s11"},{"key":"med_q145","no":"10.2 › 14)","text":"(๑๔) ระบบไฟฟ้าสำรองหรือระบบทำแสงสว่างสำรอง","section":"s11"},{"key":"med_q146","no":"10.2 › 15)","text":"(15) ห้องพักฟื้น (สัดส่วนของห้องผ่าตัด ๑ ห้อง ต้องมีเตียงพักฟื้น ๑.๕ เตียง)","section":"s11"},{"key":"med_q147","no":"10.2 › 2)","text":"ภายในห้องพักฟื้นต้องจัดให้มี\n(๑) เครื่อง monitor ผู้ป่วยไว้ในห้องพักฟื้น\n(๒) ถังออกซิเจน พร้อมอุปกรณ์วัดปริมาณออกซิเจน","section":"s11"},{"key":"med_q148","no":"10.3 › 1)","text":"10.3 จัดให้มีบริเวณ ดังต่อไปนี้\n(1) บริเวณล้างเครื่องมือที่ใช้แล้ว","section":"s11"},{"key":"med_q149","no":"10.3 › 2)","text":"(2) บริเวณที่ทำความสะอาดเครื่องมือผ่าตัด ด้วยหม้อนึ่งอบความดันที่มีประสิทธิภาพในการฆ่าเชื้อ (Autoclave) พร้อมทั้งให้จัดทำคู่มือ หรือแผนภูมิแสดงขั้นตอนการทำความสะอาดและ ทำให้เครื่องมือปราศจากเชื้อ","section":"s11"},{"key":"med_q150","no":"10.4 › 1)","text":"10.4.บุคลากรที่ปฏิบัติหน้าที่ในการให้ยาระงับความรู้สึกแก่ผู้ป่วยขณะทำการผ่าตัด\n(๑) มีวิสัญญีแพทย์เป็นผู้ปฏิบัติงาน โดยการดมยาสลบในห้องผ่าตัดใหญ่","section":"s11","hint":"(ระบุชื่อ) …"},{"key":"med_q151","no":"10.4 › 2)","text":"(2) มีวิสัญญีแพทย์ หรือแพทย์ผู้ผ่านการอบรมจากราชวิทยาลัยวิสัญญีแพทย์ โดยการฉีดยาเข้าเส้นเลือดดำเพื่อทำให้ผู้ป่วยหลับในห้องผ่าตัดใหญ่","section":"s11"}],"ack":"ข้าพเจ้าได้อ่านและรับทราบผลการตรวจสถานพยาบาลนี้แล้วและจะปฏิบัติตามคำสั่งหรือคำแนะนำของพนักงานเจ้าหน้าที่อย่างเคร่งครัด ทั้งนี้พนักงานเจ้าหน้าที่ไม่ได้ทำการละเมิด ข่มขู่ หรือทำให้ทรัพย์สินของสถานพยาบาลหรือบุคคลในสถานพยาบาลเสียหาย สูญหาย หรือเสื่อมค่าแต่ประการใด","note":"","instruction":"โปรดใส่เครื่องหมาย ✓ เมื่อถูกต้อง และเครื่องหมาย × เมื่อไม่จัดให้มีหรือไม่ถูกต้อง กรณีไม่มีบริการที่เกี่ยวข้องในหัวข้อนั้น ๆ ใส่เครื่อ xt":"1.3.2 มีส่วนที่นั่งพักคอยของผู้ป่วยและญาติที่เหมาะสม ไม่น้อยกว่า 5- 10 ที่นั่งและที่นั่งต้องมีพนักพิง","section":"s2"},{"key":"spc_q010","no":"1.4","text":"1.4 การสัญจรและการเคลื่อนย้ายผู้ป่วยต้องกระทำได้โดยสะดวก โดยเฉพาะเมื่อเกิดภาวะฉุกเฉิน ขนาดความกว้างของประตู เข้า-ออก ไม่ต่ำกว่า 80 เซนติเมตร","section":"s2"},{"key":"spc_q011","no":"1.5.1","text":"1.5 ห้องตรวจหรือห้องให้การรักษา\n1.5.1 ห้องตรวจหรือห้องให้การรักษากั้นเป็นสัดส่วนและมิดชิด มีประตู เปิด-ปิด อย่างชัดเจน","section":"s2"},{"key":"spc_q012","no":"1.5.2","text":"1.5.2 ภายในห้องตรวจต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์ 1 เตียง","section":"s2"},{"key":"spc_q013","no":"1.5.3","text":"1.5.3 อ่างฟอกมือชนิดไม่ใช้มือเปิด-ปิดน้ำ พร้อมมีสบู่เหลว ผ้าเช็ดมือหรือกระดาษเช็ดมือที่ใช้ครั้งเดียว","section":"s2"},{"key":"spc_q014","no":"1.5.4","text":"1.5.4 ไม่มีวงจรปิดในห้องตรวจหรือห้องที่เกี่ยวกับการประกอบวิชาชีพหรือการประกอบโรคศิลปะ","section":"s2"},{"key":"spc_q015","no":"1.6","text":"1.6 มีห้องน้ำห้องส้วมที่ถูกสุขลักษณะอย่างน้อยหนึ่งห้องหรือมีห้องน้ำส่วนรวมในกรณีอาคารศูนย์การค้าหรืออาคารสำนักงาน","section":"s2"},{"key":"spc_q016","no":"1.7","text":"1.7 มีแสงสว่างและการระบายอากาศเพียงพอ ไม่มีกลิ่นอับทึบ (หากความสูงของสถานพยาบาลต่ำกว่า 2.6 เมตร ต้องเพิ่มพัดลมดูดอากาศที่เหมาะสม)","section":"s2"},{"key":"spc_q017","no":"1.8.1","text":"1.8 มีระบบการเก็บและกำจัดมูลฝอยและสิ่งปฏิกูลที่เหมาะสม และมีการกำจัดอย่างเหมาะสม\n1.8.1 ทุกห้องตรวจและทุกห้องที่ให้การรักษาผู้ป่วย ต้องมีถังขยะทั่วไป–ถังขยะติดเชื้อ ที่มีลักษณะถังขยะแบบใช้เท้าเหยียบให้เปิด มีฝาปิดมิดชิด ถังขยะติดเชื้อใช้ถุงสีแดง เขียนข้อความ “ขยะติดเชื้อ”ไว้ที่ถังขยะ แยกต่างหากจากถังขยะทั่วไป ใช้ถุงสีดำ เขียนข้อความ “ขยะทั่วไป” ไว้ที่ถังขยะ วางคู่กันทุกห้อง","section":"s2"},{"key":"spc_q018","no":"1.8.2","text":"1.8.2 มีสัญญา/หนังสือตอบรับการขนถ่ายขยะติดเชื้อ ของการจ้างบริษัทกำจัดขยะติดเชื้อ หรืออาจแสดงใบเสร็จรับเงินที่เป็นเดือนปัจจุบัน","section":"s2"},{"key":"spc_q019","no":"1.9.1","text":"1.9 มีระบบควบคุมการติดเชื้อที่เหมาะสม (นอกเหนือจากพิจารณาในภาพรวมแล้ว ให้ตรวจสอบการทำความสะอาดและทำ ให้เครื่องมือปราศจากเชื้อ ในห้องบำบัดรักษาหรือในบริเวณ\nที่มีงานหัตถการด้วย)\n1.9.1 เครื่องมืออุปกรณ์และเวชภัณฑ์สำหรับควบคุมการติดเชื้อในกรณีที่จำเป็นต้องใช้ทำ เช่น Autoclave หม้อต้มเครื่องมือแพทย์ เครื่องนึ่ง","section":"s2"},{"key":"spc_q020","no":"1.9.2","text":"1.9.2 แช่น้ำยาฆ่าเชื้อ","section":"s2"},{"key":"spc_q021","no":"1.9.3","text":"1.9.3 ขั้นตอน/วิธีการทำให้เครื่องมือสะอาดปราศจากเชื้อและวิธีกำจัดของมีคม ติดในที่เปิดเผยภายในคลินิก","section":"s2"},{"key":"spc_q022","no":"1.10.1","text":"1.10 กรณีมีบริการเอกซเรย์ ต้องมีความปลอดภัยทางรังสี ดังนี้\n1.10.1 ห้องเอกซเรย์ ประตูและผนังของห้องให้บริการต้องป้องกันอันตรายจากรังสีได้และมีอุปกรณ์ป้องกันอันตรายจากรังสีตามมาตรฐานของสํานักงานปรมาณูเพื่อสันติ","section":"s2","condHead":true,"cond":"spc_g1"},{"key":"spc_q023","no":"1.10.2","text":"1.10.2 ป้ายสัญลักษณ์แสดงเขตรังสี","section":"s2","cond":"spc_g1"},{"key":"spc_q024","no":"1.10.3","text":"1.10.3 ป้ายคำเตือนผู้ป่วยมีครรภ์ให้แจ้งเจ้าหน้าที่","section":"s2","cond":"spc_g1"},{"key":"spc_q025","no":"1.10.4 › 2)","text":"1.10.4 อุปกรณ์ป้องกันอันตรายจากรังสีสำหรับผู้ป่วย\n1) เสื้อตะกั่ว\n2) ฉากกั้นรังสี","section":"s2","cond":"spc_g1"},{"key":"spc_q026","no":"1.10.5","text":"1.10.5 ตู้ส่องฟิล์มหรือจอแสดงผลภาพถ่ายทางรังสีระบบดิจิทัล","section":"s2","cond":"spc_g1"},{"key":"spc_q027","no":"1.10.6","text":"1.10.6 มีหนังสือรับรองมาตรฐานจากกรมวิทยาศาสตร์\nการแพทย์และใบอนุญาตครอบครองรังสีจากสำนักงานปรมาณู\nเพื่อสันติ","section":"s2","cond":"spc_g1"},{"key":"spc_q028","no":"1.11.1","text":"1.11 มีเครื่องดับเพลิงขนาดเหมาะสม ตามที่กฎหมายท้องถิ่นบัญญัติ และอยู่ในสภาพพร้อมใช้งาน ติดตั้งในที่มองเห็นได้ชัดเจน\n1.11.1 ขนาดเครื่องดับเพลิงไม่ต่ำกว่า 10 ปอนด์","section":"s2"},{"key":"spc_q029","no":"1.11.2","text":"1.11.2 มีเครื่องดับเพลิงติดตั้งทุกชั้น","section":"s2"},{"key":"spc_q030","no":"1.11.3","text":"1.11.3 ติดตั้งเครื่องดับเพลิงส่วนบนสูงจากพื้นไม่เกิน 1.5 เมตร หรือวางกับพื้นมีฐานรองรับที่มั่นคง อยู่ในที่มองเห็นอย่างชัดเจน และควรมีป้ายแสดงจุดที่ตั้งถังดับเพลิง","section":"s2"},{"key":"spc_q031","no":"1.12","text":"1.12 มีป้ายเครื่องหมายห้ามสูบบุหรี่","section":"s2"},{"key":"spc_q032","no":"2.1","text":"2. คลินิกต้องมีลักษณะการให้บริการดังต่อไปนี้\n2.1 มีความปลอดภัย มีความสะดวก และเหมาะสมต่อ\nผู้ให้บริการและผู้รับบริการ","section":"s3"},{"key":"spc_q033","no":"2.2","text":"2.2 มีการให้บริการที่ได้มาตรฐานตามลักษณะวิชาชีพ ตามที่สภาวิชาชีพหรือคณะกรรมการวิชาชีพประกาศกำหนด แล้วแต่กรณี","section":"s3"},{"key":"spc_q034","no":"2.3","text":"2.3 พื้นที่ให้บริการจะต้องมีพื้นที่เชื่อมและเปิดติดต่อถึงกันได้และไม่ตั้งอยู่ในพื้นที่เดียวกับสถานที่ขายยาตามกฎหมายว่าด้วยยาหรือพื้นที่เดียวกับการประกอบอาชีพอื่น","section":"s3"},{"key":"spc_q035","no":"2.4","text":"2.4 พื้นที่ให้บริการจะต้องไม่ตั้งอยู่ในสถานที่เดียวกับสถานพยาบาลของกระทรวง ทบวง กรม กรุงเทพมหานคร เมืองพัทยา องค์การบริการส่วนจังหวัด เทศบาล องค์การบริการส่วนตำบล องค์กรปกครองส่วนท้องถิ่นอื่น และสภากาชาดไทย ซึ่งให้บริการในลักษณะเดียวกัน","section":"s3"},{"key":"spc_q036","no":"2.5","text":"2.5 ในกรณีที่มีการให้บริการในอาคารเดียวกับการประกอบกิจการอื่น จะต้องมีการแบ่งพื้นที่ให้ชัดเจน และกิจการอื่นต้องไม่กระทบกระเทือนต่อการประกอบวิชาชีพ รวมทั้งสามารถเคลื่อนย้ายผู้ป่วยฉุกเฉินได้สะดวก","section":"s3","condHead":true,"cond":"spc_g2"},{"key":"spc_q037","no":"2.5.1","text":"2.5.1 สถานพยาบาลต้องมีประตู เข้า-ออก คนละทางกับการประกอบกิจการอื่น","section":"s3","cond":"spc_g2"},{"key":"spc_q038","no":"2.5.2","text":"2.5.2 การกั้นพื้นที่ต้องเป็นสัดส่วน แสดงให้เห็นประจักษ์ ชัดเจนและถาวร","section":"s3","cond":"spc_g2"},{"key":"spc_q039","no":"2.6","text":"2.6 ในกรณีที่มีการให้บริการของลักษณะสหคลินิกหรือ มีคลินิกหลายลักษณะ อยู่ในอาคารเดียวกัน จะต้องมีการแบ่งสัดส่วนพื้นที่ให้ชัดเจน และแต่ละสัดส่วนต้องมีพื้นที่และลักษณะตามมาตรฐานของการให้บริการนั้น แต่ละสาขาต้องมีอย่างน้อย 1 ห้องตรวจโรค ซึ่งต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรค 1 เตียง ที่ได้มาตรฐานทางการแพทย์ และอ่างฟอกมือชนิดที่ไม่ใช้มือ เปิด-ปิดน้ำ สบู่","section":"s3"},{"key":"spc_q040","no":"3.1.1","text":"3. การแสดงรายละเอียดเกี่ยวกับชื่อสถานพยาบาล ผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะในสถานพยาบาล อัตราค่ารักษาพยาบาล ค่าบริการและสิทธิผู้ป่วย\n3.1 มีป้ายชื่อสถานพยาบาล เป็นไปตามกฎกระทรวง\n3.1.1 ป้ายชื่อสถานพยาบาลต้องเป็นสี่เหลี่ยมผืนผ้า ขนาดความกว้างของป้ายไม่น้อยกว่า 40 เซนติเมตร ความยาวไม่น้อยกว่า 120 เซนติเมตร","section":"s4"},{"key":"spc_q041","no":"3.1.2","text":"3.1.2 จัดทำแผ่นป้ายแสดงชื่อสถานพยาบาลที่เป็นภาษาไทยขนาดความสูงไม่ต่ำกว่า 10 เซนติเมตร ตัวหนังสือ สีเขียว สีพื้นป้ายสีขาว","section":"s4"},{"key":"spc_q042","no":"3.1.3","text":"3.1.3 เลขที่ใบอนุญาตขนาดความสูงไม่ต่ำกว่า 5 เซนติเมตร ตัวเลขสีเขียว","section":"s4"},{"key":"spc_q043","no":"3.1.4","text":"3.1.4 กรณีใช้ภาษาต่างประเทศร่วมด้วย ต้องมีชื่อตรงกันกับภาษาไทย ขนาดตัวอักษรต้องเล็กกว่าภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"spc_q044","no":"3.2","text":"3.2 ติดตั้งป้ายชื่อสถานพยาบาลในตำแหน่งที่มองเห็นได้ชัดเจนจากภายนอกและเหมาะสม","section":"s4"},{"key":"spc_q045","no":"3.3.1","text":"3.3 ชื่อสถานพยาบาลไม่มีข้อความลักษณะชักชวนโอ้อวดเกินจริงหรืออาจสื่อให้เข้าใจผิด\n3.3.1 คำนำหน้าชื่อหรือต่อท้ายของชื่อคลินิกต้องประกอบด้วยลักษณะคลินิก และลักษณะการให้บริการของคลินิก","section":"s4"},{"key":"spc_q046","no":"3.3.2","text":"3.3.2 กรณีใช้ชื่อภาษาต่างประเทศด้วย ขนาดตัวอักษรต้องเล็กกว่าอักษรภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"spc_q047","no":"3.3.3","text":"3.3.3 ชื่อคลินิกจะต้องไม่ใช้คำหรือข้อความที่มีลักษณะชักชวน โอ้อวดเกินความจริง หรืออาจทำให้เกิดความเข้าใจผิดในสาระสำคัญเกี่ยวกับการประกอบกิจการ","section":"s4"},{"key":"spc_q048","no":"3.3.4","text":"3.3.4 ชื่อคลินิกต้องไม่สื่อความหมายหรืออ้างอิงสถาบันพระมหากษัตริย์ เว้นแต่ได้รับพระบรมราชานุญาต","section":"s4"},{"key":"spc_q049","no":"3.3.5","text":"3.3.5 คลินิกที่ตั้งอยู่ในอำเภอหรือในเขตเดียวกัน จะต้องมีชื่อไม่ซ้ำกัน เว้นแต่ผู้ขอรับอนุญาตเป็นบุคคลเดียวกันหรือมีหนังสือยินยอมจากผู้ได้รับใบอนุญาตให้ประกอบกิจการคลินิกเดิม ให้ใช้ชื่อซ้ำกันได้ แต่ต้องมีตัวอักษรหรือหมายเลขเรียงลำดับหรือที่ตั้งสถานที่ต่อท้ายชื่อคลินิก","section":"s4"},{"key":"spc_q050","no":"3.4","text":"3.4 มีข้อความแสดงวัน เวลา ให้บริการไว้โดยเปิดเผย มองเห็นได้ชัดเจนจากด้านนอกคลินิกและตรงกับเวลาที่ขอรับอนุญาตให้ประกอบกิจการสถานพยาบาล","section":"s4"},{"key":"spc_q051","no":"3.5","text":"3.5 มีบริเวณที่ต้องแสดงใบอนุญาตให้ประกอบกิจการและดำเนินการในบริเวณที่เปิดเผย และเหมาะสม เช่น บริเวณที่นั่งพักคอยของผู้รับบริการ","section":"s4"},{"key":"spc_q052","no":"3.6","text":"3.6 มีบริเวณที่ใช้แสดงหลักฐานการชำระค่าธรรมเนียมการประกอบกิจการสถานพยาบาล(แบบ ส.พ.12) ในที่เปิดเผยและเห็นได้ชัดเจนบริเวณทางเข้าสถานพยาบาล","section":"s4"},{"key":"spc_q053","no":"3.7","text":"3.7 หน้าห้องตรวจมีบริเวณให้ติดป้ายแสดงชื่อ ภาพถ่าย และเลขที่ใบอนุญาตของผู้ประกอบวิชาชีพเวชกรรมที่ให้บริการ หากมีผู้ประกอบวิชาชีพ/ผู้ประกอบโรคศิลปะอื่นปฏิบัติงานให้ยื่น สพ.6 ทุกคนและแสดงป้ายนี้ไว้ในบริเวณที่เปิดเผยและเห็นได้ชัดเจน","section":"s4"},{"key":"spc_q054","no":"3.8","text":"3.8 แสดงอัตราค่าบริการและค่ารักษาพยาบาลให้ครอบคลุมการบริการที่เรียกเก็บ โดยแสดงอัตราราคาต่อหน่วย และระบุข้อความด้วยอักษรภาษาไทย โดยแสดงไว้ในที่เปิดเผยให้ผู้รับบริการสามารถเห็นได้ง่าย โดยจัดทำเป็นแผ่นประกาศ แผ่นพับ เล่ม หรือแฟ้มเอกสาร หรือโปรแกรมคอมพิวเตอร์ แสดงให้ผู้ป่วยทราบ","section":"s4"},{"key":"spc_q055","no":"3.9","text":"3.9 มีป้ายแสดงให้ผู้รับบริการทราบว่าสามารถสอบถามอัตราค่าบริการและค่ารักษาพยาบาลได้จากที่ใด ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 10 เซนติเมตร แสดงไว้ในที่เห็นได้ชัดเจน","section":"s4"},{"key":"spc_q056","no":"3.10","text":"3.10 แสดงคำประกาศสิทธิผู้ป่วยไว้ในที่เปิดเผยและเห็นได้ง่ายอ่านได้ชัดเจน ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 1 เซนติเมตร บริเวณที่พักคอยของผู้รับบริการ","section":"s4"},{"key":"spc_q057","no":"3.11","text":"3.11 ข้อความโฆษณาสถานพยาบาล (ถ้ามี) ไม่เป็นเท็จ ไม่โอ้อวด หรือสื่อให้เข้าใจผิดในสาระสำคัญ","section":"s4"},{"key":"spc_q058","no":"4.1.1","text":"4.ชนิดและจำนวนเครื่องมือ เครื่องใช้ที่จำเป็นประจำสถานพยาบาล\n4.1 เวชระเบียน\n4.1.1 มีตู้หรือชั้นหรืออุปกรณ์เก็บเวชระเบียนที่มั่นคง ปลอดภัยและต้องจัดให้เป็นระเบียบสามารถค้นหาได้ง่าย","section":"s5"},{"key":"spc_q059","no":"4.1.2","text":"4.1.2 มีการจัดเตรียมทะเบียนผู้ป่วย มีรายการดังต่อไปนี้","section":"s5"},{"key":"spc_q060","no":"4.1.2 › 1)","text":"1) ชื่อ นามสกุล อายุ ของผู้ป่วย","section":"s5"},{"key":"spc_q061","no":"4.1.2 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s5"},{"key":"spc_q062","no":"4.1.2 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"spc_q063","no":"4.1.3 › 1)","text":"4.1.3 มีเวชระเบียน หรือ บัตรผู้ป่วย ที่สามารถ บันทึกรายละเอียด ตามที่กฎกระทรวงกำหนด\n1) ชื่อและที่อยู่สถานพยาบาล","section":"s5"},{"key":"spc_q064","no":"4.1.3 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s5"},{"key":"spc_q065","no":"4.1.3 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"spc_q066","no":"4.1.3 › 4)","text":"4) ชื่อ นามสกุล อายุ เพศ ที่อยู่ หมายเลขโทรศัพท์ (ถ้ามี) และข้อมูลส่วนบุคคลอื่น ๆ ของผู้ป่วย เช่น เชื้อชาติ สัญชาติ สถานภาพสมรส เลขที่บัตรประจำตัวประชาชน เป็นต้น","section":"s5"},{"key":"spc_q067","no":"4.1.3 › 5)","text":"5) อาการเจ็บป่วย การแพ้ยา ผลการตรวจทางร่างกายและผลการตรวจทางห้องปฏิบัติชันสูตรของผู้ป่วย","section":"s5"},{"key":"spc_q068","no":"4.1.3 › 6)","text":"6) การวินิจฉัยโรค","section":"s5"},{"key":"spc_q069","no":"4.1.3 › 7)","text":"7) การรักษา","section":"s5"},{"key":"spc_q070","no":"4.1.3 › 8)","text":"8) ลายมือผู้ประกอบวิชาชีพเวชกรรมที่ให้การรักษาพยาบาล","section":"s5"},{"key":"spc_q071","no":"4.2.1","text":"4.2 เครื่องใช้ทั่วไป ในห้องตรวจโรคทุกห้องต้องประกอบด้วย\n4.2.1 โต๊ะตรวจโรค พร้อมเก้าอี้","section":"s5"},{"key":"spc_q072","no":"4.2.2","text":"4.2.2 เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์ พร้อมอุปกรณ์","section":"s5"},{"key":"spc_q073","no":"4.2.2 › 1)","text":"1) มีขนาดที่ได้มาตรฐานทางการแพทย์ พื้นแข็งสามารถช่วยฟื้นคืนชีพ (CPR) ได้ตามหลักวิชาชีพ","section":"s5"},{"key":"spc_q074","no":"4.2.2 › 2)","text":"2) ต้องมีบันไดขึ้นเตียง (Step) หากเตียงนั้นมีความสูง","section":"s5"},{"key":"spc_q075","no":"4.2.2 › 3)","text":"3) มีปลอกหมอน ผ้าปูเตียง และผ้าคลุมตัวผู้ป่วย","section":"s5"},{"key":"spc_q076","no":"4.3.1","text":"4.3 เครื่องมือ หรืออุปกรณ์ในการตรวจและวินิจฉัยโรค จะต้องมี\n4.3.1 หูฟัง (Stethoscope)","section":"s5"},{"key":"spc_q077","no":"4.3.2","text":"4.3.2 เครื่องวัดความดันโลหิต (Sphygmomanometer)","section":"s5"},{"key":"spc_q078","no":"4.3.3","text":"4.3.3 ปรอทวัดอุณหภูมิร่างกาย หรือ อุปกรณ์วัดอุณหภูมิ","section":"s5"},{"key":"spc_q079","no":"4.3.4","text":"4.3.4 ไฟฉาย ไม้กดลิ้น","section":"s5"},{"key":"spc_q080","no":"4.3.5","text":"4.3.5 เครื่องชั่งน้ำหนัก และอุปกรณ์วัดส่วนสูง","section":"s5"},{"key":"spc_q081","no":"5.1","text":"5. ยา และเวชภัณฑ์ในสถานพยาบาล\n5.1 มียาและเวชภัณฑ์อื่นที่จำเป็น โดยมีจำนวน รายการและประมาณเพียงพอ ตามลักษณะสถานพยาบาล","section":"s6"},{"key":"spc_q082","no":"5.2","text":"5.2 ไม่มียาที่หมดอายุหรือเสื่อมสภาพ (ให้ใช้ภาชนะบรรจุ ยาเดิมที่ได้มาจากแหล่งผลิตยานั้น)","section":"s6"},{"key":"spc_q083","no":"5.3","text":"5.3 มีอุปกรณ์นับเม็ดยา อย่างน้อยสองชุด","section":"s6"},{"key":"spc_q084","no":"5.4","text":"5.4 ภาชนะบรรจุยาหรือฉลากติดซองยาให้ระบุชื่อและที่อยู่สถานพยาบาล ชื่อ-สกุลผู้ป่วย ชื่อยา วิธีใช้ และต้องระบุวันที่ยาหมดอายุอย่างชัดเจน","section":"s6"},{"key":"spc_q085","no":"5.5","text":"5.5 มีตู้หรือชั้นเก็บยาและเวชภัณฑ์เป็นสัดส่วน","section":"s6"},{"key":"spc_q086","no":"5.6","text":"5.6 มีตู้เย็นสำหรับเก็บยาหรือเวชภัณฑ์อื่น กรณีที่มีวัคซีน หรือยาที่ต้องเก็บไว้ในอุณหภูมิต่ำ ตู้เย็นนั้น ต้องมีการควบคุมอุณหภูมิ มีปรอทวัดอุณหภูมิ และมีการบันทึกอุณหภูมิในตู้เย็น","section":"s6"},{"key":"spc_q087","no":"5.7","text":"5.7 กรณีมียาเสพติดให้โทษ ให้มีสถานที่หรือตู้เก็บยาเสพติดให้โทษที่มั่นคงและปลอดภัย มีกุญแจปิดและเปิดอย่างมีประสิทธิภาพ","section":"s6"},{"key":"spc_q088","no":"5.8","text":"5.8 ยาต้องมีทะเบียน เว้นแต่เป็นการผลิตตามใบสั่งยาของ\nผู้ประกอบวิชาชีพเวชกรรมที่สั่งให้สำหรับคนไข้เฉพาะรายของสถานพยาบาล กรณีการผลิตยาของสถานพยาบาลต้องมีมาตรฐานการผลิต การแสดงฉลากและวันหมดอายุให้ชัดเจน","section":"s6"},{"key":"spc_q089","no":"6","text":"6. ชุดช่วยชีวิตฉุกเฉิน ประกอบด้วย","section":"s7"},{"key":"spc_q090","no":"6.1","text":"6.1 ยา เวชภัณฑ์และเครื่องมือแพทย์อื่นที่สามารถให้การรักษาพยาบาลและช่วยชีวิตผู้ป่วยฉุกเฉินตามลักษณะสถานพยาบาล ในคลินิกเวชกรรม ยาจะต้องมีเพียงพอกับการให้บริการ มีฉลากที่ถูกต้องตามกฎหมายให้ตรวจสอบ และไม่มียาที่หมดอายุหรือเสื่อมสภาพ ต้องมีครบทุกรายการ ได้แก่","section":"s7"},{"key":"spc_q091","no":"6.1 › 1)","text":"(๑) ยาฉีด Adrenaline ๑ : ๑๐๐๐","section":"s7"},{"key":"spc_q092","no":"6.1 › 2)","text":"(๒)ยาฉีด Steroid injection เช่น Dexamethazone Injection หรือ Hydrocortizone","section":"s7"},{"key":"spc_q093","no":"6.1 › 3)","text":"(๓) ยาฉีด Chlorphenilamine injection","section":"s7"},{"key":"spc_q094","no":"6.1 › 4)","text":"(๔) ๕๐% Glucose injection","section":"s7"},{"key":"spc_q095","no":"6.1 › 5)","text":"(๕) ยาอมใต้ลิ้นเพื่อขยายหลอดเลือดหัวใจ","section":"s7"},{"key":"spc_q096","no":"6.1 › 6)","text":"(6) ถุงบีบลมเพื่อช่วยหายใจพร้อมหน้ากากครอบช่วย\nการหายใจตามลักษณะการให้บริการของสถานพยาบาล ๑ ชุด","section":"s7"},{"key":"spc_q097","no":"6.1 › 7)","text":"(7) NSS ๑,๐๐๐ cc. พร้อมชุดให้สารน้ำทางหลอดเลือดดำ (set IV fluid) ๒ ชุด","section":"s7"},{"key":"spc_q098","no":"6.1 › 2)","text":"(8) Medicut หรือเข็มแทงหลอดเลือดดำเพื่อให้น้ำเกลือ\n๒ ชุด","section":"s7"},{"key":"spc_q099","no":"6.1 › 9)","text":"(9) Disposable Syringe ๕ หลอด","section":"s7"},{"key":"spc_q100","no":"6.1 › 10)","text":"(10) เข็ม Disposable ๕ อัน","section":"s7"},{"key":"spc_q101","no":"6.1 › 11)","text":"(11) เสาแขวนน้ำเกลือ (Stand) ที่เคลื่อนย้ายได้ ๑ อัน","section":"s7"},{"key":"spc_q102","no":"6.1 › 12)","text":"(12) Oral Airway ๑ อัน","section":"s7"},{"key":"spc_q103","no":"6.1 › 13)","text":"(13) Oxygen Tank พร้อมอุปกรณ์วัดปริมาณออกซิเจน","section":"s7"},{"key":"spc_q104","no":"6.1 › 14)","text":"(14) ในกรณีคลินิกเวชกรรมที่มีห้องผ่าตัดใหญ่จะต้องมีเครื่องกระตุกหัวใจ (Defibrilator)","section":"s7"},{"key":"spc_q105","no":"6.3 › 1)","text":"6.3 มีแผนการส่งต่อผู้ป่วย และการเตรียมความพร้อมในสถานการณ์ฉุกเฉิน\n(๑) มีเบอร์โทรศัพท์ฉุกเฉินติดต่อโรงพยาบาล","section":"s7"},{"key":"spc_q106","no":"6.3 › 2)","text":"(๒) มีแผนและขั้นตอนการช่วยชีวิตเบื้องต้นที่ได้มาตรฐาน และขั้นตอนการส่งต่อผู้ป่วย","section":"s7"},{"key":"spc_q107","no":"7.1","text":"7.ในกรณีมีห้องบำบัดรักษา (ห้อง Treatment) จะต้องมี\n7.1 เตียงสำหรับให้การรักษา","section":"s8"},{"key":"spc_q108","no":"7.2","text":"7.2 ยา เวชภัณฑ์ และอุปกรณ์ สำหรับทำแผล ฉีดยา ปริมาณพอเพียง","section":"s8"},{"key":"spc_q109","no":"7.3","text":"7.3 อุปกรณ์ เครื่องมือ เครื่องใช้ มีระบบควบคุมการทำ ความสะอาดและทำให้ปราศจากเชื้อที่เหมาะสม","section":"s8"},{"key":"spc_q110","no":"7.4","text":"7.4 มีภาชนะใส่มูลฝอยติดเชื้อ (ใช้ถุงสีแดง เขียนข้อความ “ขยะติดเชื้อ”) แยกต่างหากจากภาชนะใส่มูลฝอยทั่วไป","section":"s8"},{"key":"spc_q111","no":"8.1","text":"8. กรณีมีห้องตรวจภายใน (ห้อง PV) จะต้องมี\n8.1 ลักษณะเป็นสัดส่วนมิดชิด","section":"s9"},{"key":"spc_q112","no":"8.2","text":"8.2 เตียงสำหรับตรวจภายใน","section":"s9"},{"key":"spc_q113","no":"8.3","text":"8.3 ไฟส่องตรวจ","section":"s9"},{"key":"spc_q114","no":"8.4","text":"8.4 อุปกรณ์การตรวจภายใน มีการทำความสะอาด และทำให้ปราศจากเชื้ออย่างเหมาะสม","section":"s9"},{"key":"spc_q115","no":"8.5","text":"8.5 ผ้าปิดตา ผ้าคลุมตัวท่อนล่างป้องกันการเปิดเผยของผู้ป่วย","section":"s9"},{"key":"spc_q116","no":"9.1","text":"9. กรณีมีห้องผ่าตัดเล็ก\n9.1 ขนาดพื้นที่ห้องผ่าตัดเล็กไม่น้อยกว่า 12 ตารางเมตร\nส่วนที่แคบที่สุด ไม่น้อยกว่า 3 เมตร ความสูงไม่น้อยกว่า 2.6 เมตร หากมีการตกแต่งฝ้าให้ต่ำลงมา ต้องมีความสูงที่วัดจากพื้นห้องถึงฝ้าไม่ต่ำกว่า 2.45 เมตร และมีพัดลมดูดอากาศ หรือระบบระบายอากาศที่เหมาะสม","section":"s10"},{"key":"spc_q117","no":"9.2 › 1)","text":"9.2 อุปกรณ์ เครื่องมือแพทย์ ยาและเวชภัณฑ์\n(๑) หม้อนึ่งอบความดันที่มีประสิทธิภาพในการฆ่าเชื้อ (Autoclave)","section":"s10"},{"key":"spc_q118","no":"9.2 › 2)","text":"(๒) ตู้เก็บอุปกรณ์/เครื่องมือที่ปราศจากเชื้อ (ให้แสดงรายละเอียดของอุปกรณ์/เครื่องมือที่ปราศจากเชื้อ เช่น ระบุวัน เดือน ปีที่นึ่ง/หรือเปลี่ยนน้ำยา/หรือวันผลิต/หรือวันหมดอายุ","section":"s10"},{"key":"spc_q119","no":"9.2 › 3)","text":"(๓) ถังออกซิเจน","section":"s10"},{"key":"spc_q120","no":"9.2 › 4)","text":"(๔) ถุงบีบลมพร้อมหน้ากากครอบช่วยการหายใจ (Ambubag)","section":"s10"},{"key":"spc_q121","no":"9.2 › 5)","text":"(๕) ชุดเครื่องมือผ่าตัดทั่วไป","section":"s10"},{"key":"spc_q122","no":"9.2 › 6)","text":"(๖) ยาและเวชภัณฑ์ฉุกเฉินต้องจัดให้มีในห้องผ่าตัด","section":"s10"},{"key":"spc_q123","no":"9.2 › 7)","text":"(๗) เตียงและโคมไฟผ่าตัด (แบบตั้ง /ติดเตียง/ ติดผนัง)","section":"s10"},{"key":"spc_q124","no":"9.2 › 8)","text":"(๘) จัดให้มีบริเวณ ดังต่อไปนี้\n(ก) อ่างฟอกมือที่ไม่ใช้มือเปิดปิดน้ำ สำหรับแพทย์ผู้ทำผ่าตัดและสำหรับผู้ป่วยเพื่อ ล้างทำความสะอาดส่วนที่ต้องการทำผ่าตัด\n(ข) บริเวณล้างเครื่องมือที่ใช้แล้ว\n(ค) บริเวณที่ทำความสะอาดเครื่องมือผ่าตัด ด้วยหม้อนึ่งอบความดันที่มีประสิทธิภาพในการฆ่าเชื้อ (Autoclave) พร้อมทั้งให้จัดทำคู่มือ หรือแผนภูมิแสดงขั้นตอนการทำความสะอาดและทำให้เครื่องมือปราศจากเชื้อ","section":"s10"},{"key":"spc_q125","no":"10.1","text":"10. กรณีมีห้องผ่าตัดใหญ่\n10.1 ขนาดพื้นที่ห้องผ่าตัดใหญ่ไม่น้อยกว่า 20 ตารางเมตร ความสูงไม่น้อยกว่า 3 เมตร","section":"s11"},{"key":"spc_q126","no":"10.2 › 1)","text":"10.2 พื้นที่ใช้สอยประกอบด้วย\nStaff Area\n๑) ห้องเก็บเสื้อผ้าและของใช้ส่วนตัว พื้นที่ (6 ตารางเมตร)\nส่วนที่แคบที่สุด ๒.๕ เมตร ความสูงพื้นถึงฝ้า ๒.๕ เมตร","section":"s11","hint":"1 และ 2 ร่วมกันได้"},{"key":"spc_q127","no":"10.2 › 2)","text":"๒) ห้องเปลี่ยนเสื้อผ้า พื้นที่ (6 ตารางเมตร) ส่วนที่แคบที่สุด ๒ เมตร ความสูงพื้นถึงฝ้า ๒.๕ เมตร","section":"s11"},{"key":"spc_q128","no":"10.2 › 3)","text":"บริเวณรับคนไข้\n3) Transfer Area พื้นที่ (9 ตารางเมตร) ส่วนที่แคบที่สุด ๒.๕ เมตร ความสูงพื้นถึงฝ้า 3 เมตร","section":"s11"},{"key":"spc_q129","no":"10.2 › 4)","text":"Procedure Area\n4) บริเวณฟอกมือเจ้าหน้าที่ (อ่างฟอกมือชนิดที่ไม่ใช้มือเปิด-ปิดน้ำ)","section":"s11","hint":"ต้องไม่อยู่ในห้องผ่าตัด"},{"key":"spc_q130","no":"10.2 › 5)","text":"๕) Operation Rooms พื้นที่ (20 ตารางเมตร) ส่วนที่แคบที่สุด 4 เมตร ความสูงพื้นถึงฝ้า 3 เมตร","section":"s11"},{"key":"spc_q131","no":"10.2 › 6)","text":"๖) Recovery Rooms","section":"s11","hint":"๑.๕ เตียงต่อ ๑ ห้อง"},{"key":"spc_q132","no":"10.2 › 1)","text":"10.2 อุปกรณ์ เครื่องมือแพทย์ ยาและเวชภัณฑ์ ห้องผ่าตัดใหญ่\n(๑) เตียงและโคมไฟผ่าตัดแบบมาตรฐาน ใช้ในการผ่าตัดประจำทุกห้องที่ใช้งานผ่าตัด","section":"s11"},{"key":"spc_q133","no":"10.2 › 2)","text":"(๒) เครื่องดมยาสลบที่ได้มาตรฐานทางการแพทย์ และระบบแก๊สทางการแพทย์ซึ่งมีสัญญาณเตือนอันตรายทุกห้องที่ขออนุญาตใช้งาน","section":"s11"},{"key":"spc_q134","no":"10.2 › 3)","text":"(๓) ถังออกซิเจน หรือ ออกซิเจนที่ส่งผ่านมาทางท่อส่งก๊าซ (Pipe line)","section":"s11"},{"key":"spc_q135","no":"10.2 › 4)","text":"(๔) เครื่องดูดเสมหะ","section":"s11"},{"key":"spc_q136","no":"10.2 › 5)","text":"(๕) ชุดอุปกรณ์ ยาและเวชภัณฑ์ในการช่วยฟื้นคืนชีพ ทุกห้อง","section":"s11"},{"key":"spc_q137","no":"10.2 › 6)","text":"(๖) เครื่องมือผ่าตัดที่ได้มาตรฐานทางการแพทย์และเพียงพอสำหรับการผ่าตัดตามสาขาโรค","section":"s11"},{"key":"spc_q138","no":"10.2 › 7)","text":"(๗) เครื่องกระตุกหัวใจด้วยไฟฟ้า (Defibrilator)","section":"s11"},{"key":"spc_q139","no":"10.2 › 8)","text":"(๘) ถุงบีบลมพร้อมหน้ากากครอบช่วยการหายใจ (Ambubag)","section":"s11"},{"key":"spc_q140","no":"10.2 › 9)","text":"(๙) Patient monitor ซึ่งสามารถ monitor ในเรื่อง คลื่นไฟฟ้าหัวใจ (EKG) ความดันโลหิต (Blood Pressure) ชีพจร (Pulse) และการวัดความอิ่มตัวออกซิเจนของฮีโมโกลบินจากชีพจร (Oxygen Saturation )","section":"s11"},{"key":"spc_q141","no":"10.2 › 10)","text":"(๑๐) ชุดใส่ท่อหายใจ (ชุด Laryngoscope)","section":"s11"},{"key":"spc_q142","no":"10.2 › 11)","text":"(๑๑) หม้อนึ่งอบความดันที่มีประสิทธิภาพในการฆ่าเชื้อ (Autoclave)","section":"s11"},{"key":"spc_q143","no":"10.2 › 12)","text":"(๑๒) ตู้เก็บอุปกรณ์/เครื่องมือที่ปราศจากเชื้อ (ให้แสดงรายละเอียดของอุปกรณ์/เครื่องมือที่ปราศจากเชื้อ เช่น ระบุวัน เดือน ปีที่นึ่ง/หรือเปลี่ยนน้ำยา/หรือวันผลิต/หรือวันหมดอายุ)","section":"s11"},{"key":"spc_q144","no":"10.2 › 13)","text":"(๑๓) ตู้เสื้อผ้าและบริเวณสำหรับเจ้าหน้าที่เปลี่ยนเสื้อผ้าและรองเท้า","section":"s11"},{"key":"spc_q145","no":"10.2 › 14)","text":"(๑๔) ระบบไฟฟ้
