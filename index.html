ิด-ปิด อย่างชัดเจน","section":"s2"},{"key":"den_q012","no":"1.5.2","text":"1.5.2 ภายในห้องทำฟันต้องประกอบด้วยหน่วยทำฟัน(ยูนิตทำฟัน)ที่ได้มาตรฐานทางทันตกรรม","section":"s2"},{"key":"den_q013","no":"1.5.3","text":"1.5.3 อ่างฟอกมือชนิดไม่ใช้มือเปิด-ปิดน้ำ พร้อมมีสบู่เหลว ผ้าเช็ดมือหรือกระดาษเช็ดมือที่ใช้ครั้งเดียว","section":"s2"},{"key":"den_q014","no":"1.5.4","text":"1.5.4 ไม่มีวงจรปิดในห้องตรวจหรือห้องที่เกี่ยวกับการประกอบวิชาชีพหรือการประกอบโรคศิลปะ","section":"s2"},{"key":"den_q015","no":"1.6","text":"1.6 มีห้องน้ำห้องส้วมที่ถูกสุขลักษณะอย่างน้อยหนึ่งห้องหรือมีห้องน้ำส่วนรวมในกรณีอาคารศูนย์การค้าหรืออาคารสำนักงาน","section":"s2"},{"key":"den_q016","no":"1.7","text":"1.7 มีแสงสว่างและการระบายอากาศเพียงพอ ไม่มีกลิ่นอับทึบ (หากความสูงของสถานพยาบาลต่ำกว่า 2.6 เมตร ต้องเพิ่มพัดลมดูดอากาศที่เหมาะสม)","section":"s2"},{"key":"den_q017","no":"1.8.1","text":"1.8 มีระบบการเก็บและกำจัดมูลฝอยและสิ่งปฏิกูลที่เหมาะสม และมีการกำจัดอย่างเหมาะสม\n1.8.1 ทุกห้องตรวจและทุกห้องที่ให้การรักษาผู้ป่วย ต้องมีถังขยะทั่วไป–ถังขยะติดเชื้อ ที่มีลักษณะถังขยะแบบใช้เท้าเหยียบให้เปิด มีฝาปิดมิดชิด ถังขยะติดเชื้อใช้ถุงสีแดง เขียนข้อความ “ขยะติดเชื้อ”ไว้ที่ถังขยะ แยกต่างหากจากถังขยะทั่วไป ใช้ถุงสีดำ เขียนข้อความ “ขยะทั่วไป” ไว้ที่ถังขยะ วางคู่กันทุกห้อง","section":"s2"},{"key":"den_q018","no":"1.8.2","text":"1.8.2 มีสัญญา/หนังสือตอบรับการขนถ่ายขยะติดเชื้อ ของการจ้างบริษัทกำจัดขยะติดเชื้อ หรืออาจแสดงใบเสร็จรับเงินที่เป็นเดือนปัจจุบัน","section":"s2"},{"key":"den_q019","no":"1.9.1","text":"1.9 มีระบบควบคุมการติดเชื้อที่เหมาะสม (นอกเหนือจากพิจารณาในภาพรวมแล้ว ให้ตรวจสอบการทำความสะอาดและทำ ให้เครื่องมือปราศจากเชื้อ ในห้องบำบัดรักษาหรือในบริเวณ\nที่มีงานหัตถการด้วย)\n1.9.1 เครื่องมืออุปกรณ์และเวชภัณฑ์สำหรับควบคุมการติดเชื้อ เช่น Autoclave","section":"s2"},{"key":"den_q020","no":"1.9.2","text":"1.9.2 แช่น้ำยาฆ่าเชื้อ","section":"s2"},{"key":"den_q021","no":"1.9.3","text":"1.9.3 ขั้นตอน/วิธีการทำให้เครื่องมือสะอาดปราศจากเชื้อและวิธีกำจัดของมีคม ติดในที่เปิดเผยภายในคลินิก","section":"s2"},{"key":"den_q022","no":"1.10.1","text":"1.10 การให้บริการเอกซเรย์ ต้องมีความปลอดภัยทางรังสี ดังนี้\n1.10.1 ห้องเอกซเรย์ ประตูและผนังของห้องให้บริการต้องป้องกันอันตรายจากรังสีได้และมีอุปกรณ์ป้องกันอันตรายจากรังสีตามมาตรฐานของสํานักงานปรมาณูเพื่อสันติ","section":"s2"},{"key":"den_q023","no":"1.10.2","text":"1.10.2 ป้ายสัญลักษณ์แสดงเขตรังสี","section":"s2"},{"key":"den_q024","no":"1.10.3","text":"1.10.3 ป้ายคำเตือนผู้ป่วยมีครรภ์ให้แจ้งเจ้าหน้าที่","section":"s2"},{"key":"den_q025","no":"1.10.4 › 2)","text":"1.10.4 อุปกรณ์ป้องกันอันตรายจากรังสีสำหรับผู้ป่วย\n1) เสื้อตะกั่ว\n2) ฉากกั้นรังสี","section":"s2"},{"key":"den_q026","no":"1.10.6","text":"1.10.6 มีหนังสือรับรองมาตรฐานจากกรมวิทยาศาสตร์\nการแพทย์และใบอนุญาตครอบครองรังสีจากสำนักงานปรมาณู\nเพื่อสันติ","section":"s2"},{"key":"den_q027","no":"1.11.1","text":"1.11 มีเครื่องดับเพลิงขนาดเหมาะสม ตามที่กฎหมายท้องถิ่นบัญญัติ และอยู่ในสภาพพร้อมใช้งาน ติดตั้งในที่มองเห็นได้ชัดเจน\n1.11.1 ขนาดเครื่องดับเพลิงไม่ต่ำกว่า 10 ปอนด์","section":"s2"},{"key":"den_q028","no":"1.11.2","text":"1.11.2 มีเครื่องดับเพลิงติดตั้งทุกชั้นที่ขออนุญาตคลินิก","section":"s2"},{"key":"den_q029","no":"1.11.3","text":"1.11.3 ติดตั้งเครื่องดับเพลิงส่วนบนสูงจากพื้นไม่เกิน 1.5 เมตร หรือวางกับพื้นมีฐานรองรับที่มั่นคง อยู่ในที่มองเห็นอย่างชัดเจน และควรมีป้ายแสดงจุดที่ตั้งถังดับเพลิง","section":"s2"},{"key":"den_q030","no":"1.12","text":"1.12 มีป้ายเครื่องหมายห้ามสูบบุหรี่","section":"s2"},{"key":"den_q031","no":"2.1","text":"2. คลินิกต้องมีลักษณะการให้บริการดังต่อไปนี้\n2.1 มีความปลอดภัย มีความสะดวก และเหมาะสมต่อ\nผู้ให้บริการและผู้รับบริการ","section":"s3"},{"key":"den_q032","no":"2.2","text":"2.2 มีการให้บริการที่ได้มาตรฐานตามลักษณะวิชาชีพ ตามที่สภาวิชาชีพหรือคณะกรรมการวิชาชีพประกาศกำหนด แล้วแต่กรณี","section":"s3"},{"key":"den_q033","no":"2.3","text":"2.3 พื้นที่ให้บริการจะต้องมีพื้นที่เชื่อมและเปิดติดต่อถึงกันได้และไม่ตั้งอยู่ในพื้นที่เดียวกับสถานที่ขายยาตามกฎหมายว่าด้วยยาหรือพื้นที่เดียวกับการประกอบอาชีพอื่น","section":"s3"},{"key":"den_q034","no":"2.4","text":"2.4 พื้นที่ให้บริการจะต้องไม่ตั้งอยู่ในสถานที่เดียวกับสถานพยาบาลของกระทรวง ทบวง กรม กรุงเทพมหานคร เมืองพัทยา องค์การบริการส่วนจังหวัด เทศบาล องค์การบริการส่วนตำบล องค์กรปกครองส่วนท้องถิ่นอื่น และสภากาชาดไทย ซึ่งให้บริการในลักษณะเดียวกัน","section":"s3"},{"key":"den_q035","no":"2.5","text":"2.5 ในกรณีที่มีการให้บริการในอาคารเดียวกับการประกอบกิจการอื่น จะต้องมีการแบ่งพื้นที่ให้ชัดเจน และกิจการอื่นต้องไม่กระทบกระเทือนต่อการประกอบวิชาชีพ รวมทั้งสามารถเคลื่อนย้ายผู้ป่วยฉุกเฉินได้สะดวก","section":"s3","condHead":true,"cond":"den_g1"},{"key":"den_q036","no":"2.5.1","text":"2.5.1 สถานพยาบาลต้องมีประตู เข้า-ออก คนละทางกับการประกอบกิจการอื่น","section":"s3","cond":"den_g1"},{"key":"den_q037","no":"2.5.2","text":"2.5.2 การกั้นพื้นที่ต้องเป็นสัดส่วน แสดงให้เห็นประจักษ์ ชัดเจนและถาวร","section":"s3","cond":"den_g1"},{"key":"den_q038","no":"2.6","text":"2.6 ในกรณีที่มีการให้บริการของลักษณะสหคลินิกหรือ มีคลินิกหลายลักษณะ อยู่ในอาคารเดียวกัน จะต้องมีการแบ่งสัดส่วนพื้นที่ให้ชัดเจน และแต่ละสัดส่วนต้องมีพื้นที่และลักษณะตามมาตรฐานของการให้บริการนั้น แต่ละสาขาต้องมีอย่างน้อย 1 ห้องตรวจโรค ซึ่งต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรค 1 เตียง ที่ได้มาตรฐานทางการแพทย์ และอ่างฟอกมือชนิดที่ไม่ใช้มือ เปิด-ปิดน้ำ สบู่","section":"s3"},{"key":"den_q039","no":"3.1.1","text":"3. การแสดงรายละเอียดเกี่ยวกับชื่อสถานพยาบาล ผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะในสถานพยาบาล อัตราค่ารักษาพยาบาล ค่าบริการและสิทธิผู้ป่วย\n3.1 มีป้ายชื่อสถานพยาบาล เป็นไปตามกฎกระทรวง\n3.1.1 ป้ายชื่อสถานพยาบาลต้องเป็นสี่เหลี่ยมผืนผ้า ขนาดความกว้างของป้ายไม่น้อยกว่า 40 เซนติเมตร ความยาวไม่น้อยกว่า 120 เซนติเมตร","section":"s4"},{"key":"den_q040","no":"3.1.2","text":"3.1.2 จัดทำแผ่นป้ายแสดงชื่อสถานพยาบาลที่เป็นภาษาไทยขนาดความสูงไม่ต่ำกว่า 10 เซนติเมตร ตัวหนังสือสีม่วงพื้นป้ายสีขาว","section":"s4"},{"key":"den_q041","no":"3.1.3","text":"3.1.3 เลขที่ใบอนุญาตขนาดความสูงไม่ต่ำกว่า 5 เซนติเมตร ตัวเลขสีม่วง","section":"s4"},{"key":"den_q042","no":"3.1.4","text":"3.1.4 กรณีใช้ภาษาต่างประเทศร่วมด้วย ต้องมีชื่อตรงกันกับภาษาไทย ขนาดตัวอักษรต้องเล็กกว่าภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"den_q043","no":"3.2","text":"3.2 ติดตั้งป้ายชื่อสถานพยาบาลในตำแหน่งที่มองเห็นได้ชัดเจนจากภายนอกและเหมาะสม","section":"s4"},{"key":"den_q044","no":"3.3.1","text":"3.3 ชื่อสถานพยาบาลไม่มีข้อความลักษณะชักชวนโอ้อวดเกินจริงหรืออาจสื่อให้เข้าใจผิด\n3.3.1 คำนำหน้าชื่อหรือต่อท้ายของชื่อคลินิกต้องประกอบด้วยลักษณะคลินิก และลักษณะการให้บริการของคลินิก","section":"s4"},{"key":"den_q045","no":"3.3.2","text":"3.3.2 กรณีใช้ชื่อภาษาต่างประเทศด้วย ขนาดตัวอักษรต้องเล็กกว่าอักษรภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"den_q046","no":"3.3.3","text":"3.3.3 ชื่อคลินิกจะต้องไม่ใช้คำหรือข้อความที่มีลักษณะชักชวน โอ้อวดเกินความจริง หรืออาจทำให้เกิดความเข้าใจผิดในสาระสำคัญเกี่ยวกับการประกอบกิจการ","section":"s4"},{"key":"den_q047","no":"3.3.4","text":"3.3.4 ชื่อคลินิกต้องไม่สื่อความหมายหรืออ้างอิงสถาบันพระมหากษัตริย์ เว้นแต่ได้รับพระบรมราชานุญาต","section":"s4"},{"key":"den_q048","no":"3.3.5","text":"3.3.5 คลินิกที่ตั้งอยู่ในอำเภอหรือในเขตเดียวกัน จะต้องมีชื่อไม่ซ้ำกัน เว้นแต่ผู้ขอรับอนุญาตเป็นบุคคลเดียวกันหรือมีหนังสือยินยอมจากผู้ได้รับใบอนุญาตให้ประกอบกิจการคลินิกเดิม ให้ใช้ชื่อซ้ำกันได้ แต่ต้องมีตัวอักษรหรือหมายเลขเรียงลำดับหรือที่ตั้งสถานที่ต่อท้ายชื่อคลินิก","section":"s4"},{"key":"den_q049","no":"3.4","text":"3.4 มีข้อความแสดงวัน เวลา ให้บริการไว้โดยเปิดเผย มองเห็นได้ชัดเจนจากด้านนอกคลินิกและตรงกับเวลาที่ขอรับอนุญาตให้ประกอบกิจการสถานพยาบาล","section":"s4"},{"key":"den_q050","no":"3.5","text":"3.5 มีบริเวณที่ต้องแสดงใบอนุญาตให้ประกอบกิจการและดำเนินการในบริเวณที่เปิดเผย และเหมาะสม เช่น บริเวณที่นั่งพักคอยของผู้รับบริการ","section":"s4"},{"key":"den_q051","no":"3.6","text":"3.6 มีบริเวณที่ใช้แสดงหลักฐานการชำระค่าธรรมเนียมการประกอบกิจการสถานพยาบาล(แบบ ส.พ.12) ในที่เปิดเผยและเห็นได้ชัดเจนบริเวณทางเข้าสถานพยาบาล","section":"s4"},{"key":"den_q052","no":"3.7","text":"3.7 หน้าห้องตรวจมีบริเวณให้ติดป้ายแสดงชื่อ ภาพถ่าย และเลขที่ใบอนุญาตของผู้ประกอบวิชาชีพทันตกรรมที่ให้บริการ หากมีผู้ประกอบวิชาชีพ/ผู้ประกอบโรคศิลปะอื่นปฏิบัติงานให้ยื่น สพ.6 ทุกคนและแสดงป้ายนี้ไว้ในบริเวณที่เปิดเผยและเห็นได้ชัดเจน","section":"s4"},{"key":"den_q053","no":"3.8","text":"3.8 แสดงอัตราค่าบริการและค่ารักษาพยาบาลให้ครอบคลุมการบริการที่เรียกเก็บ โดยแสดงอัตราราคาต่อหน่วย และระบุข้อความด้วยอักษรภาษาไทย โดยแสดงไว้ในที่เปิดเผยให้ผู้รับบริการสามารถเห็นได้ง่าย โดยจัดทำเป็นแผ่นประกาศ แผ่นพับ เล่ม หรือแฟ้มเอกสาร หรือโปรแกรมคอมพิวเตอร์ แสดงให้ผู้ป่วยทราบ","section":"s4"},{"key":"den_q054","no":"3.9","text":"3.9 มีป้ายแสดงให้ผู้รับบริการทราบว่าสามารถสอบถามอัตราค่าบริการและค่ารักษาพยาบาลได้จากที่ใด ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 10 เซนติเมตร แสดงไว้ในที่เห็นได้ชัดเจน","section":"s4"},{"key":"den_q055","no":"3.10","text":"3.10 แสดงคำประกาศสิทธิผู้ป่วยไว้ในที่เปิดเผยและเห็นได้ง่ายอ่านได้ชัดเจน ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 1 เซนติเมตร บริเวณที่พักคอยของผู้รับบริการ","section":"s4"},{"key":"den_q056","no":"3.11","text":"3.11 ข้อความโฆษณาสถานพยาบาล (ถ้ามี) ไม่เป็นเท็จ ไม่โอ้อวด หรือสื่อให้เข้าใจผิดในสาระสำคัญ","section":"s4"},{"key":"den_q057","no":"4.1.1","text":"4.ชนิดและจำนวนเครื่องมือ เครื่องใช้ที่จำเป็นประจำสถานพยาบาล\n4.1 เวชระเบียน\n4.1.1 มีตู้หรือชั้นหรืออุปกรณ์เก็บเวชระเบียนที่มั่นคง ปลอดภัยและต้องจัดให้เป็นระเบียบสามารถค้นหาได้ง่าย","section":"s5"},{"key":"den_q058","no":"4.1.2","text":"4.1.2 มีการจัดเตรียมทะเบียนผู้ป่วย มีรายการดังต่อไปนี้","section":"s5"},{"key":"den_q059","no":"4.1.2 › 1)","text":"1) ชื่อ นามสกุล อายุ ของผู้ป่วย","section":"s5"},{"key":"den_q060","no":"4.1.2 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s5"},{"key":"den_q061","no":"4.1.2 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"den_q062","no":"4.1.3 › 1)","text":"4.1.3 มีเวชระเบียน หรือ บัตรผู้ป่วย ที่สามารถ บันทึกรายละเอียด ตามที่กฎกระทรวงกำหนด\n1) ชื่อและที่อยู่สถานพยาบาล พร้อมเบอร์โทรศัพท์","section":"s5"},{"key":"den_q063","no":"4.1.3 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s5"},{"key":"den_q064","no":"4.1.3 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"den_q065","no":"4.1.3 › 4)","text":"4) ชื่อ นามสกุล อายุ เพศ ที่อยู่ หมายเลขโทรศัพท์ (ถ้ามี) และข้อมูลส่วนบุคคลอื่น ๆ ของผู้ป่วย เช่น เชื้อชาติ สัญชาติ สถานภาพสมรส เลขที่บัตรประจำตัวประชาชน เป็นต้น","section":"s5"},{"key":"den_q066","no":"4.1.3 › 5)","text":"5) อาการเจ็บป่วย การแพ้ยา ผลการตรวจทางร่างกายและผลการตรวจทางห้องปฏิบัติชันสูตรของผู้ป่วย","section":"s5"},{"key":"den_q067","no":"4.1.3 › 6)","text":"6) การวินิจฉัยโรค","section":"s5"},{"key":"den_q068","no":"4.1.3 › 7)","text":"7) การรักษา","section":"s5"},{"key":"den_q069","no":"4.1.3 › 8)","text":"8) ลายมือผู้ประกอบวิชาชีพเวชกรรมที่ให้การรักษาพยาบาล","section":"s5"},{"key":"den_q070","no":"4.2.1","text":"4.2 อุปกรณ์ในห้องทำฟันทุกห้องต้องประกอบด้วย\n4.2.1 ยูนิตทำฟัน ประกอบด้วยระบบให้แสงสว่าง ระบบเครื่องกรอฟัน ระบบดูดน้ำลาย ระบบน้ำบ้วนปาก และเก้าอี้คนไข้","section":"s5"},{"key":"den_q071","no":"4.2.2","text":"4.2.2 เก้าอี้ทันตแพทย์และเก้าอี้ผู้ช่วยทันตแพทย์","section":"s5"},{"key":"den_q072","no":"4.2.3","text":"4.2.3 ชุดตรวจฟัน อุดฟัน ถอนฟัน ชุดศัลยกรรมช่องปาก ชุดรักษาคลองรากฟัน ชุดรักษาโรคเหงือก ชุดทันตกรรมประดิษฐ์ เครื่องขูดหินน้ำลาย และเครื่องมืออุปกรณ์อื่นตามมาตรฐานการประกอบวิชาชีพ โดยต้องมีจำนวนเพียงพอกับผู้รับบริการ","section":"s5"},{"key":"den_q073","no":"4.2.4","text":"4.2.4 อ่างฟอกมือชนิดไม่ใช้มือเปิดปิดน้ำ สบู่หรือเจลล้างมือ ผ้าเช็ดมือหรือกระดาษเช็ดมืออยู่ในห้องทำฟัน","section":"s5"},{"key":"den_q074","no":"5.1","text":"5. ยา และเวชภัณฑ์ในสถานพยาบาล\n5.1 มียาและเวชภัณฑ์อื่นที่จำเป็น โดยมีจำนวน รายการและประมาณเพียงพอ ตามลักษณะสถานพยาบาล","section":"s6"},{"key":"den_q075","no":"5.2","text":"5.2 ไม่มียาที่หมดอายุหรือเสื่อมสภาพ (ให้ใช้ภาชนะบรรจุ ยาเดิมที่ได้มาจากแหล่งผลิตยานั้น)","section":"s6"},{"key":"den_q076","no":"5.3","text":"5.3 มีอุปกรณ์นับเม็ดยา อย่างน้อยสองชุด","section":"s6"},{"key":"den_q077","no":"5.4","text":"5.4 ภาชนะบรรจุยาหรือฉลากติดซองยาให้ระบุชื่อและที่อยู่สถานพยาบาล ชื่อ-สกุลผู้ป่วยพร้อมเบอร์โทรศัพท์ ชื่อยา วิธีใช้ และต้องระบุวันที่ยาหมดอายุอย่างชัดเจน","section":"s6"},{"key":"den_q078","no":"5.5","text":"5.5 มีตู้หรือชั้นเก็บยาและเวชภัณฑ์เป็นสัดส่วน","section":"s6"},{"key":"den_q079","no":"5.6","text":"5.6 มีตู้เย็นสำหรับเก็บยาหรือเวชภัณฑ์อื่น กรณีที่มีวัคซีน หรือยาที่ต้องเก็บไว้ในอุณหภูมิต่ำ ตู้เย็นนั้น ต้องมีการควบคุมอุณหภูมิ มีปรอทวัดอุณหภูมิ","section":"s6"},{"key":"den_q080","no":"5.7","text":"5.7 ยาต้องมีทะเบียน เว้นแต่เป็นการผลิตตามใบสั่งยาของ\nผู้ประกอบวิชาชีพเวชกรรมที่สั่งให้สำหรับคนไข้เฉพาะรายของสถานพยาบาล กรณีการผลิตยาของสถานพยาบาลต้องมีมาตรฐานการผลิต การแสดงฉลากและวันหมดอายุให้ชัดเจน","section":"s6"},{"key":"den_q081","no":"5.8","text":"5.8 ในกรณีคลินิกที่ให้บริการอุดฟันด้วยอมัลกัม ควรจัดให้มี Amalgam Separator เพื่อกรองเศษอมัลกัมและแยกทิ้งในถังขยะมีพิษ หรือมีวิธีกำจัดอื่นที่เหมาะสม","section":"s6"},{"key":"den_q082","no":"6","text":"6. ชุดช่วยชีวิตฉุกเฉิน ประกอบด้วย","section":"s7"},{"key":"den_q083","no":"6.1","text":"6.1 ยา เวชภัณฑ์และเครื่องมือแพทย์อื่นที่สามารถให้การรักษาพยาบาลและช่วยชีวิตผู้ป่วยฉุกเฉินตามลักษณะสถานพยาบาล ในคลินิกทันตกรรม ยาจะต้องมีเพียงพอกับการให้บริการ มีฉลากที่ถูกต้องตามกฎหมายให้ตรวจสอบ และไม่มียาที่หมดอายุหรือเสื่อมสภาพ ต้องมีครบทุกรายการ ได้แก่","section":"s7"},{"key":"den_q084","no":"6.1 › 1)","text":"(๑) ยาฉีด Adrenaline ๑ : ๑๐๐๐","section":"s7"},{"key":"den_q085","no":"6.1 › 2)","text":"(๒)ยาฉีด Steroid injection เช่น Dexamethazone Injection หรือ Hydrocortizone","section":"s7"},{"key":"den_q086","no":"6.1 › 3)","text":"(๓) ยาฉีด Chlorphenilamine injection","section":"s7"},{"key":"den_q087","no":"6.1 › 4)","text":"(๔) ๕๐% Glucose injection","section":"s7"},{"key":"den_q088","no":"6.1 › 5)","text":"(๕) ยาอมใต้ลิ้นเพื่อขยายหลอดเลือดหัวใจ","section":"s7"},{"key":"den_q089","no":"6.1 › 6)","text":"(6) ถุงบีบลมเพื่อช่วยหายใจพร้อมหน้ากากครอบช่วย\nการหายใจตามลักษณะการให้บริการของสถานพยาบาล ๑ ชุด","section":"s7"},{"key":"den_q090","no":"6.1 › 7)","text":"(7) NSS ๑,๐๐๐ cc. พร้อมชุดให้สารน้ำทางหลอดเลือดดำ (set IV fluid) ๒ ชุด","section":"s7"},{"key":"den_q091","no":"6.1 › 2)","text":"(8) Medicut หรือเข็มแทงหลอดเลือดดำเพื่อให้น้ำเกลือ\n๒ ชุด","section":"s7"},{"key":"den_q092","no":"6.1 › 9)","text":"(9) Disposable Syringe ๕ หลอด","section":"s7"},{"key":"den_q093","no":"6.1 › 10)","text":"(10) เข็ม Disposable ๕ อัน","section":"s7"},{"key":"den_q094","no":"6.1 › 11)","text":"(11) เสาแขวนน้ำเกลือ (Stand) ที่เคลื่อนย้ายได้ ๑ อัน","section":"s7"},{"key":"den_q095","no":"6.1 › 12)","text":"(12) Oral Airway ๑ อัน","section":"s7"},{"key":"den_q096","no":"6.1 › 13)","text":"(13) Oxygen Tank พร้อมอุปกรณ์วัดปริมาณออกซิเจน","section":"s7"},{"key":"den_q097","no":"6.1 › 14)","text":"(14) ในกรณีคลินิกทันตกรรมที่มีห้องผ่าตัดใหญ่จะต้องมีเครื่องกระตุกหัวใจ (Defibrilator)","section":"s7"},{"key":"den_q098","no":"6.2 › 1)","text":"6.2 มีแผนการส่งต่อผู้ป่วย และการเตรียมความพร้อมในสถานการณ์ฉุกเฉิน\n(๑) มีเบอร์โทรศัพท์ฉุกเฉินติดต่อโรงพยาบาลหรือสถานพยาบาลที่มีศักยภาพสูงกว่าในการช่วยฟื้นคืนชีพ ติดไว้ในที่เห็นได้ชัดเจน","section":"s7"},{"key":"den_q099","no":"6.2 › 2)","text":"(๒) มีแผนและขั้นตอนการช่วยชีวิตเบื้องต้นที่ได้มาตรฐาน และขั้นตอนการส่งต่อผู้ป่วย","section":"s7"},{"key":"den_q100","no":"7.1","text":"7.บริเวณทำความสะอาด จะต้องมี\n7.1 หม้อนึ่งอบความดันที่มีประสิทธิภาพในการฆ่าเชื้อ (Autoclave) พร้อมทั้งให้จัดทำคู่มือ หรือแผนภูมิแสดงขั้นตอนการทำความสะอาดและทำให้เครื่องมือปราศจากเชื้อ","section":"s8"},{"key":"den_q101","no":"7.2","text":"7.2 บริเวณล้างเครื่องมือที่ใช้แล้ว","section":"s8"},{"key":"den_q102","no":"8.1","text":"8. กรณีมีห้องผ่าตัดเล็ก เช่น ผ่าฟันคุด เป็นต้น สามารถกระทำได้ที่ห้องทำฟัน (ห้องผ่าตัดเล็ก หมายถึง ห้องผ่าตัดที่มีการทำหัตถการโดยใช้ยาชาเฉพาะที่ (Local Anesthesia) รวมทั้งยารับประทานที่ทำให้ผู้ป่วยเคลิ้มหลับ ได้แก่ ยากล่อมประสาท หรือ ยาคลายเครียด (Tranquilizer Drug) ทั้งนี้ไม่รวมถึงยา Domicum ชนิดรับประทาน ซึ่งเป็นยาที่ทำให้ผู้ป่วยหลับ นอกจากนี้ไม่รวมถึงการฉีดยาชาเข้าเส้นเลือดดำที่ทำให้ผู้ป่วยเคลิ้มหลับ)\n8.1 ระบุวิธีการให้ยาระงับความรู้สึกและยาที่ใช้","section":"s9","kind":"text"},{"key":"den_q103","no":"8.2","text":"8.2 หัตถการหรือการทำผ่าตัดเล็ก (ระบุ)","section":"s9","kind":"text"}],"ack":"ข้าพเจ้าได้อ่านและรับทราบผลการตรวจสถานพยาบาลนี้แล้วและจะปฏิบัติตามคำแนะนำของพนักงานเจ้าหน้าที่อย่างเคร่งครัด ทั้งนี้พนักงานเจ้าหน้าที่ไม่ได้ทำการละเมิด ข่มขู่ หรือทำให้ทรัพย์สินของสถานพยาบาลหรือบุคคลในสถานพยาบาลเสียหาย สูญหาย หรือเสื่อมค่าแต่ประการใด","note":"","instruction":"โปรดใส่เครื่องหมาย ✓ เมื่อถูกต้อง และเครื่องหมาย × เมื่อไม่จัดให้มีหรือไม่ถูกต้อง กรณีไม่มีบริการที่เกี่ยวข้องในหัวข้อนั้น ๆ ใส่เครื่องหมาย –"},"nursing":{"id":"nursing","prefix":"nur","sheet":"chk_nursing","title":"บันทึกการตรวจมาตรฐานคลินิกการพยาบาลและการผดุงครรภ์ ประจำปี","short":"คลินิกการพยาบาลและการผดุงครรภ์","icon":"heart","color":"#1c86c8","source":"คลินิกการพยาบาลและการผดุงครรภ์.docx","fields":[{"key":"service_area","label":"10. พื้นที่ให้บริการประกอบด้วย","type":"textarea","maxlength":2000},{"key":"addl_services_text","label":"11. การบริการที่จัดให้มีเพิ่มเติม","type":"textarea","maxlength":2000}],"groups":[{"title":"หัวแบบบันทึก","fields":["inspection_year","inspection_date"]},{"title":"ส่วนที่ 1 ข้อมูลใบอนุญาต (ข้อ 1–6)","fields":["clinic_name","license_business_no","license_operate_no","operator_name","manager_name","opening_hours"]},{"title":"7. ชื่อผู้ประกอบวิชาชีพร่วมที่พบ","fields":["co_practitioner_1_name","co_practitioner_1_license","co_practitioner_2_name","co_practitioner_2_license","co_practitioner_3_name","co_practitioner_3_license"]},{"title":"8. ที่ตั้ง","fields":["addr_no","addr_soi","addr_road","addr_moo","addr_tambon","addr_amphoe","addr_province","phone"]},{"title":"9. ลักษณะอาคารที่ตั้งคลินิก","fields":["building_type","building_commercial_floors","building_floor_located","building_type_other"]},{"title":"พื้นที่ให้บริการ บริการเพิ่มเติม และเครื่องมือ","fields":["service_area","addl_services_text"]}],"final":[{"title":"ความเห็นของพนักงานเจ้าหน้าที่","fields":["officer_opinion"]},{"title":"ลงชื่อ","fields":["officer_1_name","officer_1_sig","officer_2_name","officer_2_sig","officer_3_name","officer_3_sig","officer_4 ถานที่\n1. ลักษณะโดยทั่วไปของสถานพยาบาล","section":"s2"},{"key":"nur_q005","no":"1.1","text":"1.1 ตั้งอยู่ในทำเลที่สะดวก ปลอดภัยและไม่เป็นอันตรายต่อสุขภาพ","section":"s2"},{"key":"nur_q006","no":"1.2","text":"1.2 อาคารต้องมั่นคงแข็งแรง ไม่อยู่ในสภาพชำรุดหรือเสี่ยงต่ออันตรายจากการใช้สอย","section":"s2"},{"key":"nur_q007","no":"1.3","text":"1.3 บริเวณทั้งภายนอกและภายในต้องสะอาด เป็นระเบียบเรียบร้อย จัดแบ่งพื้นที่ใช้สอยอย่างเหมาะสม และมีสิ่งอำนวยความสะดวกแก่ผู้ป่วย โดยมีลักษณะดังนี้","section":"s2"},{"key":"nur_q008","no":"1.3.1","text":"1.3.1 มีพื้นที่โดยรวมไม่ต่ำกว่า 20 ตารางเมตร โดยส่วนแคบที่สุดต้องมีความกว้างไม่น้อยกว่า 3.00 เมตร","section":"s2"},{"key":"nur_q009","no":"1.3.2","text":"1.3.2 มีส่วนที่นั่งพักคอยของผู้ป่วยและญาติที่เหมาะสม ไม่น้อยกว่า 5- 10 ที่นั่งและที่นั่งต้องมีพนักพิง","section":"s2"},{"key":"nur_q010","no":"1.4","text":"1.4 การสัญจรและการเคลื่อนย้ายผู้ป่วยต้องกระทำได้โดยสะดวก โดยเฉพาะเมื่อเกิดภาวะฉุกเฉิน ขนาดความกว้างของประตู เข้า-ออก ไม่ต่ำกว่า 80 เซนติเมตร","section":"s2"},{"key":"nur_q011","no":"1.5.1","text":"1.5 ห้องตรวจหรือห้องให้การรักษา\n1.5.1 ห้องตรวจหรือห้องให้การรักษากั้นเป็นสัดส่วนและมิดชิด มีประตู เปิด-ปิด อย่างชัดเจน","section":"s2"},{"key":"nur_q012","no":"1.5.2","text":"1.5.2 ภายในห้องตรวจต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์ 1 เตียง","section":"s2"},{"key":"nur_q013","no":"1.5.3","text":"1.5.3 อ่างฟอกมือชนิดไม่ใช้มือเปิด-ปิดน้ำ พร้อมมีสบู่เหลว ผ้าเช็ดมือหรือกระดาษเช็ดมือที่ใช้ครั้งเดียว","section":"s2"},{"key":"nur_q014","no":"1.5.4","text":"1.5.4 ไม่มีวงจรปิดในห้องตรวจหรือห้องที่เกี่ยวกับการประกอบวิชาชีพหรือการประกอบโรคศิลปะ","section":"s2"},{"key":"nur_q015","no":"1.6","text":"1.6 มีห้องน้ำห้องส้วมที่ถูกสุขลักษณะอย่างน้อยหนึ่งห้องหรือมีห้องน้ำส่วนรวมในกรณีอาคารศูนย์การค้าหรืออาคารสำนักงาน","section":"s2"},{"key":"nur_q016","no":"1.7","text":"1.7 มีแสงสว่างและการระบายอากาศเพียงพอ ไม่มีกลิ่นอับทึบ (หากความสูงของสถานพยาบาลต่ำกว่า 2.6 เมตร ต้องเพิ่มพัดลมดูดอากาศที่เหมาะสม)","section":"s2"},{"key":"nur_q017","no":"1.8.1","text":"1.8 มีระบบการเก็บและกำจัดมูลฝอยและสิ่งปฏิกูลที่เหมาะสม และมีการกำจัดอย่างเหมาะสม\n1.8.1 ทุกห้องตรวจและทุกห้องที่ให้บริการผู้ป่วย ต้องมีถังขยะทั่วไป–ถังขยะติดเชื้อ ที่มีลักษณะถังขยะแบบใช้เท้าเหยียบให้เปิด มีฝาปิดมิดชิด ถังขยะติดเชื้อใช้ถุงสีแดง เขียนข้อความ “ขยะติดเชื้อ”ไว้ที่ถังขยะ แยกต่างหากจากถังขยะทั่วไป ใช้ถุงสีดำ เขียนข้อความ “ขยะทั่วไป” ไว้ที่ถังขยะ วางคู่กันทุกห้อง","section":"s2"},{"key":"nur_q018","no":"1.8.2","text":"1.8.2 มีสัญญา/หนังสือตอบรับการขนถ่ายขยะติดเชื้อ ของการจ้างบริษัทกำจัดขยะติดเชื้อ หรืออาจแสดงใบเสร็จรับเงินที่เป็นเดือนปัจจุบัน","section":"s2"},{"key":"nur_q019","no":"1.9","text":"1.9 มีระบบควบคุมการติดเชื้อที่เหมาะสม ตามวิธีการป้องกันการติดเชื้อในคลินิก","section":"s2"},{"key":"nur_q020","no":"1.11.1","text":"1.10 มีเครื่องดับเพลิงขนาดเหมาะสม ตามที่กฎหมายท้องถิ่นบัญญัติ และอยู่ในสภาพพร้อมใช้งาน ติดตั้งในที่มองเห็นได้ชัดเจน\n1.11.1 ขนาดเครื่องดับเพลิงไม่ต่ำกว่า 10 ปอนด์","section":"s2"},{"key":"nur_q021","no":"1.11.2","text":"1.11.2 มีเครื่องดับเพลิงติดตั้งทุกชั้น","section":"s2"},{"key":"nur_q022","no":"1.11.3","text":"1.11.3 ติดตั้งเครื่องดับเพลิงส่วนบนสูงจากพื้นไม่เกิน 1.5 เมตร หรือวางกับพื้นมีฐานรองรับที่มั่นคง อยู่ในที่มองเห็นอย่างชัดเจน และควรมีป้ายแสดงจุดที่ตั้งถังดับเพลิง","section":"s2"},{"key":"nur_q023","no":"1.12","text":"1.12 มีป้ายเครื่องหมายห้ามสูบบุหรี่","section":"s2"},{"key":"nur_q024","no":"2.1","text":"2. คลินิกต้องมีลักษณะการให้บริการดังต่อไปนี้\n2.1 มีความปลอดภัย มีความสะดวก และเหมาะสมต่อ\nผู้ให้บริการและผู้รับบริการ","section":"s3"},{"key":"nur_q025","no":"2.2","text":"2.2 มีการให้บริการที่ได้มาตรฐานตามลักษณะวิชาชีพ ตามที่สภาวิชาชีพหรือคณะกรรมการวิชาชีพประกาศกำหนด แล้วแต่กรณี","section":"s3"},{"key":"nur_q026","no":"2.3","text":"2.3 พื้นที่ให้บริการจะต้องมีพื้นที่เชื่อมและเปิดติดต่อถึงกันได้และไม่ตั้งอยู่ในพื้นที่เดียวกับสถานที่ขายยาตามกฎหมายว่าด้วยยาหรือพื้นที่เดียวกับการประกอบอาชีพอื่น","section":"s3"},{"key":"nur_q027","no":"2.4","text":"2.4 พื้นที่ให้บริการจะต้องไม่ตั้งอยู่ในสถานที่เดียวกับสถานพยาบาลของกระทรวง ทบวง กรม กรุงเทพมหานคร เมืองพัทยา องค์การบริการส่วนจังหวัด เทศบาล องค์การบริการส่วนตำบล องค์กรปกครองส่วนท้องถิ่นอื่น และสภากาชาดไทย ซึ่งให้บริการในลักษณะเดียวกัน","section":"s3"},{"key":"nur_q028","no":"2.5","text":"2.5 ในกรณีที่มีการให้บริการในอาคารเดียวกับการประกอบกิจการอื่น จะต้องมีการแบ่งพื้นที่ให้ชัดเจน และกิจการอื่นต้องไม่กระทบกระเทือนต่อการประกอบวิชาชีพ รวมทั้งสามารถเคลื่อนย้ายผู้ป่วยฉุกเฉินได้สะดวก","section":"s3","condHead":true,"cond":"nur_g1"},{"key":"nur_q029","no":"2.5.1","text":"2.5.1 สถานพยาบาลต้องมีประตู เข้า-ออก คนละทางกับการประกอบกิจการอื่น","section":"s3","cond":"nur_g1"},{"key":"nur_q030","no":"2.5.2","text":"2.5.2 การกั้นพื้นที่ต้องเป็นสัดส่วน แสดงให้เห็นประจักษ์ ชัดเจนและถาวร","section":"s3","cond":"nur_g1"},{"key":"nur_q031","no":"2.6","text":"2.6 ในกรณีที่มีการให้บริการของลักษณะสหคลินิกหรือ มีคลินิกหลายลักษณะ อยู่ในอาคารเดียวกัน จะต้องมีการแบ่งสัดส่วนพื้นที่ให้ชัดเจน และแต่ละสัดส่วนต้องมีพื้นที่และลักษณะตามมาตรฐานของการให้บริการนั้น แต่ละสาขาต้องมีอย่างน้อย 1 ห้องตรวจโรค ซึ่งต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรค 1 เตียง ที่ได้มาตรฐานทางการแพทย์ และอ่างฟอกมือชนิดที่ไม่ใช้มือ เปิด-ปิดน้ำ สบู่","section":"s3"},{"key":"nur_q032","no":"3.1.1","text":"3. การแสดงรายละเอียดเกี่ยวกับชื่อสถานพยาบาล ผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะในสถานพยาบาล อัตราค่ารักษาพยาบาล ค่าบริการและสิทธิผู้ป่วย\n3.1 มีป้ายชื่อสถานพยาบาล เป็นไปตามกฎกระทรวง\n3.1.1 ป้ายชื่อสถานพยาบาลต้องเป็นสี่เหลี่ยมผืนผ้า ขนาดความกว้างของป้ายไม่น้อยกว่า 40 เซนติเมตร ความยาวไม่น้อยกว่า 120 เซนติเมตร","section":"s4"},{"key":"nur_q033","no":"3.1.2","text":"3.1.2 จัดทำแผ่นป้ายแสดงชื่อสถานพยาบาลที่เป็นภาษาไทยขนาดความสูงไม่ต่ำกว่า 10 เซนติเมตร ตัวหนังสือสีฟ้า สีพื้นป้ายสีขาว","section":"s4"},{"key":"nur_q034","no":"3.1.3","text":"3.1.3 เลขที่ใบอนุญาตขนาดความสูงไม่ต่ำกว่า 5 เซนติเมตร ตัวเลขสีฟ้า","section":"s4"},{"key":"nur_q035","no":"3.1.4","text":"3.1.4 กรณีใช้ภาษาต่างประเทศร่วมด้วย ต้องมีชื่อตรงกันกับภาษาไทย ขนาดตัวอักษรต้องเล็กกว่าภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"nur_q036","no":"3.2","text":"3.2 ติดตั้งป้ายชื่อสถานพยาบาลในตำแหน่งที่มองเห็นได้ชัดเจนจากภายนอกและเหมาะสม","section":"s4"},{"key":"nur_q037","no":"3.3.1","text":"3.3 ชื่อสถานพยาบาลไม่มีข้อความลักษณะชักชวนโอ้อวดเกินจริงหรืออาจสื่อให้เข้าใจผิด\n3.3.1 คำนำหน้าชื่อหรือต่อท้ายของชื่อคลินิกต้องประกอบด้วยลักษณะคลินิก และลักษณะการให้บริการของคลินิก “คลินิกการพยาบาลและการผดุงครรภ์”","section":"s4"},{"key":"nur_q038","no":"3.3.2","text":"3.3.2 กรณีใช้ชื่อภาษาต่างประเทศด้วย ขนาดตัวอักษรต้องเล็กกว่าอักษรภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"nur_q039","no":"3.3.3","text":"3.3.3 ชื่อคลินิกจะต้องไม่ใช้คำหรือข้อความที่มีลักษณะชักชวน โอ้อวดเกินความจริง หรืออาจทำให้เกิดความเข้าใจผิดในสาระสำคัญเกี่ยวกับการประกอบกิจการ","section":"s4"},{"key":"nur_q040","no":"3.3.4","text":"3.3.4 ชื่อคลินิกต้องไม่สื่อความหมายหรืออ้างอิงสถาบันพระมหากษัตริย์ เว้นแต่ได้รับพระบรมราชานุญาต","section":"s4"},{"key":"nur_q041","no":"3.3.5","text":"3.3.5 คลินิกที่ตั้งอยู่ในอำเภอหรือในเขตเดียวกัน จะต้องมีชื่อไม่ซ้ำกัน เว้นแต่ผู้ขอรับอนุญาตเป็นบุคคลเดียวกันหรือมีหนังสือยินยอมจากผู้ได้รับใบอนุญาตให้ประกอบกิจการคลินิกเดิม ให้ใช้ชื่อซ้ำกันได้ แต่ต้องมีตัวอักษรหรือหมายเลขเรียงลำดับหรือที่ตั้งสถานที่ต่อท้ายชื่อคลินิก","section":"s4"},{"key":"nur_q042","no":"3.4","text":"3.4 มีข้อความแสดงวัน เวลา ให้บริการไว้โดยเปิดเผย มองเห็นได้ชัดเจนจากด้านนอกคลินิกและตรงกับเวลาที่ขอรับอนุญาตให้ประกอบกิจการสถานพยาบาล","section":"s4"},{"key":"nur_q043","no":"3.5","text":"3.5 มีบริเวณที่ต้องแสดงใบอนุญาตให้ประกอบกิจการและดำเนินการในบริเวณที่เปิดเผยและเหมาะสม เช่น บริเวณที่นั่งพักคอยของผู้รับบริการ","section":"s4"},{"key":"nur_q044","no":"3.6","text":"3.6 มีบริเวณที่ใช้แสดงหลักฐานการชำระค่าธรรมเนียมการประกอบกิจการสถานพยาบาล(แบบ ส.พ.12) ในที่เปิดเผยและเห็นได้ชัดเจนบริเวณทางเข้าสถานพยาบาล","section":"s4"},{"key":"nur_q045","no":"3.7","text":"3.7 หน้าห้องตรวจมีบริเวณให้ติดป้ายแสดงชื่อ ภาพถ่าย และเลขที่ใบอนุญาตของผู้ประกอบวิชาชีพการพยาบาลและการผดุงครรภ์ ที่ให้บริการ หากมีผู้ประกอบวิชาชีพอื่นปฏิบัติงานให้ยื่น สพ.6 ทุกคนและแสดงป้ายนี้ไว้ในบริเวณที่เปิดเผยและเห็นได้ชัดเจน","section":"s4"},{"key":"nur_q046","no":"3.8","text":"3.8 แสดงอัตราค่าบริการและค่ารักษาพยาบาลให้ครอบคลุมการบริการที่เรียกเก็บ โดยแสดงอัตราราคาต่อหน่วย และระบุข้อความด้วยอักษรภาษาไทย(อาจมีภาษาต่างประเทศร่วมด้วยได้) โดยแสดงไว้ในที่เปิดเผยให้ผู้รับบริการสามารถเห็นได้ง่าย โดยจัดทำเป็นแผ่นประกาศ แผ่นพับ เล่ม หรือแฟ้มเอกสาร หรือโปรแกรมคอมพิวเตอร์ แสดงให้ผู้ป่วยทราบ","section":"s4"},{"key":"nur_q047","no":"3.9","text":"3.9 มีป้ายแสดงให้ผู้รับบริการทราบว่าสามารถสอบถามอัตราค่าบริการและค่ารักษาพยาบาลได้จากที่ใด ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 10 เซนติเมตร แสดงไว้ในที่เห็นได้ชัดเจน","section":"s4"},{"key":"nur_q048","no":"3.10","text":"3.10 แสดงคำประกาศสิทธิผู้ป่วยไว้ในที่เปิดเผยและเห็นได้ง่ายอ่านได้ชัดเจน ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 1 เซนติเมตร บริเวณที่พักคอยของผู้รับบริการ","section":"s4"},{"key":"nur_q049","no":"3.11","text":"3.11 ข้อความโฆษณาสถานพยาบาล (ถ้ามี) ไม่เป็นเท็จ ไม่โอ้อวด หรือสื่อให้เข้าใจผิดในสาระสำคัญ","section":"s4"},{"key":"nur_q050","no":"4.1.1","text":"4.ชนิดและจำนวนเครื่องมือ เครื่องใช้ที่จำเป็นประจำสถานพยาบาล\n4.1 เวชระเบียน\n4.1.1 มีตู้หรือชั้นหรืออุปกรณ์เก็บเวชระเบียนที่มั่นคง ปลอดภัยและต้องจัดให้เป็นระเบียบสามารถค้นหาได้ง่าย","section":"s5"},{"key":"nur_q051","no":"4.1.2","text":"4.1.2 มีการจัดเตรียมทะเบียนผู้ป่วย มีรายการดังต่อไปนี้","section":"s5"},{"key":"nur_q052","no":"4.1.2 › 1)","text":"1) ชื่อ นามสกุล อายุ ของผู้ป่วย","section":"s5"},{"key":"nur_q053","no":"4.1.2 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s5"},{"key":"nur_q054","no":"4.1.2 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"nur_q055","no":"4.1.3 › 1)","text":"4.1.3 มีเวชระเบียน หรือ บัตรผู้ป่วย ที่สามารถ บันทึกรายละเอียด ตามที่กฎกระทรวงกำหนด\n1) ชื่อและที่อยู่สถานพยาบาล","section":"s5"},{"key":"nur_q056","no":"4.1.3 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s5"},{"key":"nur_q057","no":"4.1.3 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"nur_q058","no":"4.1.3 › 4)","text":"4) ชื่อ นามสกุล อายุ เพศ ที่อยู่ หมายเลขโทรศัพท์ (ถ้ามี) และข้อมูลส่วนบุคคลอื่น ๆ ของผู้ป่วย เช่น เชื้อชาติ สัญชาติ สถานภาพสมรส เลขที่บัตรประจำตัวประชาชน เป็นต้น","section":"s5"},{"key":"nur_q059","no":"4.1.3 › 5)","text":"5) อาการเจ็บป่วย การแพ้ยา ผลการตรวจทางร่างกายและผลการตรวจทางห้องปฏิบัติชันสูตรของผู้ป่วย","section":"s5"},{"key":"nur_q060","no":"4.1.3 › 6)","text":"6) การวินิจฉัยโรค","section":"s5"},{"key":"nur_q061","no":"4.1.3 › 7)","text":"7) การรักษา","section":"s5"},{"key":"nur_q062","no":"4.1.3 › 8)","text":"8) ลายมือผู้ประกอบวิชาชีพการพยาบาลและ การผดุงครรภ์ ที่ให้การรักษาพยาบาล","section":"s5"},{"key":"nur_q063","no":"4.2.1","text":"4.2 ห้องตรวจโรคหรือห้องให้การรักษา ประกอบด้วยอุปกรณ์ ดังต่อไปนี้\n4.2.1 โต๊ะตรวจโรค พร้อมเก้าอี้","section":"s5"},{"key":"nur_q064","no":"4.2.2","text":"4.2.2 เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์ (พื้นแข็งสามารถช่วยฟื้นคืนชีพได้ตามหลักวิชาชีพ และไม่ใช่เตียงที่มีการยกระดับขึ้นลง เช่นเตียงที่ให้บริการความงาม หรือเสริมสวย","section":"s5"},{"key":"nur_q065","no":"4.2.3","text":"๔.๒.๓ มีบันไดขึ้นเตียง (Step)","section":"s5"},{"key":"nur_q066","no":"4.2.4","text":"4.2.4 ที่นอน หมอน และผ้าคลุมตัว","section":"s5"},{"key":"nur_q067","no":"4.2.5","text":"4.2.5 อ่างฟอกมือชนิดไม่ใช้มือเปิดปิดน้ำ สบู่ หรือเจลล้างมือ ผ้าเช็ดมือหรือกระดาษเช็ดมือ","section":"s5"},{"key":"nur_q068","no":"4.3.1","text":"4.๓ เครื่องมือ เครื่องใช้ หรืออุปกรณ์ ที่จำเป็น\n4.๓.1 เครื่องวัดความดันโลหิต","section":"s5"},{"key":"nur_q069","no":"4.3.2","text":"4.๓.๒ ปรอทวัดอุณหภูมิร่างกายสำหรับเด็ก และผู้ใหญ่","section":"s5"},{"key":"nur_q070","no":"4.3.3","text":"4.๓.๓ ไฟฉาย ไม้กดลิ้น","section":"s5"},{"key":"nur_q071","no":"4.3.4","text":"4.๓.๔ เครื่องชั่งน้ำหนัก","section":"s5"},{"key":"nur_q072","no":"4.3.5","text":"4.๓.๕ เครื่องวัดความสูง และสายวัดความยาวของเด็กทารก","section":"s5"},{"key":"nur_q073","no":"4.3.6","text":"4.๓.๖ ชุดทำแผล","section":"s5"},{"key":"nur_q074","no":"4.3.7","text":"4.๓.๗ อุปกรณ์เช็ดตัวลดไข้","section":"s5"},{"key":"nur_q075","no":"4.3.8","text":"4.๓.๘ มีโต๊ะ ตู้ หรือชั้นสำหรับวางอุปกรณ์ เครื่องมือ เครื่องใช้","section":"s5"},{"key":"nur_q076","no":"4.4.1","text":"4.๔ ชุดตรวจมารดาตั้งครรภ์ (หากมีบริการ) ประกอบด้วย\n4.๔.1 เครื่องฟังเสียงหัวใจเด็ก ได้แก่ หูฟัง ( Stethoscope)","section":"s5","condHead":true,"cond":"nur_g4"},{"key":"nur_q077","no":"4.4.2","text":"4.๔.๒ เครื่องวัดเชิงกรานหรือสายวัด","section":"s5","cond":"nur_g4"},{"key":"nur_q078","no":"4.5","text":"4.๕ เตียงตรวจครรภ์ (หากมีบริการ) ต้องมีลักษณะที่มั่นคง แข็งแรง ปลอดภัย สำหรับหญิงตั้งครรภ์ ความสูงของเตียงต่ำกว่าเตียงตรวจโรค และมีความกว้างกว่าเตียงทั่วไป","section":"s5"},{"key":"nur_q079","no":"4.6.1 › 1)","text":"4.๖ ชุดทำคลอด (หากมีบริการ) ประกอบด้วย\n4.๖.1 ชุดทำคลอดปราศจากเชื้อ ประกอบด้วย\n(1) กะละมังหรือถาด สำหรับรองรับรก","section":"s5","condHead":true,"cond":"nur_g6"},{"key":"nur_q080","no":"4.6.1 › 2)","text":"(๒) ถ้วย 3 ใบ (สำหรับใส่น้ำยาฆ่าเชื้อ เช่น savlon 1:100 สำลีก้อนเล็ก 2 ก้อน ชุบ 3% Boric acid หรือ NSS สำหรับเช็ดตา และสำลีก้อนใหญ่ 1 ก้อน ชุบ 70% แอลกอฮอล์ หรือ Triple dye สำหรับเช็ดสะดือ)","section":"s5","cond":"nur_g6"},{"key":"nur_q081","no":"4.6.1 › 3)","text":"(๓) ลูกสูบยางแดง 1 อัน สำหรับทารกแรกเกิด","section":"s5","cond":"nur_g6"},{"key":"nur_q082","no":"4.6.1 › 4)","text":"(๔) เชือก หรือ ยางรัดสายสะดือ 1-2 เส้น","section":"s5","cond":"nur_g6"},{"key":"nur_q083","no":"4.6.1 › 5)","text":"(๕) ผ้าก๊อส","section":"s5","cond":"nur_g6"},{"key":"nur_q084","no":"4.6.1 › 6)","text":"(๖) สำลี","section":"s5","cond":"nur_g6"},{"key":"nur_q085","no":"4.6.1 › 7)","text":"(๗) ผ้า safe perineum ผ้าสี่เหลี่ยมเจาะกลาง 1 ผืน","section":"s5","cond":"nur_g6"},{"key":"nur_q086","no":"4.6.1 › 8)","text":"(๘) ผ้าเช็ดตัวหรือผ้าก๊อสสำหรับเช็ดตัวทารกให้แห้ง","section":"s5","cond":"nur_g6"},{"key":"nur_q087","no":"4.6.2 › 1)","text":"4.๖.๒ ผ้าสี่เหลี่ยมที่สะอาด\n(1) ผ้าคลุมหน้าท้อง","section":"s5","cond":"nur_g6"},{"key":"nur_q088","no":"4.6.2 › 2)","text":"(๒) ผ้าปูรองก้น","section":"s5","cond":"nur_g6"},{"key":"nur_q089","no":"4.6.2 › 3)","text":"(๓) ผ้ารองรับทารก","section":"s5","cond":"nur_g6"},{"key":"nur_q090","no":"4.6.3 › 1)","text":"4.๖.๓ ชุดเครื่องมือทำคลอดปราศจากเชื้อประกอบด้วย\n(1) Sponge holding forceps 1 ด้าม สำหรับคีบสำลีทำความสะอาดภายหลังการฟอกบริเวณอวัยวะสืบพันธุ์","section":"s5","cond":"nur_g6"},{"key":"nur_q091","no":"4.6.3 › 2)","text":"(๒) กรรไกรตัดฝีเย็บ 1 ด้าม","section":"s5","cond":"nur_g6"},{"key":"nur_q092","no":"4.6.3 › 3)","text":"(๓) Long arterial forceps หรือ Kocher clamps 2 ด้าม สำหรับหนีบสายสะดือก่อนการตัดสายสะดือ","section":"s5","cond":"nur_g6"},{"key":"nur_q093","no":"4.6.3 › 4)","text":"(๔) กรรไกรตัดสายสะดือ 1 ด้าม","section":"s5","cond":"nur_g6"},{"key":"nur_q094","no":"4.6.3 › 5)","text":"(๕) Tooth forceps หรือ Arterial forceps 1 ด้าม สำหรับเลื่อนยางรัดสายสะดือ","section":"s5","cond":"nur_g6"},{"key":"nur_q095","no":"4.6.3 › 6)","text":"(๖) กรรไกรตัดไหม 1 ด้าม","section":"s5","cond":"nur_g6"},{"key":"nur_q096","no":"4.6.3 › 7)","text":"(๗) Needle holder 1 ด้าม พร้อมไหมเย็บแผล","section":"s5","cond":"nur_g6"},{"key":"nur_q097","no":"4.6.4","text":"4.๖.๔ น้ำยา ทำความสะอาดอวัยวะสืบพันธุ์ของมารดา น้ำยาเช็ดตาเด็ก และน้ำยาเช็ดสะดือ","section":"s5","cond":"nur_g6"},{"key":"nur_q098","no":"4.7 › 1)","text":"4.๗ ชุดตรวจหลังคลอด (หากมีบริการ) ประกอบด้วย\n(1) สายวัด","section":"s5","condHead":true,"cond":"nur_g7"},{"key":"nur_q099","no":"4.7 › 2)","text":"(๒) กรรไกรตัดไหม","section":"s5","cond":"nur_g7"},{"key":"nur_q100","no":"4.8.1","text":"4.๘ ยาและเวชภัณฑ์ที่จำเป็น โดยมีจำนวนรายการและปริมาณที่เพียงพอตามมาตรฐานการประกอบวิชาชีพ มีฉลากที่ถูกต้องตามกฎหมายให้ตรวจสอบ และไม่มียาที่หมดอายุหรือเสื่อมสภาพ หากมียาให้มีดังนี้ (ไม่จำเป็นต้องมีครบทุกรายการแล้วแต่ความประสงค์)\n๔.๘.๑ ยาสามัญประจำบ้านหรือยาตาราหลวง (มีข้อความระบุในฉลากยา)","section":"s5"},{"key":"nur_q101","no":"4.8.2 › 2)","text":"๔.๘.๒ ยาคุมกำเนิด (ประเภทรับประทาน) ยกเว้นยาคุมกำเนิดแบบฉุกเฉิน โดยยาคุมกำเนิดต้องเป็นสูตรมาตรฐานตามโครงการส่งเสริมการวางแผนครอบครัวของกระทรวงสาธารณสุข (ประกอบด้วยตัวยา ๒ ชนิด คือ\n๑) Estinyl estradiol ๐.๓ – ๐.๕ มิลลิกรัม และ\n๒) Norgestrel ๐.๒๕ – ๐.๕ มิลลิกรัม รายชื่อยาคุมกำเนิดสูตรมาตรฐาน ๔ รายการหลัก อาทิเช่น (1) Microgest (๒) Anna (๓) Microgynon ED และ (๔) Anamai )","section":"s5"},{"key":"nur_q102","no":"4.8.3","text":"๔.๘.๓ ยาสมุนไพรที่ไม่ใช่ยาอันตราย (ถ้ามี)","section":"s5"},{"key":"nur_q103","no":"4.9","text":"4.๙ มีตู้หรือชั้นเก็บยาและเวชภัณฑ์เป็นสัดส่วน","section":"s5"},{"key":"nur_q104","no":"4.10","text":"4.๑๐ มีตู้เย็นสำหรับเก็บวัคซีนชนิดรับประทาน ตู้เย็นต้องมีการควบคุมอุณหภูมิ เช่น เทอร์โมมิเตอร์วัดอุณหภูมิตู้เย็น","section":"s5"},{"key":"nur_q105","no":"4.11","text":"4.๑๑ กรณีมีการจ่ายยาเม็ด ต้องมีอุปกรณ์นับเม็ดยาอย่างน้อยสองชุด","section":"s5"},{"key":"nur_q106","no":"4.12","text":"4.๑๒ ซองยา หรือภาชนะบรรจุยาต้องมีชื่อคลินิก ที่อยู่ (ตามที่ได้รับอนุญาต) เบอร์โทรศัพท์ ชื่อ - สกุลผู้ป่วย ชื่อยา วิธีใช้ และ วัน เดือน ปี ที่ยาหมดอายุ","section":"s5"},{"key":"nur_q107","no":"4.13.1","text":"4.๑๓ เครื่องมือ อุปกรณ์ สำหรับควบคุมการติดเชื้อ ในกรณีที่จำเป็นต้องใช้\n4.๑๓.1 เครื่องมือหรืออุปกรณ์ในการควบคุมการติดเชื้อ เช่น หม้อต้ม หรือหม้อนึ่ง หรือหม้อนึ่งอบความดันที่มีประสิทธิภาพในการ ฆ่าเชื้อ","section":"s5"},{"key":"nur_q108","no":"4.13.2","text":"4.๑๓.๒ ตู้สำหรับเก็บเครื่องมือที่ปราศจากเชื้อแล้ว และแสดงรายละเอียดของเครื่องมือ หรืออุปกรณ์ที่ปราศจากเชื้อ เช่น ระบุวัน เดือน ปี ที่นึ่ง/ เปลี่ยนน้ำยา/ ผลิต /และหมดอายุ","section":"s5"},{"key":"nur_q109","no":"4.13.3","text":"4.๑๓.๓ จัดทำคู่มือหรือแผนภูมิ การทำความสะอาดและทำให้เครื่องมือปราศจากเชื้อ","section":"s5"},{"key":"nur_q110","no":"4.14.1","text":"4.๑๔ แนวทางการช่วยชีวิตฉุกเฉินเบื้องต้นที่ต้องจัดให้มีสำหรับคลินิกการพยาบาลและการผดุงครรภ์\n๔.๑๔.๑ ถุงบีบลมเพื่อช่วยหายใจพร้อมหน้ากากครอบช่วยการหายใจ (Ambubag)","section":"s5"},{"key":"nur_q111","no":"4.14.2","text":"4.๑๔.๒ มีแผนและขั้นตอนการส่งต่อผู้ป่วยกรณีฉุกเฉิน","section":"s5"},{"key":"nur_q112","no":"4.14.2 › 1)","text":"(๑) มีเบอร์โทรศัพท์ฉุกเฉินติดต่อโรงพยาบาลหรือสถานพยาบาลที่มีศักยภาพสูงกว่าในการช่วยฟื้นคืนชีพ ติดไว้ในที่เห็นได้ชัดเจน","section":"s5"},{"key":"nur_q113","no":"4.14.2 › 2)","text":"(๒) มีแผนและขั้นตอนการช่วยชีวิตเบื้องต้นที่ได้มาตรฐาน และขั้นตอนการส่งต่อผู้ป่วย","section":"s5"}],"ack":"ข้าพเจ้าได้อ่านและรับทราบผลการตรวจสถานพยาบาลนี้แล้วและจะปฏิบัติตามคำสั่งหรือคำแนะนำของพนักงานเจ้าหน้าที่อย่างเคร่งครัด ทั้งนี้พนักงานเจ้าหน้าที่ไม่ได้ทำการละเมิด ข่มขู่ หรือทำให้ทรัพย์สินของสถานพยาบาลหรือบุคคลในสถานพยาบาลเสียหาย สูญหาย หรือเสื่อมค่าแต่ประการใด","note":"","instruction":"โปรดใส่เครื่องหมาย ✓ เมื่อถูกต้อง และเครื่องหมาย × เมื่อไม่จัดให้มีหรือไม่ถูกต้อง กรณีไม่มีบริการที่เกี่ยวข้องในหัวข้อนั้น ๆ ใส่เครื่องหมาย –"},"thai_applied":{"id":"thai_applied","prefix":"atm","sheet":"chk_thai_applied","title":"บันทึกการตรวจมาตรฐานคลินิกการแพทย์แผนไทย ด้านการแพทย์แผนไทยประยุกต์ ประจำปี","short":"แผนไทย · การแพทย์แผนไทยประยุกต์","icon":"leaf","color":"#b8860b","source":"บันทึกตรวจมาตรฐานการแพทย์แผนไทยประยุกต์.doc","fields":[{"key":"service_area_floor1","label":"10. พื้นที่ให้บริการประกอบดังนี้ — ชั้น 1","type":"textarea","maxlength":1000},{"key":"service_area_floor2","label":"10. พื้นที่ให้บริการประกอบดังนี้ — ชั้น 2","type":"textarea","maxlength":1000},{"key":"service_area_floor3","label":"10. พื้นที่ให้บริการประกอบดังนี้ — ชั้น 3","type":"textarea","maxlength":1000},{"key":"service_area_floor4","label":"10. พื้นที่ให้บริการประกอบดังนี้ — ชั้น 4","type":"textarea","maxlength":1000},{"key":"service_area_floor5","label":"10. พื้นที่ให้บริการประกอบดังนี้ — ชั้น 5","type":"textarea","maxlength":1000},{"key":"addl_services_text","label":"11. บริการที่จัดให้มีเพิ่มเติม","type":"textarea","maxlength":2000}],"groups":[{"title":"หัวแบบบันทึก","fields":["form_seq_no","inspection_year","inspection_date"]},{"title":"ส่วนที่ 1 ข้อมูลใบอนุญาต (ข้อ 1–6)","fields":["clinic_name","license_business_no","license_operate_no","operator_name","manager_name","opening_hours"]},{"title":"7. ชื่อผู้ประกอบวิชาชีพร่วมที่พบ","fields":["co_practitioner_1_name","co_practitio ection":"s2"},{"key":"atm_q009","no":"1.3.2","text":"1.3.2 มีส่วนที่นั่งพักคอยของผู้ป่วยและญาติที่เหมาะสม ไม่น้อยกว่า 5- 10 ที่นั่งและที่นั่งต้องมีพนักพิง","section":"s2"},{"key":"atm_q010","no":"1.4","text":"1.4 การสัญจรและการเคลื่อนย้ายผู้ป่วยต้องกระทำได้โดยสะดวก โดยเฉพาะเมื่อเกิดภาวะฉุกเฉิน ขนาดความกว้างของประตู เข้า-ออก ไม่ต่ำกว่า 80 เซนติเมตร","section":"s2"},{"key":"atm_q011","no":"1.5.1","text":"1.5 ห้องตรวจหรือห้องให้การรักษา\n1.5.1 ห้องตรวจหรือห้องให้การรักษากั้นเป็นสัดส่วนและมิดชิด มีประตู เปิด-ปิด อย่างชัดเจน","section":"s2"},{"key":"atm_q012","no":"1.5.2 › 1)","text":"1.5.2 ภายในห้องตรวจต้องประกอบด้วย โต๊ะตรวจโรค\n1 ตัว เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์ 1 เตียง","section":"s2"},{"key":"atm_q013","no":"1.5.3","text":"1.5.3 อ่างฟอกมือชนิดไม่ใช้มือเปิด-ปิดน้ำ พร้อมมีสบู่เหลว\nผ้าเช็ดมือหรือกระดาษเช็ดมือที่ใช้ครั้งเดียว","section":"s2"},{"key":"atm_q014","no":"1.5.4","text":"1.5.4 ไม่มีวงจรปิดในห้องตรวจหรือห้องที่เกี่ยวกับการประกอบวิชาชีพหรือการประกอบโรคศิลปะ","section":"s2"},{"key":"atm_q015","no":"1.6","text":"1.6 มีห้องน้ำห้องส้วมที่ถูกสุขลักษณะอย่างน้อยหนึ่งห้องหรือมีห้องน้ำส่วนรวมในกรณีอาคารศูนย์การค้าหรืออาคารสำนักงาน","section":"s2"},{"key":"atm_q016","no":"1.7","text":"1.7 มีแสงสว่างและการระบายอากาศเพียงพอ ไม่มีกลิ่นอับทึบ (หากความสูงของสถานพยาบาลต่ำกว่า 2.6 เมตร ต้องเพิ่มพัดลมดูดอากาศที่เหมาะสม)","section":"s2"},{"key":"atm_q017","no":"1.8.1","text":"1.8 มีระบบการเก็บและกำจัดมูลฝอยและสิ่งปฏิกูลที่เหมาะสม และมีการกำจัดอย่างเหมาะสม\n1.8.1 ทุกห้องตรวจและทุกห้องที่ให้การรักษาผู้ป่วย ต้องมีถังขยะทั่วไป–ถังขยะติดเชื้อ ที่มีลักษณะถังขยะแบบใช้เท้าเหยียบให้เปิด มีฝาปิดมิดชิด ถังขยะติดเชื้อใช้ถุงสีแดง เขียนข้อความ “ขยะติดเชื้อ”ไว้ที่ถังขยะ แยกต่างหากจากถังขยะทั่วไป ใช้ถุงสีดำ เขียนข้อความ “ขยะทั่วไป” ไว้ที่ถังขยะ วางคู่กันทุกห้อง","section":"s2"},{"key":"atm_q018","no":"1.8.2","text":"1.8.2 มีสัญญา/หนังสือตอบรับการขนถ่ายขยะติดเชื้อ ของการจ้างบริษัทกำจัดขยะติดเชื้อ หรืออาจแสดงใบเสร็จรับเงินที่เป็นเดือนปัจจุบัน","section":"s2"},{"key":"atm_q019","no":"1.9","text":"1.9 มีระบบควบคุมการติดเชื้อที่เหมาะสม ตามวิธีการป้องกันการติดเชื้อในคลินิก (ส.พ.23)","section":"s2"},{"key":"atm_q020","no":"1.10.1","text":"1.10 มีเครื่องดับเพลิงขนาดเหมาะสม ตามที่กฎหมายท้องถิ่นบัญญัติ และอยู่ในสภาพพร้อมใช้งาน ติดตั้งในที่มองเห็นได้ชัดเจน\n1.10.1 ขนาดเครื่องดับเพลิงไม่ต่ำกว่า 10 ปอนด์","section":"s2"},{"key":"atm_q021","no":"1.10.2","text":"1.10.2 มีเครื่องดับเพลิงติดตั้งทุกชั้น","section":"s2"},{"key":"atm_q022","no":"1.10.3","text":"1.10.3 ติดตั้งเครื่องดับเพลิงส่วนบนสูงจากพื้นไม่เกิน 1.5 เมตร หรือวางกับพื้นมีฐานรองรับที่มั่นคง อยู่ในที่มองเห็นอย่างชัดเจน และควรมีป้ายแสดงจุดที่ตั้งถังดับเพลิง","section":"s2"},{"key":"atm_q023","no":"1.11","text":"1.11 มีป้ายเครื่องหมายห้ามสูบบุหรี่","section":"s2"},{"key":"atm_q024","no":"2.1","text":"2. คลินิกต้องมีลักษณะการให้บริการดังต่อไปนี้\n2.1 มีความปลอดภัย มีความสะดวก และเหมาะสมต่อ\nผู้ให้บริการและผู้รับบริการ","section":"s3"},{"key":"atm_q025","no":"2.2","text":"2.2 มีการให้บริการที่ได้มาตรฐานตามลักษณะวิชาชีพ ตามที่สภาวิชาชีพหรือคณะกรรมการวิชาชีพประกาศกำหนด แล้วแต่กรณี","section":"s3"},{"key":"atm_q026","no":"2.3","text":"2.3 พื้นที่ให้บริการจะต้องมีพื้นที่เชื่อมและเปิดติดต่อถึงกันได้และไม่ตั้งอยู่ในพื้นที่เดียวกับสถานที่ขายยาตามกฎหมายว่าด้วยยาหรือพื้นที่เดียวกับการประกอบอาชีพอื่น","section":"s3"},{"key":"atm_q027","no":"2.4","text":"2.4 พื้นที่ให้บริการจะต้องไม่ตั้งอยู่ในสถานที่เดียวกับสถานพยาบาลของกระทรวง ทบวง กรม กรุงเทพมหานคร เมือง\nพัทยา องค์การบริการส่วนจังหวัด เทศบาล องค์การบริการส่วน\nตำบล องค์กรปกครองส่วนท้องถิ่นอื่น และสภากาชาดไทย ซึ่งให้บริการในลักษณะเดียวกัน","section":"s3"},{"key":"atm_q028","no":"2.5","text":"2.5 ในกรณีที่มีการให้บริการในอาคารเดียวกับการประกอบกิจการอื่น จะต้องมีการแบ่งพื้นที่ให้ชัดเจน และกิจการอื่นต้องไม่กระทบ กระเทือนต่อการประกอบวิชาชีพ รวมทั้งสามารถเคลื่อนย้ายผู้ป่วยฉุกเฉินได้สะดวก","section":"s3","condHead":true,"cond":"atm_g1"},{"key":"atm_q029","no":"2.5.1","text":"2.5.1 สถานพยาบาลต้องมีประตู เข้า-ออก คนละทางกับการประกอบกิจการอื่น","section":"s3","cond":"atm_g1"},{"key":"atm_q030","no":"2.5.2","text":"2.5.2 การกั้นพื้นที่ต้องเป็นสัดส่วน แสดงให้เห็นประจักษ์ ชัดเจนและถาวร","section":"s3","cond":"atm_g1"},{"key":"atm_q031","no":"2.6","text":"2.6 ในกรณีที่มีการให้บริการของลักษณะสหคลินิกหรือ มีคลินิกหลายลักษณะ อยู่ในอาคารเดียวกัน จะต้องมีการแบ่งสัดส่วนพื้นที่ให้ชัดเจน และแต่ละสัดส่วนต้องมีพื้นที่และลักษณะตามมาตรฐานของการให้บริการนั้น แต่ละสาขาต้องมีอย่างน้อย 1 ห้องตรวจโรค ซึ่งต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรค 1 เตียง ที่ได้มาตรฐานทางการแพทย์ และอ่างฟอกมือชนิดที่ไม่ใช้มือ เปิด-ปิดน้ำ สบู่","section":"s3"},{"key":"atm_q032","no":"3.1.1","text":"3. การแสดงรายละเอียดเกี่ยวกับชื่อสถานพยาบาล ผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะในสถานพยาบาล อัตราค่ารักษาพยาบาล ค่าบริการและสิทธิผู้ป่วย\n3.1 มีป้ายชื่อสถานพยาบาล เป็นไปตามกฎกระทรวง\n3.1.1 ป้ายชื่อสถานพยาบาลต้องเป็นสี่เหลี่ยมผืนผ้า ขนาดความกว้างของป้ายไม่น้อยกว่า 40 เซนติเมตร ความยาวไม่น้อยกว่า 120 เซนติเมตร","section":"s4"},{"key":"atm_q033","no":"3.1.2","text":"3.1.2 จัดทำแผ่นป้ายแสดงชื่อสถานพยาบาลที่เป็นภาษาไทยขนาดความสูงไม่ต่ำกว่า 10 เซนติเมตร ตัวหนังสือสีทอง\nสีพื้นป้ายสีขาว","section":"s4"},{"key":"atm_q034","no":"3.1.3","text":"3.1.3 เลขที่ใบอนุญาตขนาดความสูงไม่ต่ำกว่า 5 เซนติเมตร ตัวเลขอารบิคสีทอง","section":"s4"},{"key":"atm_q035","no":"3.1.4","text":"3.1.4 กรณีใช้ภาษาต่างประเทศร่วมด้วย ต้องมีชื่อตรงกันกับภาษาไทย ขนาดตัวอักษรต้องเล็กกว่าภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"atm_q036","no":"3.2","text":"3.2 ติดตั้งป้ายชื่อสถานพยาบาลในตำแหน่งที่มองเห็นได้ชัดเจนจากภายนอกและเหมาะสม","section":"s4"},{"key":"atm_q037","no":"3.3.1","text":"3.3 ชื่อสถานพยาบาลไม่มีข้อความลักษณะชักชวนโอ้อวดเกินจริงหรืออาจสื่อให้เข้าใจผิด\n3.3.1 คำนำหน้าชื่อหรือต่อท้ายของชื่อคลินิกต้องประกอบด้วยลักษณะคลินิก และลักษณะการให้บริการของคลินิก","section":"s4"},{"key":"atm_q038","no":"3.3.2","text":"3.3.2 กรณีใช้ชื่อภาษาต่างประเทศด้วย ขนาดตัวอักษรต้องเล็กกว่าอักษรภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"atm_q039","no":"3.3.3","text":"3.3.3 ชื่อคลินิกจะต้องไม่ใช้คำหรือข้อความที่มีลักษณะชักชวน โอ้อวดเกินความจริง หรืออาจทำให้เกิดความเข้าใจผิดในสาระสำคัญเกี่ยวกับการประกอบกิจการ","section":"s4"},{"key":"atm_q040","no":"3.3.4","text":"3.3.4 ชื่อคลินิกต้องไม่สื่อความหมายหรืออ้างอิงสถาบันพระมหากษัตริย์ เว้นแต่ได้รับพระบรมราชานุญาต","section":"s4"},{"key":"atm_q041","no":"3.4","text":"3.๔ มีข้อความแสดงวัน เวลาที่ให้บริการไว้โดยเปิดเผย มองเห็นได้ชัดเจนจากด้านนอกคลินิกและตรงกับที่ได้รับอนุญาตให้ประกอบกิจการสถานพยาบาล","section":"s4"},{"key":"atm_q042","no":"3.5.2","text":"3.๕ แสดงใบอนุญาตติดในที่เปิดเผยและเหมาะสม\n3.5.๑ ใบอนุญาตให้ประกอบกิจการสถานพยาบาล (แบบ ส.พ.7)\n3.5.๒ ใบอนุญาตให้ดำเนินการสถานพยาบาล (แบบ ส.พ.19)","section":"s4"},{"key":"atm_q043","no":"3.6","text":"3.6 มีบริเวณที่ใช้แสดงหลักฐานการชำระค่าธรรมเนียมการประกอบกิจการสถานพยาบาล(แบบ ส.พ.12) ในที่เปิดเผยและเห็นได้ชัดเจนบริเวณทางเข้าสถานพยาบาล","section":"s4"},{"key":"atm_q044","no":"3.7","text":"3.7 หน้าห้องตรวจมีบริเวณให้ติดป้ายแสดงชื่อ ภาพถ่าย และเลขที่ใบอนุญาตของผู้ประกอบวิชาชีพเวชกรรมที่ให้บริการ หากมีผู้ประกอบวิชาชีพ/ผู้ประกอบโรคศิลปะอื่นปฏิบัติงานให้ยื่น สพ.6 ทุกคนและแสดงป้ายนี้ไว้ในบริเวณที่เปิดเผยและเห็นได้ชัดเจน","section":"s4"},{"key":"atm_q045","no":"3.8","text":"3.8 แสดงอัตราค่าบริการและค่ารักษาพยาบาลให้ครอบคลุมการบริการที่เรียกเก็บ โดยแสดงอัตราราคาต่อหน่วย และระบุข้อความด้วยอักษรภาษาไทย โดยแสดงไว้ในที่เปิดเผยให้ผู้รับบริการสามารถเห็นได้ง่าย โดยจัดทำเป็นแผ่นประกาศ แผ่นพับ เล่ม หรือแฟ้มเอกสาร หรือโปรแกรมคอมพิวเตอร์ แสดงให้ผู้ป่วยทราบ","section":"s4"},{"key":"atm_q046","no":"3.9","text":"3.9 มีป้ายแสดงให้ผู้รับบริการทราบว่าสามารถสอบถามอัตราค่าบริการและค่ารักษาพยาบาลได้จากที่ใด ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 10 เซนติเมตร แสดงไว้ในที่เห็นได้ชัดเจน","section":"s4"},{"key":"atm_q047","no":"3.10","text":"3.10 แสดงคำประกาศสิทธิผู้ป่วยไว้ในที่เปิดเผยและเห็นได้ง่ายอ่านได้ชัดเจน ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 1 เซนติเมตร บริเวณที่พักคอยของผู้รับบริการ","section":"s4"},{"key":"atm_q048","no":"3.11","text":"3.11 ข้อความโฆษณาสถานพยาบาล (ถ้ามี) ไม่เป็นเท็จ ไม่โอ้อวด หรือสื่อให้เข้าใจผิดในสาระสำคัญ","section":"s4"},{"key":"atm_q049","no":"4.1.1","text":"4.ชนิดและจำนวนเครื่องมือ เครื่องใช้ที่จำเป็นประจำสถานพยาบาล\n4.1 เวชระเบียน\n4.1.1 มีตู้หรือชั้นหรืออุปกรณ์เก็บเวชระเบียนที่มั่นคง ปลอดภัยและต้องจัดให้เป็นระเบียบสามารถค้นหาได้ง่าย","section":"s5"},{"key":"atm_q050","no":"4.1.2","text":"4.1.2 มีการจัดเตรียมทะเบียนผู้ป่วย มีรายการดังต่อไปนี้","section":"s5"},{"key":"atm_q051","no":"4.1.2 › 1)","text":"1) ชื่อ นามสกุล อายุ ของผู้รับบริการ","section":"s5"},{"key":"atm_q052","no":"4.1.2 › 2)","text":"2) เลขที่ประจำตัวผู้รับบริการ","section":"s5"},{"key":"atm_q053","no":"4.1.2 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"atm_q054","no":"4.1.3 › 1)","text":"4.1.3 มีเวชระเบียน หรือ บัตรผู้ป่วย ที่สามารถ บันทึกรายละเอียด ตามที่กฎกระทรวงกำหนด\n1) ชื่อและที่อยู่สถานพยาบาล","section":"s5"},{"key":"atm_q055","no":"4.1.3 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s5"},{"key":"atm_q056","no":"4.1.3 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"atm_q057","no":"4.1.3 › 4)","text":"4) ชื่อ นามสกุล อายุ เพศ ที่อยู่ หมายเลขโทรศัพท์ (ถ้ามี)\nและข้อมูลส่วนบุคคลอื่น ๆ ของผู้ป่วย เช่น เชื้อชาติ\nสัญชาติ สถานภาพสมรส เลขบัตรประจำตัว\nประชาชน เป็นต้น","section":"s5"},{"key":"atm_q058","no":"4.1.3 › 5)","text":"5) อาการเจ็บป่วย การแพ้ยา ผลการตรวจทางร่างกาย\nและผลการตรวจทางห้องปฏิบัติชันสูตรของผู้ป่วย","section":"s5"},{"key":"atm_q059","no":"4.1.3 › 6)","text":"6) การวินิจฉัยโรค","section":"s5"},{"key":"atm_q060","no":"4.1.3 › 7)","text":"7) การรักษา","section":"s5"},{"key":"atm_q061","no":"4.1.3 › 8)","text":"8) ลายมือผู้ประกอบวิชาชีพที่ให้การรักษาพยาบาล","section":"s5"},{"key":"atm_q062","no":"4.2.1","text":"4.2 เครื่องใช้ทั่วไป ในห้องตรวจโรคทุกห้องต้องประกอบด้วย\n4.2.1 โต๊ะตรวจโรค พร้อมเก้าอี้","section":"s5"},{"key":"atm_q063","no":"4.2.2","text":"4.2.2 เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์","section":"s5"},{"key":"atm_q064","no":"4.2.3","text":"4.2.3 ต้องมีบันไดขึ้นเตียง ,"cond":"atm_g5"},{"key":"atm_q081","no":"4.5.1 › 2)","text":"2) พื้น ผนัง ฝ้าทำด้วยวัสดุที่แข็งแรง ทนทาน ทนน้ำ ไม่ทาสี\nและทำความสะอาดง่าย","section":"s5","cond":"atm_g5"},{"key":"atm_q082","no":"4.5.1 › 3)","text":"3) ประตูทำด้วยวัสดุทนน้ำ มีความกว้างไม่น้อยกว่า 0.๘ เมตร\nหรือมีความกว้างที่สามารถให้รถเข็นผู้ป่วย เข้า-ออก ประตู\nได้สะดวก ประตูเปิดออกจากภายใน ด้านบนของประตูหรือ บาน\nเลื่อนมีช่องมองเป็นกระจกใสที่อยู่ในระดับสายตา และไม่มีอุปกรณ์\nล็อค/ขัดปิด/ตรึงประตู","section":"s5","cond":"atm_g5"},{"key":"atm_q083","no":"4.5.1 › 4)","text":"4) ที่นั่ง/เก้าอี้ ในห้องอบไอน้ำทำด้วยวัสดุทนความร้อน และ\nไม่มีเชื้อรา","section":"s5","cond":"atm_g5"},{"key":"atm_q084","no":"4.5.1 › 5)","text":"5) มีพัดลมดูดอากาศ หรือระบบระบายอากาศ เพื่อให้อากาศถ่ายเท\nสะดวก","section":"s5","cond":"atm_g5"},{"key":"atm_q085","no":"4.5.1 › 6)","text":"6) มีแสงสว่างเพียงพอ สามารถมองเห็นสิ่งต่างๆ ในห้องได้ชัดเจน\nหลอดไฟใช้ชนิดกันความชื้นหรือหลอดไฟชนิดที่มีฝาครอบ","section":"s5","cond":"atm_g5"},{"key":"atm_q086","no":"4.5.1 › 7)","text":"7) มีที่วัดอุณหภูมิในห้องอบไอน้ำสมุนไพรได้อย่างถูกต้องเหมาะสม","section":"s5","cond":"atm_g5"},{"key":"atm_q087","no":"4.5.1 › 45)","text":"8) มีระบบบันทึกการควบคุมอุณหภูมิในห้องอบไอน้ำสมุนไพร ในวันที่\nมีการใช้งานอย่างน้อย 1 ครั้ง โดยให้มีอุณหภูมิอยู่ระหว่าง 42 –\n45 องศาเซลเซียส","section":"s5","cond":"atm_g5"},{"key":"atm_q088","no":"4.5.1 › 9)","text":"9) มีกริ่ง/กระดิ่งสัญญาณที่ไม่ใช้ระบบไฟฟ้าเรียกในกรณีฉุกเฉิน","section":"s5","cond":"atm_g5"},{"key":"atm_q089","no":"4.5.1 › 10)","text":"10) มีสัญญาณเตือนบอกเวลา","section":"s5","cond":"atm_g5"},{"key":"atm_q090","no":"4.5.1 › 11)","text":"11) มีกริ่ง/กระดิ่งสัญญาณที่ไม่ใช้ระบบไฟฟ้าเรียกในกรณีฉุกเฉิน","section":"s5","cond":"atm_g5"},{"key":"atm_q091","no":"4.5.1 › 12)","text":"12) มีที่นั่งพักรอหน้าห้องอบไอน้ำสมุนไพร พร้อมน้ำดื่ม","section":"s5","cond":"atm_g5"},{"key":"atm_q092","no":"4.5.1 › 13)","text":"13) ท่อส่งกระจายไอน้ำในห้องอบสมุนไพร ทำด้วยวัสดุแข็งแรง\nทนความร้อนได้ดี มีฉนวนหุ้มไม่รั่วซึม มีการออกแบบให้กระจาย\nความร้อนได้ทั่วถึง ติดตั้งอยู่ในที่ปลอดภัย หรือไม่อยู่ในตำแหน่งที่\nผู้รับบริการสัมผัสง่าย","section":"s5","cond":"atm_g5"},{"key":"atm_q093","no":"4.5.1 › 14)","text":"14) กรณีมีหม้อต้มไอน้ำที่มีระบบไอน้ำผ่านท่อไปยังห้องอบ\nสมุนไพร หม้อต้มต้องทำด้วย สแตนเลส มีความแข็งแรง ไม่มี\nส่วนประกอบของสารตะกั่ว มีระบบแยกสมุนไพรออกจากน้ำ มี\nระบบควบคุมความปลอดภัย และมีเครื่องควบคุมอุณหภูมิ\nสามารถควบคุมอุณหภูมิให้อยู่ในระดับไม่เกิน 45 องศาเซลเซียส","section":"s5","cond":"atm_g5"},{"key":"atm_q094","no":"4.5.1 › 15)","text":"1๕) กรณีมีหม้อต้มไอน้ำที่ไม่มีระบบไอน้ำผ่านท่อไปยังห้องอบ\nสมุนไพร หม้อต้มทำด้วยวัสดุที่มีความปลอดภัย ไม่มีส่วนประกอบ\nของสารตะกั่วและมีระบบควบคุมความปลอดภัย ทนความร้อนได้\nดี และมีเครื่องควบคุมอุณหภูมิ สามารถควบคุมอุณหภูมิให้อยู่ใน\nระดับไม่เกิน 45 องศาเซลเซียส","section":"s5","cond":"atm_g5"},{"key":"atm_q095","no":"4.5.2 › 1)","text":"4.5.2 ห้องอบไอน้ำสมุนไพรรวม\n1) แยกห้องชาย – หญิง หรือ ถ้าไม่สามารถแยกได้ต้องบริหาร\nจัดการเรื่องเวลาการให้บริการแก่ผู้รับบริการชาย-หญิงได้อย่าง\nเหมาะสม","section":"s5","cond":"atm_g5"},{"key":"atm_q096","no":"4.5.2 › 2)","text":"2) ขนาดห้องไม่น้อยกว่า 1.5 x 2 เมตร ความสูงของเพดาน\nไม่น้อยกว่า 2.00 เมตร","section":"s5","cond":"atm_g5"},{"key":"atm_q097","no":"4.5.2 › 3)","text":"3) พื้น ผนัง ฝ้าทำด้วยวัสดุที่แข็งแรง ทนทาน ทนน้ำ ไม่ทาสี และ\nทำความสะอาดง่าย","section":"s5","cond":"atm_g5"},{"key":"atm_q098","no":"4.5.2 › 4)","text":"4) ประตูทำด้วยวัสดุทนน้ำ มีความกว้างไม่น้อยกว่า 0.๘ เมตร\nหรือมีความกว้างที่สามารถให้รถเข็นผู้ป่วย เข้า-ออก ประตูได้\nสะดวก ประตูเปิดออกจากภายใน ด้านบนของประตูหรือบานเลื่อน\nมีช่องมองเป็นกระจกใสที่อยู่ในระดับสายตา และไม่มีอุปกรณ์ล็อค/\nขัดปิด/ตรึงประตู","section":"s5","cond":"atm_g5"},{"key":"atm_q099","no":"4.5.2 › 5)","text":"5) ที่นั่ง/เก้าอี้ ในห้องอบไอน้ำทำด้วยวัสดุทนความร้อน และไม่มีเชื้อรา","section":"s5","cond":"atm_g5"},{"key":"atm_q100","no":"4.5.2 › 6)","text":"6) มีพัดลมดูดอากาศ หรือระบบระบายอากาศ เพื่อให้อากาศถ่ายเท\nสะดวก","section":"s5","cond":"atm_g5"},{"key":"atm_q101","no":"4.5.2 › 7)","text":"7) มีแสงสว่างเพียงพอ สามารถมองเห็นสิ่งต่างๆ ในห้องได้ชัดเจน\nหลอดไฟใช้ชนิดกันความชื้นหรือหลอดไฟชนิดที่มีฝาครอบ","section":"s5","cond":"atm_g5"},{"key":"atm_q102","no":"4.5.2 › 8)","text":"8) มีที่วัดอุณหภูมิในห้องอบไอน้ำสมุนไพรได้อย่างถูกต้องเหมาะสม","section":"s5","cond":"atm_g5"},{"key":"atm_q103","no":"4.5.2 › 42)","text":"9) มีระบบบันทึกการควบคุมอุณหภูมิในห้องอบไอน้ำสมุนไพร\nในวันที่มีการใช้งานอย่างน้อย 1 ครั้ง โดยให้มีอุณหภูมิอยู่ระหว่าง\n42 – 45 องศาเซลเซียส","section":"s5","cond":"atm_g5"},{"key":"atm_q104","no":"4.5.2 › 10)","text":"10) มีสัญญาณเตือนบอกเวลา","section":"s5","cond":"atm_g5"},{"key":"atm_q105","no":"4.5.2 › 11)","text":"11) มีกริ่ง/กระดิ่งสัญญาณที่ไม่ใช้ระบบไฟฟ้าเรียกในกรณีฉุกเฉิน","section":"s5","cond":"atm_g5"},{"key":"atm_q106","no":"4.5.2 › 12)","text":"12) มีระบบป้องกันไฟฟ้ารั่วและไฟฟ้าลัดวงจร","section":"s5","cond":"atm_g5"},{"key":"atm_q107","no":"4.5.2 › 13)","text":"13) มีที่นั่งพักรอหน้าห้องอบไอน้ำสมุนไพร พร้อมน้ำดื่ม","section":"s5","cond":"atm_g5"},{"key":"atm_q108","no":"4.5.2 › 14)","text":"14) ท่อส่งกระจายไอน้ำในห้องอบสมุนไพร ทำด้วยวัสดุแข็งแรง\nทนความร้อนได้ดี มีฉนวนหุ้มไม่รั่วซึม มีการออกแบบให้กระจาย\nความร้อนได้ทั่วถึง ติดตั้งอยู่ในที่ปลอดภัย หรือไม่อยู่ในตำแหน่งที่\nผู้รับบริการสัมผัสง่าย","section":"s5","cond":"atm_g5"},{"key":"atm_q109","no":"4.5.2 › 15)","text":"15) กรณีมีหม้อต้มไอน้ำที่มีระบบไอน้ำผ่านท่อไปยังห้องอบ\nสมุนไพร หม้อต้มต้องทำด้วย สแตนเลส มีความแข็งแรง ไม่มี\nส่วนประกอบของสารตะกั่ว มีระบบแยกสมุนไพรออกจากน้ำ\nมีระบบควบคุมความปลอดภัย และมีเครื่องควบคุมอุณหภูมิ\nสามารถควบคุมอุณหภูมิให้อยู่ในระดับไม่เกิน 45 องศาเซลเซียส","section":"s5","cond":"atm_g5"},{"key":"atm_q110","no":"4.5.2 › 16)","text":"16) กรณีมีหม้อต้มไอน้ำที่ไม่มีระบบไอน้ำผ่านท่อไปยังห้องอบ\nสมุนไพร หม้อต้มทำด้วยวัสดุที่มีความปลอดภัย ไม่มีส่วนประกอบ\nของสารตะกั่วและมีระบบควบคุมความปลอดภัย ทนความร้อนได้\nดีและมีเครื่องควบคุมอุณหภูมิ สามารถควบคุมอุณหภูมิให้อยู่ใน\nระดับไม่เกิน 45 องศาเซลเซียส","section":"s5","cond":"atm_g5"},{"key":"atm_q111","no":"4.5.3 › 1)","text":"4.5.3 ตู้อบไอน้ำสมุนไพร\n1) ขนาดของตู้อบไอน้ำสมุนไพรเหมาะสมกับจำนวน และขนาดของ\nผู้รับบริการ","section":"s5","cond":"atm_g5"},{"key":"atm_q112","no":"4.5.3 › 2)","text":"2) ประตูทำด้วยวัสดุทนน้ำ เปิดออกจากภายใน และสามารถเข้า –\nออก ได้สะดวก ด้านบนของบานเลื่อนมีช่องมองเป็นกระจกใสที่อยู่\nในระดับสายตา และไม่มีอุปกรณ์ล็อค/ขัดปิด/ตรึง","section":"s5","cond":"atm_g5"},{"key":"atm_q113","no":"4.5.3 › 3)","text":"3) หม้อต้มสมุนไพรทำจากวัสดุปลอดภัย ไม่มีส่วนประกอบของสาร\nตะกั่ว และมีระบบควบคุมความปลอดภัย","section":"s5","cond":"atm_g5"},{"key":"atm_q114","no":"4.5.3 › 4)","text":"4) หม้อต้มสมุนไพรวางอยู่ในตำแหน่งที่ปลอดภัย","section":"s5","cond":"atm_g5"},{"key":"atm_q115","no":"4.5.3 › 5)","text":"5) ที่นั่ง/เก้าอี้ ในห้องอบไอน้ำทำด้วยวัสดุทนความร้อน และไม่มีเชื้อรา","section":"s5","cond":"atm_g5"},{"key":"atm_q116","no":"4.5.3 › 6)","text":"6) มีพัดลมดูดอากาศ หรือระบบระบายอากาศ เพื่อให้อากาศถ่ายเท\nสะดวก","section":"s5","cond":"atm_g5"},{"key":"atm_q117","no":"4.5.3 › 7)","text":"7) มีแสงสว่างเพียงพอ สามารถมองเห็นสิ่งต่างๆ ในห้องได้ชัดเจน\nหลอดไฟใช้ชนิดกันความชื้นหรือหลอดไฟชนิดที่มีฝาครอบ","section":"s5","cond":"atm_g5"},{"key":"atm_q118","no":"4.5.3 › 8)","text":"8) มีที่วัดอุณหภูมิในห้องอบไอน้ำสมุนไพรได้อย่างถูกต้องเหมาะสม","section":"s5","cond":"atm_g5"},{"key":"atm_q119","no":"4.5.3 › 42)","text":"9) มีระบบบันทึกการควบคุมอุณหภูมิในห้องอบไอน้ำสมุนไพร\nในวันที่มีการใช้งานอย่างน้อย 1 ครั้ง โดยให้มีอุณหภูมิอยู่ระหว่าง\n42 – 45 องศาเซลเซียส","section":"s5","cond":"atm_g5"},{"key":"atm_q120","no":"4.5.3 › 10)","text":"10) มีสัญญาณเตือนบอกเวลา","section":"s5","cond":"atm_g5"},{"key":"atm_q121","no":"4.5.3 › 11)","text":"11) มีกริ่ง/กระดิ่งสัญญาณที่ไม่ใช้ระบบไฟฟ้าเรียกในกรณีฉุกเฉิน","section":"s5","cond":"atm_g5"},{"key":"atm_q122","no":"4.5.3 › 12)","text":"12) มีสัญญาณเตือนบอกเวลา","section":"s5","cond":"atm_g5"},{"key":"atm_q123","no":"4.5.3 › 13)","text":"13) มีระบบป้องกันไฟฟ้ารั่วและไฟฟ้าลัดวงจร","section":"s5","cond":"atm_g5"},{"key":"atm_q124","no":"4.5.3 › 14)","text":"14) มีที่นั่งพักรอหน้าห้องอบไอน้ำสมุนไพร พร้อมน้ำดื่ม","section":"s5","cond":"atm_g5"},{"key":"atm_q125","no":"4.5.4 › 1)","text":"4.5.4 กระโจมอบไอน้ำสมุนไพร\n1) เป็นกระโจมที่ผู้รับบริการเข้าได้ทั้งร่างกาย โดยไม่มีส่วนหนึ่งส่วนใด\nของร่างกายยื่นออกจากกระโจม และสามารถเข้าออกได้สะดวก","section":"s5","cond":"atm_g5"},{"key":"atm_q126","no":"4.5.4 › 2)","text":"2) ขนาดของกระโจมมีความเหมาะสมกับจำนวนและขนาดผู้รับบริการ","section":"s5","cond":"atm_g5"},{"key":"atm_q127","no":"4.5.4 › 3)","text":"3) ทำจากผ้าที่ระบายอากาศได้ดีและสะอาด","section":"s5","cond":"atm_g5"},{"key":"atm_q128","no":"4.5.4 › 4)","text":"4) หม้อต้มสมุนไพรทำจากวัสดุที่มีความปลอดภัย ไม่มีส่วนประกอบ\nของสารตะกั่ว","section":"s5","cond":"atm_g5"},{"key":"atm_q129","no":"4.5.4 › 5)","text":"5) มีวัสดุอุปกรณ์สำหรับป้องกันไม่ให้ผู้รับบริการสัมผัสหม้อต้ม\nสมุนไพรได้ง่าย","section":"s5","cond":"atm_g5"},{"key":"atm_q130","no":"4.5.4 › 6)","text":"6) เก้าอี้ในกระโจมทำด้วยวัสดุทนความร้อน และไม่มีเชื้อรา","section":"s5","cond":"atm_g5"},{"key":"atm_q131","no":"4.5.4 › 7)","text":"7) บริเวณพื้นที่ตั้งกระโจมต้องไม่ลื่น","section":"s5","cond":"atm_g5"},{"key":"atm_q132","no":"4.6","text":"4.6. ห้องเปลี่ยนเสื้อผ้า(ถ้ามี) มีขนาด , อุปกรณ์ตามเกณฑ์มาตรฐาน","section":"s5","condHead":true,"cond":"atm_g6"},{"key":"atm_q133","no":"4.6.1","text":"4.6.1 แยกห้องชาย – หญิง หรือ ถ้าไม่สามารถแยกได้ต้องบริหาร\nจัดการเรื่องเวลาการให้บริการแก่ผู้รับบริการชาย-หญิง ได้อย่าง\nเหมาะสม","section":"s5","cond":"atm_g6"},{"key":"atm_q134","no":"4.6.2","text":"4.6.2 ขนาดห้องมีความเหมาะสมกับผู้รับบริการ","section":"s5","cond":"atm_g6"},{"key":"atm_q135","no":"4.6.3","text":"4.6.3 มีจำนวนเพียงพอกับผู้รับบริการ","section":"s5","cond":"atm_g6"},{"key":"atm_q136","no":"4.6.4","text":"4.6.4 มีการระบายอากาศที่ดี ไม่อับชื้น ไม่มีกลิ่นเหม็น","section":"s5","cond":"atm_g6"},{"key":"atm_q137","no":"4.6.5","text":"4.6.5 มีแสงสว่างเพียงพอ","section":"s5","cond":"atm_g6"},{"key":"atm_q138","no":"4.6.6","tex ดยรวมไม่ต่ำกว่า 20 ตารางเมตร โดยส่วนแคบที่สุดต้องมีความกว้างไม่น้อยกว่า 3.00 เมตร","section":"s2"},{"key":"ttm_q009","no":"1.3.2","text":"1.3.2 มีส่วนที่นั่งพักคอยของผู้ป่วยและญาติที่เหมาะสม ไม่น้อยกว่า 5- 10 ที่นั่งและที่นั่งต้องมีพนักพิง","section":"s2"},{"key":"ttm_q010","no":"1.4","text":"1.4 การสัญจรและการเคลื่อนย้ายผู้ป่วยต้องกระทำได้โดยสะดวก โดยเฉพาะเมื่อเกิดภาวะฉุกเฉิน ขนาดความกว้างของประตู เข้า-ออก ไม่ต่ำกว่า 80 เซนติเมตร","section":"s2"},{"key":"ttm_q011","no":"1.5.1","text":"1.5 ห้องตรวจหรือห้องให้การรักษา\n1.5.1 ห้องตรวจหรือห้องให้การรักษากั้นเป็นสัดส่วนและมิดชิด มีประตู เปิด-ปิด อย่างชัดเจน","section":"s2"},{"key":"ttm_q012","no":"1.5.2 › 1)","text":"1.5.2 ภายในห้องตรวจต้องประกอบด้วย โต๊ะตรวจโรค\n1 ตัว เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์ 1 เตียง","section":"s2"},{"key":"ttm_q013","no":"1.5.3","text":"1.5.3 อ่างฟอกมือชนิดไม่ใช้มือเปิด-ปิดน้ำ พร้อมมีสบู่เหลว\nผ้าเช็ดมือหรือกระดาษเช็ดมือที่ใช้ครั้งเดียว","section":"s2"},{"key":"ttm_q014","no":"1.5.4","text":"1.5.4 ไม่มีวงจรปิดในห้องตรวจหรือห้องที่เกี่ยวกับการประกอบวิชาชีพหรือการประกอบโรคศิลปะ","section":"s2"},{"key":"ttm_q015","no":"1.6","text":"1.6 มีห้องน้ำห้องส้วมที่ถูกสุขลักษณะอย่างน้อยหนึ่งห้องหรือมีห้องน้ำส่วนรวมในกรณีอาคารศูนย์การค้าหรืออาคารสำนักงาน","section":"s2"},{"key":"ttm_q016","no":"1.7","text":"1.7 มีแสงสว่างและการระบายอากาศเพียงพอ ไม่มีกลิ่นอับทึบ (หากความสูงของสถานพยาบาลต่ำกว่า 2.6 เมตร ต้องเพิ่มพัดลมดูดอากาศที่เหมาะสม)","section":"s2"},{"key":"ttm_q017","no":"1.8.1","text":"1.8 มีระบบการเก็บและกำจัดมูลฝอยและสิ่งปฏิกูลที่เหมาะสม และมีการกำจัดอย่างเหมาะสม\n1.8.1 ทุกห้องตรวจและทุกห้องที่ให้การรักษาผู้ป่วย ต้องมีถังขยะทั่วไป–ถังขยะติดเชื้อ ที่มีลักษณะถังขยะแบบใช้เท้าเหยียบให้เปิด มีฝาปิดมิดชิด ถังขยะติดเชื้อใช้ถุงสีแดง เขียนข้อความ “ขยะติดเชื้อ”ไว้ที่ถังขยะ แยกต่างหากจากถังขยะทั่วไป ใช้ถุงสีดำ เขียนข้อความ “ขยะทั่วไป” ไว้ที่ถังขยะ วางคู่กันทุกห้อง","section":"s2"},{"key":"ttm_q018","no":"1.8.2","text":"1.8.2 มีสัญญา/หนังสือตอบรับการขนถ่ายขยะติดเชื้อ ของการจ้างบริษัทกำจัดขยะติดเชื้อ หรืออาจแสดงใบเสร็จรับเงินที่เป็นเดือนปัจจุบัน","section":"s2"},{"key":"ttm_q019","no":"1.9","text":"1.9 มีระบบควบคุมการติดเชื้อที่เหมาะสม ตามวิธีการป้องกันการติดเชื้อในคลินิก (ส.พ.23)","section":"s2"},{"key":"ttm_q020","no":"1.10.1","text":"1.10 มีเครื่องดับเพลิงขนาดเหมาะสม ตามที่กฎหมายท้องถิ่นบัญญัติ และอยู่ในสภาพพร้อมใช้งาน ติดตั้งในที่มองเห็นได้ชัดเจน\n1.10.1 ขนาดเครื่องดับเพลิงไม่ต่ำกว่า 10 ปอนด์","section":"s2"},{"key":"ttm_q021","no":"1.10.2","text":"1.10.2 มีเครื่องดับเพลิงติดตั้งทุกชั้น","section":"s2"},{"key":"ttm_q022","no":"1.10.3","text":"1.10.3 ติดตั้งเครื่องดับเพลิงส่วนบนสูงจากพื้นไม่เกิน 1.5 เมตร หรือวางกับพื้นมีฐานรองรับที่มั่นคง อยู่ในที่มองเห็นอย่างชัดเจน และควรมีป้ายแสดงจุดที่ตั้งถังดับเพลิง","section":"s2"},{"key":"ttm_q023","no":"1.11","text":"1.11 มีป้ายเครื่องหมายห้ามสูบบุหรี่","section":"s2"},{"key":"ttm_q024","no":"2.1","text":"2. คลินิกต้องมีลักษณะการให้บริการดังต่อไปนี้\n2.1 มีความปลอดภัย มีความสะดวก และเหมาะสมต่อ\nผู้ให้บริการและผู้รับบริการ","section":"s3"},{"key":"ttm_q025","no":"2.2","text":"2.2 มีการให้บริการที่ได้มาตรฐานตามลักษณะวิชาชีพ ตามที่สภาวิชาชีพหรือคณะกรรมการวิชาชีพประกาศกำหนด แล้วแต่กรณี","section":"s3"},{"key":"ttm_q026","no":"2.3","text":"2.3 พื้นที่ให้บริการจะต้องมีพื้นที่เชื่อมและเปิดติดต่อถึงกันได้และไม่ตั้งอยู่ในพื้นที่เดียวกับสถานที่ขายยาตามกฎหมายว่าด้วยยาหรือพื้นที่เดียวกับการประกอบอาชีพอื่น","section":"s3"},{"key":"ttm_q027","no":"2.4","text":"2.4 พื้นที่ให้บริการจะต้องไม่ตั้งอยู่ในสถานที่เดียวกับสถานพยาบาลของกระทรวง ทบวง กรม กรุงเทพมหานคร เมือง\nพัทยา องค์การบริการส่วนจังหวัด เทศบาล องค์การบริการส่วน\nตำบล องค์กรปกครองส่วนท้องถิ่นอื่น และสภากาชาดไทย ซึ่งให้บริการในลักษณะเดียวกัน","section":"s3"},{"key":"ttm_q028","no":"2.5","text":"2.5ในกรณีที่มีการให้บริการในอาคารเดียวกับการประกอบกิจการอื่น จะต้องมีการแบ่งพื้นที่ให้ชัดเจน และกิจการอื่นต้องไม่กระทบกระเทือนต่อการประกอบวิชาชีพ รวมทั้งสามารถเคลื่อนย้ายผู้ป่วยฉุกเฉินได้สะดวก","section":"s3","condHead":true,"cond":"ttm_g1"},{"key":"ttm_q029","no":"2.5.1","text":"2.5.1 สถานพยาบาลต้องมีประตู เข้า-ออก คนละทางกับการประกอบกิจการอื่น","section":"s3","cond":"ttm_g1"},{"key":"ttm_q030","no":"2.5.2","text":"2.5.2 การกั้นพื้นที่ต้องเป็นสัดส่วน แสดงให้เห็นประจักษ์ ชัดเจนและถาวร","section":"s3","cond":"ttm_g1"},{"key":"ttm_q031","no":"2.6","text":"2.6 ในกรณีที่มีการให้บริการของลักษณะสหคลินิกหรือ มีคลินิกหลายลักษณะ อยู่ในอาคารเดียวกัน จะต้องมีการแบ่งสัดส่วนพื้นที่ให้ชัดเจน และแต่ละสัดส่วนต้องมีพื้นที่และลักษณะตามมาตรฐานของการให้บริการนั้น แต่ละสาขาต้องมีอย่างน้อย 1 ห้องตรวจโรค ซึ่งต้องประกอบด้วย โต๊ะตรวจโรค 1 ตัว เตียงตรวจโรค 1 เตียง ที่ได้มาตรฐานทางการแพทย์ และอ่างฟอกมือชนิดที่ไม่ใช้มือ เปิด-ปิดน้ำ สบู่","section":"s3"},{"key":"ttm_q032","no":"3.1.1","text":"3. การแสดงรายละเอียดเกี่ยวกับชื่อสถานพยาบาล ผู้ประกอบวิชาชีพหรือผู้ประกอบโรคศิลปะในสถานพยาบาล อัตราค่ารักษาพยาบาล ค่าบริการและสิทธิผู้ป่วย\n3.1 มีป้ายชื่อสถานพยาบาล เป็นไปตามกฎกระทรวง\n3.1.1 ป้ายชื่อสถานพยาบาลต้องเป็นสี่เหลี่ยมผืนผ้า ขนาดความกว้างของป้ายไม่น้อยกว่า 40 เซนติเมตร ความยาวไม่น้อยกว่า 120 เซนติเมตร","section":"s4"},{"key":"ttm_q033","no":"3.1.2","text":"3.1.2 จัดทำแผ่นป้ายแสดงชื่อสถานพยาบาลที่เป็นภาษาไทยขนาดความสูงไม่ต่ำกว่า 10 เซนติเมตร ตัวหนังสือสีน้ำเงิน\nสีพื้นป้ายสีขาว","section":"s4"},{"key":"ttm_q034","no":"3.1.3","text":"3.1.3 เลขที่ใบอนุญาตขนาดความสูงไม่ต่ำกว่า 5 เซนติเมตร ตัวเลขอารบิคสีน้ำเงิน","section":"s4"},{"key":"ttm_q035","no":"3.1.4","text":"3.1.4 กรณีใช้ภาษาต่างประเทศร่วมด้วย ต้องมีชื่อตรงกันกับภาษาไทย ขนาดตัวอักษรต้องเล็กกว่าภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"ttm_q036","no":"3.2","text":"3.2 ติดตั้งป้ายชื่อสถานพยาบาลในตำแหน่งที่มองเห็นได้ชัดเจนจากภายนอกและเหมาะสม","section":"s4"},{"key":"ttm_q037","no":"3.3.1","text":"3.3 ชื่อสถานพยาบาลไม่มีข้อความลักษณะชักชวนโอ้อวดเกินจริงหรืออาจสื่อให้เข้าใจผิด\n3.3.1 คำนำหน้าชื่อหรือต่อท้ายของชื่อคลินิกต้องประกอบด้วยลักษณะคลินิก และลักษณะการให้บริการของคลินิก","section":"s4"},{"key":"ttm_q038","no":"3.3.2","text":"3.3.2 กรณีใช้ชื่อภาษาต่างประเทศด้วย ขนาดตัวอักษรต้องเล็กกว่าอักษรภาษาไทยและตรงกันกับชื่อคลินิกที่เป็นภาษาไทย","section":"s4"},{"key":"ttm_q039","no":"3.3.3","text":"3.3.3 ชื่อคลินิกจะต้องไม่ใช้คำหรือข้อความที่มีลักษณะชักชวน โอ้อวดเกินความจริง หรืออาจทำให้เกิดความเข้าใจผิดในสาระสำคัญเกี่ยวกับการประกอบกิจการ","section":"s4"},{"key":"ttm_q040","no":"3.3.4","text":"3.3.4 ชื่อคลินิกต้องไม่สื่อความหมายหรืออ้างอิงสถาบันพระมหากษัตริย์ เว้นแต่ได้รับพระบรมราชานุญาต","section":"s4"},{"key":"ttm_q041","no":"3.4","text":"3.๔ มีข้อความแสดงวัน เวลาที่ให้บริการไว้โดยเปิดเผย มองเห็นได้ชัดเจนจากด้านนอกคลินิกและตรงกับที่ได้รับอนุญาตให้ประกอบกิจการสถานพยาบาล","section":"s4"},{"key":"ttm_q042","no":"3.5.2","text":"3.๕ แสดงใบอนุญาตติดในที่เปิดเผยและเหมาะสม\n3.5.๑ ใบอนุญาตให้ประกอบกิจการสถานพยาบาล (แบบ ส.พ.7)\n3.5.๒ ใบอนุญาตให้ดำเนินการสถานพยาบาล (แบบ ส.พ.19)","section":"s4"},{"key":"ttm_q043","no":"3.6","text":"3.6 มีบริเวณที่ใช้แสดงหลักฐานการชำระค่าธรรมเนียมการประกอบกิจการสถานพยาบาล(แบบ ส.พ.12) ในที่เปิดเผยและเห็นได้ชัดเจนบริเวณทางเข้าสถานพยาบาล","section":"s4"},{"key":"ttm_q044","no":"3.7","text":"3.7 หน้าห้องตรวจมีบริเวณให้ติดป้ายแสดงชื่อ ภาพถ่าย และเลขที่ใบอนุญาตของผู้ประกอบวิชาชีพเวชกรรมที่ให้บริการ หากมีผู้ประกอบวิชาชีพ/ผู้ประกอบโรคศิลปะอื่นปฏิบัติงานให้ยื่น สพ.6 ทุกคนและแสดงป้ายนี้ไว้ในบริเวณที่เปิดเผยและเห็นได้ชัดเจน","section":"s4"},{"key":"ttm_q045","no":"3.8","text":"3.8 แสดงอัตราค่าบริการและค่ารักษาพยาบาลให้ครอบคลุมการบริการที่เรียกเก็บ โดยแสดงอัตราราคาต่อหน่วย และระบุข้อความด้วยอักษรภาษาไทย โดยแสดงไว้ในที่เปิดเผยให้ผู้รับบริการสามารถเห็นได้ง่าย โดยจัดทำเป็นแผ่นประกาศ แผ่นพับ เล่ม หรือแฟ้มเอกสาร หรือโปรแกรมคอมพิวเตอร์ แสดงให้ผู้ป่วยทราบ","section":"s4"},{"key":"ttm_q046","no":"3.9","text":"3.9 มีป้ายแสดงให้ผู้รับบริการทราบว่าสามารถสอบถามอัตราค่าบริการและค่ารักษาพยาบาลได้จากที่ใด ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 10 เซนติเมตร แสดงไว้ในที่เห็นได้ชัดเจน","section":"s4"},{"key":"ttm_q047","no":"3.10","text":"3.10 แสดงคำประกาศสิทธิผู้ป่วยไว้ในที่เปิดเผยและเห็นได้ง่ายอ่านได้ชัดเจน ด้วยตัวอักษรไทย ขนาดความสูงไม่น้อยกว่า 1 เซนติเมตร บริเวณที่พักคอยของผู้รับบริการ","section":"s4"},{"key":"ttm_q048","no":"3.11","text":"3.11 ข้อความโฆษณาสถานพยาบาล (ถ้ามี) ไม่เป็นเท็จ ไม่โอ้อวด หรือสื่อให้เข้าใจผิดในสาระสำคัญ","section":"s4"},{"key":"ttm_q049","no":"4.1.1","text":"4.ชนิดและจำนวนเครื่องมือ เครื่องใช้ที่จำเป็นประจำสถานพยาบาล\n4.1 เวชระเบียน\n4.1.1 มีตู้หรือชั้นหรืออุปกรณ์เก็บเวชระเบียนที่มั่นคง ปลอดภัยและต้องจัดให้เป็นระเบียบสามารถค้นหาได้ง่าย","section":"s5"},{"key":"ttm_q050","no":"4.1.2","text":"4.1.2 มีการจัดเตรียมทะเบียนผู้ป่วย มีรายการดังต่อไปนี้","section":"s5"},{"key":"ttm_q051","no":"4.1.2 › 1)","text":"1) ชื่อ นามสกุล อายุ ของผู้ป่วย","section":"s5"},{"key":"ttm_q052","no":"4.1.2 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s5"},{"key":"ttm_q053","no":"4.1.2 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"ttm_q054","no":"4.1.3 › 1)","text":"4.1.3 มีเวชระเบียน หรือ บัตรผู้ป่วย ที่สามารถ บันทึกรายละเอียด ตามที่กฎกระทรวงกำหนด\n1) ชื่อและที่อยู่สถานพยาบาล","section":"s5"},{"key":"ttm_q055","no":"4.1.3 › 2)","text":"2) เลขที่ประจำตัวผู้ป่วย","section":"s5"},{"key":"ttm_q056","no":"4.1.3 › 3)","text":"3) วัน เดือน ปี ที่มารับบริการ","section":"s5"},{"key":"ttm_q057","no":"4.1.3 › 4)","text":"4) ชื่อ นามสกุล อายุ เพศ ที่อยู่ หมายเลขโทรศัพท์ (ถ้ามี) และข้อมูลส่วนบุคคลอื่น ๆ ของผู้ป่วย เช่น เชื้อชาติ สัญชาติ สถานภาพสมรส เลขที่บัตรประจำตัวประชาชน เป็นต้น","section":"s5"},{"key":"ttm_q058","no":"4.1.3 › 5)","text":"5) อาการเจ็บป่วย การแพ้ยา ผลการตรวจทางร่างกายและผลการตรวจทางห้องปฏิบัติชันสูตรของผู้ป่วย","section":"s5"},{"key":"ttm_q059","no":"4.1.3 › 6)","text":"6) การวินิจฉัยโรค","section":"s5"},{"key":"ttm_q060","no":"4.1.3 › 7)","text":"7) การรักษา","section":"s5"},{"key":"ttm_q061","no":"4.1.3 › 8)","text":"8) ลายมือผู้ประกอบวิชาชีพเวชกรรมที่ให้การรักษา","section":"s5"},{"key":"ttm_q062","no":"4.2.1","text":"4.2 เครื่องใช้ทั่วไป ในห้องตรวจโรคทุกห้องต้องประกอบด้วย\n4.2.1 โต๊ะตรวจโรค พร้อมเก้าอี้","section":"s5"},{"key":"ttm_q063","no":"4.2.2","text":"4.2.2 เตียงตรวจโรคที่ได้มาตรฐานทางการแพทย์","se ection":"s5","condHead":true,"cond":"ttm_g5"},{"key":"ttm_q082","no":"4.5.1 › 1)","text":"4.5.1 ห้องอบไอน้ำสมุนไพรเดี่ยว\n1) ขนาดห้องไม่น้อยกว่า 1.2๐ x 1.20 เมตร ความสูงของเพดาน ไม่น้อยกว่า 2.00 เมตร","section":"s5","cond":"ttm_g5"},{"key":"ttm_q083","no":"4.5.1 › 2)","text":"2) พื้น ผนัง ฝ้าทำด้วยวัสดุที่แข็งแรง ทนทาน ทนน้ำ ไม่ทาสี และทำความสะอาดง่าย","section":"s5","cond":"ttm_g5"},{"key":"ttm_q084","no":"4.5.1 › 3)","text":"3) ประตูทำด้วยวัสดุทนน้ำ มีความกว้างไม่น้อยกว่า 0.๘ เมตร\nหรือมีความกว้างที่สามารถให้รถเข็นผู้ป่วย เข้า-ออก ประตู\nได้สะดวก ประตูเปิดออกจากภายใน ด้านบนของประตูหรือ บานเลื่อนมีช่องมองเป็นกระจกใสที่อยู่ในระดับสายตา และไม่มีอุปกรณ์ล็อค/ขัดปิด/ตรึงประตู","section":"s5","cond":"ttm_g5"},{"key":"ttm_q085","no":"4.5.1 › 4)","text":"4) ที่นั่ง/เก้าอี้ ในห้องอบไอน้ำทำด้วยวัสดุทนความร้อน และ ไม่มีเชื้อรา","section":"s5","cond":"ttm_g5"},{"key":"ttm_q086","no":"4.5.1 › 5)","text":"5) มีพัดลมดูดอากาศ หรือระบบระบายอากาศ เพื่อให้อากาศถ่ายเทสะดวก","section":"s5","cond":"ttm_g5"},{"key":"ttm_q087","no":"4.5.1 › 6)","text":"6) มีแสงสว่างเพียงพอ สามารถมองเห็นสิ่งต่างๆ ในห้องได้ชัดเจน หลอดไฟใช้ชนิดกันความชื้นหรือหลอดไฟชนิดที่มีฝาครอบ","section":"s5","cond":"ttm_g5"},{"key":"ttm_q088","no":"4.5.1 › 7)","text":"7) มีที่วัดอุณหภูมิในห้องอบไอน้ำสมุนไพรได้อย่างถูกต้องเหมาะสม","section":"s5","cond":"ttm_g5"},{"key":"ttm_q089","no":"4.5.1 › 8)","text":"8) มีระบบบันทึกการควบคุมอุณหภูมิในห้องอบไอน้ำสมุนไพร ในวันที่มีการใช้งานอย่างน้อย 1 ครั้ง โดยให้มีอุณหภูมิอยู่ระหว่าง 42 – 45 องศาเซลเซียส","section":"s5","cond":"ttm_g5"},{"key":"ttm_q090","no":"4.5.1 › 9)","text":"9) มีกริ่ง/กระดิ่งสัญญาณที่ไม่ใช้ระบบไฟฟ้าเรียกในกรณีฉุกเฉิน","section":"s5","cond":"ttm_g5"},{"key":"ttm_q091","no":"4.5.1 › 10)","text":"10) มีสัญญาณเตือนบอกเวลา","section":"s5","cond":"ttm_g5"},{"key":"ttm_q092","no":"4.5.1 › 11)","text":"11) มีกริ่ง/กระดิ่งสัญญาณที่ไม่ใช้ระบบไฟฟ้าเรียกในกรณีฉุกเฉิน","section":"s5","cond":"ttm_g5"},{"key":"ttm_q093","no":"4.5.1 › 12)","text":"12) มีที่นั่งพักรอหน้าห้องอบไอ
