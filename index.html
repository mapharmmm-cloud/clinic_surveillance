class ApiError extends Error { constructor(msg, code, details) { super(msg); this.code = code; this.details = details || []; } }
const MODE = CONFIG.GAS_API_URL ? 'gas' : 'demo';
const DB_KEY = 'cs_db_v1', AUTH_KEY = 'cs_auth_v1', SESSION_KEY = 'cs_session_v1', OUTBOX_KEY = 'cs_outbox_v1';

const Demo = {
  db() {
    let db = LS.get(DB_KEY, null);
    if (!db || !Array.isArray(db.records)) {
      db = { records: (SAMPLE && SAMPLE.records || []).map(r => Object.assign({}, r)), audit: (SAMPLE && SAMPLE.audit_log || []).slice(), seeded: nowISO() };
      LS.set(DB_KEY, db);
    }
    return db;
  },
  save(db) { return LS.set(DB_KEY, db); },
  audit(db, user, action, id, ft, changed, detail) {
    db.audit.push({ log_id: 'LOG-' + String(db.audit.length + 1).padStart(5, '0'), timestamp: nowISO(), user: user || '', action, record_id: id || '', form_type: ft || '', changed_fields: changed || '', detail: detail || '' });
  },
  async creds() {
    let c = LS.get(AUTH_KEY, null);
    if (!c) { const salt = newId(); c = { user: 'admin', salt, hash: await sha256(salt + 'admin'), isDefault: true }; LS.set(AUTH_KEY, c); }
    return c;
  }
};

const Api = {
  mode: MODE,
  async call(action, payload = {}, method = 'POST') {
    if (!navigator.onLine) throw new ApiError('ไม่มีการเชื่อมต่ออินเทอร์เน็ต', 'NETWORK');
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), CONFIG.API_TIMEOUT_MS);
    try {
      let res;
      if (method === 'GET') {
        const u = new URL(CONFIG.GAS_API_URL); u.searchParams.set('action', action);
        Object.entries(payload).forEach(([k, v]) => v != null && v !== '' && u.searchParams.set(k, v));
        res = await fetch(u.toString(), { signal: ctrl.signal });
      } else {
        res = await fetch(CONFIG.GAS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, payload)), signal: ctrl.signal });
      }
      if (!res.ok) throw new ApiError('เซิร์ฟเวอร์ตอบกลับผิดพลาด (HTTP ' + res.status + ')', 'HTTP');
      let j; try { j = await res.json(); } catch (e) { throw new ApiError('API ส่งข้อมูลกลับไม่ถูกต้อง — ตรวจสอบการ Deploy (Who has access: Anyone)', 'BAD_RESPONSE'); }
      if (!j.success) {
        if (j.error && j.error.code === 'AUTH') { Auth.clear(); }
        throw new ApiError(j.message || 'ดำเนินการไม่สำเร็จ', j.error && j.error.code, j.error && j.error.details);
      }
      setModeChip('live');
      return j.data;
    } catch (e) {
      if (e instanceof ApiError) throw e;
      setModeChip('off');
      if (e.name === 'AbortError') throw new ApiError('API ไม่ตอบสนองภายในเวลาที่กำหนด กรุณาลองใหม่', 'TIMEOUT');
      throw new ApiError('เชื่อมต่อ API ไม่ได้ (อินเทอร์เน็ตขัดข้องหรือ URL ไม่ถูกต้อง)', 'NETWORK');
    } finally { clearTimeout(timer); }
  },
  async ping() { return MODE === 'gas' ? this.call('ping', {}, 'GET') : { version: SCHEMA.version, mode: 'demo' }; },

  /** ข้อมูลสาธารณะแบบไม่ระบุตัวตน */
  async publicData() {
    if (MODE === 'gas') return this.call('public', {}, 'GET');
    const recs = Demo.db().records;
    return { rows: recs.map(publicize).filter(Boolean), total: recs.length,
      last_updated: recs.reduce((m, r) => (r.updated_at || '') > m ? r.updated_at : m, ''), fetched_at: nowISO() };
  },
  async create(rec) {
    rec = cleanRecord(rec);
    if (MODE === 'gas') return this.call('create', { data: rec, submitKey: CONFIG.SUBMIT_KEY });
    const db = Demo.db();
    if (db.records.some(r => r.record_id === rec.record_id)) return { record_id: rec.record_id, duplicate: true };
    const dup = db.records.find(r => r.form_type === rec.form_type && r.inspection_date === rec.inspection_date &&
      ((rec.license_business_no && r.license_business_no === rec.license_business_no) || (rec.clinic_name && String(r.clinic_name).trim().toLowerCase() === String(rec.clinic_name).trim().toLowerCase())));
    if (dup) throw new ApiError(`พบข้อมูลซ้ำ: มีการบันทึกการตรวจของสถานพยาบาลนี้ในวันเดียวกันแล้ว (${dup.record_id})`, 'DUPLICATE');
    const now = nowISO();
    Object.assign(rec, { created_at: now, updated_at: now, record_status: rec.record_status || 'submitted', created_by: rec.created_by || 'public', schema_version: SCHEMA.version });
    rec.updated_by = rec.created_by;
    if (!rec.inspection_year && rec.inspection_date) rec.inspection_year = +rec.inspection_date.slice(0, 4) + 543;
    computeScores(rec);
    const errs = validateRecord(rec);
    if (errs.length) throw new ApiError('ข้อมูลไม่ครบถ้วน ' + errs.length + ' รายการ', 'VALIDATION', errs.map(e => ({ field: e.key, message: e.msg })));
    db.records.push(rec); Demo.audit(db, rec.created_by, 'create', rec.record_id, rec.form_type, '', 'เพิ่มรายการใหม่');
    if (!Demo.save(db)) throw new ApiError('บันทึกลงเบราว์เซอร์ไม่สำเร็จ', 'STORAGE');
    return { record_id: rec.record_id, created_at: now, score_compliance_pct: rec.score_compliance_pct, overall_result: rec.overall_result };
  },
  async list() {
    if (MODE === 'gas') return (await this.call('read', { token: Auth.token(), filter: {} })).rows;
    Auth.require(); return Demo.db().records.slice();
  },
  async update(patch, expectedUpdatedAt) {
    patch = cleanRecord(patch);
    if (MODE === 'gas') return this.call('update', { token: Auth.token(), data: patch, expected_updated_at: expectedUpdatedAt });
    Auth.require();
    const db = Demo.db(); const i = db.records.findIndex(r => r.record_id === patch.record_id);
    if (i < 0) throw new ApiError('ไม่พบรายการ ' + patch.record_id, 'NOT_FOUND');
    const before = db.records[i];
    if (expectedUpdatedAt && before.updated_at !== expectedUpdatedAt) throw new ApiError('รายการนี้ถูกแก้ไขหลังจากที่คุณเปิด กรุณาโหลดใหม่', 'CONFLICT');
    const after = Object.assign({}, before);
    Object.keys(patch).forEach(k => { if (!['created_at', 'created_by', 'form_type', 'record_id'].includes(k)) after[k] = patch[k]; });
    Object.assign(after, { updated_at: nowISO(), updated_by: Auth.user(), schema_version: SCHEMA.version });
    computeScores(after);
    const errs = validateRecord(after);
    if (errs.length) throw new ApiError('ข้อมูลไม่ถูกต้อง ' + errs.length + ' รายการ', 'VALIDATION', errs.map(e => ({ field: e.key, message: e.msg })));
    const changed = Object.keys(after).filter(k => !['updated_at', 'updated_by'].includes(k) && String(after[k] ?? '') !== String(before[k] ?? ''));
    db.records[i] = after; Demo.audit(db, Auth.user(), 'update', after.record_id, after.form_type, changed.join(', '), 'แก้ไข ' + changed.length + ' ฟิลด์');
    Demo.save(db);
    return { record_id: after.record_id, updated_at: after.updated_at, changed };
  },
  async remove(id) {
    if (MODE === 'gas') return this.call('delete', { token: Auth.token(), id });
    Auth.require();
    const db = Demo.db(); const r = db.records.find(x => x.record_id === id);
    if (!r) throw new ApiError('ไม่พบรายการ', 'NOT_FOUND');
    db.records = db.records.filter(x => x.record_id !== id);
    Demo.audit(db, Auth.user(), 'delete', id, r.form_type, '', `ลบรายการ: ${r.clinic_name} วันที่ตรวจ ${r.inspection_date}`);
    Demo.save(db); return { record_id: id };
  },
  async login(u, p) {
    if (MODE === 'gas') return this.call('login', { username: u, password: p });
    const c = await Demo.creds();
    if (u !== c.user || (await sha256(c.salt + p)) !== c.hash) throw new ApiError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'AUTH');
    const db = Demo.db(); Demo.audit(db, u, 'login', '', '', '', 'เข้าสู่ระบบ'); Demo.save(db);
    return { token: 'local', user: u, expires: new Date(Date.now() + CONFIG.SESSION_HOURS * 3600e3).toISOString(), isDefault: u === 'admin' && p === 'admin' };
  },
  async changeCred(current, nu, np) {
    if (MODE === 'gas') return this.call('changePassword', { token: Auth.token(), currentPassword: current, newUsername: nu, newPassword: np });
    Auth.require();
    const c = await Demo.creds();
    if ((await sha256(c.salt + current)) !== c.hash) throw new ApiError('รหัสผ่านปัจจุบันไม่ถูกต้อง', 'AUTH');
    const salt = newId(); LS.set(AUTH_KEY, { user: nu, salt, hash: await sha256(salt + np), isDefault: false });
    const db = Demo.db(); Demo.audit(db, Auth.user(), 'change_credentials', '', '', 'user, password_hash', 'เปลี่ยนชื่อผู้ใช้/รหัสผ่าน → ' + nu); Demo.save(db);
    return { user: nu };
  },
  async logs() {
    if (MODE === 'gas') return (await this.call('logs', { token: Auth.token(), limit: 1000 })).rows;
    Auth.require(); return Demo.db().audit.slice().reverse();
  }
};

/* ---------- session ผู้ดูแล ---------- */
const Auth = {
  get() { const s = SS.get(SESSION_KEY, null); if (!s) return null; if (new Date(s.expires) < new Date()) { SS.del(SESSION_KEY); return null; } return s; },
  set(s) { SS.set(SESSION_KEY, s); },
  clear() { SS.del(SESSION_KEY); },
  token() { const s = this.get(); if (!s) throw new ApiError('กรุณาเข้าสู่ระบบผู้ดูแล', 'AUTH'); return s.token; },
  user() { const s = this.get(); return s ? s.user : ''; },
  require() { if (!this.get()) throw new ApiError('กรุณาเข้าสู่ระบบผู้ดูแล', 'AUTH'); }
};

/* ---------- Outbox: เก็บรายการที่ส่งไม่สำเร็จเพราะอินเทอร์เน็ต/API ขัดข้อง แล้วส่งซ้ำอัตโนมัติ ---------- */
const Outbox = {
  list() { return LS.get(OUTBOX_KEY, []); },
  add(rec) { const l = this.list().filter(r => r.record_id !== rec.record_id); l.push(rec); LS.set(OUTBOX_KEY, l); updateModeChip(); },
  async flush(silent = true) {
    const l = this.list(); if (!l.length || MODE !== 'gas' || !navigator.onLine) return 0;
    let sent = 0; const left = [];
    for (const r of l) {
      try { await Api.create(r); sent++; }
      catch (e) { if (['NETWORK', 'TIMEOUT', 'HTTP', 'BUSY'].includes(e.code)) left.push(r); else { left.push(Object.assign(r, { _error: e.message })); } }
    }
    LS.set(OUTBOX_KEY, left); updateModeChip();
    if (sent && !silent) toast(`ส่งรายการที่ค้างไว้สำเร็จ ${sent} รายการ`, 'ok');
    else if (sent) toast(`ส่งรายการที่ค้างในเครื่องไปยัง Google Sheets แล้ว ${sent} รายการ`, 'ok');
    return sent;
  }
};

/* =====================================================================
   FIELD RENDERER (ใช้ร่วมระหว่างหน้าบันทึกและหน้าแก้ไข)
   ===================================================================== */
function renderField(fid, key, rec) {
  const f = fieldDef(fid, key); if (!f) return '';
  const v = rec[key] == null ? '' : String(rec[key]);
  const id = 'f_' + key; const cls = ['field', f.half ? 'half' : '', f.third ? 'third' : ''].join(' ');
  const hidden = isVisible(fid, key, rec) ? '' : ' hidden';
  const req = f.required ? '<span class="req" aria-hidden="true">*</span>' : '';
  const help = f.help ? `<div class="help">${esc(f.help)}</div>` : '';
  let ctl = '';
  const common = `id="${id}" name="${key}" data-key="${key}" ${f.required ? 'aria-required="true"' : ''} aria-describedby="${id}_e"`;
  switch (f.type) {
    case 'textarea': ctl = `<textarea class="inp" ${common} maxlength="${f.maxlength || 4000}" rows="3">${esc(v)}</textarea>`; break;
    case 'number': case 'year': ctl = `<input class="inp num" type="number" inputmode="numeric" ${common} value="${esc(v)}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} step="1">`; break;
    case 'date': ctl = `<input class="inp" type="date" ${common} value="${esc(v)}" ${['inspection_date','survey_date','application_date'].includes(key) ? `max="${todayISO()}"` : ''}>`; break;
    case 'phone': ctl = `<input class="inp" type="tel" inputmode="tel" autocomplete="off" ${common} value="${esc(v)}" maxlength="${f.maxlength || 40}" placeholder="เช่น 043-123456">`; break;
    case 'radio': case 'multi': {
      const sel = f.type === 'multi' ? v.split('|').filter(Boolean) : [v];
      ctl = `<div class="opts" role="${f.type === 'multi' ? 'group' : 'radiogroup'}" aria-labelledby="${id}_l" data-key="${key}" data-type="${f.type}">` +
        f.options.map(o => `<button type="button" class="opt ${f.type === 'multi' ? 'multi' : ''}" data-opt="${esc(o)}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join('') + '</div>';
      return `<div class="${cls}${hidden}" data-field="${key}"><span class="lbl" id="${id}_l">${esc(f.label)}${req}</span>${ctl}${help}<div class="ferr" id="${id}_e"></div></div>`;
    }
    case 'signature': {
      return `<div class="${cls}${hidden}" data-field="${key}"><span class="lbl" id="${id}_l">${esc(f.label)}${req}</span>
        <div class="sigbox">${v ? `<img src="${esc(v)}" alt="${esc(f.label)}">` : '<span class="muted small">ยังไม่ได้เซ็นชื่อ</span>'}
          <div class="row"><button type="button" class="btn sm tonal" data-sigopen="${key}">${ic('draft')} ${v ? 'เซ็นใหม่' : 'เซ็นชื่อ'}</button>${v ? `<button type="button" class="btn sm ghost" data-sigclear="${key}" aria-label="ลบลายเซ็น">${ic('trash')}</button>` : ''}</div></div>
        <div class="ferr" id="${id}_e"></div></div>`;
    }
    case 'select': ctl = `<select class="inp" ${common}><option value="">— เลือก —</option>${f.options.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc((f.optionLabels || {})[o] || o)}</option>`).join('')}</select>`; break;
    default: ctl = `<input class="inp" type="text" ${common} value="${esc(v)}" maxlength="${f.maxlength || 300}" ${f.datalist ? 'list="dl_amphoe" autocomplete="off"' : ''}>`;
  }
  return `<div class="${cls}${hidden}" data-field="${key}"><label for="${id}">${esc(f.label)}${req}</label>${ctl}${help}<div class="ferr" id="${id}_e"></div></div>`;
}
/* =====================================================================
   SIGNATURE PAD — เซ็นชื่อด้วยนิ้ว / ปากกา / เมาส์
   บันทึกเป็นรูป PNG ที่ตัดขอบและย่อขนาด (≤ 45,000 ตัวอักษร เพื่อให้เก็บใน 1 เซลล์ของ Google Sheets ได้)
   ===================================================================== */
const SigPad = {
  MAX_LEN: 45000,
  open(title, onSave) {
    const m = openModal({ title: 'เซ็นชื่อ · ' + title.replace(/^ลายมือชื่อ\s*/, ''),
      body: `<p class="small muted" style="margin-top:0">ใช้นิ้ว ปากกา หรือเมาส์ เซ็นชื่อในกรอบด้านล่าง</p><div class="sigpad"><canvas aria-label="พื้นที่เซ็นชื่อ"></canvas><span class="sigx">✕</span><div class="sigline"></div></div>`,
      foot: `<button class="btn ghost" data-sclear>${ic('reset')} ล้าง</button><span class="spacer"></span><button class="btn" data-close>ยกเลิก</button><button class="btn primary" data-ssave>${ic('check')} บันทึกลายเซ็น</button>` });
    const cv = $('canvas', m.el), box = cv.parentElement;
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    const W = box.clientWidth, H = Math.round(Math.min(260, Math.max(170, W * 0.4)));
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    Object.assign(ctx, { lineCap: 'round', lineJoin: 'round', strokeStyle: '#0f1d45', fillStyle: '#0f1d45', lineWidth: 2.6 });
    let drawing = false, last = null, mid = null, dirty = false, bb;
    const resetBB = () => { bb = { x0: 1e9, y0: 1e9, x1: -1, y1: -1 }; }; resetBB();
    const grow = p => { bb.x0 = Math.min(bb.x0, p.x); bb.y0 = Math.min(bb.y0, p.y); bb.x1 = Math.max(bb.x1, p.x); bb.y1 = Math.max(bb.y1, p.y); };
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true; last = mid = pos(e); grow(last);
      ctx.beginPath(); ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); dirty = true; });
    cv.addEventListener('pointermove', e => { if (!drawing) return; e.preventDefault(); const p = pos(e); const m2 = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
      ctx.beginPath(); ctx.moveTo(mid.x, mid.y); ctx.quadraticCurveTo(last.x, last.y, m2.x, m2.y); ctx.stroke(); last = p; mid = m2; grow(p); });
    ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { drawing = false; }));
    $('[data-sclear]', m.el).addEventListener('click', () => { ctx.clearRect(0, 0, W, H); dirty = false; resetBB(); });
    $('[data-ssave]', m.el).addEventListener('click', () => {
      if (!dirty || bb.x1 < 0) return toast('ยังไม่ได้เซ็นชื่อ', 'warn');
      const url = this.export(cv, dpr, bb, W, H);
      if (!url) return toast('ลายเซ็นมีขนาดใหญ่เกินไป กรุณาเซ็นใหม่', 'err');
      m.close(); onSave(url);
    });
  },
  /** ตัดเฉพาะส่วนที่มีลายเซ็น ย่อขนาด แล้วแปลงเป็น data URI (PNG → JPEG ถ้ายังใหญ่เกิน) */
  export(cv, dpr, bb, W, H) {
    const pad = 8, sx = Math.max(0, bb.x0 - pad), sy = Math.max(0, bb.y0 - pad);
    const sw = Math.min(W, bb.x1 + pad) - sx, sh = Math.min(H, bb.y1 + pad) - sy;
    for (const k of [1, .75, .55, .4]) {
      const sc = Math.min(1, 420 / sw, 140 / sh) * k;
      const oc = document.createElement('canvas'); oc.width = Math.max(1, Math.round(sw * sc)); oc.height = Math.max(1, Math.round(sh * sc));
      const o = oc.getContext('2d'); o.imageSmoothingQuality = 'high';
      o.drawImage(cv, sx * dpr, sy * dpr, sw * dpr, sh * dpr, 0, 0, oc.width, oc.height);
      let url = oc.toDataURL('image/png');
      if (url.length > this.MAX_LEN) {
        const jc = document.createElement('canvas'); jc.width = oc.width; jc.height = oc.height; const j = jc.getContext('2d');
        j.fillStyle = '#fff'; j.fillRect(0, 0, jc.width, jc.height); j.drawImage(oc, 0, 0); url = jc.toDataURL('image/jpeg', .72);
      }
      if (url.length <= this.MAX_LEN) return url;
    }
    return '';
  }
};

      const resume = await confirmBox({ title: 'พบร่างที่บันทึกไว้', message: `มีร่างของ "${esc(FORMS[fid].short)}" บันทึกเมื่อ ${fmtDT(d.savedAt)}<br>ต้องการกรอกต่อจากร่างหรือไม่? (เลือก "เริ่มใหม่" เพื่อทิ้งร่าง)`, ok: 'กรอกต่อจากร่าง', cancel: 'เริ่มใหม่' });
      if (resume) { this.start(fid, d.rec, 'new', d.step || 0); return; }
      LS.del(this.draftKey(fid));
    }
    this.start(fid, null, 'new', 0);
  },

  blankRecord(fid) {
    const rec = { record_id: newId(), form_type: fid, record_status: 'submitted', inspection_date: todayISO(), addr_province: CONFIG.DEFAULT_PROVINCE };
    const d = new Date(); rec.inspection_year = d.getFullYear() + 543 + (d.getMonth() + 1 >= CONFIG.FISCAL_YEAR_START_MONTH ? 1 : 0);
    return rec;
  },

  start(fid, rec, mode, step) {
    const fm = FORMS[fid];
    this.st = { fid, rec: rec ? Object.assign({}, rec) : this.blankRecord(fid), step: step || 0, mode, expected: rec && rec.updated_at, dirty: false, saving: false, steps: this.buildSteps(fm) };
    if (mode === 'edit') location.hash = '#/edit'; else if (location.hash !== '#/form/' + fid) location.hash = '#/form/' + fid; else this.render();
  },

  buildSteps(fm) {
    const steps = [{ type: 'header', title: 'ส่วนที่ 1 ข้อมูลทั่วไป', short: 'ข้อมูลทั่วไป' }];
    let last = null;
    fm.sections.forEach(s => {
      const small = s.items.length < 4;
      if (small && last && last.small) { last.sections.push(s.id); last.short += ' / ' + s.title.replace(/^ส่วนที่ 1 · /, ''); }
      else { last = { type: 'items', sections: [s.id], small, title: s.title, short: s.title.replace(/^ส่วนที่ 1 · /, 'ส่วนที่ 1 · ') }; steps.push(last); }
    });
    steps.forEach(st => { if (st.type === 'items') st.short = st.short.length > 46 ? st.short.slice(0, 44) + '…' : st.short; });
    steps.push({ type: 'final', title: FORMS[fm.id].id === 'chinese' ? 'สรุปผล ส่วนที่ 3 ความเห็น และลงนาม' : 'สรุปผล ความเห็น และลงนาม', short: 'สรุปผลและลงนาม' });
    return steps;
  },

  stepItems(step) { const fm = FORMS[this.st.fid]; return step.type === 'items' ? step.sections.flatMap(id => fm.secMap[id].items) : []; },

  stepDone(step) {
    const { rec, fid } = this.st; const fm = FORMS[fid];
    if (step.type === 'header') return validateRecord(rec, { keys: fm.headerKeys }).length === 0;
    if (step.type === 'items') return this.stepItems(step).every(k => fm.itemMap[k].kind === 'text' || rec[k]);
    return fm.resultItems.every(it => rec[it.key]) && validateRecord(rec, { keys: fm.finalKeys }).length === 0;
  },

  progress() {
    const { rec, fid } = this.st; const fm = FORMS[fid];
    const reqKeys = [...fm.headerKeys, ...fm.finalKeys].filter(k => { const f = fieldDef(fid, k); return f && f.required && isVisible(fid, k, rec); });
    const done = reqKeys.filter(k => String(rec[k] ?? '').trim()).length + fm.resultItems.filter(it => rec[it.key]).length;
    const total = reqKeys.length + fm.resultItems.length;
    return { done, total, pct: total ? Math.round(done * 100 / total) : 0 };
  },

  render() {
    if (!this.st) return this.landing();
    const { fid, step, steps, mode } = this.st; const fm = FORMS[fid]; const cur = steps[step];
    Router.setTitle(fm.short);
    const pr = this.progress();
    $('#main').innerHTML = `<div id="wiz">
      <div class="wiz-top" style="--c:${esc(fm.color)}">
        <div class="wiz-title"><div class="ic">${ic(fm.icon)}</div>
          <div style="min-width:0;flex:1"><h1>${esc(fm.title)}</h1>
            <div class="tiny muted">${mode === 'edit' ? `<span class="pill info">${ic('edit')} โหมดแก้ไข</span> ` : ''}รหัสรายการ <span class="num">${esc(this.st.rec.record_id)}</span> · ความคืบหน้า <b id="pr-t">${pr.pct}%</b> (${pr.done}/${pr.total})</div></div>
          <button class="btn sm ghost no-print" id="w-new" title="เริ่มรายการใหม่">${ic('plus')}<span class="hide-sm">รายการใหม่</span></button>
        </div>
        <div class="progress" style="margin-top:8px" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pr.pct}" aria-label="ความคืบหน้าการกรอก"><i id="pr-bar" style="width:${pr.pct}%"></i></div>
        <div class="steps" role="list">${steps.map((s, i) => `<button class="step ${this.stepDone(s) ? 'done' : ''}" data-step="${i}" role="listitem" ${i === step ? 'aria-current="step"' : ''}><span class="n">${this.stepDone(s) && i !== step ? '✓' : i + 1}</span><span class="t">${esc(s.short)}</span></button>`).join('')}</div>
      </div>
      <div id="wiz-body">${cur.type === 'header' ? this.renderHeader() : cur.type === 'items' ? this.renderItems(cur) : this.renderFinal()}</div>
      <div class="wiz-foot">
        <button class="btn" id="w-prev" title="ย้อนกลับ" ${step === 0 ? 'disabled' : ''}>${ic('left')}<span class="lm">ย้อนกลับ</span></button>
        ${mode === 'new' ? `<button class="btn ghost" id="w-draft" title="บันทึกร่าง">${ic('draft')}<span class="lm">บันทึกร่าง</span></button>` : `<button class="btn ghost" id="w-cancel">${ic('x')} ยกเลิกการแก้ไข</button>`}
        <button class="btn ghost" id="w-clear" title="ล้างข้อมูล">${ic('reset')}<span class="lm">ล้างข้อมูล</span></button>
        <span class="spacer"></span>
        ${step < steps.length - 1 ? `<button class="btn primary" id="w-next">ถัดไป ${ic('right')}</button>` : `<button class="btn primary" id="w-save">${ic('save')} ${mode === 'edit' ? 'บันทึกการแก้ไข' : 'บันทึกข้อมูล'}</button>`}
      </div>${amphoeDatalist()}</div>`;
    this.bind();
    const active = $('.step[aria-current="step"]'); active && active.scrollIntoView({ block: 'nearest', inline: 'center' });
  },

  renderHeader() {
    const { fid, rec } = this.st; const fm = FORMS[fid];
    return (fm.note ? `<div class="alert info" style="margin-bottom:14px">${ic('info')}<div class="small">${esc(fm.note)}</div></div>` : '') +
      fm.groups.map(g => `<section class="card"><div class="card-h"><h3>${esc(g.title)}</h3></div><div class="fgrid">${g.fields.map(k => renderField(fid, k, rec)).join('')}</div></section>`).join('');
  },

  renderItem(it) {
    const { rec, fid } = this.st; const v = rec[it.key] || '';
    const lines = it.text.split('\n');
    const textHtml = lines.length > 1 ? lines.slice(0, -1).map(l => `<span class="ctx">${esc(l)}</span>`).join('') + esc(lines[lines.length - 1]) : esc(it.text);
    const fm = FORMS[fid];
    const optsSel = String(rec[it.key + '_opts'] || '').split('|').filter(Boolean);
    const showNote = v === 'N' || rec[it.key + '_note'];
    let extra = '';
    if (it.opts) extra += `<div class="opts" data-optsfor="${it.key}" aria-label="ตัวเลือกที่มี (เลือกได้หลายข้อ)">${it.opts.map(o => `<button type="button" class="opt multi" data-ov="${esc(o.v)}" aria-pressed="${optsSel.includes(o.v)}">${esc(o.v)}) ${esc(o.label)}</button>`).join('')}</div>
      <div class="tiny muted">เลือกแล้ว <b data-optcount="${it.key}">${optsSel.length}</b> จาก ${it.opts.length} รายการ</div>`;
    if (it.textField || it.kind === 'text') extra += `<input class="inp" data-key="${it.key}_text" value="${esc(rec[it.key + '_text'] || '')}" maxlength="2000" placeholder="ระบุ…" aria-label="ระบุรายละเอียด ข้อ ${esc(it.no)}">`;
    if (it.kind !== 'text') extra += `<button type="button" class="note-toggle ${showNote ? 'hidden' : ''}" data-note="${it.key}">${ic('note')} เพิ่มหมายเหตุ</button>
      <textarea class="inp ${showNote ? '' : 'hidden'}" data-key="${it.key}_note" maxlength="1000" rows="2" placeholder="${esc(it.hint || 'หมายเหตุ')}" aria-label="หมายเหตุ ข้อ ${esc(it.no)}">${esc(rec[it.key + '_note'] || '')}</textarea>`;
    const condHead = it.condHead ? this.condBar(it.cond, it.text.split('\n').find(l => /กรณี|หากมี|ถ้ามี/.test(l)) || it.text) : '';
    return condHead + `<div class="q ${v ? 'ans-' + v : ''}" id="q_${it.key}" data-item="${it.key}">
      <div class="q-body">${it.no ? `<span class="q-no">${esc(it.no)}</span>` : ''}<div class="q-text">${textHtml}</div>${it.hint && it.kind !== 'text' ? `<div class="q-hint">หมายเหตุในแบบ: ${esc(it.hint)}</div>` : ''}</div>
      ${it.kind === 'text' ? '<div class="tiny muted">ช่องระบุข้อความ</div>' : `<div class="seg" role="group" aria-label="ผลการตรวจ ข้อ ${esc(it.no)}">
        <button type="button" data-v="Y" aria-pressed="${v === 'Y'}"><span class="sym">✓</span><span class="w">ถูกต้อง</span></button>
        <button type="button" data-v="N" aria-pressed="${v === 'N'}"><span class="sym">×</span><span class="w">ไม่ถูกต้อง</span></button>
        <button type="button" data-v="NA" aria-pressed="${v === 'NA'}"><span class="sym">–</span><span class="w">ไม่มีบริการ</span></button></div>`}
      <div class="q-extra">${extra}</div></div>`;
  },

  condBar(gid, label) {
    return `<div class="cond-bar" data-cond="${esc(gid)}">${ic('info')}<div style="flex:1;min-width:200px">คำถามมีเงื่อนไข: <b>${esc(label.replace(/^\s*[\d๐-๙.()]+\s*/, ''))}</b><div class="tiny muted">หากสถานพยาบาลไม่มีบริการ/ห้องนี้ กด "ไม่มีบริการนี้" เพื่อบันทึก – ทั้งกลุ่ม</div></div>
      <button type="button" class="btn sm" data-condset="NA">– ไม่มีบริการนี้</button><button type="button" class="btn sm ghost" data-condset="">ล้างกลุ่ม</button></div>`;
  },

  renderItems(step) {
    const fm = FORMS[this.st.fid];
    return `<div class="instr">${ic('info')}<div>${esc(fm.instruction)}</div></div>` + step.sections.map(sid => {
      const s = fm.secMap[sid];
      const its = s.items.map(k => fm.itemMap[k]);
      const answered = its.filter(it => it.kind === 'text' || this.st.rec[it.key]).length;
      return `<section class="card" data-sec="${sid}">
        <div class="sec-h"><div>${s.group ? `<div class="grp">${esc(s.group)}</div>` : ''}<h2>${esc(s.title)}</h2><div class="tiny muted">${its.length} ข้อ · ตอบแล้ว <b data-seccount="${sid}">${answered}</b></div></div>
          <div class="row no-print"><button type="button" class="btn sm tonal" data-fillsec="${sid}" title="ตั้งค่า ✓ ให้ทุกข้อที่ยังไม่ได้ตอบในหมวดนี้">${ic('check')} ตอบ ✓ ข้อที่ยังว่าง</button></div></div>
        ${s.cond ? this.condBar('sec:' + sid, s.title) : ''}
        ${its.map(it => this.renderItem(it)).join('')}
      </section>`;
    }).join('');
  },

  summaryTiles(rec) {
    computeScores(rec);
    return `<div class="tiles">
      <div class="tile"><span class="k"><span class="mark Y">✓</span> ถูกต้อง</span><span class="v num">${rec.score_pass}</span></div>
      <div class="tile"><span class="k"><span class="mark N">×</span> ไม่ถูกต้อง</span><span class="v num">${rec.score_fail}</span></div>
      <div class="tile"><span class="k"><span class="mark NA">–</span> ไม่มีบริการ</span><span class="v num">${rec.score_na}</span></div>
      <div class="tile"><span class="k"><span class="mark B">?</span> ยังไม่บันทึก</span><span class="v num">${rec.score_blank}</span></div>
      <div class="tile"><span class="k">ร้อยละความถูกต้อง</span><span class="v num">${rec.score_compliance_pct === '' ? '–' : fmtNum(rec.score_compliance_pct, 1) + '%'}</span><span class="s">✓ ÷ (✓ + ×) ไม่นับข้อ –</span><div class="bar"><i style="width:${rec.score_compliance_pct || 0}%"></i></div></div>
    </div>`;
  },

  renderFinal() {
    const { fid, rec } = this.st; const fm = FORMS[fid];
    computeScores(rec);
    const fails = fm.resultItems.filter(it => rec[it.key] === 'N');
    const blanks = fm.resultItems.filter(it => !rec[it.key]);
    const jl = (arr, kind) => arr.map(it => `<button type="button" data-jump="${it.key}"><span class="mark ${kind}">${kind === 'N' ? '×' : '?'}</span><span><b>${esc(it.no)}</b> ${esc(it.text.split('\n').pop().slice(0, 140))}${rec[it.key + '_note'] ? `<br><span class="tiny muted">หมายเหตุ: ${esc(rec[it.key + '_note'])}</span>` : ''}</span></button>`).join('');
    return `<section class="card"><div class="card-h"><h2>สรุปผลการตรวจ</h2><span class="pill ${rec.overall_result === 'pass' ? 'good' : rec.overall_result === 'fail' ? 'bad' : 'draft'}">${esc(OVERALL[rec.overall_result])}</span></div>
        ${this.summaryTiles(rec)}
        <div class="grid g2" style="margin-top:16px">
          <div><h3>รายการที่ไม่ถูกต้อง (${fails.length})</h3>${fails.length ? `<div class="list-jump">${jl(fails, 'N')}</div>` : '<div class="muted small">ไม่พบรายการไม่ถูกต้อง</div>'}</div>
          <div><h3>ยังไม่บันทึกผล (${blanks.length})</h3>${blanks.length ? `<div class="list-jump">${jl(blanks, 'B')}</div>` : '<div class="muted small">บันทึกผลครบทุกข้อแล้ว</div>'}</div>
        </div></section>` +
      fm.final.map(g => `<section class="card"><div class="card-h"><h3>${esc(g.title)}</h3>${g.fields.includes('officer_opinion') || g.fields.includes('improvements_required') ? `<button type="button" class="btn sm tonal" id="auto-op">${ic('wand')} สร้างข้อความจากผลการตรวจ</button>` : ''}</div>
        <div class="fgrid">${g.fields.map(k => renderField(fid, k, rec)).join('')}</div></section>`).join('') +
      `<section class="card"><h3>คำรับรองของสถานพยาบาล</h3><div class="ack">${esc(fm.ack)}</div></section>`;
  },

  /* ---------- events ---------- */
  bind() {
    const body = $('#wiz');      // สร้างใหม่ทุกครั้งที่ render → ไม่มี listener ซ้อนกัน
    const st = this.st;
    body.addEventListener('click', e => {
      const t = e.target;
      const stepBtn = t.closest('[data-step]'); if (stepBtn) return this.go(+stepBtn.dataset.step);
      const segBtn = t.closest('.seg button'); if (segBtn) { const q = segBtn.closest('[data-item]'); return this.setResult(q.dataset.item, segBtn.getAttribute('aria-pressed') === 'true' ? '' : segBtn.dataset.v); }
      const ov = t.closest('[data-ov]'); if (ov) { const key = ov.parentElement.dataset.optsfor; const cur = String(st.rec[key + '_opts'] || '').split('|').filter(Boolean);
        const val = ov.dataset.ov; const next = cur.includes(val) ? cur.filter(x => x !== val) : cur.concat(val);
        const order = FORMS[st.fid].itemMap[key].opts.map(o => o.v); next.sort((a, b) => order.indexOf(a) - order.indexOf(b));
        st.rec[key + '_opts'] = next.join('|'); ov.setAttribute('aria-pressed', next.includes(val)); const c = $(`[data-optcount="${key}"]`); c && (c.textContent = next.length); return this.touch(); }
      const nt = t.closest('[data-note]'); if (nt) { nt.classList.add('hidden'); const ta = nt.nextElementSibling; ta.classList.remove('hidden'); ta.focus(); return; }
      const opt = t.closest('.opts[data-key] .opt'); if (opt) {
        const wrap = opt.parentElement; const key = wrap.dataset.key; const val = opt.dataset.opt;
        if (wrap.dataset.type === 'multi') { const cur = String(st.rec[key] || '').split('|').filter(Boolean); const f = fieldDef(st.fid, key);
          const next = cur.includes(val) ? cur.filter(x => x !== val) : cur.concat(val); next.sort((a, b) => f.options.indexOf(a) - f.options.indexOf(b)); st.rec[key] = next.join('|'); }
        else st.rec[key] = st.rec[key] === val ? '' : val;
        $$('.opt', wrap).forEach(b => b.setAttribute('aria-pressed', String(st.rec[key] || '').split('|').includes(b.dataset.opt)));
        this.fieldChanged(key); return;
      }
      const cs = t.closest('[data-condset]'); if (cs) { const gid = cs.closest('[data-cond]').dataset.cond; const fm = FORMS[st.fid];
        const keys = gid.startsWith('sec:') ? fm.secMap[gid.slice(4)].items : fm.items.filter(it => it.cond === gid).map(it => it.key);
        keys.forEach(k => { if (fm.itemMap[k].kind !== 'text') this.setResult(k, cs.dataset.condset, true); }); this.refreshCounts(); return this.touch(); }
      const fs = t.closest('[data-fillsec]'); if (fs) { const fm = FORMS[st.fid]; let n = 0;
        fm.secMap[fs.dataset.fillsec].items.forEach(k => { if (fm.itemMap[k].kind !== 'text' && !st.rec[k]) { this.setResult(k, 'Y', true); n++; } });
        this.refreshCounts(); this.touch(); return toast(n ? `ตั้งค่า ✓ ให้ ${n} ข้อที่ยังว่าง (ตรวจทานข้อที่ไม่ถูกต้องอีกครั้ง)` : 'ทุกข้อในหมวดนี้บันทึกผลแล้ว', n ? 'ok' : 'info'); }
      const jp = t.closest('[data-jump]'); if (jp) return this.jumpTo(jp.dataset.jump);
      const so = t.closest('[data-sigopen]'); if (so) { const k = so.dataset.sigopen;
        return SigPad.open(fieldDef(st.fid, k).label, url => { st.rec[k] = url; this.refreshField(k); this.touch(); toast('บันทึกลายเซ็นแล้ว', 'ok', 2000); }); }
      const sc = t.closest('[data-sigclear]'); if (sc) { st.rec[sc.dataset.sigclear] = ''; this.refreshField(sc.dataset.sigclear); return this.touch(); }
      if (t.closest('#auto-op')) return this.autoOpinion();
    });
    body.addEventListener('input', e => {
      const el = e.target.closest('[data-key]'); if (!el || el.classList.contains('opts')) return;
      st.rec[el.dataset.key] = el.value;
      if (BASE_FIELD[el.dataset.key] || FORMS[st.fid].fieldMap[el.dataset.key]) this.fieldChanged(el.dataset.key, true);
      else this.touch();
    });
    body.addEventListener('change', e => { const el = e.target.closest('[data-key]'); if (el && el.dataset.key === 'inspection_date' && el.value) {
      const [y, m] = el.value.split('-').map(Number); const yr = y + 543 + (m >= CONFIG.FISCAL_YEAR_START_MONTH ? 1 : 0);
      st.rec.inspection_year = yr; const yi = $('#f_inspection_year'); yi && (yi.value = yr); } });   // ปี พ.ศ. (ปีงบประมาณ) ตามวันที่ตรวจ
    $('#w-prev').addEventListener('click', () => this.go(st.step - 1));
    const nx = $('#w-next'); nx && nx.addEventListener('click', () => this.next());
    const sv = $('#w-save'); sv && sv.addEventListener('click', () => this.submit(sv));
    const dr = $('#w-draft'); dr && dr.addEventListener('click', () => { this.saveDraft(); toast('บันทึกร่างไว้ในเบราว์เซอร์นี้แล้ว — กลับมากรอกต่อได้จากหน้าแรก', 'ok'); });
    const cn = $('#w-cancel'); cn && cn.addEventListener('click', async () => { if (await confirmBox({ title: 'ยกเลิกการแก้ไข', message: 'การเปลี่ยนแปลงที่ยังไม่บันทึกจะหายไป ต้องการออกหรือไม่?', ok: 'ออกโดยไม่บันทึก', danger: true })) { this.st = null; location.hash = '#/admin'; } });
    $('#w-clear').addEventListener('click', () => this.clear());
    $('#w-new').addEventListener('click', () => this.newRecord());
  },

  fieldChanged(key, fromInput) {
    const st = this.st;
    // แสดง/ซ่อนฟิลด์ที่มีเงื่อนไข (เช่น "อื่น ๆ ระบุ") และล้างค่าที่ถูกซ่อน
    $$('[data-field]').forEach(w => {
      const k = w.dataset.field; const vis = isVisible(st.fid, k, st.rec);
      w.classList.toggle('hidden', !vis);
      if (!vis && st.rec[k]) { st.rec[k] = ''; const inp = $('[data-key]', w); if (inp && 'value' in inp) inp.value = ''; }
    });
    const w = $(`[data-field="${key}"]`); if (w && w.classList.contains('err')) { const e = validateRecord(st.rec, { keys: [key] }); if (!e.length) w.classList.remove('err'); }
    this.touch();
  },

  refreshField(key) { const w = $(`[data-field="${key}"]`); if (w) w.outerHTML = renderField(this.st.fid, key, this.st.rec); },

  setResult(key, v, silent) {
    const st = this.st; st.rec[key] = v;
    const q = $('#q_' + key);
    if (q) {
      q.className = 'q' + (v ? ' ans-' + v : '');
      $$('.seg button', q).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
      if (v === 'N') { const nt = $('[data-note]', q), ta = $('textarea', q); if (nt && ta) { nt.classList.add('hidden'); ta.classList.remove('hidden'); } }
    }
    if (!silent) { this.refreshCounts(); this.touch(); }
  },

  refreshCounts() {
    const st = this.st; const fm = FORMS[st.fid];
    $$('[data-seccount]').forEach(el => { const s = fm.secMap[el.dataset.seccount]; el.textContent = s.items.filter(k => fm.itemMap[k].kind === 'text' || st.rec[k]).length; });
    const pr = this.progress(); $('#pr-bar').style.width = pr.pct + '%'; $('#pr-t').textContent = pr.pct + '%';
    $$('.step').forEach((b, i) => { const done = this.stepDone(st.steps[i]); b.classList.toggle('done', done); const n = $('.n', b); if (i !== st.step) n.textContent = done ? '✓' : i + 1; });
  },

  touch() { this.st.dirty = true; this.refreshCounts(); if (this.st.mode === 'new') this.autosave(); },
  autosave: debounce(function () { Wizard.saveDraft(); }, 900),
  saveDraft() { if (!this.st || this.st.mode !== 'new') return; LS.set(this.draftKey(this.st.fid), { rec: this.st.rec, step: this.st.step, savedAt: nowISO() }); },

  showErrors(errs) {
    $$('.field.err').forEach(f => f.classList.remove('err'));
    errs.forEach(e => { const w = $(`[data-field="${e.key}"]`); if (w) { w.classList.add('err'); const fe = $('.ferr', w); fe && (fe.textContent = e.msg); } });
    const first = errs.find(e => $(`[data-field="${e.key}"]`)); if (first) { const w = $(`[data-field="${first.key}"]`); w.scrollIntoView({ behavior: 'smooth', block: 'center' }); const i = $('.inp', w); i && i.focus({ preventScroll: true }); }
  },

  next() {
    const st = this.st; const cur = st.steps[st.step]; const fm = FORMS[st.fid];
    if (cur.type === 'header') {
      const errs = validateRecord(st.rec, { keys: fm.headerKeys });
      if (errs.length) { this.showErrors(errs); return toast(`กรุณาตรวจสอบข้อมูล ${errs.length} รายการก่อนไปขั้นตอนถัดไป`, 'err'); }
    }
    if (cur.type === 'items') {
      const blank = this.stepItems(cur).filter(k => fm.itemMap[k].kind !== 'text' && !st.rec[k]);
      if (blank.length) toast(`หมวดนี้ยังไม่บันทึกผล ${blank.length} ข้อ — สามารถกลับมากรอกภายหลังได้`, 'warn');
    }
    this.go(st.step + 1);
  },

  go(i) {
    const st = this.st; if (i < 0 || i >= st.steps.length) return;
    st.step = i; this.saveDraft(); this.render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  jumpTo(key) {
    const st = this.st; const fm = FORMS[st.fid]; const it = fm.itemMap[key];
    const i = st.steps.findIndex(s => s.type === 'items' && s.sections.includes(it.section));
    if (i >= 0) { this.go(i); setTimeout(() => { const q = $('#q_' + key); if (q) { q.scrollIntoView({ behavior: 'smooth', block: 'center' }); q.classList.add('flash'); } }, 250); }
  },

  autoOpinion() {
    const st = this.st; const fm = FORMS[st.fid]; computeScores(st.rec);
    const fails = fm.resultItems.filter(it => st.rec[it.key] === 'N');
    const txt = fails.length ? `พบรายการที่ไม่ถูกต้อง ${fails.length} ข้อ ได้แก่\n` + fails.map(it => `- ข้อ ${it.no} ${it.text.split('\n').pop().slice(0, 120)}${st.rec[it.key + '_note'] ? ` (${st.rec[it.key + '_note']})` : ''}`).join('\n') + '\nให้ดำเนินการปรับปรุงแก้ไขให้ถูกต้อง'
      : `ผลการตรวจถูกต้องตามมาตรฐานครบทุกข้อ (ร้อยละ ${st.rec.score_compliance_pct || 100})`;
    const key = st.fid === 'chinese' ? 'improvements_required' : 'officer_opinion';
    st.rec[key] = st.rec[key] ? st.rec[key] + '\n' + txt : txt;
    const el = $('#f_' + key); if (el) el.value = st.rec[key];
    this.touch(); toast('เติมข้อความจากผลการตรวจแล้ว ตรวจทานและแก้ไขได้ตามต้องการ', 'ok');
  },

  async clear() {
    const st = this.st;
    if (!await confirmBox({ title: 'ล้างข้อมูล', message: 'ข้อมูลที่กรอกในแบบนี้ทั้งหมดจะถูกล้าง ต้องการดำเนินการต่อหรือไม่?', ok: 'ล้างข้อมูล', danger: true })) return;
    if (st.mode === 'edit') { const keep = { record_id: st.rec.record_id, form_type: st.fid, created_at: st.rec.created_at, created_by: st.rec.created_by, record_status: st.rec.record_status, updated_at: st.rec.updated_at }; st.rec = keep; }
    else { LS.del(this.draftKey(st.fid)); st.rec = this.blankRecord(st.fid); }
    st.step = 0; this.render(); toast('ล้างข้อมูลแล้ว', 'info');
  },

  async newRecord() {
    if (this.st && this.st.mode === 'new' && this.st.dirty) { this.saveDraft(); toast('บันทึกร่างของรายการเดิมไว้แล้ว', 'info'); }
    if (this.st && this.st.mode === 'edit' && this.st.dirty && !await confirmBox({ title: 'ออกจากการแก้ไข', message: 'การแก้ไขที่ยังไม่บันทึกจะหายไป', ok: 'ออก', danger: true })) return;
    this.st = null; location.hash = '#/form';
  },

  /** บันทึก: ตรวจสอบครบถ้วน → ยืนยัน → ส่ง (กันกดซ้ำด้วย st.saving + ปุ่ม disabled + record_id เดิม) */
  async submit(btn) {
    const st = this.st; if (st.saving) return;
    const fm = FORMS[st.fid];
    st.rec.form_type = st.fid;
    if (!st.rec.inspection_year && st.rec.inspection_date) st.rec.inspection_year = +st.rec.inspection_date.slice(0, 4) + 543;
    if (!st.rec.created_by && st.mode === 'new') st.rec.created_by = st.rec.officer_1_name || 'public';
    computeScores(st.rec);
    const errs = validateRecord(st.rec);
    if (errs.length) {
      const hdr = errs.filter(e => e.where === 'header'), fin = errs.filter(e => e.where === 'final'), itm = errs.filter(e => e.where === 'item');
      if (fin.length) this.showErrors(fin);
      openModal({ title: 'ข้อมูลยังไม่ครบถ้วน', size: 'sm', body: `<div class="alert err">${ic('alert')}<div>พบ ${errs.length} รายการที่ต้องแก้ไขก่อนบันทึก</div></div>
        <ul class="small" style="margin:12px 0 0;padding-left:20px">${hdr.length ? `<li>ส่วนที่ 1 ข้อมูลทั่วไป: ${hdr.map(e => esc(e.msg)).slice(0, 6).join(', ')}${hdr.length > 6 ? ' …' : ''}</li>` : ''}
        ${itm.length ? `<li>ยังไม่บันทึกผลการตรวจ ${itm.length} ข้อ</li>` : ''}${fin.length ? `<li>ส่วนท้าย: ${fin.map(e => esc(e.msg)).join(', ')}</li>` : ''}</ul>`,
        foot: `${hdr.length ? `<button class="btn" data-close data-gohdr>ไปที่ข้อมูลทั่วไป</button>` : ''}${itm.length ? `<button class="btn primary" data-close data-goitem>ไปยังข้อที่ยังไม่ตอบ</button>` : '<button class="btn primary" data-close>ตกลง</button>'}` });
      const g1 = $('[data-gohdr]'); g1 && g1.addEventListener('click', () => { this.go(0); setTimeout(() => this.showErrors(hdr), 200); });
      const g2 = $('[data-goitem]'); g2 && g2.addEventListener('click', () => this.jumpTo(itm[0].key));
      return;
    }
    const ok = await confirmBox({ title: st.mode === 'edit' ? 'ยืนยันการแก้ไขข้อมูล' : 'ยืนยันการบันทึกข้อมูล',
      message: `<b>${esc(st.rec.clinic_name)}</b><br>วันที่ตรวจ ${fmtDate(st.rec.inspection_date)} · ✓ ${st.rec.score_pass} · × ${st.rec.score_fail} · – ${st.rec.score_na}<br>ร้อยละความถูกต้อง ${st.rec.score_compliance_pct === '' ? '–' : st.rec.score_compliance_pct + '%'}`,
      ok: st.mode === 'edit' ? 'ยืนยันการแก้ไข' : 'บันทึกข้อมูล' });
    if (!ok) return;
    st.saving = true; btnBusy(btn, true, 'กำลังบันทึก…');
    try {
      if (st.mode === 'edit') {
        const r = await Api.update(st.rec, st.expected);
        toast(`แก้ไขข้อมูลสำเร็จ (${r.changed ? r.changed.length : 0} ฟิลด์)`, 'ok');
        Admin.cache = null; this.st = null; location.hash = '#/admin';
      } else {
        const r = await Api.create(st.rec);
        LS.del(this.draftKey(st.fid));
        this.success(Object.assign({}, st.rec), r.duplicate ? 'รายการนี้ถูกบันทึกไว้ก่อนแล้ว (ระบบไม่บันทึกซ้ำ)' : 'บันทึกข้อมูลสำเร็จ', false);
      }
    } catch (e) {
      if (st.mode === 'new' && MODE === 'gas' && ['NETWORK', 'TIMEOUT', 'HTTP', 'BAD_RESPONSE'].includes(e.code)) {
        Outbox.add(Object.assign({}, st.rec)); LS.del(this.draftKey(st.fid));
        this.success(Object.assign({}, st.rec), 'เชื่อมต่อ Google Sheets ไม่ได้ — บันทึกไว้ในเครื่องแล้ว ระบบจะส่งอัตโนมัติเมื่อเชื่อมต่อได้', true);
      } else {
        const det = (e.details || []).slice(0, 8).map(d => `<li>${esc(d.field)}: ${esc(d.message)}</li>`).join('');
        openModal({ title: 'บันทึกไม่สำเร็จ', size: 'sm', body: `<div class="alert err">${ic('alert')}<div>${esc(e.message)}</div></div>${det ? `<ul class="small">${det}</ul>` : ''}`, foot: '<button class="btn primary" data-close>ตกลง</button>' });
        if (e.code === 'AUTH') { location.hash = '#/admin'; }
      }
    } finally {
      if (this.st) { this.st.saving = false; btnBusy(btn, false); }
    }
  },

  success(rec, msg, queued) {
    const fm = FORMS[rec.form_type]; this.st = null;
    Router.setTitle('บันทึกสำเร็จ');
    $('#main').innerHTML = `<div class="login-wrap"><section class="card" style="width:min(640px,100%);text-align:center">
      <div class="logo" style="margin:0 auto 12px;width:64px;height:64px;border-radius:20px;background:${queued ? 'var(--warn)' : 'var(--good)'}">${ic(queued ? 'alert' : 'check')}</div>
      <h1>${esc(msg)}</h1>
      <p class="muted">${esc(fm.short)} · ${esc(rec.clinic_name)}<br>รหัสรายการ <b class="num">${esc(rec.record_id)}</b> · วันที่ตรวจ ${fmtDate(rec.inspection_date)}</p>
      <div style="margin:16px 0">${Wizard.summaryTiles(rec)}</div>
      <div class="row" style="justify-content:center">
        <button class="btn primary" id="s-new">${ic('plus')} เริ่มรายการใหม่</button>
        <button class="btn" id="s-pdf">${ic('download')} บันทึก PDF</button>
        <button class="btn" id="s-print">${ic('print')} พิมพ์</button>
        <a class="btn tonal" href="#/dashboard">${ic('chart')} ไปที่ Dashboard</a>
      </div></section></div>`;
    $('#s-new').addEventListener('click', () => { location.hash = '#/form'; Wizard.landing(); });
    $('#s-print').addEventListener('click', () => printRecord(rec));
    $('#s-pdf').addEventListener('click', e => PDF.download(rec, pdfName(rec), e.currentTarget));
  }
};

/* =====================================================================
   เอกสารรายการ (ใช้แสดงรายละเอียด + พิมพ์/บันทึก PDF)
   ===================================================================== */
function recordDoc(rec) {
  const fm = FORMS[rec.form_type]; if (!fm) return '<div class="empty">ไม่พบแบบบันทึก</div>';
  computeScores(rec);
  const show = v => v === '' || v == null ? '<span class="muted">–</span>' : esc(v).replace(/\n/g, '<br>');
  const val = (k) => { const f = fieldDef(rec.form_type, k); const v = rec[k]; if (!f) return show(v);
    if (f.type === 'signature') return v ? `<img src="${esc(v)}" alt="ลายเซ็น" style="height:48px;background:#fff;border-radius:6px;padding:2px 6px">` : show('');
    if (f.type === 'date') return v ? fmtDate(v) : show(''); if (f.type === 'multi') return show(String(v || '').split('|').filter(Boolean).join(', ')); if (f.optionLabels) return show(f.optionLabels[v] || v); return show(v); };
  const kv = keys => `<dl class="kv">${keys.filter(k => isVisible(rec.form_type, k, rec) || rec[k]).map(k => `<dt>${esc(fieldDef(rec.form_type, k).label)}</dt><dd>${val(k)}</dd>`).join('')}</dl>`;
  const sections = fm.sections.map(s => `<h3>${s.group ? esc(s.group) + ' · ' : ''}${esc(s.title)}</h3>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:70px">ข้อ</th><th>รายการตรวจ</th><th class="c">✓</th><th class="c">×</th><th class="c">–</th><th>หมายเหตุ</th></tr></thead><tbody>
    ${s.items.map(k => { const it = fm.itemMap[k]; const v = rec[k];
      const opts = it.opts ? String(rec[k + '_opts'] || '').split('|').filter(Boolean).map(x => { const o = it.opts.find(o => o.v === x); return o ? `${x}) ${o.label}` : x; }) : [];
      return `<tr><td class="num">${esc(it.no)}</td><td>${esc(it.text).replace(/\n/g, '<br>')}${opts.length ? `<div class="tiny muted">ตัวเลือกที่มี: ${esc(opts.join(' · '))}</div>` : ''}${rec[k + '_text'] ? `<div class="small">ระบุ: ${esc(rec[k + '_text'])}</div>` : ''}</td>
        ${it.kind === 'text' ? '<td class="c" colspan="3"><span class="tiny muted">ข้อความ</span></td>' : ['Y', 'N', 'NA'].map(x => `<td class="c">${v === x ? `<span class="mark ${x}">${SYM[x]}</span>` : ''}</td>`).join('')}
        <td>${esc(rec[k + '_note'] || '')}</td></tr>`; }).join('')}
    </tbody></table></div>`).join('');
  return `<div class="doc">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div class="row" style="align-items:flex-start;flex-wrap:nowrap">${CONFIG.LOGO_URL ? logoHTML('doc-logo') : ''}<div><div class="eyebrow">${esc([CONFIG.ORG_NAME, CONFIG.ORG_UNIT].filter(Boolean).join(' · '))}</div><h2 style="margin:2px 0">${esc(fm.title)}</h2>
      <div class="small muted">รหัสรายการ ${esc(rec.record_id)} · สถานะ ${esc(STATUS[rec.record_status] || rec.record_status || '–')} · บันทึก ${fmtDT(rec.created_at)}${rec.updated_at && rec.updated_at !== rec.created_at ? ` · แก้ไขล่าสุด ${fmtDT(rec.updated_at)} โดย ${esc(rec.updated_by || '')}` : ''}</div></div></div>
      <span class="pill ${rec.overall_result === 'pass' ? 'good' : rec.overall_result === 'fail' ? 'bad' : 'draft'}">${esc(OVERALL[rec.overall_result] || '')} · ${rec.score_compliance_pct === '' ? '–' : rec.score_compliance_pct + '%'}</span></div>
    <div class="rule"></div>
    ${fm.groups.map(g => `<h3>${esc(g.title)}</h3>${kv(g.fields)}`).join('')}
    <h3>สรุปผล</h3><p class="small">✓ ถูกต้อง ${rec.score_pass} · × ไม่ถูกต้อง ${rec.score_fail} · – ไม่มีบริการ ${rec.score_na} · ยังไม่บันทึก ${rec.score_blank} · รวม ${rec.score_total_items} ข้อ</p>
    <p class="small muted">${esc(fm.instruction)}</p>
    ${sections}
    ${fm.final.map(g => `<h3>${esc(g.title)}</h3>${kv(g.fields)}`).join('')}
    <h3>คำรับรอง</h3><p class="small">${esc(fm.ack)}</p>
  </div>`;
}
/* =====================================================================
   แบบฟอร์มรูปแบบต้นฉบับ (สำหรับ PDF / พิมพ์)
   จัดวางตามแบบบันทึกกระดาษ: ส่วนที่ 1 เติมคำในช่อง ……, ช่อง □, ตาราง "รายการตรวจ | ผลการตรวจ (ถูกต้อง/ไม่ถูกต้อง) | หมายเหตุ",
   ความเห็นพนักงานเจ้าหน้าที่ และช่องลงชื่อพร้อมลายเซ็น
   ===================================================================== */
const TH_MON_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const thaiLong = iso => { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${+m[3]} ${TH_MON_FULL[+m[2] - 1]} ${+m[1] + 543}` : (iso || ''); };

function formDoc(rec) {
  const fid = rec.form_type, fm = FORMS[fid]; if (!fm) return '';
  rec = computeScores(Object.assign({}, rec));
  const apply = fid === 'dialysis' || fid === 'chinese';
  const val = k => rec[k] == null ? '' : String(rec[k]);
  const L = k => (fieldDef(fid, k) || {}).label || k;
  const fv = k => { const f = fieldDef(fid, k) || {}; const x = val(k); if (!x) return ''; if (f.type === 'date') return thaiLong(x); if (f.type === 'multi') return x.split('|').filter(Boolean).join(', '); return x; };
  const fill = (x, cls = '') => `<span class="pf-fill ${cls}">${x ? esc(x).replace(/\n/g, '<br>') : '&nbsp;'}</span>`;
  const line = (label, x) => `<div class="pf-line"><span class="pf-lab">${esc(label)}</span>${fill(x)}</div>`;
  const box = m => `<span class="pf-box">${m || ''}</span>`;
  const MARK = { Y: '✓', N: '×', NA: '–' };
  const HEAD = new Set(['form_seq_no', 'inspection_year', 'inspection_date', 'specialty_branch', 'survey_date', 'inspection_purpose']);
  const INLINE_WITH = new Set(['building_commercial_floors', 'building_floor_located', 'building_type_other', 'addl_services_other']);

  const choiceBlock = (k, labelOverride) => {
    const f = fieldDef(fid, k); const sel = val(k).split('|');
    const extra = o => {
      if (k === 'building_type' && o === 'อาคารพาณิชย์') return ` ${fill(val('building_commercial_floors'), 'sm')} ชั้น`;
      if (o === 'อื่น ๆ') { const ok = k === 'building_type' ? 'building_type_other' : k === 'addl_services' ? 'addl_services_other' : ''; return ok ? ` ${fill(val(ok), 'md')}` : ''; }
      return '';
    };
    let h = `<div class="pf-q">${esc(labelOverride || L(k))}</div><div class="pf-choices">${f.options.map(o => `<span>${box(sel.includes(o) ? '✓' : '')}${esc(o)}${extra(o)}</span>`).join('')}</div>`;
    if (k === 'building_type') h += `<div class="pf-inline" style="margin-left:18px;max-width:360px">${line('ตั้งอยู่ชั้นที่', val('building_floor_located'))}</div>`;
    return h;
  };
  const renderKeys = keys => {
    let html = '', inl = [], lastPrefix = '';
    const flush = () => { if (inl.length) { html += `<div class="pf-inline">${inl.join('')}</div>`; inl = []; } };
    keys.forEach(k => {
      if (HEAD.has(k) || INLINE_WITH.has(k) || /^co_practitioner_\d_license$/.test(k)) return;
      const f = fieldDef(fid, k); if (!f || f.type === 'signature') return;
      // 7. ผู้ประกอบวิชาชีพร่วมที่พบ: "1. ……… เลขที่ใบอนุญาต ………" ตามต้นฉบับ
      const cp = k.match(/^co_practitioner_(\d)_name$/);
      if (cp) { flush(); lastPrefix = ''; html += `<div class="pf-inline" style="margin-left:18px"><div class="pf-line" style="flex:3 1 260px"><span class="pf-lab">${cp[1]}.</span>${fill(val(k))}</div>${line('เลขที่ใบอนุญาต', val(`co_practitioner_${cp[1]}_license`))}</div>`; return; }
      if (f.type === 'radio' || f.type === 'multi') { flush(); lastPrefix = ''; html += choiceBlock(k); return; }
      // ชุดข้อย่อย เช่น "พื้นที่ให้บริการ — ชั้น 1..5", "เครื่องมือพิเศษ ได้แก่ 1)..5)" → หัวข้อครั้งเดียว + บรรทัดย่อย
      const sp = L(k).match(/^(.*?)(?:\s+—\s+|\s+)(ชั้น \d+|\d+\)|ข้อ \d+\.\d+)$/);
      if (sp) {
        flush();
        if (sp[1] !== lastPrefix) { html += `<div class="pf-q">${esc(sp[1].replace(/\s+—$/, ''))}</div>`; lastPrefix = sp[1]; }
        html += `<div style="margin-left:18px">${line(sp[2].replace(/^ข้อ /, ''), fv(k))}</div>`; return;
      }
      lastPrefix = '';
      const l = line(L(k), fv(k));
      if (f.half || f.third) inl.push(l); else { flush(); html += l; }
    });
    flush(); return html;
  };
  /* ข้อความรายการตรวจ: ย่อหน้าตามระดับเลขข้อ (1. → 1.1 → 1.1.1 → 1) / (๑)) */
  const itemText = t => t.split('\n').map(ln => {
    const s = ln.trim(); let d = 0; const m = s.match(/^\(?[0-9๐-๙]+((?:\.[0-9๐-๙]+)*)\s*([.)])?/);
    if (m) d = /^\(/.test(s) || m[2] === ')' ? 3 : (m[1].match(/\./g) || []).length;
    return `<span class="ln" style="padding-left:${d * 0.9}em">${esc(s)}</span>`;
  }).join('');
  const optsHTML = it => it.opts ? `<div class="pf-opts">${it.opts.map(o => `<span>${box(String(val(it.key + '_opts')).split('|').includes(o.v) ? '✓' : '')}${esc(o.v)}) ${esc(o.label)}</span>`).join('')}</div>` : '';
  const textHTML = it => (it.textField || it.kind === 'text') ? `<div class="pf-line"><span class="pf-lab">ระบุ</span>${fill(val(it.key + '_text'))}</div>` : '';
  const noteHTML = it => [it.hint && !/^หากไม่พบ|^\(ระบุชื่อ\)/.test(it.hint) ? `<div class="pf-note">${esc(it.hint)}</div>` : '', it.hint && /^หากไม่พบ|^\(ระบุชื่อ\)/.test(it.hint) ? `<div class="pf-note">${esc(it.hint.replace(/\s*…\s*/g, ' '))}</div>` : '', val(it.key + '_note') ? `<div class="val">${esc(val(it.key + '_note'))}</div>` : ''].join('');
  const chkLine = it => `<div class="pf-chk">${box(MARK[val(it.key)] || '')}<div style="flex:1">${itemText(it.text)}${optsHTML(it)}${textHTML(it)}${val(it.key + '_note') ? `<div class="pf-note">หมายเหตุ: <span class="val">${esc(val(it.key + '_note'))}</span></div>` : ''}</div></div>`;

  /* ---------- หัวแบบ ---------- */
  const org = [CONFIG.ORG_NAME, CONFIG.ORG_UNIT].filter(Boolean).join(' ');
  let h = `<div class="pf-top"><div class="pf-org">${CONFIG.LOGO_URL ? `<img src="${esc(CONFIG.LOGO_URL)}" alt="">` : ''}<span>${esc(org)}</span></div>
    <div style="text-align:right">${fm.commonUsed.includes('form_seq_no') ? `ลำดับที่ ${fill(val('form_seq_no'), 'sm')}` : ''}${fid === 'medtech' ? `<br>ว/ด/ปี ที่สำรวจ ${fill(fv('survey_date'), 'md')}` : ''}</div></div>`;
  if (fid === 'chinese') {
    h += `<h1>บันทึกการตรวจมาตรฐานสถานพยาบาลประเภทคลินิก<br>การประกอบโรคศิลปะสาขาการแพทย์แผนจีน</h1>
      <div class="pf-choices" style="justify-content:center;margin-left:0">${fieldDef(fid, 'inspection_purpose').options.map(o => `<span>${box(val('inspection_purpose') === o ? '✓' : '')}${esc(o)}</span>`).join('')}</div>`;
  } else {
    h += `<h1>${esc(fm.title.replace(/\s*ประจำปี\s*$/, ''))} ประจำปี ${fill(val('inspection_year'), 'sm')}</h1>`;
    if (fid === 'specialist') h += `<div class="pf-sub">คลินิกเฉพาะทาง ด้านเวชกรรม สาขา ${fill(val('specialty_branch'), 'md')}</div>`;

  h += `<h2>ส่วนที่ 1 ${apply ? 'ข้อมูลทั่วไป' : 'บันทึกข้อมูลในช่องว่าง'}</h2>`;
  fm.groups.forEach(g => {
    if (/^\d+\./.test(g.title) && !g.fields.includes('building_type')) h += `<div class="pf-q">${esc(g.title)}</div>`;

  if (fm.note) h += `<p class="pf-note">${esc(fm.note)}</p>`;
  fm.sections.filter(s => /^ส่วนที่ 1/.test(s.title)).forEach(s => {
    h += `<div class="pf-sec">${esc(s.title.replace(/^ส่วนที่ 1 · /, ''))}</div>` + s.items.map(k => chkLine(fm.itemMap[k])).join('');
  });
  h += `<p style="margin-top:8px">${apply ? 'พนักงานเจ้าหน้าที่ได้มาตรวจตามที่ขออนุญาตเมื่อวันที่' : 'พนักงานเจ้าหน้าที่ ได้มาตรวจมาตรฐาน เมื่อวันที่'} ${fill(thaiLong(val('inspection_date')), 'md')} ปรากฏผลการตรวจ ดังนี้คือ</p>`;

  /* ---------- ส่วนที่ 2 ---------- */
  const part2 = fm.sections.filter(s => !/^ส่วนที่ 1/.test(s.title));
  h += `<h2>ส่วนที่ 2 การตรวจลักษณะสถานพยาบาล</h2><p class="pf-note">${esc(fm.instruction)}</p>`;
  if (fid === 'chinese') {
    part2.forEach(s => { h += `<div class="pf-sec">${esc(s.title)}</div>` + s.items.map(k => chkLine(fm.itemMap[k])).join(''); });
  } else {
    h += `<table><thead><tr><th rowspan="2">รายการตรวจ</th><th colspan="2">ผลการตรวจ</th><th rowspan="2">หมายเหตุ</th></tr><tr><th>ถูกต้อง</th><th>ไม่ถูกต้อง</th></tr></thead><tbody>`;
    part2.forEach(s => s.items.forEach(k => {
      const it = fm.itemMap[k]; const v = val(k);
      if (it.kind === 'text') { h += `<tr><td colspan="4">${itemText(it.text)}${textHTML(it)}</td></tr>`; return; }
      h += `<tr><td>${itemText(it.text)}${optsHTML(it)}${textHTML(it)}</td><td class="c">${v === 'Y' ? '✓' : v === 'NA' ? '–' : ''}</td><td class="c">${v === 'N' ? '×' : v === 'NA' ? '–' : ''}</td><td class="nt">${noteHTML(it)}</td></tr>`;
    }));
    h += `</tbody></table>`;
  }
  /* ---------- ความเห็น / ส่วนที่ 3 ---------- */
  if (fid === 'chinese') {
    const d = val('permit_decision');
    h += `<h2>ส่วนที่ 3 ความเห็นของพนักงานเจ้าหน้าที่ผู้ตรวจสถานพยาบาลประเภทคลินิก</h2>
      <div class="pf-chk">${box(d === 'อนุญาต' ? '✓' : '')}<div>อนุญาต</div></div>
      <div class="pf-chk">${box(d === 'ไม่อนุญาต' ? '✓' : '')}<div style="flex:1;display:flex;gap:6px;align-items:flex-end">ไม่อนุญาต เนื่องจาก ${fill(val('not_permit_reason'))}</div></div>
      <div class="pf-chk">${box(d === 'อนุญาตมีเงื่อนไขโดยให้ปรับปรุง' ? '✓' : '')}<div>อนุญาตมีเงื่อนไขโดยให้ปรับปรุง (โดยกำหนดเวลาตามความเหมาะสมของสภาพปัญหา แต่ทั้งนี้ไม่ควรเกิน 30 วัน หรือตามความเห็นของคณะอนุกรรมการสถานพยาบาล)</div></div>
      <p class="pf-note" style="text-indent:2.5em">คณะอนุกรรมการสถานพยาบาล หมายถึง คณะอนุกรรมการสถานพยาบาลประจำจังหวัด (ในส่วนภูมิภาค) หรือ คณะอนุกรรมการสถานพยาบาลประเภทที่ไม่รับผู้ป่วยไว้ค้างคืน (ในเขตกรุงเทพมหานคร)</p>
      <p style="margin:4px 0">จากการตรวจมาตรฐานสถานพยาบาลประเภทคลินิก พนักงานเจ้าหน้าที่ที่มีความเห็นต้องแก้ไข ปรับปรุง ก่อนการประชุมของคณะอนุกรรมการสถานพยาบาล เพื่อพิจารณาอนุญาต ได้แก่</p>
      <div class="pf-block">${esc(val('improvements_required'))}</div>`;
  } else {
    h += `<div style="margin-top:12px;break-inside:avoid"><div>ความเห็นของพนักงานเจ้าหน้าที่</div><div class="pf-block">${esc(val('officer_opinion'))}</div></div>`;
  }
  /* ---------- ลงชื่อ ---------- */
  const sign = (nameKey, role) => {
    const sigKey = nameKey.replace(/_name$/, '_sig'); const img = val(sigKey);
    return `<div class="pf-sign"><div class="s">ลงชื่อ <span class="pf-sigimg">${img ? `<img src="${esc(img)}" alt="">` : ''}</span> ${esc(role)}</div><div>( ${fill(val(nameKey), 'nm')} )</div></div>`;
  };
  const finalKeys = fm.finalKeys;
  const officers = finalKeys.filter(k => /^(officer_\d|witness)_name$/.test(k));
  h += `<div class="pf-sigs">${officers.map(k => sign(k, k === 'witness_name' ? 'พยาน' : 'พนักงานเจ้าหน้าที่')).join('')}</div>`;
  h += `<p class="pf-ack">${esc(fm.ack)}</p><div class="pf-fsign">`;
  ['sign_operator_name', 'sign_manager_name', 'sign_staff_name'].filter(k => finalKeys.includes(k)).forEach(k => { h += sign(k, L(k).replace(/^ลงชื่อ\s*/, '')); });
  const sd = String(val('sign_date')).match(/^(\d{4})-(\d{2})-(\d{2})/);
  h += `<div class="pf-line" style="margin-top:10px">วัน ${fill(sd ? String(+sd[3]) : '', 'sm')} เดือน ${fill(sd ? TH_MON_FULL[+sd[2] - 1] : '', 'md')} ${fid === 'chinese' ? 'ปี' : 'พ.ศ.'} ${fill(sd ? String(+sd[1] + 543) : '', 'sm')}</div></div>`;
  h += `<div class="pf-foot">พิมพ์จาก${esc(CONFIG.APP_NAME)} · รหัสรายการ ${esc(rec.record_id)} · สรุปผล ✓ ${rec.score_pass} × ${rec.score_fail} – ${rec.score_na}${rec.score_blank ? ` · ยังไม่บันทึก ${rec.score_blank}` : ''} · ร้อยละความถูกต้อง ${rec.score_compliance_pct === '' ? '–' : rec.score_compliance_pct + '%'} · พิมพ์เมื่อ ${fmtDT(nowISO())}</div>`;
  return h;
}

const pdfName = rec => [(FORMS[rec.form_type] || {}).short, rec.clinic_name, rec.inspection_date].filter(Boolean).join('_').replace(/[\\/:*?"<>|·]+/g, '').replace(/\s+/g, '_').slice(0, 120) + '.pdf';

/** พิมพ์ / บันทึกเป็น PDF ผ่านเมนูพิมพ์ของเบราว์เซอร์ (รองรับหลายรายการ) */
function printRecord(recs) {
  recs = [].concat(recs);
  $('#print-root').innerHTML = recs.map((r, i) => `<div class="pf ${i ? 'pf-break' : ''}">${formDoc(r)}</div>`).join('');
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); $('#print-root').innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 120);
}

/**
 * บันทึกเป็น PDF ด้วยเครื่องพิมพ์ของเบราว์เซอร์ ("Save as PDF" / "บันทึกเป็น PDF")
 * เหตุผล: ไลบรารีแปลงหน้าเว็บเป็นรูป (html2canvas) วางตำแหน่งสระ/วรรณยุกต์ภาษาไทยผิด และตัดเอกสารยาว
 * การพิมพ์ของเบราว์เซอร์ได้ PDF ที่ข้อความคมชัด ค้นหา/คัดลอกได้ แบ่งหน้าถูกต้อง และตั้งชื่อไฟล์ให้อัตโนมัติ
 */
const PDF = {
  MAX: 50,
  async download(recs, filename, btn) {
    recs = [].concat(recs);
    if (recs.length > this.MAX) { toast(`บันทึก PDF ได้ครั้งละไม่เกิน ${this.MAX} รายการ — กรุณากรองข้อมูลให้น้อยลง`, 'warn', 6000); return; }
    btnBusy(btn, true, 'กำลังเตรียม PDF…');
    try { if (document.fonts) await Promise.all([document.fonts.load('15px Sarabun'), document.fonts.load('bold 15px Sarabun')]); } catch (e) {}
    btnBusy(btn, false);
    const prevTitle = document.title;
    document.title = filename.replace(/\.pdf$/i, '');      // เบราว์เซอร์ใช้ title เป็นชื่อไฟล์ PDF เริ่มต้น
    const restore = () => { document.title = prevTitle; window.removeEventListener('afterprint', restore); };
    window.addEventListener('afterprint', restore);
    toast('ในหน้าต่างพิมพ์ เลือกปลายทาง <b>"บันทึกเป็น PDF" (Save as PDF)</b> แล้วกดบันทึก', 'info', 8000);
    printRecord(recs);
  }
};

/* =====================================================================
   PAGE: DASHBOARD สาธารณะ (ไม่ต้องเข้าสู่ระบบ / ไม่มีข้อมูลส่วนบุคคล)
   ===================================================================== */
const Dash = {
  data: null, rows: [], charts: {}, chartData: {}, timer: null,
  f: { range: 'all', from: '', to: '', form: '', amphoe: '', building: '', result: '', q: '' },
  sort: { key: 'n', dir: -1 }, page: 0,

  async show() {
    Router.setTitle('Dashboard');
    $('#main').innerHTML = `<section class="hero"><div><div class="eyebrow">Dashboard สาธารณะ · ข้อมูลสรุปไม่ระบุตัวตน</div><h1>สรุปผลการตรวจมาตรฐานสถานพยาบาล</h1>
      <p>แสดงเฉพาะข้อมูลสรุป ไม่แสดงชื่อสถานพยาบาล ชื่อบุคคล เลขใบอนุญาต หรือหมายเลขโทรศัพท์</p></div>
      <div class="row no-print"><button class="btn" id="d-refresh">${ic('refresh')} รีเฟรช</button><button class="btn" id="d-print">${ic('print')} พิมพ์รายงาน</button></div></section>
      <div id="d-body"><div class="card empty"><span class="spin" style="display:inline-block;width:22px;height:22px;border:3px solid var(--brand);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite"></span><p>กำลังโหลดข้อมูล…</p></div></div>`;
    $('#d-refresh').addEventListener('click', () => this.load(true));
    $('#d-print').addEventListener('click', () => window.print());
    await this.load();
    clearInterval(this.timer);
    if (MODE === 'gas') this.timer = setInterval(() => { if (Router.current === 'dashboard' && !document.hidden) this.load(false, true); }, CONFIG.DASHBOARD_REFRESH_MIN * 60e3);
  },

  async load(force, silent) {
    try {
      this.data = await Api.publicData();
      this.render();
      if (force) toast('อัปเดตข้อมูลล่าสุดแล้ว', 'ok', 2000);
    } catch (e) {
      if (!silent) $('#d-body').innerHTML = `<div class="card"><div class="alert err">${ic('alert')}<div><b>โหลดข้อมูลไม่สำเร็จ</b><br>${esc(e.message)}</div></div><div class="row" style="margin-top:12px"><button class="btn primary" id="d-retry">${ic('refresh')} ลองใหม่</button></div></div>`;
      const r = $('#d-retry'); r && r.addEventListener('click', () => this.load(true));
    }
  },

  filtered() {
    const f = this.f; let from = f.from, to = f.to; const t = new Date();
    if (f.range === '30') from = isoOf(new Date(t - 30 * 864e5));
    if (f.range === '90') from = isoOf(new Date(t - 90 * 864e5));
    if (f.range === 'year') from = t.getFullYear() + '-01-01';
    if (f.range === 'fy') { const y = t.getMonth() + 1 >= CONFIG.FISCAL_YEAR_START_MONTH ? t.getFullYear() : t.getFullYear() - 1; from = `${y}-${pad(CONFIG.FISCAL_YEAR_START_MONTH)}-01`; }
    if (f.range !== 'custom' && f.range !== 'all') to = '';
    if (f.range === 'all') { from = ''; to = ''; }
    return this.data.rows.filter(r => (!from || r.inspection_date >= from) && (!to || r.inspection_date <= to) && (!f.form || r.form_type === f.form)
      && (!f.amphoe || r.addr_amphoe === f.amphoe) && (!f.building || r.building_type === f.building) && (!f.result || r.overall_result === f.result));
  },

  render() {
    const all = this.data.rows; const amphoes = [...new Set(all.map(r => r.addr_amphoe).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'th'));
    const builds = [...new Set(all.map(r => r.building_type).filter(Boolean))];
    const f = this.f;
    const sel = (id, label, opts, v) => `<div class="field"><label for="${id}" class="small">${label}</label><select class="inp" id="${id}">${opts.map(([k, l]) => `<option value="${esc(k)}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
    $('#d-body').innerHTML = `
      <div class="filters" role="search" aria-label="ตัวกรอง Dashboard">
        ${sel('df-range', 'ช่วงเวลา', [['all', 'ทั้งหมด'], ['30', '30 วันล่าสุด'], ['90', '90 วันล่าสุด'], ['year', 'ปีปฏิทินนี้'], ['fy', 'ปีงบประมาณนี้'], ['custom', 'กำหนดเอง…']], f.range)}
        <div class="field date ${f.range === 'custom' ? '' : 'hidden'}"><label for="df-from" class="small">ตั้งแต่</label><input type="date" class="inp" id="df-from" value="${esc(f.from)}"></div>
        <div class="field date ${f.range === 'custom' ? '' : 'hidden'}"><label for="df-to" class="small">ถึง</label><input type="date" class="inp" id="df-to" value="${esc(f.to)}"></div>
        ${sel('df-form', 'ประเภทคลินิก', [['', 'ทุกประเภท'], ...FORM_IDS.map(k => [k, FORMS[k].short])], f.form)}
        ${sel('df-amphoe', 'พื้นที่ (อำเภอ)', [['', 'ทุกอำเภอ'], ...amphoes.map(a => [a, a])], f.amphoe)}
        ${sel('df-building', 'ลักษณะอาคาร', [['', 'ทั้งหมด'], ...builds.map(a => [a, a])], f.building)}
        ${sel('df-result', 'ผลการตรวจ', [['', 'ทั้งหมด'], ...SCHEMA.overall.map(o => [o.v, o.label])], f.result)}
        <button class="btn" id="df-reset">${ic('reset')} รีเซ็ต</button>
        <div class="updated" style="flex-basis:100%">${ic('history')} ข้อมูลอัปเดตล่าสุด ${fmtDT(this.data.last_updated)} · ดึงข้อมูลเมื่อ ${fmtDT(this.data.fetched_at)}${MODE === 'demo' ? ' · <b>Demo Mode (ข้อมูลตัวอย่างสมมติ)</b>' : ` · แหล่งข้อมูล: Google Sheets (${fmtNum(this.data.total ?? this.data.rows.length)} รายการ)`}</div>
      </div>
      <div id="d-content"></div>`;
    const on = (id, k) => $('#' + id).addEventListener('change', e => { this.f[k] = e.target.value; this.page = 0; if (k === 'range') this.render(); else this.renderContent(); });
    on('df-range', 'range'); on('df-from', 'from'); on('df-to', 'to'); on('df-form', 'form'); on('df-amphoe', 'amphoe'); on('df-building', 'building'); on('df-result', 'result');
    $('#df-reset').addEventListener('click', () => { this.f = { range: 'all', from: '', to: '', form: '', amphoe: '', building: '', result: '', q: '' }; this.page = 0; this.render(); });
    this.renderContent();
  },

  renderContent() {
    const rows = this.rows = this.filtered();
    const box = $('#d-content');
    if (!rows.length) { box.innerHTML = this.data.rows.length
        ? `<div class="card empty">${ic('search')}<p>ไม่พบข้อมูลตามตัวกรองที่เลือก</p></div>`
        : `<div class="card empty">${ic('info')}<h3 style="margin-top:8px">ยังไม่มีข้อมูลการตรวจใน Google Sheets</h3><p>เมื่อมีการบันทึกแบบตรวจ ข้อมูลสรุปจะแสดงที่นี่โดยอัตโนมัติ</p><a class="btn primary" href="#/form">${ic('plus')} บันทึกการตรวจรายการแรก</a></div>`; Object.values(this.charts).forEach(c => c.destroy()); this.charts = {}; return; }
    const n = rows.length, pass = rows.filter(r => r.overall_result === 'pass').length;
    const comp = rows.filter(r => r.score_compliance_pct !== '' && r.score_compliance_pct != null);
    const avg = comp.length ? comp.reduce((s, r) => s + +r.score_compliance_pct, 0) / comp.length : null;
    const fails = rows.reduce((s, r) => s + (+r.score_fail || 0), 0);

          <div class="legend"><span><i style="background:var(--good)"></i>✓ ถูกต้องทุกข้อ</span><span><i style="background:var(--bad)"></i>× พบข้อไม่ถูกต้อง</span><span><i style="background:var(--na)"></i>ตรวจไม่ครบ</span></div></section>

            <div class="row"><div class="field" style="min-width:240px"><input class="inp" id="d-q" type="search" placeholder="ค้นหารายการตรวจ / เลขข้อ / ประเภทคลินิก" value="${esc(this.f.q)}" aria-label="ค้นหารายการตรวจ"></div></div></div>

            <th class="sort" data-sort="form">ประเภทคลินิก</th><th class="sort" data-sort="no">ข้อ</th><th class="sort" data-sort="text">รายการตรวจ</th>
            <th class="sort r" data-sort="checked">ตรวจ (✓+×)</th><th class="sort r" data-sort="n">ไม่ถูกต้อง</th><th class="sort r" data-sort="rate">ร้อยละไม่ถูกต้อง</th></tr></thead><tbody></tbody></table></div>

    $$('[data-kpi]').forEach(b => b.addEventListener('click', () => this.kpiDrill(b.dataset.kpi)));

    $$('#d-tbl th.sort').forEach(th => th.addEventListener('click', () => { const k = th.dataset.sort; this.sort = { key: k, dir: this.sort.key === k ? -this.sort.dir : (['form', 'no', 'text'].includes(k) ? 1 : -1) }; this.renderItemTable(); }));
    this.itemStats = this.computeItemStats(rows);
    this.renderItemTable();
    this.renderSections();
    this.renderInsights(rows, avg, pass);
